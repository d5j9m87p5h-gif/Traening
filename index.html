// Tids-formattering
function fmtSec(s){const m=Math.floor(s/60),sec=Math.round(s%60);return m+':'+String(sec).padStart(2,'0')}
function parseSec(str){
  if(!str)return null;
  const s=String(str).trim().replace(',','.');
  if(!s)return null;
  // Format "min:sec"
  if(s.includes(':')){
    const p=s.split(':');
    if(p.length!==2)return null;
    const m=parseInt(p[0]),sec=parseInt(p[1]);
    if(isNaN(m)||isNaN(sec))return null;
    return m*60+sec;
  }
  // Bare et tal → tolk som minutter (decimaler tilladt)
  const num=parseFloat(s);
  if(isNaN(num)||num<=0)return null;
  return Math.round(num*60);
}

// Beregn realistisk 5km-mål baseret på starttid og programlængde
// ~1.5-2% forbedring per uge for motionister, med aftagende effekt
/* ═══════════════════════════════════════════════════════════ */
/* ── EVIDENSBASERET LØBEMOTOR ──────────────────────────────── */
/* Daniels VDOT, Pfitzinger, Magness — polariseret periodisering */
/* ═══════════════════════════════════════════════════════════ */

// Daniels-style improvement curve (s-formet, ikke lineær).
// Realistisk forbedring afhænger af startpunkt — begyndere forbedrer sig mere.
function getMaxImprovementPct(startSec,distance){
  // Pace per km i sekunder
  const startPacePerKm=startSec/distance;
  // Hvis du allerede løber meget hurtigt (≤4:00/km), er fremgang sværere
  if(startPacePerKm<=240)return 0.06;  // 6% (eksempelvis 16:00 → 15:00 på 5km)
  if(startPacePerKm<=300)return 0.10;  // 10% (eksempelvis 25:00 → 22:30)
  if(startPacePerKm<=360)return 0.15;  // 15% (30:00 → 25:30)
  if(startPacePerKm<=420)return 0.20;  // 20% begynder (35:00 → 28:00)
  return 0.25;                          // 25% absolut begynder
}

// Beregn slutmål baseret på realistisk forbedring
function goal5kSec(){
  const s=PROG.start5kSec||2100;
  const w=TW();
  const dist=PROG.runDistance||5;
  // Skalér forbedring efter program-længde — 12 uger giver mere end 4 uger
  const lengthFactor=Math.min(1,w/12);
  const maxPct=getMaxImprovementPct(s,dist);
  const actualPct=maxPct*lengthFactor;
  return Math.round(s*(1-actualPct));
}

// S-formet interpolation: langsom start (base), hurtig midten, lille slutning (taper)
function getRacePaceForWeek(wk){
  const start=PROG.start5kSec||2100;
  const end=goal5kSec();
  const totalWeeks=TW();
  if(totalWeeks<=1)return end;
  // Normaliseret position 0-1
  const t=(wk-1)/(totalWeeks-1);
  // Sigmoid-kurve: langsom de første 25%, hurtigere midten, plateau de sidste 10%
  const s=1/(1+Math.exp(-6*(t-0.5)));
  // Pace per km i sekunder
  const startPpk=start/(PROG.runDistance||5);
  const endPpk=end/(PROG.runDistance||5);
  return Math.round(startPpk+(endPpk-startPpk)*s);
}

// Fase-bestemmelse for periodisering
function getRunPhase(wk){
  const tw=TW();
  const t=wk/tw;
  if(t<=0.33)return 'base';     // Base building — easy + long
  if(t<=0.67)return 'build';    // Build — tilføj tempo
  if(t<=0.90)return 'peak';     // Peak — VO2max intervaller
  return 'taper';                // Taper — reducer volumen
}

// Klassificér løbe-type fra template-streng
function classifyRunType(typeStr){
  if(!typeStr)return 'easy';
  const s=typeStr.toLowerCase();
  if(s.includes('interval'))return 'interval';
  if(s.includes('tempo')||s.includes('threshold'))return 'tempo';
  if(s.includes('lang')||s.includes('long'))return 'long';
  if(s.includes('restitution')||s.includes('recovery'))return 'recovery';
  if(s.includes('steady')||s.includes('cardio'))return 'steady';
  if(s.includes('lavintensitet')||s.includes('samtale')||s.includes('gang'))return 'walk';
  return 'easy';
}

// Beregn pace per km for en given uge + løbe-type (sekunder per km)
function getPaceForRunType(wk,runType){
  const racePace=getRacePaceForWeek(wk); // sek per km på race-pace
  // Daniels/Pfitzinger pace-offsets fra current race pace:
  const offsets={
    recovery: 105,  // +105 sek/km (rolig samtale)
    walk:     180,  // +180 sek/km (gå-tempo)
    easy:      75,  // +75 sek/km (samtale-tempo)
    long:      60,  // +60 sek/km (lang udholdenhed)
    steady:    35,  // +35 sek/km (marathon-pace)
    tempo:     12,  // +12 sek/km (laktat-tærskel)
    interval: -10   // -10 sek/km (VO2max, 3-5 min effort)
  };
  const raw=racePace+(offsets[runType]||0);
  // Loft og gulv: under 2:30/km er urealistisk hurtigt, over 15:00/km er
  // langsommere end rask gang — begge dele ville give meningsløse planer.
  return Math.max(150,Math.min(900,raw));
}

// Beregn varighed (i minutter) baseret på fase, type, og brugerens niveau
function getDurationForRun(wk,runType){
  const phase=getRunPhase(wk);
  const tw=TW();
  // Hvor langt vi er nået (0-1) for progression
  const progress=wk/tw;
  // Basisvarigheder per type (minutter) — skaleres med progression
  const base={
    recovery: 25,
    walk:     35,
    easy:     30,
    long:     45,
    steady:   30,
    tempo:    25,
    interval: 22  // typisk 5-8x intervaller
  };
  let dur=base[runType]||30;
  // Volumen vokser med base-fase, plateauer i build/peak, falder i taper
  let multiplier=1;
  if(phase==='base'){multiplier=0.85+(progress*3)*0.30}      // 0.85 → 1.15
  else if(phase==='build'){multiplier=1.15+((progress-0.33)*3)*0.15}  // 1.15 → 1.30
  else if(phase==='peak'){multiplier=1.30}                    // hold
  else if(phase==='taper'){multiplier=0.65}                   // 35% reduktion
  // For long runs vokser de mere aggressivt op til peak
  if(runType==='long'&&phase!=='taper'){
    multiplier*=1+progress*0.4; // bliver gradvist længere
  }
  return Math.round(dur*multiplier);
}

// Beregn intervalløb-detaljer (antal x distance)
function getIntervalStructure(wk){
  const phase=getRunPhase(wk);
  const tw=TW();
  const progress=wk/tw;
  // Begynd med 4×400m, byg op til 6×800m i peak
  if(phase==='base')return {reps:4,dist:400,rest:90};
  if(phase==='build'){
    if(progress<0.5)return {reps:5,dist:400,rest:90};
    return {reps:6,dist:400,rest:90};
  }
  if(phase==='peak'){
    if(progress<0.85)return {reps:5,dist:600,rest:120};
    return {reps:6,dist:800,rest:180};
  }
  // Taper — kort, skarp
  return {reps:4,dist:400,rest:120};
}

// Beregn opvarmning for løbe-type (returner null hvis ingen behøves)
function getWarmupForRunType(wk,runType){
  if(runType!=='interval'&&runType!=='tempo')return null;
  const phase=getRunPhase(wk);
  const racePace=getRacePaceForWeek(wk);
  // Warmup pace = easy pace (+75 sek/km)
  const warmupPace=racePace+75;
  // Varighed afhænger af type og fase
  let dur;
  if(runType==='interval'){
    if(phase==='base')dur=10;
    else if(phase==='build')dur=12;
    else if(phase==='peak')dur=15;
    else dur=10; // taper
  }else{ // tempo
    if(phase==='base')dur=8;
    else dur=10;
  }
  // Strides ved interval-træning (springes over i taper for at undgå træthed)
  let strides=null;
  if(runType==='interval'&&phase!=='taper'){
    let count=4;
    if(phase==='base')count=3;     // begynd let
    else if(phase==='build')count=4;
    else if(phase==='peak')count=6;
    strides={count,distance:30};
  }
  return {
    dur,
    pacePerKm:warmupPace,
    pacePerKmFmt:fmtSec(warmupPace),
    strides
  };
}

// Beregn nedløb for løbe-type
function getCooldownForRunType(wk,runType){
  if(runType!=='interval'&&runType!=='tempo')return null;
  const racePace=getRacePaceForWeek(wk);
  // Cooldown pace = recovery pace (+105 sek/km, endnu lavere)
  const cooldownPace=racePace+105;
  let dur;
  if(runType==='interval'){
    const phase=getRunPhase(wk);
    if(phase==='peak')dur=12;
    else dur=10;
  }else{ // tempo
    dur=8;
  }
  return {
    dur,
    pacePerKm:cooldownPace,
    pacePerKmFmt:fmtSec(cooldownPace)
  };
}

// Hovedfunktion: returner komplet løbe-plan for en specifik uge + dag
function getRunPlan(wk,dayRunDef){
  const runType=classifyRunType(dayRunDef.type);
  const pacePerKm=getPaceForRunType(wk,runType);
  // Deload: samme tempo, ~35% kortere — intensitet bevares, volumen sænkes
  const dur=isDeload(wk)?Math.max(15,Math.round(getDurationForRun(wk,runType)*0.65)):getDurationForRun(wk,runType);
  const phase=getRunPhase(wk);
  let format='dur';
  let intervalsInfo=null;
  if(runType==='interval'){
    format='intervals';
    intervalsInfo=getIntervalStructure(wk);
  }
  let paceDelta=0;
  if(wk>1){
    const prevPace=getPaceForRunType(wk-1,runType);
    paceDelta=pacePerKm-prevPace;
  }
  // Opvarmning og nedløb (kun for interval og tempo)
  const warmup=getWarmupForRunType(wk,runType);
  const cooldown=getCooldownForRunType(wk,runType);
  // Total varighed inkl warmup/cooldown
  let totalDur=dur;
  if(warmup)totalDur+=warmup.dur;
  if(cooldown)totalDur+=cooldown.dur;
  return {
    type:runType,
    typeLabel:dayRunDef.type,
    pacePerKm,
    pacePerKmFmt:fmtSec(pacePerKm),
    dur,
    durFmt:dur+' min',
    totalDur,
    warmup,
    cooldown,
    phase,
    phaseLabel:{base:'Base-fase',build:'Build-fase',peak:'Peak-fase',taper:'Taper'}[phase],
    format,
    intervalsInfo,
    paceDelta,
    tip:dayRunDef.tip||'',
    phaseContext:getPhaseContext(phase,runType)
  };
}

// Forklarende tekst per fase + type
function getPhaseContext(phase,runType){
  const contexts={
    'base-easy':'Byg base. Pace skal være så rolig at du kan tale i hele sætninger.',
    'base-long':'Tid på fødderne > tempo. Det her bygger udholdenhed.',
    'base-recovery':'Aktiv hvile. Lavere puls = bedre restitution til næste hårde session.',
    'build-tempo':'Komfortabelt hårdt. Du kan kun sige 2-3 ord ad gangen.',
    'build-steady':'Marathon-pace zone — solid fundament for hurtigere løb.',
    'build-long':'Tilføj 5-10 min hver 2. uge. Brug det til at finde din rytme.',
    'peak-interval':'Højeste intensitet. Det her gør dig hurtigere på alle distancer.',
    'peak-tempo':'Lige ved din laktat-tærskel — kroppen lærer at klare længere på hard pace.',
    'taper-easy':'Reducer volumen, behold intensitet. Du skal være frisk til race-day.',
    'taper-interval':'Korte, skarpe — for at holde nervesystemet skarpt uden træthed.'
  };
  return contexts[phase+'-'+runType]||contexts[phase+'-easy']||'';
}

// Helpers til adaptiv tilpasning baseret på profil
function pcosBMI(){
  // Læs fra generel profil hvis muligt, ellers PCOS_PROFILE for backwards compat
  const h=PROFILE.height||PCOS_PROFILE.height;
  const w=PROFILE.weight||PCOS_PROFILE.weight;
  if(!h||!w)return null;
  const m=h/100;
  return Math.round((w/(m*m))*10)/10;
}
function isLeanPCOS(){const b=pcosBMI();return b!==null&&b<25}
function pcosGoalIsWeightloss(){return PCOS_PROFILE.goal==='weightloss'}
function pcosGoalIsBalance(){return PCOS_PROFILE.goal==='balance'||PCOS_PROFILE.goal==='fertility'}

// TDEE & kalorie-beregning
function calcBMR(){
  const p=PROFILE;
  if(!p.height||!p.weight||!p.age||!p.gender)return null;
  // Mifflin-St Jeor formel
  const base=10*p.weight+6.25*p.height-5*p.age;
  return p.gender==='male'?Math.round(base+5):Math.round(base-161);
}
function calcTDEE(activityMult){
  const mult=activityMult||1.55; // moderat aktivitet (træner 4-6 dage/uge)
  const bmr=calcBMR();
  return bmr?Math.round(bmr*mult):null;
}
function calcCalorieTarget(){
  const tdee=calcTDEE();
  if(!tdee)return null;
  const tpl=TEMPLATES[PROG.template||'recomp'];
  if(!tpl)return tdee;
  switch(tpl.id){
    case 'recomp':return tdee; // vedligeholdelseskalorier
    case 'bulk':return tdee+250; // moderat overskud
    case 'cut':return tdee-500; // 500 kcal underskud
    case 'strength':return tdee+150; // let overskud for muskel-bevarelse
    case 'beginner':return tdee;
    case 'pcos':
      // PCOS: tilpas efter BMI og mål
      const b=pcosBMI();
      if(PCOS_PROFILE.goal==='balance'||PCOS_PROFILE.goal==='fertility')return tdee;
      if(b&&b<25)return tdee; // lean PCOS = maintenance
      if(PCOS_PROFILE.goal==='weightloss'&&b&&b>=25)return tdee-400;
      return tdee-200; // mild deficit som default
    default:return tdee;
  }
}
function calcProteinTarget(){
  const w=PROFILE.weight;
  if(!w)return null;
  const tpl=TEMPLATES[PROG.template||'recomp'];
  if(!tpl)return Math.round(w*2);
  switch(tpl.id){
    case 'cut':return Math.round(w*2.4); // bevar muskel i underskud
    case 'pcos':return Math.round(w*1.9);
    case 'beginner':return Math.round(w*1.8);
    case 'bulk':return Math.round(w*2.0);
    case 'strength':return Math.round(w*2.0);
    case 'recomp':return Math.round(w*2.2);
    default:return Math.round(w*2);
  }
}

function parseW(val){if(!val)return[];return String(val).split(',').map(s=>parseFloat(s.trim())).filter(v=>!isNaN(v))}

// ── CORE CHECKMARK helpers (tid-baserede øvelser) ──
// Parse værdi til array af booleans (er sættet gennemført?)
function parseCompletedSets(val,numSets){
  if(!val)return Array(numSets).fill(false);
  const arr=String(val).split(',').map(s=>{
    const v=s.trim();
    // Migration: gamle data (fx "45") behandles som "gennemført"
    const num=parseFloat(v);
    if(!isNaN(num))return num>0;
    return false;
  });
  while(arr.length<numSets)arr.push(false);
  return arr.slice(0,numSets);
}

function countCompletedSets(val,numSets){
  return parseCompletedSets(val,numSets).filter(b=>b).length;
}

// Toggle et sæt for en core-øvelse
function toggleCoreSet(w,day,name,setIdx,numSets){
  const cur=parseCompletedSets(gw(w,day,name),numSets);
  cur[setIdx]=!cur[setIdx];
  const newVal=cur.map(b=>b?'1':'0').join(',');
  W[ek(w,day,name)]=newVal;
  save();
  toast();
  // PR-tjek hvis alle sæt er gennemført for første gang
  if(cur.every(b=>b)){
    // Hvis det er første uge alt er gennemført, fejr
    const prevWeeks=[];
    for(let pw=1;pw<w;pw++){
      const pv=gw(pw,day,name);
      if(pv&&countCompletedSets(pv,numSets)===numSets)prevWeeks.push(pw);
    }
    if(prevWeeks.length===0){
      // Første gang alle sæt er gennemført — lille fejring
      setTimeout(()=>{
        const el=document.querySelector(`.core-check-row[data-day="${day}"][data-name="${typeof CSS!=="undefined"&&CSS.escape?CSS.escape(name):name}"]`);
        if(el)el.classList.add('all-done');
      },50);
    }
  }
  maybeShowDayComplete(w,day);
  render();
}

// Render tap-able cirkler for tid-baserede core-øvelser
function renderCoreCheckmarks(w,day,name,numSets){
  const completed=parseCompletedSets(gw(w,day,name),numSets);
  let h=`<div class="core-check-row" data-day="${escAttr(day)}" data-name="${escAttr(name)}">`;
  for(let i=0;i<numSets;i++){
    const isDone=completed[i];
    h+=`<button class="core-check${isDone?' done':''}" onclick="toggleCoreSet(${w},'${escAttr(day)}','${escAttr(name)}',${i},${numSets})" aria-label="Sæt ${i+1}${isDone?' gennemført':''}">
      <span class="cc-num">SÆT ${i+1}</span>
      <span class="cc-mark">${isDone?'✓':'○'}</span>
    </button>`;
  }
  h+=`</div>`;
  return h;
}

// Vælg alternativ til øvelse — undgår navne der allerede er brugt på dagen (used=Set)
function homeAlternative(e,used){
  if(e.core)return null; // core kan laves hjemme som de er
  const eq=HOME_EQUIP==='db'?'db':'bw';
  const pick=list=>{
    if(!list||!list.length)return null;
    const free=list.find(v=>!used||!used.has(v.n));
    const v=free||list[list.length-1];
    if(used)used.add(v.n);
    return v;
  };
  const hit=HOME_ALT[e.n]||(e.originalName&&HOME_ALT[e.originalName]);
  if(hit)return pick(hit[eq]||hit.bw);
  const n=e.n.toLowerCase();
  for(const [re,bwList,dbList] of HOME_GENERIC){
    if(re.test(n))return pick(eq==='db'?dbList:bwList);
  }
  const q=encodeURIComponent(e.n+(eq==='db'?' dumbbell alternative':' bodyweight alternative'));
  return {n:eq==='db'?'DB-alternativ':'Kropsvægt-alternativ',no:'Spørg AI-coachen om det bedste hjemme-alternativ.',l:'https://www.youtube.com/results?search_query='+q};
}

const MOB_KEY='tw4_mobility';
let MOB={};// {"2026-07-16__morgen":"1,1,0,..", ...} + {"log":["2026-07-16__morgen",...]}
try{MOB=JSON.parse(localStorage.getItem(MOB_KEY)||'{}')}catch(e){}
function saveMob(){try{localStorage.setItem(MOB_KEY,JSON.stringify(MOB))}catch(e){}}
function mobDoneCount(){return (MOB.log||[]).length}
let mobOpenRoutine=null;

function openMobilityModal(routineId){
  mobOpenRoutine=routineId||null;
  renderMobilityModal();
}
function renderMobilityModal(){
  const m=document.getElementById('modal');
  let inner='';
  if(!mobOpenRoutine){
    // Rutine-oversigt
    inner=`<div class="mob-head">
      <div class="mob-title">Mobility & smidighed</div>
      <div class="mob-sub">Kør når som helst — uafhængigt af dit program. ${mobDoneCount()>0?mobDoneCount()+' sessioner gennemført.':''}</div>
    </div>`;
    MOBILITY_ROUTINES.forEach(r=>{
      inner+=`<button class="mob-routine" style="--mc:${r.c}" onclick="openMobilityModal('${r.id}')">
        <span class="mob-r-icon">${r.icon}</span>
        <span class="mob-r-text"><b>${r.n}</b><small>${r.dur} · ${r.ex.length} øvelser</small><em>${r.desc}</em></span>
        <span class="mob-r-arrow">›</span>
      </button>`;
    });
  }else{
    const r=MOBILITY_ROUTINES.find(x=>x.id===mobOpenRoutine);
    const dateKey=todayISO()+'__'+r.id;
    const checks=(MOB[dateKey]||'').split(',');
    const doneN=checks.filter(c=>c==='1').length;
    const allDone=doneN===r.ex.length;
    inner=`<div class="mob-head">
      <button class="mob-back" onclick="openMobilityModal()">‹ Rutiner</button>
      <div class="mob-title" style="color:${r.c}">${r.icon} ${r.n}</div>
      <div class="mob-sub">${r.dur} · ${doneN}/${r.ex.length} gennemført i dag</div>
    </div>`;
    r.ex.forEach((e,i)=>{
      const done=checks[i]==='1';
      inner+=`<div class="mob-ex${done?' done':''}">
        <button class="mob-check" style="--mc:${r.c}" onclick="toggleMobEx('${r.id}',${i},${r.ex.length})">${done?'✓':''}</button>
        <div class="mob-ex-text">
          <div class="mob-ex-n">${e.n} <span class="mob-ex-r">${e.r}</span></div>
          <div class="mob-ex-no">${e.no}</div>
        </div>
        <a class="mob-ex-vid" href="${e.l}" target="_blank">▶</a>
      </div>`;
    });
    if(allDone)inner+=`<div class="mob-complete">🎉 Rutine gennemført — kroppen takker dig!</div>`;
  }
  m.innerHTML=`<div class="modal mob-modal" onclick="event.stopPropagation()">
    <button class="modal-x" onclick="closeModal()">✕</button>
    ${inner}
  </div>`;
  m.classList.add('show');
}
function toggleMobEx(rid,idx,total){
  const dateKey=todayISO()+'__'+rid;
  const checks=(MOB[dateKey]||Array(total).fill('0').join(',')).split(',');
  while(checks.length<total)checks.push('0');
  const wasAllDone=checks.every(c=>c==='1');
  checks[idx]=checks[idx]==='1'?'0':'1';
  MOB[dateKey]=checks.join(',');
  // Log gennemført rutine (én gang per dag+rutine)
  const nowAllDone=checks.every(c=>c==='1');
  if(nowAllDone&&!wasAllDone){
    if(!MOB.log)MOB.log=[];
    if(!MOB.log.includes(dateKey))MOB.log.push(dateKey);
  }
  saveMob();
  renderMobilityModal();
}

}

          <li>Gå til <a href="https://openrouteservice.org/dev/#/signup" target="_blank">openrouteservice.org</a> og opret konto</li>

      </div>
    </div>`;
    m.classList.add('show');

  }
  m.innerHTML=`<div class="modal route-modal" onclick="event.stopPropagation()">
    <button class="modal-x" onclick="closeModal()">✕</button>
    <div class="mob-title">🗺️ Din løberute</div>

      <button class="ai-btn" onclick="regenRoute()">🔄 Ny variant</button>
      <button class="ai-btn ghost" onclick="clearOrsKey()">Skift nøgle</button>

}
function clearOrsKey(){saveOrsKey('');openRouteModal(routeTargetKm)}
function regenRoute(){routeSeed=Math.floor(Math.random()*100);findAndDrawRoute()}

function findAndDrawRoute(){
  const st=document.getElementById('routeStatus');
  if(!navigator.geolocation){if(st)st.textContent='⚠️ Din browser understøtter ikke lokation';return}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude,lon=pos.coords.longitude;
    if(st)st.textContent='🧭 Beregner '+routeTargetKm+' km rute…';
    try{
      // Prøv op til 4 seeds og vælg ruten der rammer dagens distance tættest.
      // (I tyndt vejnet kan rundturs-algoritmen ellers skyde langt over målet.)
      const targetM=routeTargetKm*1000;
      let best=null,bestDiff=Infinity;
      for(let attempt=0;attempt<4;attempt++){
        const seed=(routeSeed+attempt*17)%1000;
        if(st&&attempt>0)st.textContent='🧭 Finjusterer længden… ('+(attempt+1)+'/4)';
        const resp=await fetch('https://api.openrouteservice.org/v2/directions/foot-walking/geojson',{
          method:'POST',
          headers:{'Authorization':ORS,'Content-Type':'application/json'},
          body:JSON.stringify({
            coordinates:[[lon,lat]],
            instructions:true,
            language:'da',
            options:{round_trip:{length:Math.round(targetM),points:5,seed}}
          })
        });
        if(!resp.ok){
          if(best)break; // vi har allerede en brugbar rute
          throw new Error(resp.status===401||resp.status===403?'Ugyldig nøgle — tjek den under "Skift nøgle"':'Rutetjeneste-fejl ('+resp.status+')');
        }
        const g=await resp.json();
        if(!g||!g.features||!g.features.length||!g.features[0].geometry)continue;
        const dist=g.features[0].properties?.summary?.distance||0;
        const diff=Math.abs(dist-targetM);
        if(diff<bestDiff){best=g;bestDiff=diff}
        if(diff/targetM<=0.12)break; // inden for 12% — godt nok
      }
      const geo=best;
      // Validér at der faktisk kom en rute tilbage
      if(!geo||!geo.features||!geo.features.length||!geo.features[0].geometry){
        throw new Error('Ingen rute fundet her — prøv "Ny variant"');
      }
      await loadLeaflet();
      const mapEl=document.getElementById('routeMapEl');
      if(!mapEl)return; // modal lukket undervejs
      // Ryd gammelt kort SIKKERT — containeren kan være fjernet (modal genåbnet)
      if(routeMap){
        try{routeMap.off();routeMap.remove()}catch(e){}
        routeMap=null;routeLayer=null;
      }
      // Hvis elementet har rester fra tidligere Leaflet-init, nulstil det
      if(mapEl._leaflet_id){try{delete mapEl._leaflet_id}catch(e){}mapEl.innerHTML=''}
      routeMap=L.map(mapEl,{zoomControl:false});
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(routeMap);
      routeLayer=L.geoJSON(geo,{style:{color:'#ffd60a',weight:4,opacity:.9}}).addTo(routeMap);
      L.circleMarker([lat,lon],{radius:7,color:'#32d74b',fillColor:'#32d74b',fillOpacity:1}).addTo(routeMap).bindPopup('Start/mål');
      try{routeMap.fitBounds(routeLayer.getBounds(),{padding:[24,24]})}catch(e){routeMap.setView([lat,lon],14)}
      const sum=geo.features?.[0]?.properties?.summary;
      const actualKm=sum?sum.distance/1000:routeTargetKm;
      const distKm=actualKm.toFixed(1);
      // Estimeret LØBE-tid: skalér dagens session-minutter med rutens faktiske længde
      const runMin=routeEstMin?Math.round(routeEstMin*(actualKm/routeTargetKm)):null;
      // Byg navigations-data: koordinater + kumuleret distance + sving-instruktioner
      buildRouteNav(geo);
      const dev=Math.abs(actualKm-routeTargetKm)/routeTargetKm;
      if(st){
        if(dev>0.20)st.textContent='⚠️ Ruten blev '+distKm+' km (dagens mål: '+routeTargetKm+' km) — vejnettet her gør præcis længde svær. Prøv "Ny variant".';
        else st.textContent='✓ Rute klar ('+distKm+' km — mål '+routeTargetKm+' km). Følg den gule linje';
      }
      const stats=document.getElementById('routeStats');
      if(stats)stats.innerHTML=`<div class="route-stat"><b>${distKm}</b><small>km · mål ${routeTargetKm}</small></div>
        ${runMin?`<div class="route-stat"><b>~${runMin}</b><small>min løb</small></div>`:''}
        <div class="route-stat"><b>${routeNav?routeNav.steps.length:0}</b><small>sving</small></div>`;
      const btns=document.querySelector('.route-btns');
      if(btns&&routeNav&&!document.getElementById('navRunBtn')){
        const b=document.createElement('button');
        b.id='navRunBtn';b.className='rg-start';b.style.width='100%';b.style.marginBottom='8px';
        b.textContent='🎧 Løb ruten med navigation';
        b.onclick=()=>openRunGuide(routeDay,routeTargetKm,true);
        btns.parentNode.insertBefore(b,btns);
      }
    }catch(err){
      if(st)st.textContent='⚠️ '+err.message;
    }
  },err=>{
    if(st)st.textContent='⚠️ Kunne ikke få din position — tillad lokation i Safari-indstillinger';
  },{enableHighAccuracy:true,timeout:10000});
}

/* ═══ TURN-BY-TURN NAVIGATION ═══ */
let routeNav=null,routeDay=null;

function buildRouteNav(geo){
  try{
    const f=geo.features[0];
    const coords=f.geometry.coordinates.map(c=>({lat:c[1],lon:c[0]})); // [lon,lat] → {lat,lon}
    if(coords.length<2){routeNav=null;return}
    // Kumuleret distance langs ruten
    const cum=[0];
    for(let i=1;i<coords.length;i++){
      cum.push(cum[i-1]+rgHaversine(coords[i-1],coords[i]));
    }
    // Sving-instruktioner fra alle segmenter
    const steps=[];
    (f.properties.segments||[]).forEach(seg=>{
      (seg.steps||[]).forEach(s=>{
        if(!s.way_points||s.type===11)return; // 11 = depart, spring over
        steps.push({
          instr:s.instruction||'',
          startIdx:s.way_points[0],
          type:s.type,
          a120:false, // annonceret "om X meter"
          aNow:false  // annonceret "nu"
        });
      });
    });
    routeNav={coords,cum,steps,lastIdx:0,offCount:0,offAnnounced:false};
  }catch(e){routeNav=null}
}

// Kaldes fra rgOnPos når navigation er aktiv
function navUpdate(lat,lon){
  if(!routeNav||!RG.useNav)return;
  const pos={lat,lon};
  const n=routeNav.coords.length;
  // Vinduessøgning efter nærmeste rutepunkt (rundture kan krydse sig selv)
  const from=Math.max(0,routeNav.lastIdx-15);
  const to=Math.min(n,routeNav.lastIdx+90);
  let best=Infinity,bi=routeNav.lastIdx;
  for(let i=from;i<to;i++){
    const d=rgHaversine(pos,routeNav.coords[i]);
    if(d<best){best=d;bi=i}
  }
  routeNav.lastIdx=bi;
  // Væk fra ruten?
  if(best>60){
    routeNav.offCount++;
    if(routeNav.offCount>=5&&!routeNav.offAnnounced){
      routeNav.offAnnounced=true;
      rgSpeak('Du er cirka '+Math.round(best/10)*10+' meter fra ruten. Find tilbage til den gule linje.');
    }
  }else{
    routeNav.offCount=0;routeNav.offAnnounced=false;
  }
  // Find næste kommende sving
  let next=null;
  for(const s of routeNav.steps){
    if(s.aNow)continue;
    if(s.startIdx<=bi){
      // Lige ankommet til svinget uden "nu"-annoncering? Sig den nu (catch-up)
      if(!s.aNow&&routeNav.cum[bi]-routeNav.cum[s.startIdx]<45){
        s.a120=true;s.aNow=true;rgSpeak(s.instr);
      }else{s.a120=true;s.aNow=true}
      continue;
    }
    next=s;break;
  }
  const navEl=document.getElementById('rgNav');
  if(!next){
    if(navEl)navEl.textContent='➡ Følg ruten til mål';
    return;
  }
  const distTo=Math.max(0,routeNav.cum[next.startIdx]-routeNav.cum[bi]-best*0.3);
  if(navEl)navEl.textContent='↰ Om '+(distTo<1000?Math.round(distTo/10)*10+' m':(distTo/1000).toFixed(1)+' km')+': '+next.instr;
  if(distTo<=130&&!next.a120){
    next.a120=true;
    rgSpeak('Om '+Math.max(20,Math.round(distTo/10)*10)+' meter: '+next.instr);
  }
  if(distTo<=30&&!next.aNow){
    next.aNow=true;
    rgSpeak(next.instr);
  }
}

/* ═══ GUIDET LØB ═══ */
// GPS-tracking + dansk stemme-guidning i høretelefoner + wake lock + auto-log
// OBS: iOS tillader ikke baggrundskørsel for web-apps — skærmen holdes vågen i stedet
const RG={active:false,paused:false,day:null,targetKm:5,startTs:0,pausedMs:0,pauseStart:0,dist:0,lastPos:null,lastKmAnnounced:0,watchId:null,timerId:null,wakeLock:null};

function rgSpeak(txt){
  try{
    if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='da-DK';u.rate=1.02;u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function rgFmtTime(sec){
  sec=Math.round(sec);
  const m=Math.floor(sec/60),s=sec%60;
  return m+':'+String(s).padStart(2,'0');
}
function rgFmtTimeSpoken(sec){
  sec=Math.round(sec);
  const m=Math.floor(sec/60),s=sec%60;
  return m+' minutter og '+s+' sekunder';
}
function rgElapsed(){
  if(!RG.startTs)return 0;
  const now=RG.paused?RG.pauseStart:Date.now();
  return (now-RG.startTs-RG.pausedMs)/1000;
}
function rgHaversine(a,b){
  const R=6371000,rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

function openRunGuide(day,targetKm,useNav){
  RG.day=day;RG.targetKm=targetKm||5;
  RG.useNav=!!(useNav&&routeNav);
  if(!useNav)routeNav=null; // standalone-løb skal ikke bruge gammel rute
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal rg-modal" onclick="event.stopPropagation()">
    <div class="rg-status" id="rgStatus">${RG.useNav?'🗺️ Navigation klar — stemmen guider dig ved hvert sving':'Klar — tryk start og læg telefonen i lommen (skærm forbliver tændt)'}</div>
    <div class="rg-time" id="rgTime">0:00</div>
    <div class="rg-row">
      <div class="rg-stat"><b id="rgKm">0.00</b><small>km</small></div>
      <div class="rg-stat"><b id="rgPace">–:––</b><small>pace /km</small></div>
    </div>
    ${RG.useNav?'<div class="rg-nav" id="rgNav">↰ Navigation starter når du løber</div>':''}
    <div class="rg-btns" id="rgBtns">
      <button class="rg-start" onclick="startRunGuide()">▶ Start</button>
      <button class="ai-btn ghost" onclick="cancelRunGuide()">Luk</button>
    </div>
    <div class="rg-note">${RG.useNav?'Sving-guidning på dansk · ':''}Stemme-splits ved hver km · Auto-log ved stop · Virker med skærm tændt (iOS-krav for web-apps)</div>
  </div>`;
  m.classList.add('show');
}

async function startRunGuide(){
  RG.active=true;RG.paused=false;RG.startTs=Date.now();RG.pausedMs=0;RG.dist=0;RG.lastPos=null;RG.lastKmAnnounced=0;
  rgSpeak('Guidet løb startet. God tur!'); // user-gesture unlock af TTS
  // Wake lock — hold skærmen vågen
  try{RG.wakeLock=await navigator.wakeLock?.request('screen')}catch(e){}
  document.addEventListener('visibilitychange',rgReacquireWake);
  // GPS
  if(navigator.geolocation){
    RG.watchId=navigator.geolocation.watchPosition(rgOnPos,()=>{},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  }
  RG.timerId=setInterval(rgTick,1000);
  // Skift UI til kørende
  const btns=document.getElementById('rgBtns');
  if(btns)btns.innerHTML=`<button class="rg-pause" onclick="pauseRunGuide()" id="rgPauseBtn">⏸ Pause</button>
    <button class="rg-stop" onclick="stopRunGuide()">■ Stop & log</button>`;
  const st=document.getElementById('rgStatus');
  if(st)st.textContent='🏃 Løb i gang — telefonen må gerne i lommen';
}
async function rgReacquireWake(){
  if(RG.active&&document.visibilityState==='visible'){
    try{RG.wakeLock=await navigator.wakeLock?.request('screen')}catch(e){}
  }
}
function rgOnPos(pos){
  if(!RG.active||RG.paused)return;
  if(pos.coords.accuracy>35)return; // ignorér upræcise målinger
  const p={lat:pos.coords.latitude,lon:pos.coords.longitude,t:Date.now()};
  if(RG.lastPos){
    const d=rgHaversine(RG.lastPos,p);
    const dt=(p.t-RG.lastPos.t)/1000;
    if(dt>0&&d/dt<7){ // <7 m/s = realistisk løb, filtrér GPS-hop
      RG.dist+=d;
    }
  }
  RG.lastPos=p;
  navUpdate(p.lat,p.lon);
}
function rgTick(){
  if(!RG.active||RG.paused)return;
  const el=rgElapsed();
  const km=RG.dist/1000;
  const t=document.getElementById('rgTime');if(t)t.textContent=rgFmtTime(el);
  const k=document.getElementById('rgKm');if(k)k.textContent=km.toFixed(2);
  const p=document.getElementById('rgPace');
  if(p)p.textContent=km>0.05?rgFmtTime(el/km):'–:––';
  // Km-split annoncering
  const whole=Math.floor(km);
  if(whole>RG.lastKmAnnounced&&whole>=1){
    RG.lastKmAnnounced=whole;
    const pace=rgFmtTime(el/km).replace(':',' minutter ')+' sekunder';
    rgSpeak(whole+' kilometer. Tid: '+rgFmtTimeSpoken(el)+'. Gennemsnitspace: '+pace+' per kilometer.');
    // Halvvejs/målnær opmuntring
    if(whole===Math.floor(RG.targetKm/2))rgSpeak('Du er halvvejs. Stærkt arbejde!');
    if(RG.targetKm-km<=1&&RG.targetKm-km>0.5)rgSpeak('Under én kilometer til målet. Hold tempoet!');
  }
}
function pauseRunGuide(){
  if(!RG.paused){
    RG.paused=true;RG.pauseStart=Date.now();
    rgSpeak('Pause.');
    const b=document.getElementById('rgPauseBtn');if(b)b.textContent='▶ Fortsæt';
    if(b)b.onclick=pauseRunGuide;
  }else{
    RG.pausedMs+=Date.now()-RG.pauseStart;
    RG.paused=false;
    rgSpeak('Fortsætter.');
    const b=document.getElementById('rgPauseBtn');if(b)b.textContent='⏸ Pause';
  }
}
function rgCleanup(){
  RG.active=false;
  if(RG.watchId!=null){try{navigator.geolocation.clearWatch(RG.watchId)}catch(e){}RG.watchId=null}
  if(RG.timerId){clearInterval(RG.timerId);RG.timerId=null}
  try{RG.wakeLock?.release()}catch(e){}
  RG.wakeLock=null;
  document.removeEventListener('visibilitychange',rgReacquireWake);
}
function cancelRunGuide(){rgCleanup();closeModal()}
function stopRunGuide(){
  const el=rgElapsed();
  const km=RG.dist/1000;
  rgCleanup();
  if(km<0.1||el<60){
    // For kort til at logge
    closeModal();toast('Løb stoppet (for kort til at logge)');return;
  }
  const tidStr=rgFmtTime(el);
  const paceStr=rgFmtTime(el/km);
  const kmStr=km.toFixed(2);
  rgSpeak('Løb gennemført. '+kmStr.replace('.',' komma ')+' kilometer på '+rgFmtTimeSpoken(el)+'. Godt arbejde!');
  // Auto-log i dagens felter
  sw(week,RG.day,'tid',tidStr);
  sw(week,RG.day,'pace',paceStr);
  sw(week,RG.day,'km',kmStr);
  closeModal();
  toast('✓ Logget: '+kmStr+' km · '+tidStr+' · '+paceStr+'/km');
  maybeShowDayComplete(week,RG.day);
  render();
}

// Programmets nuværende uge — først via startdato, ellers fra seneste data
function currentWeek(){
  if(PROG.startDate){
    const w=weekFromStart();
    if(w>=1&&w<=TW())return w;
    if(w>TW())return TW()+1; // færdigt (fungerer for 8/12/16 uger)
    return 1; // før startdato
  }
  // Fallback: seneste uge med data
  for(let w=TW();w>=1;w--){
    const has=D.some(d=>{
      if(d.ex){return dayEx(d).some(e=>gw(w,d.full,e.n))}
      if(d.run){return['tid','pace','km'].some(k=>gw(w,d.full,k))}
      return false;
    });
    if(has)return w;
  }
  return 1;
}
function isProgramDone(){return PROG.startDate&&weekFromStart()>TW()}

// ── FLEX-MODE helpers ──
// Tjek om en træningsdag har data logget i en given uge
function isDayLogged(w,dayFull){
  const d=D.find(x=>x.full===dayFull);
  if(!d)return false;
  if(d.ex){
    return dayEx(d).some(e=>{
      const v=gw(w,d.full,e.n);
      return v&&maxW(v)>0;
    });
  }
  if(d.run){
    return ['tid','pace','km'].some(k=>gw(w,d.full,k));
  }
  return false;
}

// Returner alle ikke-loggede træningsdage i indeværende uge (i programmets rækkefølge)
function getPendingSessions(w){
  return D.filter(d=>d.ex||d.run).filter(d=>!isDayLogged(w,d.full));
}

// I flex-mode: hvad er "næste session" lige nu?
function getNextFlexSession(){
  const w=currentWeek();
  const pending=getPendingSessions(w);
  return pending[0]||null; // null = ugen er færdig
}

// I flex-mode beregnes uge ud fra antal komplette sessioner
function flexCurrentWeek(){
  if(!PROG.startDate)return 1;
  const sessionsPerWeek=D.filter(d=>d.ex||d.run).length;
  if(sessionsPerWeek===0)return 1;
  // Tæl total loggede sessioner på tværs af alle uger
  let totalLogged=0;
  for(let w=1;w<=TW();w++){
    D.filter(d=>d.ex||d.run).forEach(d=>{
      if(isDayLogged(w,d.full))totalLogged++;
    });
  }
  return Math.min(Math.floor(totalLogged/sessionsPerWeek)+1,TW());
}

// Swipe mellem dage
let daySwipeX=null,daySwipeY=null,daySwipeTime=0;
function daySwipeStart(e){
  const t=e.target;
  // Ignorer hvis swipe starter på input/button/select
  if(t.tagName==='INPUT'||t.tagName==='BUTTON'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.tagName==='A')return;
  daySwipeX=e.touches[0].clientX;
  daySwipeY=e.touches[0].clientY;
  daySwipeTime=Date.now();
}
function daySwipeMove(e){
  if(daySwipeX===null)return;
  const dy=e.touches[0].clientY-daySwipeY;
  const dx=e.touches[0].clientX-daySwipeX;
  // Hvis primært vertikal scroll, drop swipe
  if(Math.abs(dy)>Math.abs(dx)){daySwipeX=null;return}
}
function daySwipeEnd(e){
  if(daySwipeX===null)return;
  const dx=(e.changedTouches?.[0]?.clientX||0)-daySwipeX;
  const elapsed=Date.now()-daySwipeTime;
  const isSwipe=Math.abs(dx)>60||(Math.abs(dx)>30&&elapsed<200);
  if(isSwipe){
    if(dx<0){
      // Swipe venstre = næste dag
      sel=(sel+1)%7;
    }else{
      // Swipe højre = forrige dag
      sel=(sel-1+7)%7;
    }
    render();
  }
  daySwipeX=null;daySwipeY=null;
}
function goToTodayDetail(idx){
  sel=idx;render();
  setTimeout(()=>{
    document.querySelector('.det')?.scrollIntoView({behavior:'smooth',block:'start'});

// Render kompakt historik-strip med sidste 2-3 ugers data for en øvelse
function renderHistoryStrip(day,name,exDef){
  const cw=week;
  if(cw<2)return '';
  // Detekter type
  const isCore=exDef.core;
  // For ALLE core-øvelser: vis sæt-completion historik (afkryds-baseret)
  if(isCore){
    const numSets=parseInt(exDef.numSets)||3;
    const history=[];
    for(let w=cw-1;w>=1&&history.length<3;w--){
      const v=gw(w,day,name);
      if(v){
        const done=countCompletedSets(v,numSets);
        if(done>0)history.push({week:w,done:done,total:numSets});
      }
    }
    if(history.length===0)return '';
    let h=`<div class="hist-strip">
      <div class="hist-label">${ic('trending','sm')} SIDSTE</div>
      <div class="hist-cells">`;
    history.reverse().forEach((item,i)=>{
      const isLast=i===history.length-1;
      const isFull=item.done===item.total;
      h+=`<div class="hist-cell${isLast?' latest':''}"><div class="hist-w">U${item.week}</div><div class="hist-v" style="color:${isFull?'var(--grn)':'var(--txt)'}">${item.done}/${item.total}</div></div>`;
    });
    const last=history[history.length-1];
    if(last.done<last.total){
      h+=`<span class="hist-suggest">→ Tag alle ${last.total} i denne uge</span>`;
    }
    h+=`</div>`;
    return h;
  }
  // Saml op til 3 sidste uger med data (kg eller reps)
  const history=[];
  for(let w=cw-1;w>=1&&history.length<3;w--){
    const v=gw(w,day,name);
    if(v){
      const max=maxW(v);
      if(!isNaN(max)&&max>0){
        history.push({week:w,max:max,full:v});
      }
    }
  }
  if(history.length===0)return '';
  const unit='kg';
  // Foreslå næste vægt (kun for ikke-core) — brug den deload-bevidste motor
  let suggestion='';
  if(!isCore&&history.length>=1){
    const dayObj=D.find(x=>x.full===day);
    const sug=suggestWeight(cw,day,name,exDef,dayObj);
    if(sug&&sug.w){
      const nSets=parseInt(exSR(exDef,cw).s)||3;
      suggestion=`<button class="hist-suggest hist-suggest-btn" onclick="applySuggestion(${cw},'${escAttr(day)}','${escAttr(name)}',${nSets},${sug.w})">→ Prøv ${sug.w} ${unit}</button>`;
    }
  }
  let trendIcon='';
  if(history.length>=2){
    const newest=history[0].max;
    const older=history[history.length-1].max;
    if(newest>older)trendIcon='<span style="color:var(--grn);margin-left:4px">↗</span>';
    else if(newest<older)trendIcon='<span style="color:#ff9f0a;margin-left:4px">↘</span>';
    else trendIcon='<span style="color:var(--mut);margin-left:4px">→</span>';
  }
  let h=`<div class="hist-strip">
    <div class="hist-label">${ic('trending','sm')} SIDSTE${trendIcon}</div>
    <div class="hist-cells">`;
  history.reverse().forEach((item,i)=>{
    const isLast=i===history.length-1;
    h+=`<div class="hist-cell${isLast?' latest':''}"><div class="hist-w">U${item.week}</div><div class="hist-v">${item.max}</div></div>`;
  });
  h+=`</div>${suggestion}</div>`;
  return h;
}

function wchSet(w,day,name,idx,numSets,val){
  const current=gw(w,day,name);
  const arr=parseW(current);
  const num=parseFloat(val);
  while(arr.length<numSets)arr.push(0);
  // Tomt input = ryd kun dette ene sæt
  arr[idx]=isNaN(num)?0:num;
  const newVal=arr.join(',');
  sw(w,day,name,newVal);
  // Find exercise type for timer
  const dayObj=D.find(o=>o.full===day);
  if(dayObj){

// Nuværende streak (samme logik som rStreak, home-aware)
function calcCurrentStreak(){
  if(!PROG.startDate)return 0;
  const start=new Date(PROG.startDate+'T00:00:00');
  const today=new Date();today.setHours(0,0,0,0);start.setHours(0,0,0,0);
  const todayIdx=Math.floor((today-start)/86400000);
  const dayMap={};
  for(let w=1;w<=TW();w++){
    D.forEach((d,di)=>{
      const exs=dayEx(d);
      let hasData=false;
      if(exs){hasData=exs.some(e=>gw(w,d.full,e.n)||gw(w,d.full,'HOME__'+e.n))}
      else if(d.run){hasData=['tid','pace','km'].some(k=>gw(w,d.full,k))}
      if(hasData)dayMap[(w-1)*7+di]=1;
    });
  }
  let running=0;
  for(let i=0;i<=Math.min(todayIdx,TW()*7-1);i++){
    if(dayMap[i])running++;else running=0;
  }
  return running;
}

// Dato-label til detalje-header i "Kun i dag" mode (erstatter banneret)
function dayContextLabel(dayIdx){
  const realToday=todayDayIdx();
  const d=D[dayIdx];
  const cw=currentWeek();
  const isToday=dayIdx===realToday;
  let dateLabel='';
  if(PROG.startDate){
    const start=new Date(PROG.startDate);
    const startDayIdx=(start.getDay()+6)%7;
    const daysDiff=(cw-1)*7+(dayIdx-startDayIdx);
    const targetDate=new Date(start);
    targetDate.setDate(start.getDate()+daysDiff);
    dateLabel=targetDate.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'});
  }else{
    dateLabel=d.full;
  }
  return (isToday?'I dag · ':'')+dateLabel;

        // Opvarmningssæt: kun tunge compounds hvor en arbejdsvægt kendes
        const wuHtml=(()=>{
          if(e.core||e.k!=='c'||homeOn)return '';
          const wu=warmupSets(mainVal||(sugg&&sugg.w)||0);
          if(!wu)return '';
          return `<details class="wu"><summary>🔥 Opvarmning før arbejdssæt</summary>
            <div class="wu-rows">${wu.map(s=>`<div class="wu-row"><span class="wu-pct">${s.pct}%</span><b>${s.w} kg</b><span class="wu-reps">× ${s.reps}</span></div>`).join('')}
            <div class="wu-note">Hvil 60-90 sek mellem opvarmningssæt. Sidste opvarmning skal føles let og hurtig — ikke trættende.</div></div></details>`;
        })();
        // Handlings-knapper samlet i tydelig bar
        const actionBar=`<div class="ex-actions">
          ${!e.core?`<button class="ex-act${inSS?' on':''}" onclick="toggleSuperset('${escAttr(d.full)}',${exIdx})">${inSS?'✓ Superset':'+ Superset'}</button>`:''}
          ${!e.custom&&!e.core?`<button class="ex-act${e.swapped?' on':''}" onclick="openSwapModal('${escAttr(d.full)}','${escAttr(e.originalName||e.n)}')">⇆ Skift</button>`:''}

        // Hjemme-alternativ (kun når hjemme-mode er aktiv for dagen)
        let homeAltHtml='';
        if(homeOn){
          const alt=homeAlternative(e,usedHomeAlts);
          if(alt){
            homeAltHtml=`<div class="home-alt">
              <div class="home-alt-head">
                <svg class="ic sm" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
                <b>${escHtml(alt.n)}</b>
                <a class="home-alt-vid" href="${alt.l}" target="_blank">▶ Guide</a>
              </div>
              <div class="home-alt-note">${escHtml(alt.no)} Samme sæt/reps. Vægten logges separat — din center-historik påvirkes ikke.</div>
            </div>`;
          }
        }
        // Done-state: alle sæt logget på denne øvelse
        const exDone=(()=>{
          if(e.core)return countCompletedSets(v,numSets)===numSets;
          const arr=parseW(v);
          if(arr.length<numSets)return false;
          for(let si=0;si<numSets;si++){
            if(arr[si]==null||isNaN(arr[si]))return false;
            if(!homeOn&&arr[si]<=0)return false;
          }
          return true;
        })();
        h+=`<div class="exrow${cls?' '+cls:''}${showSetInputs?' has-sets':''}${exDone?' done':''}">
          <div class="exrow-top">
            <div>
              <div class="exn">${e.n}${custTag}${swapTag}${prBadge}</div>
              ${e.swapped?`<div class="exno" style="color:var(--mut2)">⇆ Erstatter "${escHtml(e.originalName)}"</div>`:''}
              ${e.injurySwapped?`<div class="inj-why">🤕 Byttet fra "${escHtml(e.originalName)}" pga. ${escHtml(e.injuryArea||'skade')} — ${escHtml(e.injuryWhy||'')}</div>`:''}
              ${e.no?`<div class="exno">${e.no}</div>`:''}
            </div>
            <a class="vl" href="${e.l}" target="_blank">▶ Video</a>
          </div>
          ${homeAltHtml}
          ${suggHtml}
          ${wuHtml}
          <div class="metrics">
            <div class="metric"><div class="metric-num" style="color:${d.color}">${sr.s}</div><div class="metric-cap">Sæt</div></div>
            <div class="metric"><div class="metric-num">${sr.r}</div><div class="metric-cap">Reps</div></div>
            ${(()=>{
              if(e.core){
                const done=countCompletedSets(gw(week,d.full,logName),numSets);
                if(done===numSets)return '<div class="metric"><div class="metric-num grn">✓</div><div class="metric-cap">'+done+'/'+numSets+' sæt</div></div>';
                return '<div class="metric"><div class="metric-num'+(done===0?' muted':'')+'">'+done+'/'+numSets+'</div><div class="metric-cap">Sæt gjort</div></div>';
              }
              if(!mainVal||isNaN(mainVal)||mainVal<=0)return '<div class="metric"><div class="metric-num muted">—</div><div class="metric-cap">Max</div></div>';
              return '<div class="metric"><div class="metric-num grn">'+mainVal+'<small>kg</small></div><div class="metric-cap">Max'+(diffH(dv)?' '+diffH(dv):'')+'</div></div>';
            })()}
          </div>
          ${week>=2?renderHistoryStrip(d.full,homeOn?logName:(e.originalName||e.n),e):''}
          ${rmDisplay||''}
          ${e.core?renderCoreCheckmarks(week,d.full,logName,numSets):''}
          ${showSetInputs?renderSetInputs(week,d.full,logName,numSets):''}
          ${noteOpen?renderNotePopup(week,d.full,e.n):''}
          ${actionBar}
        </div>`;
      });
      h+=`<div class="tip">💡 <b>Pause:</b> 2–3 min styrke &nbsp;·&nbsp; 60–90 sek isolation &nbsp;·&nbsp; 1–2 reps fra failure</div>`;
      if(exs.some(e=>e.core))h+=`<div class="tcore">🔶 <b>Core-blok</b> – ca. 10 min til sidst &nbsp;·&nbsp; 45–60 sek pause</div>`;
      h+=`<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="ai-btn quick-coach" onclick="askCoachAboutToday('${escAttr(d.full)}')">${ic('bot','sm')} Spørg coachen</button>
        <button class="ai-btn ghost" onclick="go('library')">+ Tilføj øvelse</button>
        <button class="ai-btn ghost" onclick="openMobilityModal()">🧘 Mobility</button>
      </div>`;

    }else if(d.run){
      // ─── EVIDENSBASERET LØBEPLAN ───
      h+=wpickH();
      const plan=getRunPlan(week,d.run);
      const phaseColors={base:'#0a84ff',build:'#ffd60a',peak:'#ff453a',taper:'#30d158'};
      const phaseColor=phaseColors[plan.phase];
      const tpl2=TEMPLATES[PROG.template||'recomp'];
      const hasGoal=tpl2?.needsRunTime;

      // Fase-banner øverst
      h+=`<div class="run-phase-banner" style="--pc:${phaseColor}">
        <div class="rpb-icon">${plan.phase==='base'?'🏗️':plan.phase==='build'?'⚙️':plan.phase==='peak'?'🔥':'🎯'}</div>
        <div class="rpb-text">
          <div class="rpb-eyebrow">// Fase · uge ${week}/${TW()}</div>
          <div class="rpb-title">${plan.phaseLabel} <button class="run-info-btn" onclick="openRunInfo('phase-${plan.phase}')" aria-label="Forklaring om fase">i</button></div>
          <div class="rpb-sub">${plan.phaseContext}</div>
        </div>
      </div>`;

      // Hoved-prescriptionskort
      h+=`<div class="run-prescription" style="--rc:${d.color}">
        <div class="rp-header">
          <span class="rp-type-emoji">${plan.type==='interval'?'⚡':plan.type==='tempo'?'🔥':plan.type==='long'?'🏃':plan.type==='recovery'?'💚':plan.type==='walk'?'🚶':'🏃‍♀️'}</span>
          <div>
            <div class="rp-type">${plan.typeLabel}</div>
            <div class="rp-type-cat">${{
              easy:'Easy run · 60-70% HRmax',
              long:'Long run · 65-75% HRmax',
              recovery:'Recovery · 60-65% HRmax',
              steady:'Steady · 75-82% HRmax',
              tempo:'Threshold · 82-87% HRmax',
              interval:'VO2max · 90-95% HRmax',
              walk:'Walking · 55-65% HRmax'
            }[plan.type]||''}</div>
          </div>
        </div>

        ${(plan.warmup||plan.cooldown)?`
          <div class="rp-blocks">
            ${plan.warmup?`<div class="rp-block warmup">
              <div class="rp-block-num">1</div>
              <div class="rp-block-content">
                <div class="rp-block-title">🔥 OPVARMNING <button class="run-info-btn" onclick="openRunInfo('warmup')" aria-label="Forklaring om opvarmning">i</button></div>
                <div class="rp-block-detail">Easy løb @ ${plan.warmup.pacePerKmFmt}/km · <b>${plan.warmup.dur} min</b></div>
                ${plan.warmup.strides?`<div class="rp-block-extra">+ ${plan.warmup.strides.count} strides à ${plan.warmup.strides.distance}m <button class="run-info-btn small" onclick="openRunInfo('strides')" aria-label="Hvad er strides?">i</button></div>`:''}
              </div>
            </div>`:''}
            <div class="rp-block main">
              <div class="rp-block-num">${plan.warmup?'2':'1'}</div>
              <div class="rp-block-content">
                <div class="rp-block-title">${plan.type==='interval'?'⚡ INTERVALLER':'🎯 HOVED-SESSION'} <button class="run-info-btn" onclick="openRunInfo('${plan.type}')" aria-label="Forklaring">i</button></div>
                <div class="rp-block-detail">${plan.format==='intervals'?
                  `<b>${plan.intervalsInfo.reps}×${plan.intervalsInfo.dist}m</b> @ ${plan.pacePerKmFmt}/km`:
                  `<b>${plan.dur} min</b> @ ${plan.pacePerKmFmt}/km`}</div>
                ${plan.format==='intervals'?`<div class="interval-rest-card">
                  <div class="irc-row">
                    <span class="irc-icon">⏸️</span>
                    <div class="irc-text">
                      <div class="irc-label">PAUSE MELLEM INTERVALLER</div>
                      <div class="irc-value"><b>${plan.intervalsInfo.rest} sek</b> · easy jog (ikke stop)</div>
                    </div>
                    <button class="run-info-btn" onclick="openRunInfo('rest')" aria-label="Hvorfor pause?">i</button>
                  </div>
                </div>`:''}
                ${plan.paceDelta!==0?`<div class="rp-delta ${plan.paceDelta<0?'down':'up'}" style="margin-top:6px">${plan.paceDelta<0?'−':'+'}${Math.abs(plan.paceDelta)} sek/km fra sidste uge</div>`:''}
              </div>
            </div>
            ${plan.cooldown?`<div class="rp-block cooldown">
              <div class="rp-block-num">${plan.warmup?'3':'2'}</div>
              <div class="rp-block-content">
                <div class="rp-block-title">💚 NEDLØB <button class="run-info-btn" onclick="openRunInfo('cooldown')" aria-label="Forklaring om nedløb">i</button></div>
                <div class="rp-block-detail">Easy løb @ ${plan.cooldown.pacePerKmFmt}/km · <b>${plan.cooldown.dur} min</b></div>
                <div class="rp-block-extra">Lad pulsen gradvist falde — det her hjælper restitution</div>
              </div>
            </div>`:''}
          </div>
          <div class="rp-total">⏱️ Total: <b>~${plan.totalDur} min</b></div>
        `:`
          <div class="rp-targets">
            <div class="rp-target">
              <div class="rp-label">Mål-pace <button class="run-info-btn" onclick="openRunInfo('${plan.type}')" aria-label="Forklaring">i</button></div>
              <div class="rp-value">${plan.pacePerKmFmt} /km</div>
              ${plan.paceDelta!==0?`<div class="rp-delta ${plan.paceDelta<0?'down':'up'}">${plan.paceDelta<0?'−':'+'}${Math.abs(plan.paceDelta)} sek/km fra sidste uge</div>`:''}
            </div>
            <div class="rp-target">
              <div class="rp-label">Varighed</div>
              <div class="rp-value">${plan.dur} min</div>
              <div class="rp-extra">~${Math.round((plan.dur*60)/plan.pacePerKm*10)/10} km</div>
            </div>
          </div>
        `}

        ${plan.tip?`<div class="rp-tip" style="background:${d.color}12;border:1px solid ${d.color}30;color:${d.color}">💡 ${plan.tip}</div>`:''}
      </div>`;

      // Mål-kort bygges til variabel — placeres EFTER log (indtastning er vigtigst)
      let goalCard='';
      if(hasGoal){
        const dist=PROG.runDistance||5;
        const startSec=PROG.start5kSec||2100;
        const startMin=Math.floor(startSec/60),startSecRem=startSec%60;
        const goalSec=goal5kSec();
        const weeksRemaining=TW()-week+1;
        const improvementPct=Math.round((1-goalSec/startSec)*100*10)/10;
        goalCard=`<div class="run-goal-card">
          <div class="rgc-title">${ic('target','sm')} Mit ${dist} km mål</div>
          <div class="rgc-row">
            <div class="rgc-field">
              <label>📏 Distance</label>
              <select id="runDistInline" onchange="updateRunGoal()">
                ${[3,5,10,15,21].map(k=>`<option value="${k}"${k===dist?' selected':''}>${k} km${k===21?' (½M)':''}</option>`).join('')}
              </select>
            </div>
            <div class="rgc-field">
              <label>🏁 Min starttid</label>
              <div style="display:flex;align-items:center;gap:4px;justify-content:center">
                <input type="number" inputmode="numeric" min="0" max="200" id="runStartMin" value="${startMin}" oninput="updateRunGoal()" onfocus="this.select()" style="width:54px">
                <span style="font-weight:600;color:var(--mut)">:</span>
                <input type="number" inputmode="numeric" min="0" max="59" id="runStartSec" value="${String(startSecRem).padStart(2,'0')}" oninput="updateRunGoal()" onfocus="this.select()" style="width:54px">
              </div>
            </div>
          </div>
          <div class="rgc-result" id="runGoalDisplay">
            <span class="rgc-arrow">→</span>
            <div>
              <div class="rgc-goal-label">SLUTMÅL · ${TW()} UGER (~${improvementPct}% hurtigere)</div>
              <div class="rgc-goal-time" style="color:${d.color}">&lt;${fmtSec(goalSec)}</div>
              <div class="rgc-goal-pace">${fmtSec(Math.round(goalSec/dist))} /km · ${weeksRemaining} uger tilbage</div>
            </div>
          </div>
        </div>`;
      }

      const rf=[{k:'tid',label:'Tid (min:sek)',ph:'28:30'},{k:'pace',label:'Faktisk pace (min/km)',ph:'5:42'},{k:'km',label:'Distance (km)',ph:'5.2'}];
      h+=`<div class="runlog">
        <div class="runlog-head" style="background:${d.color}15;border-bottom:1px solid ${d.color}25">
          <span style="color:${d.color}">📝</span>
          <span style="color:${d.color}">LOG – UGE ${week}</span>
        </div>`;
      rf.forEach(f=>{
        const cv=gw(week,d.full,f.k),pv=week>1?gw(week-1,d.full,f.k):'';
        h+=`<div class="runlog-row">
          <div>
            <div class="runlog-label">${f.label}</div>
            ${pv?`<div class="runlog-prev">▸ Forrige: ${pv}</div>`:''}
          </div>
          <input class="wi" type="text" inputmode="decimal" placeholder="${f.ph}" style="width:80px"
            value="${cv}" data-w="${week}" data-d="${d.full}" data-n="${f.k}"
            onchange="wch(this)" onfocus="this.select()">
        </div>`;
      });
      const note=gw(week,d.full,'note');
      h+=`<div class="runlog-note">
        <label>📓 Noter</label>
        <textarea rows="2" placeholder="Hvordan gik det? Følte du dig stærk?"
          data-w="${week}" data-d="${d.full}" data-n="note"
          onchange="wch(this)">${escHtml(note)}</textarea>
      </div></div>`;
      // Mål-kort placeres HER — efter loggen (sekundær reference)
      h+=goalCard;
      h+=renderPaceCalc();
      // Løberute: beregn dagens reelle distance komponent-vis
      // (opvarmning/nedløb/pauser løbes i easy-tempo — ikke i hoveddelens pace)
      const routeKm=(()=>{
        const easyPace=getPaceForRunType(week,'easy');
        let meters=0;
        if(plan.warmup)meters+=plan.warmup.dur*60/easyPace*1000;
        if(plan.cooldown)meters+=plan.cooldown.dur*60/easyPace*1000;
        if(plan.format==='intervals'){
          // Intervaller: ca. halvdelen arbejde (interval-pace), halvdelen pause (recovery-tempo)
          const recPace=getPaceForRunType(week,'recovery');
          meters+=plan.dur*60*(0.5/plan.pacePerKm+0.5/recPace)*1000;
        }else{
          meters+=plan.dur*60/plan.pacePerKm*1000;
        }
        return Math.max(2,Math.round(meters/100)/10);
      })();
      h+=`<button class="route-btn" onclick="openRouteModal(${routeKm},'${escAttr(d.full)}',${plan.totalDur})">
        <svg class="ic sm" viewBox="0 0 24 24"><path d="M9 20l-5.5-2.2a1 1 0 0 1-.5-.9V4.6a1 1 0 0 1 1.4-.9L9 5.8m0 14.2 6-2m-6 2V5.8m6 12.2 5.1 2a1 1 0 0 0 1.4-.9V6.6a1 1 0 0 0-.6-.9L15 3.8m0 14.2V3.8M9 5.8l6-2"/></svg>
        Generér løberute · ca. ${routeKm} km fra din position
      </button>`;
      h+=`<button class="guide-btn" onclick="openRunGuide('${escAttr(d.full)}',${routeKm})">
        🎧 Guidet løb — stemme i høretelefoner + auto-log
      </button>`;
      h+=`<div style="margin-top:12px;text-align:center">
        <button class="ai-btn quick-coach" onclick="askCoachAboutToday('${escAttr(d.full)}')">${ic('bot','sm')} Spørg coachen om dagens løb</button>
      </div>`;

    }else{
      h+=`<div class="rest">
        <span class="rest-icon">😴</span>
        <div class="rest-title">Restitutionsdag</div>
        <div class="rest-sub">Søvn 7–9 timer &nbsp;·&nbsp; Let gåtur er fint</div>
      </div>`;
      h+=`<button class="mob-card" onclick="openMobilityModal()">
        <span class="mob-card-icon">🧘</span>
        <div class="mob-card-text">
          <b>Perfekt dag til mobility</b>
          <small>4 rutiner · 8–15 min${mobDoneCount()>0?' · '+mobDoneCount()+' gennemført':''}</small>
        </div>
        <span class="mob-card-arrow">›</span>
      </button>`;
    }
    h+='</div>';
    // Luk altid swipe-wrap (vi bruger den nu for alle dage)
    h+=`</div>`;
  }
  return h;
}

// FLEX-MODE banner: viser næste session i køen i stedet for dagens dag
function rFlexBanner(){
  const cw=flexCurrentWeek();
  const next=getNextFlexSession();
  if(!next){
    // Ugen er færdig
    if(cw>=TW()&&isProgramDone()){
      return `<div class="flex-banner done">
        <div class="flex-banner-icon">🏆</div>
        <div class="flex-banner-text">
          <div class="fb-eyebrow"><span class="pulse"></span>Program færdigt</div>
          <div class="fb-title">Tillykke!</div>
          <div class="fb-sub">Alle ${TW()} uger gennemført</div>
        </div>
      </div>`;
    }
    return `<div class="flex-banner complete">
      <div class="flex-banner-icon">✅</div>
      <div class="flex-banner-text">
        <div class="fb-eyebrow">// Uge ${cw} fuldført</div>
        <div class="fb-title">Hvile-tid</div>
        <div class="fb-sub">Du har lavet alle sessions denne uge · Næste uge starter når du logger igen</div>
      </div>
    </div>`;
  }
  const pending=getPendingSessions(cw);
  const idx=D.findIndex(d=>d.full===next.full);
  const sessionsThisWeek=D.filter(d=>d.ex||d.run).length;
  const completedThisWeek=sessionsThisWeek-pending.length;
  return `<div class="flex-banner" style="--tc:${next.color}" onclick="goToTodayDetail(${idx})">
    <div class="flex-banner-icon">${next.icon}</div>
    <div class="flex-banner-text">
      <div class="fb-eyebrow"><span class="pulse"></span>Næste session · Uge ${cw} (${completedThisWeek}/${sessionsThisWeek})</div>
      <div class="fb-title">${next.type}</div>
      <div class="fb-sub">${next.label}${pending.length>1?` · ${pending.length-1} flere venter i køen`:''}</div>
    </div>
    <div class="tb-arrow">›</div>
  </div>
  ${pending.length>1?`<div class="flex-queue">
    <div class="flex-queue-label">📋 RESTERENDE I UGE ${cw}</div>
    <div class="flex-queue-list">
      ${pending.slice(1).map((d,i)=>`<div class="flex-queue-item" onclick="goToTodayDetail(${D.findIndex(x=>x.full===d.full)})">
        <span style="font-size:16px">${d.icon}</span>
        <div style="flex:1;min-width:0">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.3px">${d.type}</div>
          <div style="font-size:9px;color:var(--mut);font-family:'DM Mono',monospace;letter-spacing:.5px">${d.label.toUpperCase()}</div>
        </div>
        <span style="color:var(--mut2);font-size:14px">›</span>
      </div>`).join('')}
    </div>
  </div>`:''}`;
}

function rTodayBanner(){
  // Vis valgt dag (sel) hvis den findes, ellers dagens dag
  const realToday=todayDayIdx();
  const idx=sel!==null?sel:realToday;
  const d=D[idx];
  const cw=currentWeek();
  const isToday=idx===realToday;
  // Beregn dato for den valgte dag
  let dateLabel='';
  if(PROG.startDate){
    const start=new Date(PROG.startDate);
    const startDayIdx=(start.getDay()+6)%7;
    const daysDiff=(cw-1)*7+(idx-startDayIdx);
    const targetDate=new Date(start);
    targetDate.setDate(start.getDate()+daysDiff);
    dateLabel=targetDate.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'});
  }else{
    dateLabel=new Date().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'});
  }
  const exs=dayEx(d);
  let summary='';
  if(d.run){
    const plan=getRunPlan(cw,d.run);
    if(plan.format==='intervals'){
      summary=`${plan.intervalsInfo.reps}×${plan.intervalsInfo.dist}m @ ${plan.pacePerKmFmt}/km · ~${plan.totalDur} min total`;
    }else if(plan.warmup||plan.cooldown){
      summary=`${plan.dur} min tempo @ ${plan.pacePerKmFmt}/km · ~${plan.totalDur} min total`;
    }else{
      summary=`${plan.dur} min @ ${plan.pacePerKmFmt}/km · ${plan.typeLabel}`;
    }
  }else if(exs){
    const compounds=exs.filter(e=>!e.core).slice(0,3).map(e=>e.n).join(', ');
    summary=`${exs.filter(e=>!e.core).length} øvelser · ${compounds}${exs.filter(e=>!e.core).length>3?'…':''}`;
  }else{
    summary='Hvile · Søvn 7-9 timer · Let gåtur er fint';
  }
  const prefix=isToday?'I dag':d.full;
  return `<div class="today-banner" style="--tc:${d.color}" onclick="goToTodayDetail(${idx})"

let bannerSwipeX=null,bannerSwipeY=null,bannerSwipeTime=0;
function bannerSwipeStart(e){
  bannerSwipeX=e.touches[0].clientX;
  bannerSwipeY=e.touches[0].clientY;
  bannerSwipeTime=Date.now();
}
function bannerSwipeMove(e){
  if(bannerSwipeX===null)return;
  const dy=e.touches[0].clientY-bannerSwipeY;
  const dx=e.touches[0].clientX-bannerSwipeX;
  if(Math.abs(dy)>Math.abs(dx)){bannerSwipeX=null;return}
}
function bannerSwipeEnd(e){
  if(bannerSwipeX===null)return;
  const dx=(e.changedTouches?.[0]?.clientX||0)-bannerSwipeX;
  const elapsed=Date.now()-bannerSwipeTime;
  const isSwipe=Math.abs(dx)>60||(Math.abs(dx)>30&&elapsed<200);
  if(isSwipe){
    const cur=sel!==null?sel:todayDayIdx();
    if(dx<0)sel=(cur+1)%7;
    else sel=(cur-1+7)%7;
    render();
  }
  bannerSwipeX=null;bannerSwipeY=null;
}

function calorieTargets(){
  const w=parseFloat(PROFILE.weight)|| (BODY&&BODY.length?parseFloat(BODY[BODY.length-1].w):0) || 80;
  const tpl=PROG.template||'recomp';
  // kcal/kg og protein g/kg efter forløbs-mål

  if(tpl==='shred'){kcalPerKg=26;protPerKg=2.8;label='Aggressivt underskud'}
  else if(tpl==='cut'){kcalPerKg=30;protPerKg=2.4;label='Moderat underskud'}
  else if(tpl==='bulk'){kcalPerKg=39;protPerKg=2.0;label='Overskud'}
  else{kcalPerKg=33;protPerKg=2.2;label='Vedligehold / recomp'}
  const kcal=Math.round(w*kcalPerKg);
  const protein=Math.round(w*protPerKg);
  const fat=Math.round(w*0.9); // ~0.9 g/kg fedt-gulv
  const carbKcal=kcal-(protein*4)-(fat*9);
  const carbs=Math.max(0,Math.round(carbKcal/4));
  return {kcal,protein,fat,carbs,label,w};
}

/* ── GEMINI-HJÆLPERE: kvote-beskeder + husk døde modeller ── */
// Tolker Googles 429 præcist: er grænsen pr. minut eller pr. dag? Og hvor længe skal man vente?
function geminiRateMsg(errJson){
  const err=(errJson&&errJson.error)||{};
  const msg=(err.message||'').toLowerCase();
  let retrySec=null,perMinute=false,perDay=false;
  (err.details||[]).forEach(d=>{
    const t=d['@type']||'';
    if(t.includes('RetryInfo')&&d.retryDelay){
      const mm=String(d.retryDelay).match(/([\d.]+)s/);
      if(mm)retrySec=Math.ceil(parseFloat(mm[1]));
    }
    if(t.includes('QuotaFailure')){
      (d.violations||[]).forEach(v=>{
        const q=(v.quotaId||'')+(v.quotaMetric||'');
        if(/PerMinute/i.test(q))perMinute=true;
        if(/PerDay/i.test(q))perDay=true;
      });
    }
  });
  if(!perMinute&&!perDay){
    if(/per minute/.test(msg))perMinute=true;
    else if(/per day|daily/.test(msg))perDay=true;
  }
  if(perDay)return 'Dagens AI-kvote er brugt op. Den nulstilles i nat — prøv igen i morgen.';
  if(perMinute||retrySec)return 'For mange forespørgsler lige nu (grænse pr. minut). Vent '+(retrySec?retrySec+' sekunder':'ca. et minut')+' og prøv igen.';
  return 'AI-grænse nået. Vent et minut og prøv igen — er dagens kvote brugt, nulstilles den i nat.';
}

  const good=all.filter(m=>bad.indexOf(m)<0);
  return good.length?good:all; // er alt markeret dødt, prøv alligevel forfra
}

// Kald Gemini med et billede — genbruger fallback-kæden fra callClaude
async function callGeminiVision(base64,mimeType,promptText){
  if(!AI.apiKey)throw new Error('AI-coachen kræver en Gemini-nøgle (se Coach-fanen). Foto-analyse bruger samme nøgle.');
  const candidates=geminiCandidates();
  let res=null,usedModel='',lastErr='';
  async function tryVision(cand,withThinking){
    const is25=cand.startsWith('gemini-2.5')||cand.endsWith('-latest');
    const gen={maxOutputTokens:2048,temperature:0.4};
    if(is25&&withThinking)gen.thinkingConfig={thinkingBudget:0};
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cand)}:generateContent`;
    return fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':AI.apiKey},
      body:JSON.stringify({contents:[{role:'user',parts:[{inline_data:{mime_type:mimeType,data:base64}},{text:promptText}]}],generationConfig:gen})
    });
  }
  for(const cand of candidates){
    res=await tryVision(cand,true);
    usedModel=cand;
    if(res.ok)break;
    let em='';try{const ej=await res.clone().json();em=ej?.error?.message||''}catch(e){}
    const eml=em.toLowerCase();
    if(res.status===400&&eml.includes('invalid argument')){
      const r2=await tryVision(cand,false);
      if(r2.ok){res=r2;break}
      let em2='';try{const ej2=await r2.clone().json();em2=ej2?.error?.message||''}catch(e){}
      lastErr=em2||em;res=r2;
    }else{lastErr=em}
    const l=lastErr.toLowerCase();
    if(res.status===404||l.includes('not found'))markBadModel(cand);
    if(!(res.status===404||(res.status===400&&(l.includes('model')||l.includes('invalid')||l.includes('not found')))))break;
  }
  if(res.ok&&usedModel!==AI.workingModel){AI.workingModel=usedModel;saveAI()}
  if(!res.ok){
    let em='Foto-analyse fejl '+res.status,ej=null;
    try{ej=await res.json();em=ej?.error?.message||lastErr||em}catch(e){}
    if(res.status===403)throw new Error('Adgang nægtet. Har din nøgle website-restriktion, skal den tillade d5j9m87p5h-gif.github.io/*');
    if(res.status===429)throw new Error(geminiRateMsg(ej)+' (Du kan indtaste maden manuelt imens.)');
    throw new Error(em.slice(0,140));
  }
  const data=await res.json();
  const cand=data?.candidates?.[0];
  const txt=(cand?.content?.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('').trim();
  if(!txt)throw new Error('Tomt svar fra billed-analysen.');
  return txt;
}

// Ren tekst-Gemini (deler ikke coach-historik) med samme fallback-kæde
async function callGeminiText(promptText,maxTok){
  if(!AI.apiKey)throw new Error('Madplan kræver en Gemini-nøgle (samme som AI-coachen — se Coach-fanen).');
  const candidates=geminiCandidates();
  let res=null,usedModel='',lastErr='';
  // Hjælper: ét kald mod én model, evt. uden thinkingConfig
  async function tryCall(cand,withThinking){
    const is25=cand.startsWith('gemini-2.5')||cand.endsWith('-latest');
    const tok=Math.min(maxTok||3000,is25?8192:6000);
    const gen={maxOutputTokens:tok,temperature:0.7};
    if(is25&&withThinking)gen.thinkingConfig={thinkingBudget:0};
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cand)}:generateContent`;
    return fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':AI.apiKey},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:promptText}]}],generationConfig:gen})
    });
  }
  for(const cand of candidates){
    res=await tryCall(cand,true);
    usedModel=cand;
    if(res.ok)break;
    let em='';try{const ej=await res.clone().json();em=ej?.error?.message||''}catch(e){}
    const eml=em.toLowerCase();
    // Er fejlen "invalid argument"? Prøv SAMME model igen uden thinkingConfig (parametret kan være problemet)
    if(res.status===400&&eml.includes('invalid argument')){
      const res2=await tryCall(cand,false);
      if(res2.ok){res=res2;break}
      let em2='';try{const ej2=await res2.clone().json();em2=ej2?.error?.message||''}catch(e){}
      lastErr=em2||em;res=res2;
    }else{lastErr=em}
    const eml2=lastErr.toLowerCase();
    if(res.status===404||eml2.includes('not found'))markBadModel(cand);
    const tryNext=res.status===404||(res.status===400&&(eml2.includes('model')||eml2.includes('invalid')||eml2.includes('token')||eml2.includes('not found')));
    if(!tryNext)break;
  }
  if(res.ok&&usedModel!==AI.workingModel){AI.workingModel=usedModel;saveAI()}
  if(!res.ok){
    let em='Madplan-fejl '+res.status,ej=null;try{ej=await res.json();em=ej?.error?.message||lastErr||em}catch(e){if(lastErr)em=lastErr}
    const eml=(em||'').toLowerCase();
    if(res.status===403)throw new Error('Adgang nægtet. Har din nøgle website-restriktion, skal den tillade d5j9m87p5h-gif.github.io/*');
    if(res.status===429)throw new Error(geminiRateMsg(ej));
    if(res.status===400&&eml.includes('api key'))throw new Error('Ugyldig API-nøgle. Tjek den under Coach-fanen.');
    if(res.status===400)throw new Error('AI-tjenesten afviste forespørgslen. Prøv igen om lidt — virker det stadig ikke, så prøv en anden model under Coach → indstillinger.');
    throw new Error(em.slice(0,150));
  }
  const data=await res.json();const c=data?.candidates?.[0];
  if(c&&c.finishReason==='MAX_TOKENS'&&!(c.content?.parts||[]).some(p=>p.text)){
    throw new Error('Ugeplanen blev for stor. Prøv dags-madplanen nedenfor i stedet.');
  }
  const txt=(c?.content?.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('').trim();
  if(!txt)throw new Error('Tomt svar fra madplan-generatoren.');
  return txt;
}

  const trainingType=dayObj?(dayObj.ex?'styrketræning':dayObj.run?'løb/cardio':'hviledag'):'hviledag';
  const tplName=(TEMPLATES[PROG.template||'recomp']||{}).name||'';
  mealplanGenerating=true;mealplanErr='';render();
  const prompt=`Du er en dansk ernæringsekspert. Lav en konkret madplan for ÉN dag der rammer disse mål så præcist som muligt:
- Kalorier: ${t.kcal} kcal
- Protein: ${t.protein} g (VIGTIGST — ram dette tal)
- Kulhydrat: ~${t.carbs} g
- Fedt: ~${t.fat} g
Kontekst: Personen følger forløbet "${tplName}" (${t.label}). I dag er en ${trainingType}${isTraining?' — læg gerne flest kulhydrater omkring træningen':''}.
Krav:

Svar KUN med ren JSON (ingen markdown, ingen tekst udenfor) i præcis dette format:
{"meals":[{"navn":"Morgenmad","beskrivelse":"kort: hvad og hvor meget","kcal":tal,"protein":gram,"kulhydrat":gram,"fedt":gram},{...frokost...},{...aftensmad...},{...snack...}]}`;

// ISO-uge-nøgle (mandag-baseret) så planen hører til den rigtige uge
function isoWeekKey(d){
  const dt=d?new Date(d):new Date();
  dt.setHours(0,0,0,0);
  const day=(dt.getDay()+6)%7; // man=0
  dt.setDate(dt.getDate()-day+3); // torsdag i denne uge
  const firstThu=new Date(dt.getFullYear(),0,4);
  const week=1+Math.round(((dt-firstThu)/86400000-3+((firstThu.getDay()+6)%7))/7);
  return dt.getFullYear()+'-W'+String(week).padStart(2,'0');
}
function currentWeekplan(){return WEEKPLAN[isoWeekKey()]}

async function generateWeekplan(){
  const t=calorieTargets();
  const tplName=(TEMPLATES[PROG.template||'recomp']||{}).name||'';
  // Hvilke dage er træningsdage? (giver AI kontekst til kulhydrat-timing)
  const dayInfo=D.map(d=>({
    navn:d.full,
    type:d.ex?'styrketræning':d.run?(d.run.type||'løb'):'hviledag'
  }));
  weekplanGenerating=true;weekplanErr='';render();
  const prompt=`Du er en dansk ernæringsekspert. Lav en madplan for en HEL UGE (7 dage) der hver dag rammer ca. ${t.kcal} kcal og ${t.protein} g protein (protein vigtigst). Forløb: "${tplName}" (${t.label}).
Træningsdage (læg flere kulhydrater her): ${dayInfo.filter(d=>d.type!=='hviledag').map(d=>d.navn).join(', ')||'ingen'}.
Variér retterne men genbrug ingredienser så indkøb er nemt. Danske varer fra Netto/Rema. Hold beskrivelser KORTE (maks 8 ord, med gram).
Svar KUN med ren JSON (ingen markdown). Format:
{"days":[{"dag":"Mandag","meals":[{"navn":"Morgenmad","beskrivelse":"kort m. gram","kcal":0,"protein":0,"kulhydrat":0,"fedt":0},{"navn":"Frokost",...},{"navn":"Aftensmad",...},{"navn":"Snack",...}]},{"dag":"Tirsdag",...}, ...7 dage],"shopping":["vare + mængde",...]}`;
  try{
    const raw=await callGeminiText(prompt,8192);
    const clean=raw.replace(/```json|```/g,'').trim();
    const j=JSON.parse(clean);
    if(!j.days||!Array.isArray(j.days)||j.days.length<5)throw new Error('tomt');
    const days={};
    j.days.forEach(d=>{
      const meals=(d.meals||[]).map(m=>({
        navn:m.navn||'Måltid',beskrivelse:m.beskrivelse||'',
        kcal:Math.round(m.kcal)||0,protein:Math.round(m.protein)||0,
        kulhydrat:Math.round(m.kulhydrat)||0,fedt:Math.round(m.fedt)||0,done:false
      }));
      if(d.dag&&meals.length)days[d.dag]=meals;
    });
    const shopping=(j.shopping||[]).map(s=>({item:String(s),done:false}));
    WEEKPLAN[isoWeekKey()]={days,shopping,targetKcal:t.kcal,targetProt:t.protein,genereret:new Date().toISOString()};
    saveWeekplan();
    weekplanView='plan';
  }catch(e){
    weekplanErr=e.message.includes('JSON')||e.message==='tomt'?'Ugeplanen kom i et uventet format — prøv igen (det er en stor forespørgsel).':e.message;
  }
  weekplanGenerating=false;render();
}

// Hak et måltid af → ryger i kalorietælleren på den rigtige dag
function weekplanToggleMeal(dayName,idx){
  const wp=currentWeekplan();
  if(!wp||!wp.days[dayName]||!wp.days[dayName][idx])return;
  const meal=wp.days[dayName][idx];
  meal.done=!meal.done;
  // Find datoen for den ugedag → log/fjern i CAL
  const dateKey=dateKeyForWeekday(dayName);
  if(dateKey){
    if(!CAL[dateKey])CAL[dateKey]={items:[]};
    const tag='📋 '+meal.navn;
    if(meal.done){
      CAL[dateKey].items.push({n:tag+': '+meal.beskrivelse.slice(0,40),qty:null,kcal:meal.kcal,p:meal.protein,c:meal.kulhydrat,f:meal.fedt,_mp:dayName+'#'+idx});
    }else{
      CAL[dateKey].items=(CAL[dateKey].items||[]).filter(it=>it._mp!==dayName+'#'+idx);
    }
    saveCal();
  }
  saveWeekplan();render();
}
// Find ISO-dato for en ugedag i den nuværende plan-uge
function dateKeyForWeekday(dayName){
  const order=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
  const idx=order.indexOf(dayName);
  if(idx<0)return null;
  const now=new Date();now.setHours(0,0,0,0);
  const curDay=(now.getDay()+6)%7; // man=0
  const monday=new Date(now);monday.setDate(now.getDate()-curDay);
  const target=new Date(monday);target.setDate(monday.getDate()+idx);
  return target.toISOString().slice(0,10);
}
