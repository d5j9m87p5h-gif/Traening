  const inp=document.getElementById('libQ');
  const focus=document.activeElement===inp;
  const caret=inp?inp.selectionStart:0;
  render();
  if(focus){
    const newInp=document.getElementById('libQ');
    if(newInp){newInp.focus();newInp.setSelectionRange(caret,caret)}
  }
}

function libSetFilter(f){libFilter=f;render()}

function openAddModal(libIdx){
  const ex=LIB[libIdx];
  if(!ex)return;
  const m=document.getElementById('modal');
  let h=`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Tilføj "${ex.n}"</div>
    <div class="modal-sub">Vælg hvilken styrkedag øvelsen skal tilføjes til</div>
    <div class="modal-list">`;
  D.filter(d=>d.ex).forEach(d=>{
    h+=`<div class="modal-row" onclick="addCustomEx(${libIdx},'${escAttr(d.full)}')">
      <span class="mi">${d.icon}</span>
      <div>
        <div class="mt">${d.full}</div>
        <div class="ms">${d.type}</div>
      </div>
      <span class="mr">+ TILFØJ</span>
    </div>`;
  });
  h+=`</div>
    <button class="modal-close" onclick="closeModal()">Annuller</button>
  </div>`;
  m.innerHTML=h;
  m.classList.add('show');
}

function closeModal(){
  const m=document.getElementById('modal');
  m.classList.remove('show');
  m.innerHTML='';
}

function addCustomEx(libIdx,dayFull){
  const ex=LIB[libIdx];
  if(!ex)return;
  if(!CUSTOM[dayFull])CUSTOM[dayFull]=[];
  // Avoid duplicates
  if(CUSTOM[dayFull].some(e=>e.n===ex.n)){
    toast('Allerede tilføjet');
    closeModal();
    return;
  }
  CUSTOM[dayFull].push({
    n:ex.n,
    k:ex.k,
    no:ex.e,
    l:ex.l,
    custom:true,
    core:ex.k==='x'?1:undefined
  });
  saveCustom();
  closeModal();
  toast('✓ Tilføjet til '+dayFull);
  render();
}

function removeCustomEx(dayFull,exName){
  if(!confirm(`Fjern "${exName}" fra ${dayFull}?`))return;
  if(!CUSTOM[dayFull])return;
  CUSTOM[dayFull]=CUSTOM[dayFull].filter(e=>e.n!==exName);
  if(CUSTOM[dayFull].length===0)delete CUSTOM[dayFull];
  saveCustom();
  toast('✓ Fjernet');
  render();
}

/* ═══════════════════════════════════════════════════════════ */
/* ── REST TIMER ────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
let restTimerInterval=null,restTimerEnd=0;

function startRestTimer(exType){
  // exType: 'c'=compound, 'i'=isolation, 'x'=core
  const durations={c:150,i:75,x:45}; // sekunder
  const secs=durations[exType]||90;
  restTimerEnd=Date.now()+secs*1000;
  const el=document.getElementById('restTimer');
  el.classList.remove('done');
  el.classList.add('show');
  clearInterval(restTimerInterval);
  restTimerInterval=setInterval(()=>{
    const left=Math.max(0,Math.ceil((restTimerEnd-Date.now())/1000));
    const m=Math.floor(left/60),s=left%60;
    el.querySelector('.rt-time').textContent=m+':'+String(s).padStart(2,'0');
    if(left<=0){
      clearInterval(restTimerInterval);
      el.classList.add('done');
      el.querySelector('.rt-time').textContent='GÅ!';
      try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
      setTimeout(()=>dismissTimer(),4000);
    }
  },250);
}

function dismissTimer(){
  clearInterval(restTimerInterval);
  const el=document.getElementById('restTimer');
  el.classList.remove('show','done');
}

/* ═══════════════════════════════════════════════════════════ */
/* ── PR TRACKING ───────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function getPR(day,exName){
  let best=0;
  for(let w=1;w<=TW();w++){
    const v=maxW(gw(w,day,exName));
    if(!isNaN(v)&&v>best)best=v;
  }
  return best||0;
}

function checkAndCelebratePR(day,exName,newVal){
  const newMax=maxW(newVal);
  if(isNaN(newMax)||newMax<=0)return;
  // Check all OTHER weeks for previous best
  let prevBest=0;
  for(let w=1;w<=TW();w++){
    const v=maxW(gw(w,day,exName));
    if(!isNaN(v)&&v>prevBest)prevBest=v;
  }
  // If newMax equals prevBest, it might BE this entry. Compare against truly previous
  // The new value is already stored at this point, so prevBest includes it
  // We need to check: is this the ONLY time this max appears?
  if(newMax>=prevBest&&newMax>0){
    // Count how many weeks have this max
    let maxCount=0;
    for(let w=1;w<=TW();w++){
      const v=maxW(gw(w,day,exName));
      if(v===newMax)maxCount++;
    }
    if(maxCount===1){showPRCelebration()} // first time hitting this weight
  }
}

function showPRCelebration(){
  const el=document.getElementById('prToast');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  try{navigator.vibrate&&navigator.vibrate([100,50,100,50,200])}catch(e){}
  setTimeout(()=>el.classList.remove('show'),1200);
}

function isPR(day,exName,week){
  const thisMax=maxW(gw(week,day,exName));
  if(isNaN(thisMax)||thisMax<=0)return false;
  const pr=getPR(day,exName);
  return thisMax>=pr;
}

/* ═══════════════════════════════════════════════════════════ */
/* ── SUPERSET GROUPING ─────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
const SSK='tw4_ss';
let SUPERSETS={};// { "Mandag": [[0,1],[3,4]], ... } pairs of exercise indices
try{SUPERSETS=JSON.parse(localStorage.getItem(SSK)||'{}')}catch(e){}

// Default superset-forslag baseret på øvelsesnavne (push/pull, antagonister, arme)
const DEFAULT_SS_PAIRS={
  "Mandag":[["Bænkpres (flad)","Bent-over Rows"]],
  "Onsdag":[["Leg Curl","Calf Raises"]],
  "Torsdag":[["Biceps Curl (kabel)","Triceps Pushdown"]],
  "Lørdag":[["Leg Curl (liggende)","Tibialis Raises"]]
};

// Konvertér default-par til indices baseret på dagens øvelser. Kører kun første gang.
function applyDefaultSupersets(){
  if(localStorage.getItem('tw4_ss_init'))return;
  Object.entries(DEFAULT_SS_PAIRS).forEach(([dayFull,pairs])=>{
    const dayObj=D.find(o=>o.full===dayFull);
    if(!dayObj||!dayObj.ex)return;
    const exNames=dayObj.ex.map(e=>e.n);
    if(!SUPERSETS[dayFull])SUPERSETS[dayFull]=[];
    pairs.forEach(([a,b])=>{
      const ai=exNames.indexOf(a),bi=exNames.indexOf(b);
      if(ai>=0&&bi>=0&&!SUPERSETS[dayFull].some(p=>p[0]===ai||p[1]===ai||p[0]===bi||p[1]===bi)){
        SUPERSETS[dayFull].push([ai,bi]);
      }
    });
  });
  saveSS();
  try{localStorage.setItem('tw4_ss_init','1')}catch(e){}
}
applyDefaultSupersets();

function saveSS(){try{localStorage.setItem(SSK,JSON.stringify(SUPERSETS))}catch(e){}}

function toggleSuperset(dayFull,idx){
  if(!SUPERSETS[dayFull])SUPERSETS[dayFull]=[];
  const pairs=SUPERSETS[dayFull];
  const existing=pairs.findIndex(p=>p[0]===idx||p[1]===idx);
  if(existing>=0){
    pairs.splice(existing,1);
    toast('Superset fjernet');
  }else{
    // Pair with next exercise that isn't already in a superset
    const dayObj=D.find(o=>o.full===dayFull);
    const exs=dayObj?dayEx(dayObj):null;
    if(!exs)return;
    let partner=-1;
    for(let i=idx+1;i<exs.length;i++){
      if(!exs[i].core&&!pairs.some(p=>p[0]===i||p[1]===i)){partner=i;break}
    }
    if(partner<0){toast('Ingen tilgængelig partner');return}
    pairs.push([idx,partner]);
    toast('✓ Superset markeret');
  }
  saveSS();render();
}

function isInSuperset(dayFull,idx){
  const pairs=SUPERSETS[dayFull]||[];
  return pairs.some(p=>p[0]===idx||p[1]===idx);
}

function isSupersetPartner(dayFull,idx){
  const pairs=SUPERSETS[dayFull]||[];
  const pair=pairs.find(p=>p[0]===idx||p[1]===idx);
  if(!pair)return null;
  return pair[0]===idx?pair[1]:pair[0];
}

function getRestTypeForSuperset(dayFull,exIdx,exType){
  // If in superset, only start timer after the SECOND exercise in the pair
  const pairs=SUPERSETS[dayFull]||[];
  const pair=pairs.find(p=>p[0]===exIdx||p[1]===exIdx);
  if(!pair)return exType; // normal timer
  if(pair[1]===exIdx)return exType; // second in pair → start timer
  return null; // first in pair → no timer yet
}

/* ═══════════════════════════════════════════════════════════ */
/* ── PACE CALCULATOR ───────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function renderPaceCalc(){
  return `<div class="pace-calc">
    <div class="pace-calc-title">🧮 Pace-kalkulator</div>
    <div class="pace-calc-row">
      <div class="pace-calc-field">
        <label>Distance</label>
        <input type="number" inputmode="decimal" step="0.1" placeholder="5.0" id="pcDist" value="5" oninput="calcPace()">
      </div>
      <div class="pace-calc-field">
        <label>Tid (min:sek)</label>
        <input type="text" inputmode="decimal" placeholder="30:00" id="pcTime" oninput="calcPace()">
      </div>
      <div class="pace-calc-field">
        <label>Pace /km</label>
        <input type="text" inputmode="decimal" placeholder="6:00" id="pcPace" oninput="calcPaceReverse()">
      </div>
    </div>
    <div class="pace-calc-result" id="pcResult">Indtast tid eller pace for at beregne</div>
  </div>`;
}

function calcPace(){
  const dist=parseFloat(document.getElementById('pcDist')?.value);
  const timeStr=document.getElementById('pcTime')?.value;
  const totalSec=parseSec(timeStr);
  if(!dist||!totalSec||dist<=0)return;
  const paceSec=Math.round(totalSec/dist);
  const paceStr=fmtSec(paceSec);
  const pcPace=document.getElementById('pcPace');
  if(pcPace)pcPace.value=paceStr;
  const kmh=Math.round(dist/(totalSec/3600)*10)/10;
  const result=document.getElementById('pcResult');
  if(result)result.textContent=`${paceStr} /km · ${kmh} km/t`;
}

function calcPaceReverse(){
  const dist=parseFloat(document.getElementById('pcDist')?.value);
  const paceStr=document.getElementById('pcPace')?.value;
  const paceSec=parseSec(paceStr);
  if(!dist||!paceSec||dist<=0)return;
  const totalSec=Math.round(paceSec*dist);
  const timeStr=fmtSec(totalSec);
  const pcTime=document.getElementById('pcTime');
  if(pcTime)pcTime.value=timeStr;
  const kmh=Math.round(3600/paceSec*10)/10;
  const result=document.getElementById('pcResult');
  if(result)result.textContent=`${timeStr} total · ${kmh} km/t`;
}

/* ═══════════════════════════════════════════════════════════ */
/* ── EXPORT / IMPORT ───────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function exportData(){
  const data={
    tw4:W, tw4_custom:CUSTOM, tw4_ai:{apiKey:AI.apiKey,model:AI.model,settingsOpen:AI.settingsOpen},
    tw4_prog:PROG, tw4_body:BODY, tw4_ss:SUPERSETS,
    _exported:new Date().toISOString(), _version:2
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='traening-backup-'+todayISO()+'.json';
  a.click();URL.revokeObjectURL(url);
  toast('✓ Backup downloadet');
}

function importData(input){
  const file=input.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.tw4&&!data._version){throw new Error('Ugyldigt format')}
      if(!confirm('Importér backup?\n\nDette overskriver alle nuværende data. Kan ikke fortrydes.'))return;
      if(data.tw4){W=data.tw4;save()}
      if(data.tw4_custom){CUSTOM=data.tw4_custom;saveCustom()}
      if(data.tw4_ai){AI={...AI,...data.tw4_ai};saveAI()}
      if(data.tw4_prog){PROG={...PROG,...data.tw4_prog};saveProg()}
      if(data.tw4_body){BODY=data.tw4_body;saveBody()}
      if(data.tw4_ss){SUPERSETS=data.tw4_ss;saveSS()}
      toast('✓ Data importeret');
      render();
    }catch(err){
      toast('Fejl: '+err.message);
    }
  };
  reader.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════ */
/* ── PWA / OFFLINE SUPPORT ─────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
// Inline service worker via Blob URL — caches the app shell after first load
if('serviceWorker' in navigator){
  const swCode=`
    const CACHE='traening-v1';
    self.addEventListener('install',e=>{self.skipWaiting()});
    self.addEventListener('activate',e=>{e.waitUntil(clients.claim())});
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET')return;
      e.respondWith(
        caches.open(CACHE).then(cache=>
          cache.match(e.request).then(cached=>{
            const fetchPromise=fetch(e.request).then(resp=>{
              if(resp&&resp.status===200&&resp.type==='basic'){
                cache.put(e.request,resp.clone());
              }
              return resp;
            }).catch(()=>cached);
            return cached||fetchPromise;
          })
        )
      );
    });
  `;
  try{
    const blob=new Blob([swCode],{type:'application/javascript'});
    const swUrl=URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }catch(e){}
}

/* ── INIT ──────────────────────────────────────────────────── */

render();
