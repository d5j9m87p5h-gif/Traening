<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRÆNING">
<meta name="theme-color" content="#07070f">
<title>TRÆNINGSPROGRAM</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23000'/%3E%3Ctext x='50%25' y='52%25' text-anchor='middle' dominant-baseline='middle' fill='%23ffd60a' font-family='-apple-system,sans-serif' font-size='90' font-weight='900'%3E💪%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💪%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;--bg1:#0c0c0e;--bg2:#161618;--bg3:#1c1c1e;
  --bdr:#2c2c2e;--bdr2:#38383a;
  --txt:#f5f5f7;--mut:#86868b;--mut2:#48484a;
  --acc:#ffd60a;--acc2:#f0c040;
  --blue:#0a84ff;--ora:#ff6f40;--grn:#30d158;--red:#ff453a;--pur:#bf5af2;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --r:16px;--r2:12px;--r3:8px;
  --glass:rgba(28,28,30,.72);
  --shadow:0 2px 16px rgba(0,0,0,.35),0 0 1px rgba(255,255,255,.05);
  --shadow-up:0 -2px 20px rgba(0,0,0,.45);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;z-index:1}

/* ══ HEADER ══ */
#hdr{
  padding:calc(var(--st) + 16px) 20px 16px;flex-shrink:0;position:relative;z-index:10;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
#hdr::before{content:'';position:absolute;top:-60px;right:-30px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,214,10,.08) 0%,transparent 65%);pointer-events:none}
.hdr-eyebrow{font-size:10px;letter-spacing:3px;color:var(--acc);font-family:'DM Mono',monospace;margin-bottom:4px;opacity:.7;text-transform:uppercase}
#hdr h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,9vw,54px);letter-spacing:1px;line-height:.92;background:linear-gradient(145deg,#ffffff 30%,var(--acc) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hdr-stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:6px 14px;display:flex;align-items:center;gap:7px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hdr-stat-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0}
.hdr-stat label{font-size:10px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;font-weight:500}
.hdr-stat b{font-size:12px;font-weight:600;color:var(--acc);font-family:'DM Mono',monospace}

/* ══ TABS (iOS bottom bar) ══ */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;padding:6px 4px calc(var(--sb) + 4px);box-shadow:var(--shadow-up)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--mut);border:none;background:transparent;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;transition:color .25s var(--ease);position:relative;min-height:44px;justify-content:center}
.tab .tab-icon{font-size:20px;display:block;line-height:1;transition:transform .25s var(--spring)}
.tab.on{color:var(--acc)}
.tab.on .tab-icon{transform:scale(1.1)}
.tab::after{display:none}

/* ══ SCROLL ══ */
#cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px calc(var(--sb) + 80px);scroll-behavior:smooth}

/* ══ DAY GRID ══ */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px}
.dc{border-radius:var(--r2);padding:12px 4px 10px;text-align:center;cursor:pointer;border:1.5px solid rgba(255,255,255,.06);background:var(--bg2);transition:all .25s var(--ease);position:relative;overflow:hidden;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--col);border-radius:var(--r2) var(--r2) 0 0;transform:scaleX(0);transition:transform .3s var(--spring)}
.dc:active{transform:scale(.93);transition-duration:.1s}
.dc.on{border-color:var(--col);background:linear-gradient(180deg,var(--col)18 0%,var(--col)08 100%);box-shadow:0 4px 20px var(--col)20,inset 0 1px 0 rgba(255,255,255,.06)}
.dc.on::before{transform:scaleX(1)}
.dc .di{font-size:18px;display:block;margin-bottom:4px}
.dc .da{font-size:10px;font-weight:700;letter-spacing:.5px;font-family:'DM Mono',monospace}
.dc .dl{font-size:7px;letter-spacing:.6px;margin-top:4px;color:var(--col);opacity:.7;text-transform:uppercase}
.dc.on .dl{opacity:1}

/* ══ DETAIL PANEL ══ */
.det{background:var(--bg1);border-radius:var(--r);padding:20px;border:1px solid var(--bdr);box-shadow:var(--shadow);animation:slideUp .35s var(--spring);position:relative;overflow:hidden}
.det::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.det-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.det-icon{font-size:28px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:var(--r2);border:1px solid var(--bdr);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.det-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;line-height:1}
.det-sub{font-size:10px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:2px}
.badge{margin-left:auto;padding:6px 14px;border-radius:100px;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;font-family:'DM Mono',monospace}

/* ══ PHASE BANNER ══ */
.phase-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r2);margin-bottom:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.phase-banner::before{display:none}
.phase-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.phase-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px}
.phase-info{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace}

/* ══ EXERCISE TABLE ══ */
.ex-hd{display:grid;grid-template-columns:1fr 32px 44px 110px 38px;gap:4px 8px;padding:10px 0 6px;border-bottom:1px solid var(--bdr);margin-bottom:4px}
.ex-hd span{font-size:9px;color:var(--mut2);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace}
.exrow{display:grid;grid-template-columns:1fr 32px 44px 110px 38px;gap:4px 8px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center;border-radius:var(--r3);position:relative;transition:background .15s}
.exrow.core{padding-left:12px;margin-bottom:2px}
.exrow.core::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--acc);border-radius:3px}
.exrow.cust{padding-left:12px}
.exrow.cust::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--pur);border-radius:3px}
.exn{font-size:13px;font-weight:500;line-height:1.3;color:var(--txt)}
.exn .cust-tag{display:inline-block;background:rgba(191,90,242,.15);color:var(--pur);font-family:'DM Mono',monospace;font-size:8px;font-weight:600;letter-spacing:1px;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.exn .rmx{display:inline-flex;align-items:center;justify-content:center;color:var(--red);font-size:13px;margin-left:4px;cursor:pointer;opacity:.5;padding:0 4px;background:none;border:none;font-family:inherit;min-width:44px;min-height:44px}
.exn .rmx:hover{opacity:1}
.exno{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.exs{font-family:'Bebas Neue',sans-serif;font-size:22px;text-align:center;line-height:1}
.exr{font-size:10px;font-weight:500;text-align:center;font-family:'DM Mono',monospace;line-height:1.3;color:var(--txt)}
.exkg{display:flex;flex-direction:column;align-items:center;gap:4px}
.wi{background:var(--bg3);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:14px;font-weight:500;width:72px;padding:8px 4px;border-radius:100px;text-align:center;outline:none;-webkit-appearance:none;transition:all .2s var(--ease);min-height:36px}
.wi:focus{border-color:var(--acc);background:rgba(255,214,10,.06);box-shadow:0 0 0 3px rgba(255,214,10,.12)}
.wi::placeholder{color:var(--mut2);font-size:11px;font-weight:400}
.wi.fl{animation:wfl .6s var(--ease)}
@keyframes wfl{0%{border-color:var(--grn);box-shadow:0 0 0 4px rgba(48,209,88,.2)}100%{border-color:var(--bdr);box-shadow:none}}
.dup{font-size:10px;font-weight:600;font-family:'DM Mono',monospace;color:var(--grn)}
.ddn{font-size:10px;font-weight:600;font-family:'DM Mono',monospace;color:var(--red)}
.deq{font-size:10px;font-family:'DM Mono',monospace;color:var(--mut)}
.vl{display:inline-flex;align-items:center;justify-content:center;color:var(--acc);text-decoration:none;font-size:10px;font-family:'DM Mono',monospace;font-weight:500;padding:6px 8px;background:rgba(255,214,10,.08);border-radius:var(--r3);white-space:nowrap;border:1px solid rgba(255,214,10,.15);transition:all .15s;min-width:36px;min-height:36px}
.vl:hover{background:rgba(255,214,10,.16)}

/* ══ PER-SET INPUTS ══ */
.set-expand{
  grid-column:1/-1;padding:10px 0 6px;
  animation:slideUp .25s var(--spring);
}
.set-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.set-chip{display:flex;flex-direction:column;align-items:center;gap:3px}
.set-chip label{font-family:'DM Mono',monospace;font-size:8px;color:var(--mut);letter-spacing:1px}
.set-chip input{
  width:56px;padding:7px 4px;border-radius:10px;text-align:center;
  background:var(--bg3);border:1.5px solid var(--bdr);color:var(--txt);
  font-family:'DM Mono',monospace;font-size:13px;font-weight:500;
  outline:none;-webkit-appearance:none;transition:border-color .2s;
  min-height:36px;
}
.set-chip input:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(255,214,10,.1)}
.set-toggle{
  background:var(--bg2);border:1.5px solid var(--bdr);color:var(--mut);font-size:14px;
  cursor:pointer;padding:0;border-radius:50%;
  font-family:'DM Mono',monospace;transition:all .15s var(--ease);
  width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;letter-spacing:1px;
}
.set-toggle:active{transform:scale(.88);background:var(--acc);color:#000;border-color:var(--acc)}
.set-toggle:hover{color:var(--acc);border-color:var(--acc);background:rgba(255,214,10,.08)}

/* ══ TIP ══ */
.tip{margin-top:16px;padding:12px 16px;background:var(--bg2);border-radius:var(--r2);font-size:12px;color:var(--mut);line-height:1.6;border-left:3px solid var(--bdr)}
.tip b{color:var(--txt)}
.tcore{margin-top:8px;padding:12px 16px;background:rgba(255,214,10,.04);border:1px solid rgba(255,214,10,.12);border-radius:var(--r2);font-size:12px;color:var(--acc);border-left:3px solid var(--acc)}

/* ══ WEEK PICKER ══ */
.wpick{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.wpick label{font-size:9px;color:var(--mut);letter-spacing:2px;font-family:'DM Mono',monospace;text-transform:uppercase}
.wb{padding:7px 12px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);font-family:'DM Mono',monospace;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s var(--ease);min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.wb:active{transform:scale(.92)}
.wb.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}

/* ══ RUN CARDS ══ */
.rungrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.rcard{background:var(--bg2);border-radius:var(--r2);padding:16px;border:1px solid var(--bdr);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.rcard label{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:6px}
.rcard .rval{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px}
.rtip{grid-column:1/-1;border-radius:var(--r2);padding:14px 16px;font-size:13px;line-height:1.5}
.runlog{margin-top:4px;background:var(--bg2);border-radius:var(--r2);overflow:hidden;border:1px solid var(--bdr)}
.runlog-head{padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr)}
.runlog-head span{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px}
.runlog-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}
.runlog-label{font-size:13px;font-weight:500}
.runlog-prev{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.runlog-note{padding:12px 16px}
.runlog-note label{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:6px}
textarea{background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);border-radius:var(--r2);padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:13px;resize:none;outline:none;width:100%;transition:border-color .2s,box-shadow .2s;line-height:1.5}
textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,214,10,.1)}

/* ══ REST ══ */
.rest{text-align:center;padding:48px 0}
.rest-icon{font-size:56px;display:block;margin-bottom:16px}
.rest-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--mut);letter-spacing:1px}
.rest-sub{font-size:13px;color:var(--mut2);margin-top:6px;font-family:'DM Mono',monospace}

/* ══ WEIGHT LOG ══ */
.wld{background:var(--bg1);border-radius:var(--r);overflow:hidden;margin-bottom:16px;border:1px solid var(--bdr);box-shadow:var(--shadow)}
.wlh{padding:14px 16px;display:flex;align-items:center;gap:10px;position:relative}
.wlh-icon{font-size:18px}
.wlh-text{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.5px}
.wlh-phase{margin-left:auto;font-size:9px;font-family:'DM Mono',monospace;font-weight:500;padding:4px 10px;border-radius:100px;opacity:.9}
.wlc{display:grid;grid-template-columns:1fr 80px 80px 72px;gap:4px 8px;padding:8px 16px 6px;border-bottom:1px solid var(--bdr);background:var(--bg2)}
.wlc span{font-size:9px;color:var(--mut2);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace}
.wlr{display:grid;grid-template-columns:1fr 80px 80px 72px;gap:4px 8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}
.wln{font-size:13px;font-weight:500}
.wls{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.wlp{font-size:13px;font-weight:500;color:var(--mut);font-family:'DM Mono',monospace}

/* ══ PHASES ══ */
.phcard{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.phcard::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--pc)}
.ph-num-wrap{text-align:center}
.ph-num{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;color:var(--pc)}
.ph-weeks{font-size:9px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.ph-label{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.5px;margin-bottom:6px}
.ph-row{font-size:12px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:3px;line-height:1.5}
.ph-goal{text-align:center;background:var(--bg2);border-radius:var(--r2);padding:12px 14px;border:1px solid var(--bdr);min-width:72px}
.ph-goal label{font-size:8px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:4px}
.ph-goal span{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;color:var(--acc)}
.section-label{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:12px;margin-top:8px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* ══ RULES ══ */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:var(--bg1);border-radius:var(--r2);padding:16px;border:1px solid var(--bdr);position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.rc:active{transform:scale(.98)}
.rc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--rc)}
.rc-icon{font-size:24px;margin-bottom:10px;display:block}
.rc-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px;margin-bottom:6px;color:var(--rc)}
.rc-body{font-size:12px;color:var(--mut);line-height:1.6}

/* ══ GRAPH ══ */
.graph-wrap{background:var(--bg1);border-radius:var(--r);padding:20px;border:1px solid var(--bdr);margin-bottom:16px;box-shadow:var(--shadow)}
.graph-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;margin-bottom:4px}
.graph-gain{font-size:12px;font-family:'DM Mono',monospace;font-weight:500;margin-bottom:14px}
.ex-picker{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.ex-picker::-webkit-scrollbar{display:none}
.expill{flex-shrink:0;padding:8px 14px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s var(--ease);min-height:36px}
.expill:active{transform:scale(.95)}
.expill.on{color:#000;font-weight:700}

/* ══ HINT ══ */
.hint{text-align:center;padding:40px 0;color:var(--mut2);font-family:'DM Mono',monospace;font-size:13px;line-height:2}
.hint-icon{font-size:40px;display:block;margin-bottom:10px}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:calc(var(--sb)+100px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--grn);color:#000;font-family:'DM Mono',monospace;font-size:13px;font-weight:600;padding:10px 24px;border-radius:100px;opacity:0;transition:all .35s var(--spring);pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 8px 32px rgba(48,209,88,.3)}

/* ══ DIVIDERS ══ */
.page-title{margin-bottom:20px}
.page-eyebrow{font-size:9px;color:var(--acc);letter-spacing:3px;font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:4px;opacity:.6}
.page-h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.5px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ══ TODAY BANNER ══ */
.today-banner{background:linear-gradient(135deg,var(--tc)14 0%,var(--tc)06 100%);border:1px solid var(--tc)30;border-radius:var(--r);padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s var(--ease);box-shadow:0 4px 24px var(--tc)10}
.today-banner::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--tc)}
.today-banner:active{transform:scale(.98)}
.tb-icon{font-size:32px;flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--tc)18;border-radius:var(--r2);border:1px solid var(--tc)25}
.tb-text{flex:1;min-width:0}
.tb-eyebrow{font-size:9px;letter-spacing:3px;color:var(--tc);font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tb-eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:var(--tc);animation:pls 2s infinite ease-in-out}
@keyframes pls{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.tb-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;line-height:1;color:var(--txt)}
.tb-sub{font-size:12px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:4px;line-height:1.4}
.tb-arrow{font-size:20px;color:var(--tc);flex-shrink:0;opacity:.4}

/* ══ PROGRAM SETUP/DONE ══ */
.prog-setup{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:24px 20px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.prog-setup::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.prog-setup-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;margin-bottom:8px}
.prog-setup-sub{font-size:12px;color:var(--mut);line-height:1.7;margin-bottom:16px}
.prog-setup .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.prog-btn{background:var(--acc);color:#000;border:none;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:12px 20px;border-radius:100px;cursor:pointer;text-transform:uppercase;transition:transform .15s var(--spring);min-height:44px}
.prog-btn:active{transform:scale(.95)}
.prog-btn.ghost{background:transparent;color:var(--mut);border:1.5px solid var(--bdr)}
.prog-btn.ghost:hover{color:var(--txt);border-color:var(--mut)}
.prog-date-input{background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:14px;padding:10px 14px;border-radius:var(--r2);outline:none;text-align:center;margin:10px 0}
.prog-date-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,214,10,.1)}
.prog-done{background:linear-gradient(150deg,rgba(255,69,58,.06) 0%,rgba(255,214,10,.08) 50%,rgba(48,209,88,.06) 100%);border:1px solid rgba(255,214,10,.2);border-radius:var(--r);padding:24px 20px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.prog-done .pd-emoji{font-size:56px;display:block;margin-bottom:12px}
.prog-done .pd-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;background:linear-gradient(135deg,#fff 0%,var(--acc) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.prog-done .pd-sub{font-size:13px;color:var(--mut);line-height:1.7;margin-bottom:16px;font-family:'DM Mono',monospace}
.prog-done .pd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.prog-done .pd-stat{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:10px 8px}
.prog-done .pd-stat label{font-size:8px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:4px}
.prog-done .pd-stat span{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;color:var(--acc)}

/* ══ AI COACH ══ */
.ai-settings{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.ai-settings-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;min-height:44px}
.ai-settings-head .arrow{transition:transform .25s var(--spring);font-size:11px;color:var(--acc)}
.ai-settings.open .ai-settings-head .arrow{transform:rotate(90deg)}
.ai-settings-body{display:none;margin-top:14px}
.ai-settings.open .ai-settings-body{display:block}
.ai-settings-status{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;padding:4px 10px;border-radius:100px}
.ai-settings-status.ok{background:rgba(48,209,88,.12);color:var(--grn);border:1px solid rgba(48,209,88,.25)}
.ai-settings-status.miss{background:rgba(255,69,58,.12);color:var(--red);border:1px solid rgba(255,69,58,.25)}
.ai-field{margin-bottom:14px}
.ai-field label{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
.ai-field input,.ai-field select{width:100%;background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);border-radius:var(--r2);padding:10px 12px;font-family:'DM Mono',monospace;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.ai-field input:focus,.ai-field select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,214,10,.1)}
.ai-field .hint-line{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6}
.ai-field .hint-line a{color:var(--acc);text-decoration:none}
.ai-btn{background:var(--acc);color:#000;border:none;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:10px 18px;border-radius:100px;cursor:pointer;text-transform:uppercase;transition:transform .15s var(--spring);min-height:44px}
.ai-btn:active{transform:scale(.95)}
.ai-btn:disabled{opacity:.3;cursor:not-allowed}
.ai-btn.ghost{background:transparent;color:var(--mut);border:1.5px solid var(--bdr)}
.ai-btn.ghost:hover{color:var(--txt);border-color:var(--mut)}
.ai-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ai-quick-btn{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--txt);transition:all .2s var(--ease);display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;min-height:64px;box-shadow:var(--shadow)}
.ai-quick-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--qc)}
.ai-quick-btn:active{transform:scale(.97)}
.ai-quick-btn:hover{border-color:var(--qc)}
.ai-quick-btn .qi{font-size:22px;flex-shrink:0}
.ai-quick-btn .qt{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px;line-height:1.1;color:var(--qc)}
.ai-quick-btn .qd{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.3}
.ai-chat{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.ai-chat-head{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;background:var(--bg2)}
.ai-chat-head .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn)}
.ai-chat-head .ai-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px}
.ai-chat-head .ai-clear{margin-left:auto;background:none;border:none;color:var(--mut);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;padding:6px 10px;border-radius:8px;min-height:36px}
.ai-chat-head .ai-clear:hover{color:var(--red);background:rgba(255,69,58,.08)}
.ai-msgs{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto}
.ai-msg{display:flex;gap:8px;animation:slideUp .35s var(--spring)}
.ai-msg.user{justify-content:flex-end}
.ai-bub{max-width:85%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.6}
.ai-msg.user .ai-bub{background:var(--acc);color:#000;border-bottom-right-radius:6px;font-weight:500}
.ai-msg.bot .ai-bub{background:var(--bg2);color:var(--txt);border:1px solid var(--bdr);border-bottom-left-radius:6px}
.ai-bub p{margin:0 0 10px}.ai-bub p:last-child{margin-bottom:0}
.ai-bub strong{color:var(--acc);font-weight:600}
.ai-msg.user .ai-bub strong{color:#000;text-decoration:underline;text-decoration-color:#0004;text-underline-offset:2px}
.ai-bub ul,.ai-bub ol{margin:8px 0 8px 20px}.ai-bub li{margin:4px 0}
.ai-bub code{background:var(--bg);padding:2px 6px;border-radius:5px;font-family:'DM Mono',monospace;font-size:12px;color:var(--acc)}
.ai-msg.user .ai-bub code{background:#0002;color:#000}
.ai-typing{display:flex;align-items:center;gap:5px;padding:16px}
.ai-typing span{width:8px;height:8px;border-radius:50%;background:var(--mut);animation:tdot 1.4s infinite ease-in-out}
.ai-typing span:nth-child(2){animation-delay:.2s}
.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.ai-error{background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.25);color:var(--red);padding:12px 16px;border-radius:var(--r2);font-size:13px;line-height:1.5;margin:8px 16px 16px}
.ai-input-row{border-top:1px solid var(--bdr);padding:12px 14px;display:flex;gap:10px;align-items:flex-end;background:var(--bg)}
.ai-input{flex:1;background:var(--bg2);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;border-radius:22px;outline:none;resize:none;min-height:44px;max-height:120px;line-height:1.4;transition:border-color .2s}
.ai-input:focus{border-color:var(--acc)}
.ai-send{background:var(--acc);color:#000;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;flex-shrink:0;transition:transform .15s var(--spring);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,214,10,.2)}
.ai-send:active{transform:scale(.88)}
.ai-send:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.ai-empty{text-align:center;padding:36px 24px;color:var(--mut)}
.ai-empty .ae-icon{font-size:42px;display:block;margin-bottom:12px;opacity:.5}
.ai-empty .ae-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--txt);letter-spacing:.5px;margin-bottom:8px}
.ai-empty .ae-sub{font-size:12px;font-family:'DM Mono',monospace;line-height:1.8}
.ai-cost-note{font-size:11px;color:var(--mut2);text-align:center;font-family:'DM Mono',monospace;padding:8px 16px;line-height:1.5}

/* ══ LIBRARY ══ */
.lib-search{display:flex;gap:8px;margin-bottom:14px}
.lib-search input{flex:1;background:var(--bg2);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;padding:12px 16px;border-radius:100px;outline:none;transition:border-color .2s,box-shadow .2s}

.lib-pill{flex-shrink:0;padding:8px 14px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s var(--ease);display:flex;align-items:center;gap:6px;min-height:36px}

.lib-pill:active{transform:scale(.95)}
.lib-pill.on{font-weight:700;color:#000}
.lib-grid{display:grid;grid-template-columns:1fr;gap:12px}

.lib-card{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .2s var(--ease)}

.lib-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--lc)}
.lc-row1{display:flex;align-items:flex-start;gap:12px}
.lc-emo{font-size:24px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--lc)12;border-radius:var(--r2);border:1px solid var(--lc)20}
.lc-titles{flex:1;min-width:0}
.lc-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;line-height:1.1}

.lc-tag{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg2);color:var(--mut);border:1px solid var(--bdr)}
.lc-tag.muscle{background:var(--lc)12;color:var(--lc);border-color:var(--lc)20}
.lc-diff{font-family:'DM Mono',monospace;font-size:10px;color:var(--acc);letter-spacing:1px}
.lc-desc{font-size:12px;color:var(--mut);line-height:1.6}
.lc-actions{display:flex;gap:8px;margin-top:4px}
.lc-btn{flex:1;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);transition:all .15s;min-height:44px}
.lc-btn:active{transform:scale(.97)}
.lc-btn:hover{color:var(--txt);border-color:var(--mut)}
.lc-btn.video{border-color:rgba(255,214,10,.2);color:var(--acc);background:rgba(255,214,10,.06)}
.lc-btn.video:hover{background:rgba(255,214,10,.12)}
.lc-btn.add{border-color:rgba(191,90,242,.2);color:var(--pur);background:rgba(191,90,242,.06)}
.lc-btn.add:hover{background:rgba(191,90,242,.14)}
.lib-empty{text-align:center;padding:48px 24px;color:var(--mut);font-family:'DM Mono',monospace;font-size:13px}

/* ══ MODAL ══ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:998;display:none;align-items:flex-end;justify-content:center;padding:0 14px calc(var(--sb) + 14px)}
.modal-bg.show{display:flex}
.modal{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:480px;padding:24px 20px calc(var(--sb) + 24px);animation:slup .35s var(--spring);box-shadow:0 -8px 40px rgba(0,0,0,.5)}

.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:18px}
.modal-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.modal-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);cursor:pointer;transition:all .15s;min-height:56px}

.modal-close{width:100%;padding:12px;background:transparent;border:1.5px solid var(--bdr);color:var(--mut);border-radius:var(--r2);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;min-height:44px;transition:all .15s}

.body-photo-preview .bpp-empty div{font-size:11px;font-family:'DM Mono',monospace}
.body-photo-btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
.bp-btn{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:10px 16px;border-radius:100px;cursor:pointer;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);transition:all .15s;min-height:44px;display:flex;align-items:center;gap:6px}
.bp-btn:active{transform:scale(.95)}
.bp-btn.primary{background:var(--acc);color:#000;border-color:var(--acc)}
.bp-btn.danger{color:var(--red);border-color:rgba(255,69,58,.3)}
input[type=file]{display:none}

.body-graph{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.body-graph-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:4px}
.body-graph-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:14px}

.body-compare{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.body-compare-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:14px}
.body-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.body-compare-card{text-align:center}
.body-compare-card .bcc-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
.body-compare-card .bcc-img{width:100%;aspect-ratio:3/4;border-radius:var(--r2);overflow:hidden;background:var(--bg2);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center}
.body-compare-card .bcc-img img{width:100%;height:100%;object-fit:cover}
.body-compare-card .bcc-stats{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:6px;line-height:1.6}
.body-compare-card .bcc-empty{color:var(--mut2);font-size:24px;opacity:.3}

/* ══ REST TIMER ══ */
#restTimer{position:fixed;bottom:calc(var(--sb) + 72px);right:16px;z-index:99;width:72px;height:72px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:2px solid var(--acc);box-shadow:0 4px 24px rgba(255,214,10,.2);display:none;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;transition:transform .2s var(--spring);font-family:'DM Mono',monospace}
#restTimer.show{display:flex;animation:slideUp .3s var(--spring)}
#restTimer:active{transform:scale(.92)}
#restTimer .rt-time{font-size:20px;font-weight:700;color:var(--acc);line-height:1}
#restTimer .rt-label{font-size:7px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
#restTimer.done{border-color:var(--grn);animation:timerPulse .6s ease 3}
#restTimer.done .rt-time{color:var(--grn)}
@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ══ PR BADGE ══ */
.pr-badge{display:inline-flex;align-items:center;gap:2px;background:rgba(255,214,10,.15);color:var(--acc);font-family:'DM Mono',monospace;font-size:7px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.pr-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:1000;font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--acc);text-shadow:0 0 40px rgba(255,214,10,.5);pointer-events:none;opacity:0}
.pr-toast.show{animation:prCelebrate .8s var(--spring) forwards}
@keyframes prCelebrate{0%{opacity:1;transform:translate(-50%,-50%) scale(0)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) translateY(-30px)}}

/* ══ SUPERSET ══ */
.ss-tag{display:inline-block;background:rgba(255,111,64,.12);color:var(--ora);font-family:'DM Mono',monospace;font-size:7px;font-weight:600;letter-spacing:1px;padding:2px 5px;border-radius:4px;margin-left:4px;vertical-align:middle}
.ss-bracket{position:absolute;right:-4px;top:-2px;bottom:-2px;width:3px;background:var(--ora);border-radius:3px;opacity:.6}

/* ══ PACE CALCULATOR ══ */
.pace-calc{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-top:16px;box-shadow:var(--shadow)}
.pace-calc-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pace-calc-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.pace-calc-field{text-align:center}
.pace-calc-field label{display:block;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.pace-calc-field input{width:100%;background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:15px;padding:8px;border-radius:var(--r2);outline:none;text-align:center;min-height:40px}
.pace-calc-field input:focus{border-color:var(--acc)}
.pace-calc-result{text-align:center;padding:10px;background:var(--bg2);border-radius:var(--r2);border:1px solid var(--bdr);font-family:'DM Mono',monospace;font-size:13px;color:var(--grn)}

/* ══ EXPORT/IMPORT ══ */
.backup-section{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-top:20px;box-shadow:var(--shadow)}
.backup-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;margin-bottom:8px}
.backup-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:14px;line-height:1.6}
.backup-btns{display:flex;gap:8px;flex-wrap:wrap}

/* ══ COG BUTTON ══ */
#hdrCog{position:absolute;top:calc(var(--st) + 14px);right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--mut);font-size:18px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:all .2s var(--ease);display:flex;align-items:center;justify-content:center}
#hdrCog:active{transform:scale(.9) rotate(45deg)}
#hdrCog:hover{color:var(--acc);border-color:var(--acc)}

/* ══ NOTES POPUP ══ */
.note-btn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:14px;padding:4px;opacity:.5;transition:opacity .15s;min-width:28px;min-height:28px}
.note-btn:hover,.note-btn.has{opacity:1;color:var(--acc)}
.note-popup{margin-top:8px;padding:10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);grid-column:1/-1;animation:slideUp .2s var(--spring)}
.note-popup textarea{width:100%;min-height:50px;font-size:12px}

/* ══ ESTIMATED 1RM ══ */
.est-1rm{font-size:9px;color:var(--mut2);font-family:'DM Mono',monospace;margin-top:2px;letter-spacing:.5px}
.est-1rm b{color:var(--blue);font-weight:600}

/* ══ CONFETTI ══ */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:1001;overflow:hidden;display:none}
#confetti.show{display:block}
.cf{position:absolute;top:-20px;width:8px;height:14px;animation:cfFall 1.6s ease-in forwards}
@keyframes cfFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(120vh) rotate(720deg);opacity:.5}}

/* ══ VOLUME CHART ══ */
.vol-section{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.vol-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:4px}
.vol-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:12px}
.vol-bars{display:flex;flex-direction:column;gap:8px}
.vol-bar-row{display:grid;grid-template-columns:80px 1fr 60px;gap:10px;align-items:center}
.vol-bar-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.vol-bar-track{height:12px;background:var(--bg2);border-radius:6px;position:relative;overflow:hidden}
.vol-bar-fill{height:100%;border-radius:6px;transition:width .8s var(--ease)}
.vol-bar-val{font-size:11px;font-family:'DM Mono',monospace;color:var(--txt);text-align:right;font-weight:500}

/* ══ STREAK HEATMAP ══ */
.streak-section{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.streak-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:4px}
.streak-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.streak-stat{color:var(--acc);font-weight:600}
.streak-grid{display:grid;grid-template-columns:32px repeat(7,1fr);gap:4px}
.streak-day-label{font-size:8px;color:var(--mut2);font-family:'DM Mono',monospace;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.5px}
.streak-cell{aspect-ratio:1;border-radius:4px;background:var(--bg3);position:relative;transition:transform .15s var(--ease)}
.streak-cell:hover{transform:scale(1.15)}
.streak-cell.l1{background:rgba(255,214,10,.18)}
.streak-cell.l2{background:rgba(255,214,10,.4)}
.streak-cell.l3{background:rgba(255,214,10,.7)}
.streak-cell.l4{background:var(--acc)}
.streak-cell.future{background:var(--bg2);opacity:.5}
.streak-cell.today{box-shadow:0 0 0 2px var(--acc)}
.streak-week-label{font-size:7px;color:var(--mut2);font-family:'DM Mono',monospace;text-align:center;margin-top:2px}
.streak-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:9px;color:var(--mut2);font-family:'DM Mono',monospace}
.streak-legend-cells{display:flex;gap:3px}
.streak-legend-cells div{width:10px;height:10px;border-radius:2px}

/* ══ PHOTO GALLERY ══ */
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media (min-width:520px){.gallery-grid{grid-template-columns:repeat(3,1fr)}}
.gallery-item{position:relative;aspect-ratio:3/4;border-radius:var(--r2);overflow:hidden;background:var(--bg2);border:1px solid var(--bdr);cursor:pointer;transition:transform .2s var(--ease)}
.gallery-item:active{transform:scale(.96)}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-item .gal-week{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;padding:3px 8px;border-radius:6px;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.5px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.gallery-item .gal-stats{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-family:'DM Mono',monospace;font-size:9px;color:#fff;text-align:center}
.gallery-toggle{margin-top:12px;text-align:center}

/* ══ WORKOUT TIMER ══ */
.workout-timer{display:inline-flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:var(--blue);padding:5px 10px;background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.25);border-radius:100px;letter-spacing:.5px}
.workout-timer .wt-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pls 1.5s infinite}

/* ══ TOOLTIP ══ */
#chartTooltip{position:fixed;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:11px;padding:6px 10px;border-radius:8px;pointer-events:none;z-index:1000;display:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#chartTooltip.show{display:block;animation:fi .15s ease}

/* ══ TEMPLATE CHOOSER ══ */
.tpl-chooser{padding:24px 16px;animation:fi .3s ease}
.tpl-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--acc);text-transform:uppercase;text-align:center;margin-bottom:6px}
.tpl-h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;text-align:center;margin-bottom:8px;line-height:1}
.tpl-sub{font-size:13px;color:var(--mut);font-family:'DM Mono',monospace;text-align:center;margin-bottom:32px;line-height:1.5}
.tpl-card{background:var(--bg1);border:2px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:12px;cursor:pointer;transition:all .2s var(--ease);display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center}
.tpl-card:active{transform:scale(.98)}
.tpl-card:hover{border-color:var(--tc);background:var(--bg2)}
.tpl-card.cur{border-color:var(--tc);background:var(--bg2);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 20%,transparent)}
.tpl-emo{width:54px;height:54px;border-radius:50%;background:color-mix(in srgb,var(--tc) 15%,transparent);display:flex;align-items:center;justify-content:center;font-size:28px}
.tpl-info .tpl-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;line-height:1.1;margin-bottom:2px}
.tpl-info .tpl-meta{font-size:11px;font-family:'DM Mono',monospace;color:var(--mut2);margin-bottom:6px;letter-spacing:.5px}
.tpl-info .tpl-desc{font-size:12px;color:var(--mut);line-height:1.5}
.tpl-arr{color:var(--tc);font-size:20px;opacity:.6}
.tpl-card.cur .tpl-arr{opacity:1}
.tpl-current-tag{font-family:'DM Mono',monospace;font-size:8px;font-weight:700;letter-spacing:1.5px;background:var(--acc);color:#000;padding:3px 8px;border-radius:100px;display:inline-block;margin-left:8px;vertical-align:middle}

/* ══ STEPS WIDGET (PCOS) ══ */
.steps-widget{background:linear-gradient(135deg,rgba(255,111,168,.12),rgba(10,132,255,.08));border:1.5px solid rgba(255,111,168,.3);border-radius:var(--r);padding:18px;margin-bottom:16px}
.steps-widget-row{display:flex;align-items:center;gap:14px}
.steps-icon{width:54px;height:54px;border-radius:50%;background:rgba(255,111,168,.18);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.steps-content{flex:1}
.steps-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.steps-value{display:flex;align-items:baseline;gap:6px}
.steps-value input{width:90px;background:transparent;border:none;color:var(--txt);font-family:'Bebas Neue',sans-serif;font-size:32px;font-weight:600;outline:none;padding:0;letter-spacing:.5px}
.steps-value input:focus{color:#ff6fa8}
.steps-goal{font-size:13px;color:var(--mut);font-family:'DM Mono',monospace}
.steps-bar{height:6px;background:var(--bg3);border-radius:6px;margin-top:10px;overflow:hidden}
.steps-bar-fill{height:100%;background:linear-gradient(90deg,#ff6fa8,#0a84ff);border-radius:6px;transition:width .6s var(--ease)}
.steps-status{font-size:10px;font-family:'DM Mono',monospace;margin-top:6px;letter-spacing:.5px}

/* ══ CYCLE TRACKER ══ */
.cycle-section{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:16px}
.cycle-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:4px}
.cycle-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:14px}
.cycle-phases{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:480px){.cycle-phases{grid-template-columns:repeat(4,1fr)}}
.cycle-phase{padding:12px 8px;border:1.5px solid var(--bdr);border-radius:var(--r2);background:var(--bg2);text-align:center;cursor:pointer;transition:all .2s var(--ease);min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cycle-phase:active{transform:scale(.95)}
.cycle-phase.on{background:rgba(255,111,168,.15);border-color:#ff6fa8;color:#ff6fa8}
.cycle-phase .cp-emo{font-size:18px}
.cycle-phase .cp-name{font-family:'DM Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}

/* ══ MEDICAL DISCLAIMER ══ */
.med-disclaimer{background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.25);border-radius:var(--r2);padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.med-disclaimer-icon{font-size:18px;line-height:1.3;flex-shrink:0}
.med-disclaimer-text{font-size:11px;color:var(--mut);line-height:1.5}
.med-disclaimer-text b{color:#ff453a;font-weight:600}

/* ══ PCOS ONBOARDING ══ */
.pcos-ob{padding:20px 16px;animation:fi .3s ease}
.pcos-ob-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:#ff6fa8;text-transform:uppercase;text-align:center;margin-bottom:6px}
.pcos-ob-h1{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;text-align:center;margin-bottom:8px;line-height:1.1}
.pcos-ob-sub{font-size:13px;color:var(--mut);font-family:'DM Mono',monospace;text-align:center;margin-bottom:24px;line-height:1.5;padding:0 8px}
.pcos-ob-card{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.pcos-ob-q{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;margin-bottom:6px}
.pcos-ob-hint{font-size:11px;color:var(--mut2);font-family:'DM Mono',monospace;margin-bottom:12px;line-height:1.5}
.pcos-ob-bmi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcos-ob-input-wrap{position:relative}
.pcos-ob-input-wrap input{width:100%;background:var(--bg2);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:18px;padding:12px 14px;padding-right:36px;border-radius:var(--r2);outline:none;text-align:center;min-height:48px;font-weight:500;transition:border-color .2s}
.pcos-ob-input-wrap input:focus{border-color:#ff6fa8}
.pcos-ob-input-wrap .ob-unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mut2);font-family:'DM Mono',monospace;pointer-events:none}
.pcos-ob-bmi-result{margin-top:10px;padding:10px 14px;border-radius:var(--r2);background:var(--bg2);text-align:center;font-family:'DM Mono',monospace;font-size:12px;color:var(--mut)}
.pcos-ob-bmi-result.lean{background:rgba(48,209,88,.1);color:#30d158}
.pcos-ob-bmi-result.normal{background:rgba(10,132,255,.1);color:#0a84ff}
.pcos-ob-bmi-result.over{background:rgba(255,159,10,.1);color:#ff9f0a}

.pcos-ob-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcos-ob-opt{padding:12px 10px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);border-radius:var(--r2);cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.5px;text-align:center;transition:all .2s var(--ease);min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1.3}
.pcos-ob-opt:active{transform:scale(.96)}
.pcos-ob-opt.on{background:rgba(255,111,168,.12);border-color:#ff6fa8;color:#ff6fa8}
.pcos-ob-opt .ob-emo{font-size:18px}

.pcos-ob-actions{display:flex;gap:8px;margin-top:20px;flex-direction:column}
.pcos-ob-actions .pob-primary{background:#ff6fa8;color:#fff;border:none;font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:1.5px;padding:14px 20px;border-radius:100px;cursor:pointer;text-transform:uppercase;min-height:48px}
.pcos-ob-actions .pob-primary:active{transform:scale(.97);background:#e8588f}
.pcos-ob-actions .pob-skip{background:none;border:none;color:var(--mut2);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;padding:10px;cursor:pointer;text-transform:uppercase}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <button id="hdrCog" onclick="openSettingsModal()" title="Indstillinger">⚙️</button>
    <div class="hdr-eyebrow">// PERSONLIGT TRÆNINGSPROGRAM</div>
    <h1>RECOMP<br>+ 5KM RUN</h1>
    <div class="hdr-stats" id="hdrStats">
      <div class="hdr-stat" id="hdrStart"><div class="hdr-stat-dot"></div><label>Start</label><b>35:00</b></div>
      <div class="hdr-stat" id="hdrGoal"><div class="hdr-stat-dot"></div><label>Mål</label><b>&lt;30:00</b></div>
      <div class="hdr-stat" id="hdrWeek"><div class="hdr-stat-dot"></div><label>Plan</label><b>8 UGE</b></div>
    </div>

function loadProgram(){
  const tplId=PROG.template||'recomp';
  const tpl=TEMPLATES[tplId]||TEMPLATES.recomp;
  // Deep clone så ændringer ikke ødelægger templates
  D=JSON.parse(JSON.stringify(tpl.D));
  GP=JSON.parse(JSON.stringify(tpl.GP));
  PH=JSON.parse(JSON.stringify(tpl.PH));
  RL=JSON.parse(JSON.stringify(tpl.RL));
  // Opdater header-titel
  const h1=document.querySelector('#hdr h1');
  if(h1)h1.innerHTML=tpl.headerTitle||'TRÆNINGSPROGRAM';
}

function rTemplateChooser(){
  const cur=PROG.template||'recomp';
  let h=`<div class="tpl-chooser">
    <div class="tpl-eyebrow">// Vælg dit program</div>
    <div class="tpl-h1">VÆLG PROGRAM</div>
    <div class="tpl-sub">Hvad er dit primære mål? Du kan altid skifte senere via ⚙️ indstillinger.</div>`;
  Object.values(TEMPLATES).forEach(t=>{
    const isCur=t.id===cur;
    const tag=isCur?'<span class="tpl-current-tag">NUVÆRENDE</span>':'';
    h+=`<div class="tpl-card${isCur?' cur':''}" style="--tc:${t.color}" onclick="chooseTemplate('${t.id}')">
      <div class="tpl-emo">${t.emo}</div>
      <div class="tpl-info">
        <div class="tpl-name">${t.name}${tag}</div>
        <div class="tpl-meta">${t.weeks} UGER · ${(t.D||[]).filter(d=>d.ex||d.run).length} TRÆNINGSDAGE</div>
        <div class="tpl-desc">${t.desc}</div>
      </div>
      <div class="tpl-arr">›</div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}

function chooseTemplate(tplId){
  const tpl=TEMPLATES[tplId];
  if(!tpl)return;
  const wasCurrentDefault=PROG.template===tplId&&PROG.templateChosen;
  if(wasCurrentDefault){
    // Hvis de allerede har dette template, luk bare
    PROG.templateChosen=true;saveProg();
    if(modalOpenForTemplate){closeModal();modalOpenForTemplate=false}
    render();return;
  }
  // Hvis de skifter program og har eksisterende data → spørg
  const hasData=Object.keys(W).length>0;
  if(hasData&&PROG.template!==tplId){
    if(!confirm('Skift til "'+tpl.name+'"?\n\nDine eksisterende vægt-data bevares men programmet ændrer sig.'))return;
  }
  PROG.template=tplId;
  PROG.templateChosen=true;
  PROG.totalWeeks=tpl.weeks||8;
  if(tpl.needsRunTime&&tpl.defaultRunSec)PROG.start5kSec=tpl.defaultRunSec;
  saveProg();
  loadProgram();
  // Reset supersets fordi øvelser kan have ændret sig
  SUPERSETS={};saveSS();
  try{localStorage.removeItem('tw4_ss_init')}catch(e){}
  applyDefaultSupersets();
  if(modalOpenForTemplate){closeModal();modalOpenForTemplate=false}
  toast('✓ Skiftet til '+tpl.name);
  render();
}

let modalOpenForTemplate=false;
function openTemplateChooserModal(){
  modalOpenForTemplate=true;
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal" onclick="event.stopPropagation()" style="max-width:480px;max-height:85vh;overflow-y:auto">
    ${rTemplateChooser()}
    <div style="text-align:center;margin-top:8px">
      <button class="prog-btn ghost" onclick="closeModal();modalOpenForTemplate=false">Annullér</button>
    </div>
  </div>`;
  m.classList.add('show');
}

// Tids-formattering
function fmtSec(s){const m=Math.floor(s/60),sec=Math.round(s%60);return m+':'+String(sec).padStart(2,'0')}
function parseSec(str){
  if(!str)return null;
  const s=String(str).trim().replace(',','.');
  if(!s)return null;
  // Format "min:sec"
  if(s.includes(':')){
    const p=s.split(':');
    if(p.length!==2)return null;
    const m=parseInt(p[0]),sec=parseInt(p[1]);
    if(isNaN(m)||isNaN(sec))return null;
    return m*60+sec;
  }
  // Bare et tal → tolk som minutter (decimaler tilladt)
  const num=parseFloat(s);
  if(isNaN(num)||num<=0)return null;
  return Math.round(num*60);
}

}

(function migrateProfile(){

})();

// Helpers til adaptiv tilpasning baseret på profil
function pcosBMI(){
  // Læs fra generel profil hvis muligt, ellers PCOS_PROFILE for backwards compat
  const h=PROFILE.height||PCOS_PROFILE.height;
  const w=PROFILE.weight||PCOS_PROFILE.weight;
  if(!h||!w)return null;
  const m=h/100;
  return Math.round((w/(m*m))*10)/10;
}
function isLeanPCOS(){const b=pcosBMI();return b!==null&&b<25}
function pcosGoalIsWeightloss(){return PCOS_PROFILE.goal==='weightloss'}
function pcosGoalIsBalance(){return PCOS_PROFILE.goal==='balance'||PCOS_PROFILE.goal==='fertility'}

// TDEE & kalorie-beregning
function calcBMR(){
  const p=PROFILE;
  if(!p.height||!p.weight||!p.age||!p.gender)return null;
  // Mifflin-St Jeor formel
  const base=10*p.weight+6.25*p.height-5*p.age;
  return p.gender==='male'?Math.round(base+5):Math.round(base-161);
}
function calcTDEE(activityMult){
  const mult=activityMult||1.55; // moderat aktivitet (træner 4-6 dage/uge)
  const bmr=calcBMR();
  return bmr?Math.round(bmr*mult):null;
}
function calcCalorieTarget(){
  const tdee=calcTDEE();
  if(!tdee)return null;
  const tpl=TEMPLATES[PROG.template||'recomp'];
  if(!tpl)return tdee;
  switch(tpl.id){
    case 'recomp':return tdee; // vedligeholdelseskalorier
    case 'bulk':return tdee+250; // moderat overskud
    case 'cut':return tdee-500; // 500 kcal underskud
    case 'strength':return tdee+150; // let overskud for muskel-bevarelse
    case 'beginner':return tdee;
    case 'pcos':
      // PCOS: tilpas efter BMI og mål
      const b=pcosBMI();
      if(PCOS_PROFILE.goal==='balance'||PCOS_PROFILE.goal==='fertility')return tdee;
      if(b&&b<25)return tdee; // lean PCOS = maintenance
      if(PCOS_PROFILE.goal==='weightloss'&&b&&b>=25)return tdee-400;
      return tdee-200; // mild deficit som default
    default:return tdee;
  }
}
function calcProteinTarget(){
  const w=PROFILE.weight;
  if(!w)return null;
  const tpl=TEMPLATES[PROG.template||'recomp'];
  if(!tpl)return Math.round(w*2);
  switch(tpl.id){
    case 'cut':return Math.round(w*2.4); // bevar muskel i underskud
    case 'pcos':return Math.round(w*1.9);
    case 'beginner':return Math.round(w*1.8);
    case 'bulk':return Math.round(w*2.0);
    case 'strength':return Math.round(w*2.0);
    case 'recomp':return Math.round(w*2.2);
    default:return Math.round(w*2);
  }
}

function weekFromStart(){
  if(!PROG.startDate)return 0;
  const start=new Date(PROG.startDate+'T00:00:00');
  const today=new Date();
  today.setHours(0,0,0,0);start.setHours(0,0,0,0);
  const diffDays=Math.floor((today-start)/(24*60*60*1000));
  return Math.floor(diffDays/7)+1; // uge 1 = dag 0..6
}

}

function sw(w,d,n,v){W[ek(w,d,n)]=v;save();toast()}

// Multi-set helpers
function parseW(val){if(!val)return[];return String(val).split(',').map(s=>parseFloat(s.trim())).filter(v=>!isNaN(v))}
function maxW(val){const arr=parseW(val);if(!arr.length)return NaN;return Math.max(...arr)}
function summaryW(val){const arr=parseW(val);if(!arr.length)return'';if(arr.every(v=>v===arr[0]))return String(arr[0]);return arr.join('/')}
function df(w,d,n){if(w<2)return null;const c=maxW(gw(w,d,n)),p=maxW(gw(w-1,d,n));if(isNaN(c)||isNaN(p))return null;return Math.round((c-p)*10)/10}

let selExRow=null; // which exercise row is expanded for per-set input

// merge default + custom exercises for a day
function dayEx(d){if(!d.ex)return null;return [...d.ex,...(CUSTOM[d.full]||[])]}

// Programmets nuværende uge — først via startdato, ellers fra seneste data
function currentWeek(){
  if(PROG.startDate){
    const w=weekFromStart();
    if(w>=1&&w<=TW())return w;
    if(w>TW())return 9; // færdigt
    return 1; // før startdato
  }
  // Fallback: seneste uge med data
  for(let w=8;w>=1;w--){
    const has=D.some(d=>{
      if(d.ex){return dayEx(d).some(e=>gw(w,d.full,e.n))}
      if(d.run){return['tid','pace','km'].some(k=>gw(w,d.full,k))}
      return false;
    });
    if(has)return w;
  }
  return 1;
}
function isProgramDone(){return PROG.startDate&&weekFromStart()>TW()}

let tt;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg||'✓ Gemt';
  t.classList.add('show');
  clearTimeout(tt);
  tt=setTimeout(()=>t.classList.remove('show'),1400);
}

const TABS=['weekly','weights','graph','body','coach','library','info'];
function go(t){
  tab=t;
  // Når Skema åbnes: spring til dagens dag og dagens uge
  if(t==='weekly'){
    sel=todayDayIdx();
    const cw=currentWeek();
    if(cw>=1&&cw<=TW())week=cw;
  }else{
    sel=null;
  }
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('on',TABS[i]===t));
  render();
  document.getElementById('cnt').scrollTop=0;
}
function sd(i){sel=sel===i?null:i;render();if(sel!==null)setTimeout(()=>document.querySelector('.det')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function goToTodayDetail(idx){
  sel=idx;render();
  setTimeout(()=>{
    document.querySelector('.det')?.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(()=>{
      const empties=document.querySelectorAll('input.wi[type="number"]');
      for(const inp of empties){if(!inp.value){inp.focus();break}}
    },400);
  },50);
}
function sw2(w){week=w;render()}
function wch(el){const w=+el.dataset.w,d=el.dataset.d,n=el.dataset.n;sw(w,d,n,el.value);el.classList.remove('fl');void el.offsetWidth;el.classList.add('fl');setTimeout(()=>el.classList.remove('fl'),550)}
function diffH(d){if(d===null)return'';const cl=d>0?'dup':d<0?'ddn':'deq',s=d>0?`▲+${d}`:d<0?`▼${d}`:'=0';return`<div class="${cl}">${s}</div>`}

// Sæt-for-sæt funktioner
function wchAll(el){
  const w=+el.dataset.w,d=el.dataset.d,n=el.dataset.n,sets=+el.dataset.sets||3;
  const t=el.dataset.t||'c';
  const exIdx=+el.dataset.idx;
  const val=el.value.trim();
  if(!val){sw(w,d,n,'');return}
  const arr=Array(sets).fill(val).join(',');
  sw(w,d,n,arr);
  bumpWorkoutActivity();
  const restType=getRestTypeForSuperset(d,exIdx,t);
  if(restType)startRestTimer(restType);
  checkAndCelebratePR(d,n,arr);
  el.classList.remove('fl');void el.offsetWidth;el.classList.add('fl');setTimeout(()=>el.classList.remove('fl'),550);
  if(selExRow===d+'__'+n)render();
}
function toggleSetRow(key){
  selExRow=selExRow===key?null:key;
  render();
}
function renderSetInputs(w,day,name,numSets){
  const val=gw(w,day,name);
  const arr=parseW(val);
  let h=`<div class="set-expand"><div class="set-row">`;
  for(let s=0;s<numSets;s++){
    const sv=s<arr.length?arr[s]:'';
    h+=`<div class="set-chip">
      <label>S${s+1}</label>
      <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="—" value="${sv}"
        onchange="wchSet(${w},'${escAttr(day)}','${escAttr(name)}',${s},${numSets},this.value)"
        onfocus="this.select()">
    </div>`;
  }
  h+=`</div></div>`;
  return h;
}
function wchSet(w,day,name,idx,numSets,val){
  const current=gw(w,day,name);
  const arr=parseW(current);
  const num=parseFloat(val);
  if(isNaN(num))return;
  while(arr.length<numSets)arr.push(0);
  arr[idx]=num;
  for(let i=0;i<arr.length;i++){if(arr[i]===0)arr[i]=num}
  const newVal=arr.join(',');
  sw(w,day,name,newVal);
  // Find exercise type for timer
  const dayObj=D.find(o=>o.full===day);
  if(dayObj){
    const exObj=dayEx(dayObj)?.find(e=>e.n===name);
    if(exObj){
      const exIdx=dayEx(dayObj).indexOf(exObj);
      const restType=getRestTypeForSuperset(day,exIdx,exObj.k);
      if(restType)startRestTimer(restType);
    }
  }
  checkAndCelebratePR(day,name,newVal);
  render();
}

function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ── MAIN RENDER ───────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function render(){
  updateHeaderWeek();
  const c=document.getElementById('cnt');
  if(tab==='weekly')c.innerHTML=rWeekly();
  else if(tab==='weights')c.innerHTML=rLog();
  else if(tab==='graph')c.innerHTML=rGraph();
  else if(tab==='body')c.innerHTML=rBody();
  else if(tab==='coach')c.innerHTML=rCoach();
  else if(tab==='library')c.innerHTML=rLibrary();
  else if(tab==='info')c.innerHTML=rInfo();
}

function updateHeaderWeek(){
  // Start-tid
  const startEl=document.getElementById('hdrStart');
  if(startEl)startEl.innerHTML=`<div class="hdr-stat-dot"></div><label>Start</label><b>${fmtSec(PROG.start5kSec||2100)}</b>`;
  // Mål-tid
  const goalEl=document.getElementById('hdrGoal');
  if(goalEl){const g=goal5kSec();goalEl.innerHTML=`<div class="hdr-stat-dot" style="background:var(--grn)"></div><label>Mål</label><b style="color:var(--grn)">&lt;${fmtSec(g)}</b>`}
  // Uge / Status
  const el=document.getElementById('hdrWeek');
  if(!el)return;
  const cw=currentWeek();
  if(isProgramDone()){
    el.innerHTML=`<div class="hdr-stat-dot" style="background:#30d158"></div><label>Status</label><b style="color:#30d158">FÆRDIG</b>`;
  }else if(PROG.startDate){
    el.innerHTML=`<div class="hdr-stat-dot"></div><label>Uge</label><b>${cw} / ${TW()}</b>`;
  }else{
    el.innerHTML=`<div class="hdr-stat-dot"></div><label>Plan</label><b>${TW()} UGE</b>`;
  }
}

function wpickH(){
  let h='<div class="wpick"><label>Uge</label>';
  for(let w=1;w<=TW();w++)h+=`<button class="wb${week===w?' on':''}" onclick="sw2(${w})">${w}</button>`;
  return h+'</div>';
}

/* ── WEEKLY ── */
function rWeekly(){
  let h='';

  // Første gang: vis template-vælger
  if(!PROG.templateChosen){
    return rTemplateChooser();
  }

  // Generel profil ej udfyldt → vis profil-onboarding (alle templates)
  if(!PROFILE.completed){
    return rProfileOnboarding();
  }

  // PCOS template + ingen PCOS-specifik profil endnu → vis PCOS-specifik onboarding
  if(PROG.template==='pcos'&&!PCOS_PROFILE.completed){
    return rPcosOnboarding();
  }

  // Program færdigt? Vis fejring + start-forfra
  if(isProgramDone()){
    h+=rProgDone();
  }
  // Ingen startdato sat? Vis setup-banner
  else if(!PROG.startDate){
    h+=rProgSetup();
  }
  // I gang: vis dagens træning som banner
  else{
    h+=rTodayBanner();
  }

  // Day grid
  const todayIdx=todayDayIdx();
  h+='<div class="dgrid">';
  D.forEach((d,i)=>{
    const isToday=i===todayIdx&&PROG.startDate&&!isProgramDone();
    h+=`<div class="dc${sel===i?' on':''}" style="--col:${d.color}" onclick="sd(${i})">
      <span class="di">${d.icon}</span>
      <div class="da">${d.day}${isToday?' <span style="color:'+d.color+';font-size:10px">●</span>':''}</div>
      <div class="dl">${d.label}</div>
    </div>`;
  });
  h+='</div>';
  if(sel!==null){
    const d=D[sel];
    h+=`<div class="det">
      <div class="det-head">
        <div class="det-icon">${d.icon}</div>
        <div>
          <div class="det-sub">${d.full}</div>
          <div class="det-title">${d.type}</div>
        </div>
        <div class="badge" style="background:${d.color}22;color:${d.color};border:1px solid ${d.color}44">${d.label}</div>
      </div>`;

    const exs=dayEx(d);
    if(exs){
      const gp=GP[gymPhase(week)];
      h+=wpickH();
      h+=`<div class="phase-banner" style="background:${gp.color}10;border:1px solid ${gp.color}30">
        <div class="phase-dot" style="background:${gp.color}"></div>
        <div class="phase-name" style="color:${gp.color}">${gp.name.toUpperCase()}</div>
        <div class="phase-info">${gp.weeks} &nbsp;·&nbsp; ${gp.tip}</div>
        <div id="workoutTimer" class="workout-timer" style="margin-left:auto;display:${workoutStart?'inline-flex':'none'}">
          <div class="wt-dot"></div>
          <span class="wt-time">0:00</span>
        </div>
      </div>`;
      h+=`<div class="ex-hd"><span>Øvelse</span><span>Sæt</span><span>Reps</span><span>Kg – uge ${week}</span><span>Se</span></div>`;
      exs.forEach((e,exIdx)=>{
        const sr=exSR(e,week),v=gw(week,d.full,e.n),dv=df(week,d.full,e.n);
        const numSets=parseInt(sr.s)||3;
        const isCust=e.custom;
        const cls=isCust?'cust':(e.core?'core':'');
        const rmBtn=isCust?`<button class="rmx" onclick="removeCustomEx('${escAttr(d.full)}','${escAttr(e.n)}')" title="Fjern">×</button>`:'';
        const custTag=isCust?'<span class="cust-tag">EGEN</span>':'';
        const isExpanded=selExRow===d.full+'__'+e.n;
        const displayVal=summaryW(v)||'';
        const mainVal=maxW(v);
        const inSS=isInSuperset(d.full,exIdx);
        const ssTag=inSS?'<span class="ss-tag">SS</span>':'';
        const showPR=!e.core&&isPR(d.full,e.n,week)&&mainVal>0;
        const prBadge=showPR?'<span class="pr-badge">🏆 PR</span>':'';
        const ssBtn=!e.core?`<button class="ss-btn${inSS?' on':''}" onclick="toggleSuperset('${escAttr(d.full)}',${exIdx})" title="${inSS?'Fjern superset':'Markér som superset'}">${inSS?'×SS':'+SS'}</button>`:'';
        const noteKey=d.full+'__'+e.n;
        const hasNote=!!getExerciseNote(week,d.full,e.n);
        const noteOpen=selExRow==='note__'+noteKey;
        const noteBtn=`<button class="note-btn${hasNote?' has':''}" onclick="toggleNote('${escAttr(noteKey)}')" title="Note">${hasNote?'📝':'✎'}</button>`;
        const est1rm=!e.core?estimateExercise1RM(week,d.full,e.n,e):null;
        const rmDisplay=est1rm?`<div class="est-1rm">est. 1RM: <b>${est1rm} kg</b></div>`:'';
        h+=`<div class="exrow${cls?' '+cls:''}">
          <div><div class="exn">${e.n}${custTag}${ssTag}${prBadge}${ssBtn}${noteBtn}${rmBtn}</div>${e.no?`<div class="exno">${e.no}</div>`:''}${rmDisplay}</div>
          <div class="exs" style="color:${d.color}">${sr.s}</div>
          <div class="exr">${sr.r}</div>
          <div class="exkg">
            <div style="display:flex;align-items:center;gap:2px">
              <input class="wi" type="number" inputmode="decimal" placeholder="kg" min="0" step="0.5"
                value="${!isNaN(mainVal)?mainVal:''}" data-w="${week}" data-d="${d.full}" data-n="${escAttr(e.n)}" data-sets="${numSets}" data-t="${e.k||'c'}" data-idx="${exIdx}"
                onchange="wchAll(this)" onfocus="this.select()">
              <button class="set-toggle" onclick="toggleSetRow('${escAttr(d.full)}__${escAttr(e.n)}')" title="Sæt-detaljer">${isExpanded?'▴':'⋯'}</button>
            </div>
            ${diffH(dv)}
          </div>
          <a class="vl" href="${e.l}" target="_blank">▶</a>
          ${isExpanded?renderSetInputs(week,d.full,e.n,numSets):''}
          ${noteOpen?renderNotePopup(week,d.full,e.n):''}
        </div>`;
      });
      h+=`<div class="tip">💡 <b>Pause:</b> 2–3 min styrke &nbsp;·&nbsp; 60–90 sek isolation &nbsp;·&nbsp; 1–2 reps fra failure</div>`;
      if(exs.some(e=>e.core))h+=`<div class="tcore">🔶 <b>Core-blok</b> – ca. 10 min til sidst &nbsp;·&nbsp; 45–60 sek pause</div>`;
      h+=`<div style="margin-top:12px;text-align:center"><button class="ai-btn ghost" onclick="go('library')">+ Tilføj øvelse fra bibliotek</button></div>`;

    }else if(d.run){
      h+=wpickH();
      h+=`<div class="rungrid">
        <div class="rcard"><label>Type</label><div class="rval" style="color:${d.color}">${d.run.type}</div></div>
        <div class="rcard"><label>Mål pace</label><div class="rval" style="color:${d.color}">${d.run.pace}</div></div>
        <div class="rcard"><label>Varighed</label><div class="rval" style="color:${d.color}">${d.run.dur}</div></div>
        <div class="rtip" style="background:${d.color}10;border:1px solid ${d.color}25;color:${d.color}cc">💡 ${d.run.tip}</div>
      </div>`;
      const rf=[{k:'tid',label:'Tid (min:sek)',ph:'28:30'},{k:'pace',label:'Faktisk pace (min/km)',ph:'5:42'},{k:'km',label:'Distance (km)',ph:'5.2'}];
      h+=`<div class="runlog">
        <div class="runlog-head" style="background:${d.color}15;border-bottom:1px solid ${d.color}25">
          <span style="color:${d.color}">📝</span>
          <span style="color:${d.color}">LOG – UGE ${week}</span>
        </div>`;
      rf.forEach(f=>{
        const cv=gw(week,d.full,f.k),pv=week>1?gw(week-1,d.full,f.k):'';
        h+=`<div class="runlog-row">
          <div>
            <div class="runlog-label">${f.label}</div>
            ${pv?`<div class="runlog-prev">▸ Forrige: ${pv}</div>`:''}
          </div>
          <input class="wi" type="text" inputmode="decimal" placeholder="${f.ph}" style="width:80px"
            value="${cv}" data-w="${week}" data-d="${d.full}" data-n="${f.k}"
            onchange="wch(this)" onfocus="this.select()">
        </div>`;
      });
      const note=gw(week,d.full,'note');
      h+=`<div class="runlog-note">
        <label>📓 Noter</label>
        <textarea rows="2" placeholder="Hvordan gik det? Følte du dig stærk?"
          data-w="${week}" data-d="${d.full}" data-n="note"
          onchange="wch(this)">${escHtml(note)}</textarea>
      </div></div>`;
      h+=renderPaceCalc();

    }else{
      h+=`<div class="rest">
        <span class="rest-icon">😴</span>
        <div class="rest-title">Restitutionsdag</div>
        <div class="rest-sub">Søvn 7–9 timer &nbsp;·&nbsp; Let gåtur er fint</div>
      </div>`;
    }
    h+='</div>';
  }else{
    h+=`<div class="hint"><span class="hint-icon">👆</span>Tryk på en dag<br>for øvelser og videolinks</div>`;
  }
  return h;
}

/* ── TODAY BANNER ── */
function rTodayBanner(){
  const idx=todayDayIdx();
  const d=D[idx];
  const cw=currentWeek();
  const today=new Date().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'});
  const exs=dayEx(d);
  let summary='';
  if(d.run){
    summary=`${d.run.dur} @ ${d.run.pace} · ${d.run.type}`;
  }else if(exs){
    const compounds=exs.filter(e=>!e.core).slice(0,3).map(e=>e.n).join(', ');
    summary=`${exs.filter(e=>!e.core).length} øvelser · ${compounds}${exs.filter(e=>!e.core).length>3?'…':''}`;
  }else{
    summary='Hvile · Søvn 7-9 timer · Let gåtur er fint';
  }
  return `<div class="today-banner" style="--tc:${d.color}" onclick="goToTodayDetail(${idx})">
    <div class="tb-icon">${d.icon}</div>
    <div class="tb-text">
      <div class="tb-eyebrow"><span class="pulse"></span>I dag · ${today} · Uge ${cw}</div>
      <div class="tb-title">${d.type}</div>
      <div class="tb-sub">${summary}</div>
    </div>
    <div class="tb-arrow">›</div>
  </div>`;
}

}

/* ── PROGRAM DONE ── */
function rProgDone(){
  const startDate=fmtDate(PROG.startDate);
  const tw=TW();
  let totalLogged=0;
  D.filter(d=>d.ex).forEach(d=>{
    dayEx(d).filter(e=>!e.core).forEach(e=>{
      for(let w=1;w<=tw;w++){const v=parseFloat(gw(w,d.full,e.n));if(!isNaN(v)){totalLogged++}}
    });
  });
  let bestPace='–';
  D.filter(d=>d.run).forEach(d=>{
    for(let w=1;w<=tw;w++){const v=gw(w,d.full,'tid');if(v&&(bestPace==='–'||v<bestPace))bestPace=v}
  });
  return `<div class="prog-done">
    <span class="pd-emoji">🏆</span>
    <div class="pd-title">${tw} UGER FÆRDIG!</div>
    <div class="pd-sub">Startet ${startDate}<br>Du har gennemført hele Recomp + 5km programmet</div>
    <div class="pd-stats">
      <div class="pd-stat"><label>Sæt loggede</label><span>${totalLogged}</span></div>
      <div class="pd-stat"><label>Bedste tid</label><span>${bestPace}</span></div>
      <div class="pd-stat"><label>Uger</label><span>${tw}/${tw}</span></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="prog-btn" onclick="restartProgram()">↻ Start nyt forløb</button>
      <button class="prog-btn ghost" onclick="go('coach')">🤖 Få debrief fra coach</button>
    </div>
