function calPhotoPick(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    calPhotoData={base64:reader.result.split(',')[1],mime:file.type||'image/jpeg'};
    calAnalyzePhoto();
  };
  reader.onerror=()=>{calPhotoErr='Kunne ikke læse billedet.';render()};
  reader.readAsDataURL(file);
}

async function calAnalyzePhoto(){
  if(!calPhotoData)return;
  calPhotoAnalyzing=true;calPhotoErr='';calPhotoResult=null;render();
  const prompt=`Du er en ernæringsekspert. Se billedet af mad og estimér næringsindholdet.
Svar KUN med ren JSON (ingen markdown, ingen forklaring) i præcis dette format:
{"navn":"kort dansk beskrivelse","gram":estimeret_vægt_i_gram,"kcal":total_kalorier,"protein":gram,"kulhydrat":gram,"fedt":gram,"usikkerhed":"lav|middel|høj"}
Estimér realistisk ud fra hvad du kan se. Hvis portionsstørrelsen er svær at bedømme, sæt usikkerhed til "høj". Er det ikke mad, sæt navn til "ikke mad".`;
  try{
    const raw=await callGeminiVision(calPhotoData.base64,calPhotoData.mime,prompt);
    const clean=raw.replace(/```json|```/g,'').trim();
    const j=JSON.parse(clean);
    if(!j.navn||j.navn.toLowerCase()==='ikke mad'){
      calPhotoErr='Kunne ikke genkende mad på billedet. Prøv et tydeligere foto, eller indtast manuelt.';
    }else{
      calPhotoResult={
        n:j.navn,gram:Math.round(j.gram)||100,
        kcal:Math.round(j.kcal)||0,
        p:Math.round((j.protein||0)*10)/10,
        c:Math.round((j.kulhydrat||0)*10)/10,
        f:Math.round((j.fedt||0)*10)/10,
        usikkerhed:j.usikkerhed||'høj'
      };
    }
  }catch(e){
    calPhotoErr=e.message.includes('JSON')?'Analysen gav et uventet svar — prøv igen eller indtast manuelt.':e.message;
  }
  calPhotoAnalyzing=false;calPhotoData=null;render();
}

// Juster foto-estimatet til en vejet gramvægt (bevarer makro-forhold)
function calPhotoRescale(newGram){
  if(!calPhotoResult)return;
  const g=parseFloat(newGram)||calPhotoResult.gram;
  const factor=g/calPhotoResult.gram;
  calPhotoResult={...calPhotoResult,gram:g,
    kcal:Math.round(calPhotoResult.kcal*factor),
    p:Math.round(calPhotoResult.p*factor*10)/10,
    c:Math.round(calPhotoResult.c*factor*10)/10,
    f:Math.round(calPhotoResult.f*factor*10)/10};
  render();
}
function calPhotoConfirm(){
  if(!calPhotoResult)return;
  const k=calDayKey();if(!CAL[k])CAL[k]={items:[]};
  CAL[k].items.push({n:calPhotoResult.n+' 📷',qty:calPhotoResult.gram,kcal:calPhotoResult.kcal,p:calPhotoResult.p,c:calPhotoResult.c,f:calPhotoResult.f});
  saveCal();calPhotoResult=null;render();
}

/* ══ ENERGIFORBRUG: hvile + hverdag + træning per dag ══ */
function energyWeight(){
  return parseFloat(PROFILE.weight)||((BODY&&BODY.length)?parseFloat(BODY[BODY.length-1].w):0)||80;
}
// Hvilestofskifte (BMR) — Mifflin-St Jeor, den mest præcise standardformel
function bmrKcal(){
  const w=energyWeight();
  const h=parseFloat(PROFILE.height)||178;
  const a=parseFloat(PROFILE.age)||32;
  // 'private'/ukendt → midt mellem mande- og kvindekonstanten
  const k=PROFILE.gender==='male'?5:PROFILE.gender==='female'?-161:-78;
  return Math.round(10*w+6.25*h-5*a+k);
}
// Dagens løbedistance ud fra planen (samme logik som rute-knappen)
function dayRunKm(wk,plan){
  if(!plan)return 0;
  const easyPace=getPaceForRunType(wk,'easy');
  let meters=0;
  if(plan.warmup)meters+=plan.warmup.dur*60/easyPace*1000;
  if(plan.cooldown)meters+=plan.cooldown.dur*60/easyPace*1000;
  if(plan.format==='intervals'){
    const recPace=getPaceForRunType(wk,'recovery');
    meters+=plan.dur*60*(0.5/plan.pacePerKm+0.5/recPace)*1000;
  }else{
    meters+=plan.dur*60/plan.pacePerKm*1000;
  }
  return Math.max(2,Math.round(meters/100)/10);
}
// Estimeret forbrænding fra dagens træning
function dayTrainingBurn(dayObj,wk){
  const w=energyWeight();
  if(!dayObj||dayObj.tag==='rest')return {kcal:0,min:0,label:'Hvile'};
  if(dayObj.run){
    const plan=getRunPlan(wk,dayObj.run);
    const km=dayRunKm(wk,plan);
    // Løb: ~0,95 kcal pr. kg pr. km (veletableret nettoestimat)
    return {kcal:Math.round(w*km*0.95),min:plan?plan.totalDur:40,label:plan?.typeLabel||'Løb',km};
  }
  if(dayObj.ex){
    const sets=dayEx(dayObj).reduce((a,e)=>a+(parseInt(exSR(e,wk).s)||3),0);
    const min=Math.round(sets*2.6+10); // inkl. pauser og opvarmning
    // Styrketræning ≈ 4,5 MET → kcal/min = MET × 3,5 × kg / 200
    return {kcal:Math.round(4.5*3.5*w/200*min),min,label:'Styrketræning',sets};
  }
  return {kcal:0,min:0,label:'Hvile'};
}
// Hverdagsaktivitet (NEAT) — bruger dine rigtige skridt hvis de er logget
function dayNeatKcal(dateKey){
  const w=energyWeight();
  const steps=(dateKey&&typeof STEPS!=='undefined')?parseInt(STEPS[dateKey]):0;
  const s=steps>0?steps:6000; // 6.000 = typisk hverdag uden logning
  return {kcal:Math.round(s*0.045*(w/80)),steps:s,logged:steps>0};
}
// Samlet dagsregnskab
function dayEnergy(dayObj,wk,dateKey){
  const bmr=bmrKcal();
  const tef=Math.round(bmr*0.12);      // fordøjelse (termisk effekt af mad)
  const neat=dayNeatKcal(dateKey);
  const tr=dayTrainingBurn(dayObj,wk);
  const total=bmr+tef+neat.kcal+tr.kcal;
  const target=calorieTargets();
  return {bmr,tef,neat,training:tr,total,intake:target.kcal,balance:target.kcal-total,label:target.label};
}

// Swipe mellem Log og Graf
let weightSwipeX=null,weightSwipeY=null,weightSwipeTime=0;
function weightSwipeStart(e){
  const t=e.target;
  if(t.tagName==='INPUT'||t.tagName==='BUTTON'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.tagName==='A')return;
  weightSwipeX=e.touches[0].clientX;
  weightSwipeY=e.touches[0].clientY;
  weightSwipeTime=Date.now();
}
function weightSwipeMove(e){
  if(weightSwipeX===null)return;
  const dy=e.touches[0].clientY-weightSwipeY;
  const dx=e.touches[0].clientX-weightSwipeX;
  if(Math.abs(dy)>Math.abs(dx)){weightSwipeX=null;return}
}
function weightSwipeEnd(e){
  if(weightSwipeX===null)return;
  const dx=(e.changedTouches?.[0]?.clientX||0)-weightSwipeX;
  const elapsed=Date.now()-weightSwipeTime;
  const isSwipe=Math.abs(dx)>60||(Math.abs(dx)>30&&elapsed<200);
  if(isSwipe){
    if(dx<0&&weightSubView==='log'){weightSubView='graph';render()}
    else if(dx>0&&weightSubView==='graph'){weightSubView='log';render()}
  }
  weightSwipeX=null;weightSwipeY=null;
}

/* ── DASHBOARD-OVERBLIK (øverst i Graf-visningen) ── */
function dashKPIs(){
  const cw=Math.min(currentWeek(),TW());
  // Vægt + trend
  const bodyLog=(typeof BODY!=='undefined'&&Array.isArray(BODY))?BODY.filter(b=>b&&b.w):[];
  let wNow=null,wDelta=null;
  if(bodyLog.length){
    wNow=parseFloat(bodyLog[bodyLog.length-1].w);
    const older=bodyLog.length>=4?bodyLog[bodyLog.length-4]:bodyLog[0];
    const wOld=parseFloat(older.w);
    if(!isNaN(wNow)&&!isNaN(wOld)&&bodyLog.length>=2)wDelta=Math.round((wNow-wOld)*10)/10;
  }
  // Volumen denne uge vs sidste
  const volNow=Object.values(calcWeeklyVolume(cw)).reduce((a,b)=>a+b,0);
  const volPrev=cw>1?Object.values(calcWeeklyVolume(cw-1)).reduce((a,b)=>a+b,0):0;
  const volPct=(volPrev>0&&volNow>0)?Math.round((volNow-volPrev)/volPrev*100):null;
  // Gennemførte træningspas
  let done=0,planned=0;
  for(let w=1;w<=cw;w++){
    D.filter(d=>d.ex||d.run).forEach(d=>{
      planned++;
      if(isDayFullyLogged(w,d.full))done++;
    });
  }
  const pct=planned?Math.round(done/planned*100):0;
  // Løbetid
  let bestRun=null;
  D.filter(d=>d.run).forEach(rd=>{
    for(let w=1;w<=TW();w++){
      const t=gw(w,rd.full,'tid');
      if(t&&/^\d+:\d+$/.test(t)){
        const parts=t.split(':'),secs=(+parts[0])*60+(+parts[1]);
        if(!bestRun||secs<bestRun)bestRun=secs;
      }
    }
  });
  return{wNow,wDelta,volNow,volPct,done,planned,pct,bestRun,cw};
}

    const rest=d.tag==='rest';
    const icon=logged?'✓':rest?'😴':d.run?'🏃':'💪';
    h+=`<div class="dash-day${logged?' done':''}${rest?' rest':''}${isToday?' today':''}">
      <div class="dd-d">${d.day}</div><div class="dd-i">${icon}</div></div>`;
  });
  h+=`</div>`;
  // KPI'er
  h+=`<div class="dash-kpis">`;
  h+=`<div class="dash-kpi"><div class="dk-l">Vægt</div>
    <div class="dk-v">${k.wNow?k.wNow.toLocaleString('da-DK'):'—'} <span>${k.wNow?'kg':''}</span></div>
    <div class="dk-s${k.wDelta!==null?(k.wDelta<0?' down':k.wDelta>0?' up':''):''}">${k.wDelta!==null?(k.wDelta<0?'↓ ':k.wDelta>0?'↑ +':'→ ')+Math.abs(k.wDelta)+' kg':'Log din vægt'}</div></div>`;
  h+=`<div class="dash-kpi"><div class="dk-l">Volumen i uge</div>
    <div class="dk-v">${k.volNow?Math.round(k.volNow).toLocaleString('da-DK'):'—'} <span>${k.volNow?'kg':''}</span></div>
    <div class="dk-s${k.volPct>0?' up':k.volPct<0?' down':''}">${k.volPct!==null?(k.volPct>=0?'↑ +':'↓ ')+Math.abs(k.volPct)+'% vs sidste uge':'Ingen data endnu'}</div></div>`;
  const goalS=goal5kSec();
  h+=`<div class="dash-kpi"><div class="dk-l">Bedste løb</div>
    <div class="dk-v">${k.bestRun?fmtSec(k.bestRun):'—'}</div>
    <div class="dk-s${k.bestRun&&k.bestRun<=goalS?' up':''}">${k.bestRun?'mål '+fmtSec(goalS):'Log en løbetur'}</div></div>`;
  h+=`<div class="dash-kpi"><div class="dk-l">Træningspas</div>
    <div class="dk-v">${k.done}</div>
    <div class="dk-s">${k.pct}% af ${k.planned} planlagte</div></div>`;
  h+=`</div>`;
  // Vægtgraf
  h+=rDashWeightChart();
  // PR'er
  h+=rDashPRs();
  h+=`</div>`;
  return h;
}
function rDashWeightChart(){
  const log=(typeof BODY!=='undefined'&&Array.isArray(BODY))?BODY.filter(b=>b&&b.w&&!isNaN(parseFloat(b.w))):[];
  if(log.length<2)return '';
  const pts=log.slice(-10).map(b=>parseFloat(b.w));
  const mx=Math.max(...pts),mn=Math.min(...pts);
  const range=Math.max(mx-mn,1);
  const W=300,H=80,pad=8;
  const stepX=pts.length>1?W/(pts.length-1):W;
  const coords=pts.map((v,i)=>({x:i*stepX,y:pad+(1-(v-mn)/range)*(H-pad*2)}));
  const line=coords.map((c,i)=>(i?'L':'M')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const area=line+` L${W},${H} L0,${H} Z`;
  const delta=Math.round((pts[pts.length-1]-pts[0])*10)/10;
  return `<div class="dash-sec">Vægtudvikling</div>
  <div class="dash-chart">
    <div class="dc-hd"><span class="dc-t">Seneste ${pts.length} målinger</span>
    <span class="dc-d">${pts[0]} → ${pts[pts.length-1]} kg (${delta>0?'+':''}${delta})</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%">
      <defs><linearGradient id="dwg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffd60a" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#ffd60a" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#dwg)"/>
      <path d="${line}" fill="none" stroke="#ffd60a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${coords[coords.length-1].x.toFixed(1)}" cy="${coords[coords.length-1].y.toFixed(1)}" r="3.5" fill="#ffd60a"/>
    </svg>
  </div>`;
}
function rDashPRs(){
  const list=[];
  D.filter(d=>d.ex).forEach(d=>{
    dayEx(d).filter(e=>!e.core&&e.k==='c').forEach(e=>{
      const pr=getPR(d.full,e.n);
      if(!pr)return;
      // Find første loggede vægt for at vise fremgang
      let first=null,prWeek=null;
      for(let w=1;w<=TW();w++){
        const v=maxW(gw(w,d.full,e.n));
        if(!isNaN(v)&&v>0){if(first===null)first=v;if(v===pr&&prWeek===null)prWeek=w}
      }
      list.push({n:e.n,pr,gain:first!==null?Math.round((pr-first)*10)/10:null,week:prWeek});
    });
  });
  if(!list.length)return '';
  list.sort((a,b)=>b.pr-a.pr);
  const cw=Math.min(currentWeek(),TW());
  let h=`<div class="dash-sec">Personlige rekorder</div>`;
  list.slice(0,5).forEach(p=>{
    const isNew=p.week===cw;
    h+=`<div class="dash-pr">
      <div><div class="dp-n">${escHtml(p.n)}</div>
      <div class="dp-d">Uge ${p.week}${p.gain>0?' · +'+p.gain+' kg siden start':''}</div></div>
      <div class="dp-r"><span class="dp-w">${p.pr} kg</span>${isNew?'<span class="dp-badge">NY</span>':''}</div>
    </div>`;
  });
  return h;
}

function rGraphContent(){
  const gymExs=[];
  D.filter(d=>d.ex).forEach(d=>{
    dayEx(d).filter(e=>!e.core).forEach(e=>{
      if(!gymExs.find(x=>x.n===e.n))gymExs.push({n:e.n,day:d.full,color:d.color});
    });
  });
  if(selGraph>=gymExs.length)selGraph=0;
  const selEx=gymExs[selGraph]||gymExs[0];
  if(!selEx)return rDashboard()+'<div class="hint"><span class="hint-icon">📊</span>Ingen øvelser endnu</div>';
  const pts=[];
  for(let w=1;w<=TW();w++){const v=maxW(gw(w,selEx.day,selEx.n));pts.push(isNaN(v)?null:v)}
  const filled=pts.filter(v=>v!==null);
  const hasData=filled.length>=2;
  const maxV=hasData?Math.max(...filled):100,minV=hasData?Math.min(...filled):0;
  const range=Math.max(maxV-minV,10),padV=range*.2;
  const W2=340,H2=170,pl=42,pr=14,pt2=18,pb=28,iw=W2-pl-pr,ih=H2-pt2-pb;
  function px(w){return pl+((w-1)/7)*iw}
  function py(v){return pt2+ih-(((v-(minV-padV))/(range+2*padV))*ih)}
  const phC=['#4f8ef722','#f0704022','#e0406022'],phR=[[1,3],[4,6],[7,8]];
  let svg=`<svg viewBox="0 0 ${W2} ${H2}" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:10px">`;
  svg+=`<rect width="${W2}" height="${H2}" fill="#0e0e1a" rx="10"/>`;
  phR.forEach(([s,e],i)=>{
    const x1=px(s)-iw/14,x2=px(e)+iw/14;
    svg+=`<rect x="${x1}" y="${pt2}" width="${x2-x1}" height="${ih}" fill="${phC[i]}" rx="4"/>`;
  });
  for(let i=0;i<=4;i++){const y=pt2+(ih/4)*i;svg+=`<line x1="${pl}" y1="${y}" x2="${W2-pr}" y2="${y}" stroke="#ffffff06" stroke-width="1"/>`;}
  if(hasData){
    for(let i=0;i<=2;i++){
      const v=minV-padV+(range+2*padV)*(1-i/2);
      svg+=`<text x="${pl-4}" y="${pt2+(ih/2)*i+4}" text-anchor="end" font-size="8" fill="#3a3a5a" font-family="DM Mono,monospace">${Math.round(v)}</text>`;
    }
  }
  for(let w=1;w<=TW();w++)svg+=`<text x="${px(w)}" y="${H2-6}" text-anchor="middle" font-size="9" fill="#3a3a5a" font-family="DM Mono,monospace">${w}</text>`;
  if(hasData){
    let pathD='',dotPts=[];
    let prev=null;
    for(let w=1;w<=TW();w++){
      const v=pts[w-1];
      if(v!==null){const x=px(w),y=py(v);if(prev===null)pathD+=`M${x},${y}`;else pathD+=` L${x},${y}`;dotPts.push({x,y,v,w});prev={x,y};}
    }
    const fd=dotPts[0],ld=dotPts[dotPts.length-1];
    svg+=`<path d="${pathD} L${ld.x},${pt2+ih} L${fd.x},${pt2+ih} Z" fill="url(#grad)"/>`;
    svg+=`<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${selEx.color}" stop-opacity=".3"/><stop offset="100%" stop-color="${selEx.color}" stop-opacity="0"/></linearGradient></defs>`;
    svg+=`<path d="${pathD}" fill="none" stroke="${selEx.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    dotPts.forEach(({x,y,v})=>{
      svg+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${selEx.color}" stroke="#0e0e1a" stroke-width="2"/>`;
      svg+=`<text x="${x}" y="${y-9}" text-anchor="middle" font-size="9" fill="${selEx.color}" font-family="DM Mono,monospace" font-weight="500">${v}</text>`;
    });
  }else{
    svg+=`<text x="${W2/2}" y="${H2/2}" text-anchor="middle" font-size="11" fill="#3a3a5a" font-family="DM Sans,sans-serif">Ingen data endnu</text>`;
  }
  svg+=`<text x="${W2/2}" y="${H2-1}" text-anchor="middle" font-size="7" fill="#2a2a3a" font-family="DM Mono,monospace">UGE</text>`;
  svg+='</svg>';

  const firstVal=filled[0],lastVal=filled[filled.length-1];
  const totalGain=filled.length>=2?Math.round((lastVal-firstVal)*10)/10:null;

  let h=rDashboard();
  h+=`<div class="dash-sec">Øvelsesfremgang</div>`;
  h+=`<div class="ex-picker">`;
  gymExs.forEach((e,i)=>{
    const on=i===selGraph;
    h+=`<button class="expill${on?' on':''}" style="${on?`background:${e.color}22;border-color:${e.color};color:${e.color}`:''}" onclick="selGraph=${i};render()">${e.n}</button>`;
  });
  h+=`</div>`;
  h+=`<div class="graph-wrap">
    <div class="graph-title" style="color:${selEx.color}">${selEx.n}</div>
    ${totalGain!==null?`<div class="graph-gain" style="color:${totalGain>=0?'#30c080':'#e04060'}">${totalGain>=0?'▲ +':'▼ '}${totalGain} kg totalt over ${filled.length} uger</div>`:'<div class="graph-gain" style="color:var(--mut)">Tilføj mindst 2 ugers data for at se trend</div>'}
    ${svg}
    <div style="display:flex;justify-content:center;gap:14px;margin-top:12px">
      ${['Hypertrofi','Styrke','Peak'].map((l,i)=>`<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:3px;background:${'#4f8ef7 #f07040 #e04060'.split(' ')[i]}33;border:1px solid ${'#4f8ef7 #f07040 #e04060'.split(' ')[i]}55"></div><span style="font-size:9px;color:var(--mut);font-family:'DM Mono',monospace">${l}</span></div>`).join('')}
    </div>
  </div>`;

  h+=`<div class="section-label">🏃 Løbefremgang</div>`;
  D.filter(d=>d.run).forEach(rd=>{
    const paces=[];
    for(let w=1;w<=TW();w++){const v=gw(w,rd.full,'pace');if(v)paces.push({w,v});}
    h+=`<div class="wld" style="margin-bottom:12px;border:1px solid ${rd.color}22">
      <div class="wlh" style="background:${rd.color}12;border-bottom:1px solid ${rd.color}20">
        <span class="wlh-icon" style="color:${rd.color}">${ic(dayIcon(rd),'sm')}</span>
        <span class="wlh-text" style="color:${rd.color}">${rd.full} – ${rd.type}</span>
      </div>
      <div style="padding:12px 16px">`;
    if(paces.length===0){
      h+=`<div style="font-size:12px;color:var(--mut2);font-family:'DM Mono',monospace">Ingen løbsdata endnu</div>`;
    }else{
      h+=`<div style="display:flex;gap:8px;flex-wrap:wrap">`;
      paces.forEach(p=>{
        h+=`<div style="background:${rd.color}15;border:1px solid ${rd.color}25;border-radius:10px;padding:8px 12px;text-align:center">
          <div style="font-size:8px;color:var(--mut);font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:3px">UGE ${p.w}</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:${rd.color}">${p.v}</div>
        </div>`;
      });
      h+=`</div>`;
    }
    h+=`</div></div>`;
  });

  // Volumen og streak nederst
  h+=rVolume();
  h+=rStreak();

  return h;
}

/* ── BODY TRACKER ──────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
let bodyWeek=null; // tracks which week is selected in body view

function rBody(){
  if(bodyWeek===null)bodyWeek=Math.min(currentWeek(),TW())||1;
  const bw=bodyWeek;
  const bd=BODY[bw]||{};
  const prevBd=bw>1?BODY[bw-1]||{}:{};

  let h=`<div class="page-title"><div class="page-eyebrow">// Kropsmåling</div><div class="page-h1">Kropslog</div></div>`;

  // PCOS-specifikke widgets øverst
  const tpl=TEMPLATES[PROG.template||'recomp'];
  if(tpl?.medicalNote){
    h+=`<div class="med-disclaimer">
      <div class="med-disclaimer-icon">⚕️</div>
      <div class="med-disclaimer-text"><b>Medicinsk note:</b> ${tpl.medicalNote}</div>
    </div>`;
  }
  if(tpl?.needsSteps){
    h+=rStepsWidget();
    h+=rCycleTracker();
  }

  // Week navigator
  const gp=GP[gymPhase(Math.min(bw,TW()))];
  h+=`<div class="body-week-nav">
    <button class="bw-arr${bw<=1?' dis':''}" onclick="bodyNav(-1)">‹</button>
    <div>
      <div class="bw-label">Uge ${bw}</div>
      <span class="bw-phase" style="color:${gp.color}">${gp.name} · ${gp.tip}</span>
    </div>
    <button class="bw-arr${bw>=TW()?' dis':''}" onclick="bodyNav(1)">›</button>
  </div>`;

  // Weight + fat inputs
  const kgDiff=bw>1&&bd.kg&&prevBd.kg?Math.round((bd.kg-prevBd.kg)*10)/10:null;
  const fatDiff=bw>1&&bd.fat&&prevBd.fat?Math.round((bd.fat-prevBd.fat)*10)/10:null;
  h+=`<div class="body-inputs">
    <div class="body-field">
      <label>⚖️ Kropsvægt</label>
      <input type="number" inputmode="decimal" step="0.1" placeholder="—" value="${bd.kg||''}"
        onchange="bodySetField(${bw},'kg',this.value)" onfocus="this.select()">
      <div class="bf-unit">kg</div>
      ${kgDiff!==null?`<div class="bf-diff" style="color:${kgDiff<=0?'var(--grn)':'var(--red)'}">
        ${kgDiff>0?'▲ +':'▼ '}${kgDiff} kg fra uge ${bw-1}
      </div>`:''}
    </div>
    <div class="body-field">
      <label>📐 Fedtprocent</label>
      <input type="number" inputmode="decimal" step="0.1" placeholder="—" value="${bd.fat||''}"
        onchange="bodySetField(${bw},'fat',this.value)" onfocus="this.select()">
      <div class="bf-unit">%</div>
      ${fatDiff!==null?`<div class="bf-diff" style="color:${fatDiff<=0?'var(--grn)':'var(--red)'}">
        ${fatDiff>0?'▲ +':'▼ '}${fatDiff}% fra uge ${bw-1}
      </div>`:''}
    </div>
  </div>`;

  // Photo upload — dual slots
  // Migrate old 'photo' field → 'photoBody'
  if(bd.photo&&!bd.photoBody){bd.photoBody=bd.photo;delete bd.photo;BODY[bw]=bd;saveBody()}

  h+=`<div class="body-photo">
    <label>📸 Billeder – Uge ${bw}</label>
    <div class="body-photo-grid">
      <div class="body-photo-slot">
        <div class="bps-label" style="color:var(--blue)">📱 Vægt-aflæsning</div>
        <div class="body-photo-preview">
          ${bd.photoScale
            ?`<img src="${bd.photoScale}" alt="Vægt uge ${bw}">`
            :`<div class="bpp-empty"><span>📱</span><div>Foto af vægt</div></div>`}
        </div>
        <div class="body-photo-btns">
          <label class="bp-btn${bd.photoScale?'':' primary'}" for="bpScale${bw}">📱 ${bd.photoScale?'Skift':'Upload'}</label>
          <input type="file" id="bpScale${bw}" accept="image/*" capture="environment" onchange="bodyUploadPhoto(${bw},'photoScale',this)">
          ${bd.photoScale?`<button class="bp-btn danger" onclick="bodyRemovePhoto(${bw},'photoScale')">✕</button>`:''}
        </div>
      </div>
      <div class="body-photo-slot">
        <div class="bps-label" style="color:var(--grn)">${ic('camera','sm')} Progressbillede</div>
        <div class="body-photo-preview">
          ${bd.photoBody
            ?`<img src="${bd.photoBody}" alt="Krop uge ${bw}">`
            :`<div class="bpp-empty">${ic('camera')}<div>Foto af dig</div></div>`}
        </div>
        <div class="body-photo-btns">
          <label class="bp-btn${bd.photoBody?'':' primary'}" for="bpBody${bw}">${ic('camera','sm')} ${bd.photoBody?'Skift':'Upload'}</label>
          <input type="file" id="bpBody${bw}" accept="image/*" capture="environment" onchange="bodyUploadPhoto(${bw},'photoBody',this)">
          ${bd.photoBody?`<button class="bp-btn danger" onclick="bodyRemovePhoto(${bw},'photoBody')">✕</button>`:''}
        </div>
      </div>
    </div>
  </div>`;

  // Graph: weight + fat over 8 weeks
  h+=rBodyGraph();

  // Photo comparison: week 1 vs current
  h+=rBodyCompare();

  // Photo gallery (all weeks)
  h+=rPhotoGallery();

  // Data summary
  h+=`<div class="tip">💡 <b>Tip:</b> Vej dig og tag billede samme dag hver uge — gerne om morgenen, fastende. Fedtprocent kan aflæses fra din smarte vægt, eller vurderes visuelt.</div>`;

  return h;
}

function bodyNav(dir){bodyWeek=Math.max(1,Math.min(TW(),bodyWeek+dir));render()}

function bodySetField(w,field,val){
  if(!BODY[w])BODY[w]={};
  const num=parseFloat(val);
  if(isNaN(num)||val.trim()===''){delete BODY[w][field]}
  else{BODY[w][field]=num}
  if(!BODY[w].date)BODY[w].date=todayISO();
  saveBody();toast();
  render();
}

function bodyUploadPhoto(w,field,input){
  const file=input.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    // Compress image to max 600px width to keep localStorage manageable
    const img=new Image();
    img.onload=function(){
      const maxW=600,maxH=800;
      let cw=img.width,ch=img.height;
      if(cw>maxW){ch=Math.round(ch*(maxW/cw));cw=maxW}
      if(ch>maxH){cw=Math.round(cw*(maxH/ch));ch=maxH}
      const canvas=document.createElement('canvas');
      canvas.width=cw;canvas.height=ch;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,cw,ch);
      const compressed=canvas.toDataURL('image/jpeg',0.7);
      if(!BODY[w])BODY[w]={};
      BODY[w][field]=compressed;
      if(!BODY[w].date)BODY[w].date=todayISO();
      saveBody();
      toast('✓ Billede gemt');
      render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function bodyRemovePhoto(w,field){
  if(!confirm('Fjern billedet?'))return;
  if(BODY[w])delete BODY[w][field];
  saveBody();toast('✓ Fjernet');render();
}

/* ── STEPS WIDGET (PCOS template) ──────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function rStepsWidget(){
  const today=todayISO();
  const tpl=TEMPLATES[PROG.template||'recomp'];
  const goal=tpl?.dailyStepsGoal||8000;
  const today_steps=STEPS[today]||0;
  const pct=Math.min(100,Math.round(today_steps/goal*100));
  let status='',statusColor='var(--mut)';
  if(today_steps===0){status='Indtast dagens skridt fra din telefon/ur';}
  else if(pct>=100){status=`✓ Mål nået! +${today_steps-goal} over`;statusColor='var(--grn)'}
  else if(pct>=75){status=`Næsten der · mangler ${(goal-today_steps).toLocaleString('da-DK')}`;statusColor='var(--acc)'}
  else if(pct>=50){status=`Godt på vej · mangler ${(goal-today_steps).toLocaleString('da-DK')}`;statusColor='#0a84ff'}
  else{status=`Mangler ${(goal-today_steps).toLocaleString('da-DK')} skridt`;statusColor='var(--mut)'}

  return `<div class="steps-widget">
    <div class="steps-widget-row">
      <div class="steps-icon">🚶‍♀️</div>
      <div class="steps-content">
        <div class="steps-label">Skridt i dag · ${todayISO()}</div>
        <div class="steps-value">
          <input type="number" inputmode="numeric" min="0" max="100000" placeholder="0"
            value="${today_steps||''}"
            onchange="setSteps('${today}',this.value)" onfocus="this.select()">
          <span class="steps-goal">/ ${goal.toLocaleString('da-DK')}</span>
        </div>
      </div>
    </div>
    <div class="steps-bar"><div class="steps-bar-fill" style="width:${pct}%"></div></div>
    <div class="steps-status" style="color:${statusColor}">${status}</div>
  </div>`;
}

function setSteps(date,val){
  const num=parseInt(val);
  if(isNaN(num)||num<0){delete STEPS[date]}
  else{STEPS[date]=num}
  saveSteps();toast('✓ Gemt');
  render();
}

/* ── WELLNESS (Søvn + Stress) ──────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function rWellnessWidget(){
  const today=todayISO();
  const w=WELLNESS[today]||{};
  const sleep=w.sleep??null;
  const stress=w.stress??null;
  const sleepEmo=sleep===null?'😴':sleep<6?'😩':sleep<7?'😐':sleep<9?'😊':'🌟';
  const stressEmo=stress===null?'🧘':stress<=2?'😌':stress<=3?'😐':stress<=4?'😬':'😫';
  const sleepLabel=sleep===null?'—':sleep+' t';

/* ── CYCLE TRACKER (PCOS template) ─────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
const CYCLE_PHASES=[
  {id:'menstrual',emo:'🔴',name:'Menstruation',tip:'Lavere energi normalt — lyt til kroppen, kortere sessioner OK'},
  {id:'follicular',emo:'🌱',name:'Follikulær',tip:'Energi stiger — perfekt til tunge løft og PR-forsøg'},
  {id:'ovulation',emo:'☀️',name:'Ægløsning',tip:'Topform · maksimal styrke og udholdenhed'},
  {id:'luteal',emo:'🌙',name:'Luteal',tip:'Nedadgående energi — fokus på vedligeholdelse'},
];

// Auto-prediction af cyklus-dag og fase baseret på PROFILE.lastPeriodDate
function getCurrentCycleDay(){
  if(!PROFILE.cycleTrackingEnabled||!PROFILE.lastPeriodDate)return null;
  const last=new Date(PROFILE.lastPeriodDate);
  const today=new Date();
  last.setHours(0,0,0,0);today.setHours(0,0,0,0);
  const daysDiff=Math.floor((today-last)/(1000*60*60*24));
  if(daysDiff<0)return null;
  const len=PROFILE.cycleLength||28;
  return (daysDiff%len)+1;
}

function getCurrentCyclePhase(){
  const day=getCurrentCycleDay();
  if(day===null)return null;
  const len=PROFILE.cycleLength||28;
  // Standard 4-fase mapping (skaleret til cyklus-længde)
  if(day<=5)return CYCLE_PHASES.find(p=>p.id==='menstrual');
  if(day<=Math.floor(len*0.46))return CYCLE_PHASES.find(p=>p.id==='follicular');
  if(day<=Math.floor(len*0.57))return CYCLE_PHASES.find(p=>p.id==='ovulation');
  return CYCLE_PHASES.find(p=>p.id==='luteal');
}

// Render kompakt cyklus-pille til dagens detaljer
function rCyclePill(){
  const phase=getCurrentCyclePhase();
  const day=getCurrentCycleDay();
  if(!phase||day===null)return '';
  return `<div class="cycle-pill" onclick="openCycleSettingsModal()">
    <span class="cycle-pill-emo">${phase.emo}</span>
    <span class="cycle-pill-text"><b>Dag ${day}</b> · ${phase.name} fase</span>
    <span class="cycle-pill-tip">${phase.tip}</span>
  </div>`;
}

function rCycleTracker(){
  const today=todayISO();
  const cur=CYCLE[today]?.phase||null;
  const curObj=CYCLE_PHASES.find(p=>p.id===cur);
  let h=`<div class="cycle-section">
    <div class="cycle-title">🌸 Cyklus i dag</div>
    <div class="cycle-sub">Energi & styrke svinger med cyklusen — log fasen og opdage mønstre over tid</div>
    <div class="cycle-phases">`;
  CYCLE_PHASES.forEach(p=>{
    h+=`<button class="cycle-phase${cur===p.id?' on':''}" onclick="setCyclePhase('${today}','${p.id}')">
      <div class="cp-emo">${p.emo}</div>
      <div class="cp-name">${p.name}</div>
    </button>`;
  });
  h+=`</div>`;
  if(curObj){
    h+=`<div style="font-size:11px;color:#ff6fa8;font-family:'DM Mono',monospace;text-align:center;background:rgba(255,111,168,.08);padding:8px 12px;border-radius:8px;line-height:1.5">💡 ${curObj.tip}</div>`;
  }
  h+=`</div>`;
  return h;
}

function setCyclePhase(date,phase){
  if(!CYCLE[date])CYCLE[date]={};
  if(CYCLE[date].phase===phase){delete CYCLE[date].phase}
  else{CYCLE[date].phase=phase}
  saveCycle();
  render();
}

function rPcosOnboarding(){
  const p=PCOS_PROFILE;
  const bmi=pcosBMI();
  const hasBasicProfile=PROFILE.height&&PROFILE.weight;
  let bmiText='Udfyld personlig profil først for BMI-info',bmiCls='';
  if(bmi){
    if(bmi<18.5){bmiText=`BMI ${bmi} · undervægt — fokus bør være muskelopbygning`;bmiCls='lean'}
    else if(bmi<25){bmiText=`BMI ${bmi} · normal — "lean PCOS" — fokus på hormonel balance`;bmiCls='lean'}
    else if(bmi<30){bmiText=`BMI ${bmi} · let overvægt — moderat fedttab kan hjælpe`;bmiCls='normal'}
    else{bmiText=`BMI ${bmi} · overvægt — strategisk fedttab forbedrer symptomer`;bmiCls='over'}
  }
  return `<div class="pcos-ob">
    <div class="pcos-ob-eyebrow">// PCOS Strong</div>
    <div class="pcos-ob-h1">PCOS-SPECIFIKKE<br>SPØRGSMÅL</div>
    <div class="pcos-ob-sub">3 ekstra spørgsmål kun for PCOS-programmet. Coachen bruger info til empatisk og evidensbaseret rådgivning.</div>

    ${hasBasicProfile?`<div class="pcos-ob-card">
      <div class="pcos-ob-q">📊 Din BMI-status</div>
      <div class="pcos-ob-bmi-result ${bmiCls}">${bmiText}</div>
    </div>`:`<div class="pcos-ob-card" style="background:rgba(255,159,10,.08);border-color:rgba(255,159,10,.3)">
      <div class="pcos-ob-q" style="color:#ff9f0a">⚠️ Mangler basis-profil</div>
      <div class="pcos-ob-hint">Udfyld først din personlige profil (køn, alder, højde, vægt) for at få BMI-baseret rådgivning.</div>
      <button class="pob-primary" style="background:#ff9f0a;color:#000;width:100%;margin-top:8px" onclick="openProfileModal()">📋 Udfyld personlig profil</button>
    </div>`}

    <div class="pcos-ob-card">
      <div class="pcos-ob-q">🎯 Primært PCOS-mål</div>
      <div class="pcos-ob-hint">Hvad er vigtigst for dig lige nu? Dette styrer hvordan coachen og programmet vægter sit fokus.</div>
      <div class="pcos-ob-options">
        <div class="pcos-ob-opt${p.goal==='balance'?' on':''}" onclick="setPcosOb('goal','balance')"><span class="ob-emo">⚖️</span>Hormonel<br>balance</div>
        <div class="pcos-ob-opt${p.goal==='weightloss'?' on':''}" onclick="setPcosOb('goal','weightloss')"><span class="ob-emo">📉</span>Vægttab</div>
        <div class="pcos-ob-opt${p.goal==='fertility'?' on':''}" onclick="setPcosOb('goal','fertility')"><span class="ob-emo">🌱</span>Fertilitet</div>
        <div class="pcos-ob-opt${p.goal==='health'?' on':''}" onclick="setPcosOb('goal','health')"><span class="ob-emo">💪</span>Generel<br>sundhed</div>
      </div>
    </div>

    <div class="pcos-ob-card">
      <div class="pcos-ob-q">🌸 Cyklus-status</div>
      <div class="pcos-ob-hint">Mange med PCOS har uregelmæssig eller manglende cyklus — det er almindeligt og påvirker hvordan vi tilpasser intensitet.</div>
      <div class="pcos-ob-options" style="grid-template-columns:1fr 1fr 1fr">
        <div class="pcos-ob-opt${p.cycleStatus==='regular'?' on':''}" onclick="setPcosOb('cycleStatus','regular')"><span class="ob-emo">✅</span>Regelmæssig</div>
        <div class="pcos-ob-opt${p.cycleStatus==='irregular'?' on':''}" onclick="setPcosOb('cycleStatus','irregular')"><span class="ob-emo">〰️</span>Uregelmæssig</div>
        <div class="pcos-ob-opt${p.cycleStatus==='absent'?' on':''}" onclick="setPcosOb('cycleStatus','absent')"><span class="ob-emo">⏸️</span>Ingen / udebliver</div>
      </div>
    </div>

    <div class="pcos-ob-card">
      <div class="pcos-ob-q">💊 PCOS-medicin?</div>
      <div class="pcos-ob-hint">Tager du medicin relateret til PCOS (Metformin, p-piller, Inositol osv.)? Coachen bruger info til at give relevant rådgivning.</div>
      <div class="pcos-ob-options" style="grid-template-columns:1fr 1fr 1fr">
        <div class="pcos-ob-opt${p.onMedication==='yes'?' on':''}" onclick="setPcosOb('onMedication','yes')"><span class="ob-emo">💊</span>Ja</div>
        <div class="pcos-ob-opt${p.onMedication==='no'?' on':''}" onclick="setPcosOb('onMedication','no')"><span class="ob-emo">🚫</span>Nej</div>
        <div class="pcos-ob-opt${p.onMedication==='private'?' on':''}" onclick="setPcosOb('onMedication','private')"><span class="ob-emo">🔒</span>Privat</div>
      </div>
    </div>

    <div class="pcos-ob-actions">
      <button class="pob-primary" onclick="completePcosProfile()">✓ Færdig — start program</button>
      <button class="pob-skip" onclick="skipPcosProfile()">Spring over (kan udfyldes senere)</button>
    </div>
  </div>`;
}

function setPcosOb(field,val){
  if(PCOS_PROFILE[field]===val){delete PCOS_PROFILE[field]}
  else{PCOS_PROFILE[field]=val}
  savePcosProfile();
  const modalContent=document.getElementById('profileModalContent');
  if(modalContent){openPcosProfileModal()}
  else{render()}
}

function updatePcosOb(){
  const h=parseInt(document.getElementById('pobHeight')?.value);
  const w=parseFloat(document.getElementById('pobWeight')?.value);
  if(!isNaN(h)&&h>=120&&h<=220)PCOS_PROFILE.height=h;
  if(!isNaN(w)&&w>=30&&w<=200)PCOS_PROFILE.weight=w;
  savePcosProfile();
  // Bare opdater BMI-result, ikke hele render (input ville miste fokus)
  const bmi=pcosBMI();
  const el=document.getElementById('pobBmiResult');
  if(el){
    el.classList.remove('lean','normal','over');
    if(bmi){
      if(bmi<18.5){el.textContent=`BMI ${bmi} · undervægt — fokus bør være muskelopbygning`;el.classList.add('lean')}
      else if(bmi<25){el.textContent=`BMI ${bmi} · normal — "lean PCOS" — fokus på hormonel balance`;el.classList.add('lean')}
      else if(bmi<30){el.textContent=`BMI ${bmi} · let overvægt — moderat fedttab kan hjælpe`;el.classList.add('normal')}
      else{el.textContent=`BMI ${bmi} · overvægt — strategisk fedttab forbedrer symptomer`;el.classList.add('over')}
    }else{
      el.textContent='Indtast højde + vægt for at beregne BMI';
    }
  }
}

function completePcosProfile(){
  PCOS_PROFILE.completed=true;
  savePcosProfile();
  closeModal();
  toast('✓ Tak — programmet er nu tilpasset dig');
  render();
}

function skipPcosProfile(){
  PCOS_PROFILE.completed=true;
  PCOS_PROFILE.skipped=true;
  savePcosProfile();
  closeModal();
  render();
}

function rBodyGraph(){
  const pts=[],fatPts=[];
  for(let w=1;w<=TW();w++){
    const b=BODY[w]||{};
    pts.push(b.kg?b.kg:null);
    fatPts.push(b.fat?b.fat:null);
  }
  const kgFilled=pts.filter(v=>v!==null);
  const fatFilled=fatPts.filter(v=>v!==null);
  const hasKg=kgFilled.length>=2,hasFat=fatFilled.length>=2;
  if(!hasKg&&!hasFat)return'<div class="body-graph"><div class="body-graph-title">Vægt & Fedt Trend</div><div class="body-graph-sub" style="color:var(--mut2)">Tilføj mindst 2 ugers data for at se trend</div></div>';

  const W2=340,H2=180,pl=46,pr=14,pt2=20,pb=30;
  const iw=W2-pl-pr,ih=H2-pt2-pb;
  function px(w){return pl+((w-1)/7)*iw}

  let svg=`<svg viewBox="0 0 ${W2} ${H2}" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:10px">`;
  svg+=`<rect width="${W2}" height="${H2}" fill="#0c0c0e" rx="10"/>`;

  // Grid
  for(let i=0;i<=4;i++){const y=pt2+(ih/4)*i;svg+=`<line x1="${pl}" y1="${y}" x2="${W2-pr}" y2="${y}" stroke="#ffffff06" stroke-width="1"/>`;}
  for(let w=1;w<=TW();w++)svg+=`<text x="${px(w)}" y="${H2-8}" text-anchor="middle" font-size="9" fill="#48484a" font-family="DM Mono,monospace">${w}</text>`;
  svg+=`<text x="${W2/2}" y="${H2-1}" text-anchor="middle" font-size="7" fill="#38383a" font-family="DM Mono,monospace">UGE</text>`;

  // Draw kg line (blue)
  if(hasKg){
    const maxV=Math.max(...kgFilled),minV=Math.min(...kgFilled);
    const range=Math.max(maxV-minV,2),padV=range*.25;
    function pyKg(v){return pt2+ih-(((v-(minV-padV))/(range+2*padV))*ih)}
    let pathD='',dots=[];
    for(let w=1;w<=TW();w++){if(pts[w-1]!==null){const x=px(w),y=pyKg(pts[w-1]);pathD+=(dots.length===0?'M':'L')+x+','+y;dots.push({x,y,v:pts[w-1]})}}
    svg+=`<path d="${pathD}" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    dots.forEach(d=>{
      svg+=`<circle cx="${d.x}" cy="${d.y}" r="4" fill="#0a84ff" stroke="#0c0c0e" stroke-width="2"/>`;
      svg+=`<text x="${d.x}" y="${d.y-9}" text-anchor="middle" font-size="8" fill="#0a84ff" font-family="DM Mono,monospace" font-weight="500">${d.v}</text>`;
    });
  }

  // Draw fat% line (purple)
  if(hasFat){
    const maxF=Math.max(...fatFilled),minF=Math.min(...fatFilled);
    const rangeF=Math.max(maxF-minF,2),padF=rangeF*.25;
    function pyFat(v){return pt2+ih-(((v-(minF-padF))/(rangeF+2*padF))*ih)}
    let pathF='',dotsF=[];
    for(let w=1;w<=TW();w++){if(fatPts[w-1]!==null){const x=px(w),y=pyFat(fatPts[w-1]);pathF+=(dotsF.length===0?'M':'L')+x+','+y;dotsF.push({x,y,v:fatPts[w-1]})}}
    svg+=`<path d="${pathF}" fill="none" stroke="#bf5af2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 3"/>`;
    dotsF.forEach(d=>{
      svg+=`<circle cx="${d.x}" cy="${d.y}" r="3.5" fill="#bf5af2" stroke="#0c0c0e" stroke-width="2"/>`;
      svg+=`<text x="${d.x}" y="${d.y+14}" text-anchor="middle" font-size="8" fill="#bf5af2" font-family="DM Mono,monospace">${d.v}%</text>`;
    });
  }
  svg+='</svg>';

  // Summary stats
  const kgChange=hasKg?Math.round((kgFilled[kgFilled.length-1]-kgFilled[0])*10)/10:null;
  const fatChange=hasFat?Math.round((fatFilled[fatFilled.length-1]-fatFilled[0])*10)/10:null;

  let h=`<div class="body-graph">
    <div class="body-graph-title">Vægt & Fedt Trend</div>
    <div class="body-graph-sub">
      ${hasKg?`<span style="color:#0a84ff">● Vægt${kgChange!==null?' ('+(kgChange>=0?'+':'')+kgChange+' kg)':''}</span> `:''}
      ${hasFat?`<span style="color:#bf5af2">● Fedt%${fatChange!==null?' ('+(fatChange>=0?'+':'')+fatChange+'%)':''}</span>`:''}
    </div>
    ${svg}
  </div>`;
  return h;
}

function rBodyCompare(){
  // Find first and last week with progress photos
  let first=null,last=null;
  for(let w=1;w<=TW();w++){if(BODY[w]?.photoBody){if(!first)first=w;last=w;}}
  if(!first||first===last)return'';

  const fb=BODY[first],lb=BODY[last];
  return `<div class="body-compare">
    <div class="body-compare-title">📸 Før & Nu</div>
    <div class="body-compare-grid">
      <div class="body-compare-card">
        <div class="bcc-label">Uge ${first}</div>
        <div class="bcc-img"><img src="${fb.photoBody}" alt="Uge ${first}"></div>
        <div class="bcc-stats">${fb.kg?fb.kg+' kg':''}${fb.kg&&fb.fat?' · ':''}${fb.fat?fb.fat+'%':''}</div>
      </div>
      <div class="body-compare-card">
        <div class="bcc-label">Uge ${last}</div>
        <div class="bcc-img"><img src="${lb.photoBody}" alt="Uge ${last}"></div>
        <div class="bcc-stats">${lb.kg?lb.kg+' kg':''}${lb.kg&&lb.fat?' · ':''}${lb.fat?lb.fat+'%':''}</div>
      </div>
    </div>
  </div>`;
}

function rInfo(){
  let h=`<div class="page-title"><div class="page-eyebrow">// Program & principper</div><div class="page-h1">Info</div></div>`;

  // Kalorie/protein-mål (kun hvis profil er udfyldt)
  const tdee=calcTDEE(),target=calcCalorieTarget(),protein=calcProteinTarget();
  if(tdee&&target){
    const tpl=TEMPLATES[PROG.template||'recomp'];
    const diff=target-tdee;
    const diffStr=diff===0?'Vedligehold':(diff>0?'+'+diff:diff)+' kcal';
    const diffColor=diff===0?'var(--blue)':diff>0?'var(--grn)':'#ff9f0a';
    h+=`<div class="vol-section" style="background:linear-gradient(135deg,rgba(48,209,88,.06),rgba(10,132,255,.06));border-color:rgba(48,209,88,.3)">
      <div class="vol-title">📊 Dine ernærings-mål</div>
      <div class="vol-sub">Beregnet ud fra din profil og programmet ${tpl?.emo||''} ${tpl?.name||''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px;text-align:center">
          <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--mut);margin-bottom:4px">DAGLIGE KALORIER</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--acc);line-height:1">${target.toLocaleString('da-DK')}</div>
          <div style="font-size:11px;color:${diffColor};font-family:'DM Mono',monospace;margin-top:4px;font-weight:600">${diffStr}</div>
          <div style="font-size:9px;color:var(--mut2);font-family:'DM Mono',monospace;margin-top:2px">TDEE: ${tdee.toLocaleString('da-DK')}</div>
        </div>
        ${protein?`<div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px;text-align:center">
          <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--mut);margin-bottom:4px">DAGLIGT PROTEIN</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--red);line-height:1">${protein} g</div>
          <div style="font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:4px">${(protein/PROFILE.weight).toFixed(1)} g/kg</div>
        </div>`:''}
      </div>
      <div style="font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;line-height:1.5;text-align:center">
        Beregning bruger Mifflin-St Jeor (TDEE) × moderat aktivitet (1.55).<br>Justér i profil hvis aktivitetsniveau er anderledes.
      </div>
    </div>`;
  }else if(!PROFILE.completed||PROFILE.skipped||!PROFILE.height||!PROFILE.weight||!PROFILE.age||!PROFILE.gender){
    // Banner: opfordring til at udfylde profil
    h+=`<div style="background:rgba(255,159,10,.08);border:1px solid rgba(255,159,10,.3);border-radius:var(--r);padding:14px;margin-bottom:16px;display:flex;gap:12px;align-items:center">
      <div style="font-size:24px">📋</div>
      <div style="flex:1">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:15px;color:#ff9f0a;letter-spacing:.3px">Få personlige kalorie-mål</div>
        <div style="font-size:11px;color:var(--mut);line-height:1.5;margin-top:2px">Udfyld personlig profil — så beregner appen TDEE og daglige kalorie/protein-mål.</div>
      </div>
      <button class="prog-btn" style="font-size:10px;padding:8px 14px;min-height:36px" onclick="openProfileModal()">Udfyld</button>
    </div>`;
  }

  // Faser
  h+=`<div class="section-label">💪 Gym-faser</div>`;
  GP.forEach((p,i)=>{
    h+=`<div class="phcard" style="--pc:${p.color}">
      <div class="ph-num-wrap"><div class="ph-num">${i+1}</div><div class="ph-weeks">${phaseLabel(i)}</div></div>

        <div class="ph-label" style="color:${p.color}">${p.name.toUpperCase()}</div>

  h+='<div class="rgrid">';

    h+=`<div class="rc" style="--rc:${r.c}">
      <span class="rc-icon">${r.i}</span>
      <div class="rc-title">${r.t.toUpperCase()}</div>
      <div class="rc-body">${r.b}</div>
    </div>`;
  });
  h+='</div>';

  // Backup
  h+=`<div class="backup-section">
    <div class="backup-title">💾 Backup & gendan</div>
    <div class="backup-sub">Download alle dine data som JSON-fil. Hvis Safari-cachen ryddes eller du skifter telefon, kan du importere filen og få det hele tilbage.</div>
    <div class="backup-btns">

      <input type="file" id="importFile" accept=".json,application/json" onchange="importData(this)">
    </div>
  </div>`;
  return h;
}

// Swipe mellem Coach og Krop
let coachSwipeX=null,coachSwipeY=null,coachSwipeTime=0;
function coachSwipeStart(e){
  const t=e.target;
  if(t.tagName==='INPUT'||t.tagName==='BUTTON'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.tagName==='A')return;
  coachSwipeX=e.touches[0].clientX;
  coachSwipeY=e.touches[0].clientY;
  coachSwipeTime=Date.now();
}
function coachSwipeMove(e){
  if(coachSwipeX===null)return;
  const dy=e.touches[0].clientY-coachSwipeY;
  const dx=e.touches[0].clientX-coachSwipeX;
  if(Math.abs(dy)>Math.abs(dx)){coachSwipeX=null;return}
}
function coachSwipeEnd(e){
  if(coachSwipeX===null)return;
  const dx=(e.changedTouches?.[0]?.clientX||0)-coachSwipeX;
  const elapsed=Date.now()-coachSwipeTime;
  const isSwipe=Math.abs(dx)>60||(Math.abs(dx)>30&&elapsed<200);
  if(isSwipe){
    const order=['coach','cal','body'];
    const i=order.indexOf(coachSubView);
    if(dx<0&&i<order.length-1){coachSubView=order[i+1];render()}
    else if(dx>0&&i>0){coachSubView=order[i-1];render()}
  }
  coachSwipeX=null;coachSwipeY=null;
}

// Build context summary of all training data
function buildTrainingContext(){
  // === DATO & DAGENS TRÆNING ===
  const now=new Date();
  const todayStr=now.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const todayIdx=todayDayIdx();
  const todayD=D[todayIdx];
  const cw=currentWeek();
  const programDone=isProgramDone();

  let ctx='';

  // === TRÆNINGSSTIL ===
  if(PROG.flexMode){
    const cw=flexCurrentWeek();
    const pending=getPendingSessions(cw);
    ctx+='=== TRÆNINGSSTIL ===\n';
    ctx+=`Flex-mode aktiveret: Brugeren træner når hun/han har tid, ikke på faste ugedage.\n`;
    ctx+=`Status: Uge ${cw} · ${pending.length} sessions tilbage\n\n`;
  }

  // === PERSONLIG PROFIL (vises altid hvis udfyldt) ===
  if(PROFILE.completed&&!PROFILE.skipped){
    ctx+='=== PERSONLIG PROFIL ===\n';
    if(PROFILE.gender&&PROFILE.gender!=='private'){ctx+=`Køn: ${PROFILE.gender==='male'?'Mand':'Kvinde'}\n`}
    if(PROFILE.age)ctx+=`Alder: ${PROFILE.age} år\n`;
    if(PROFILE.height)ctx+=`Højde: ${PROFILE.height} cm\n`;
    if(PROFILE.weight)ctx+=`Vægt: ${PROFILE.weight} kg\n`;
    const bmi=pcosBMI();
    if(bmi)ctx+=`BMI: ${bmi}\n`;
    if(PROFILE.goalWeight)ctx+=`Mål-vægt: ${PROFILE.goalWeight} kg\n`;
    if(PROFILE.experience){
      const exMap={beginner:'Begynder (<1 år)',some:'Mellem (1-3 år)',experienced:'Erfaren (3+ år)'};
      ctx+=`Erfaring: ${exMap[PROFILE.experience]||PROFILE.experience}\n`;
    }
    if(PROFILE.injuries)ctx+=`Skader/begrænsninger: ${PROFILE.injuries}\n`;
    const ia=activeInjuries();
    if(ia.length){
      ctx+=`Markerede skadesområder: ${ia.map(k=>(INJURY_AREAS[k]||{}).label||k).join(', ')} — appen har allerede byttet de mest belastende øvelser til skånsomme varianter. Foreslå ALDRIG at gå tilbage til de originale øvelser, og anbefal professionel hjælp ved vedvarende smerte.\n`;
    }
    const tdee=calcTDEE(),target=calcCalorieTarget(),protein=calcProteinTarget();
    if(tdee)ctx+=`TDEE: ${tdee} kcal\n`;
    if(target)ctx+=`Anbefalede daglige kalorier: ${target} kcal\n`;
    if(protein)ctx+=`Anbefalet protein: ${protein} g/dag\n`;
    // Cyklus-info hvis aktiveret (kun kvinder)
    if(PROFILE.gender==='female'&&PROFILE.cycleTrackingEnabled&&PROFILE.lastPeriodDate){
      const day=getCurrentCycleDay();
      const phase=getCurrentCyclePhase();
      if(day&&phase){
        ctx+=`Cyklus: Dag ${day}/${PROFILE.cycleLength||28} · ${phase.name} fase\n`;
        ctx+=`  → ${phase.tip}\n`;
        ctx+='  Bemærk: Individuelle forskelle er store. Spørg brugeren hvordan hun konkret oplever fasen.\n';
      }
    }
    ctx+='\n';
  }

  ctx+='=== I DAG ===\n';
  ctx+=`Dato: ${todayStr}\n`;
  ctx+=`Dagens dag: ${todayD.full} – ${todayD.type} (${todayD.label})\n`;
  if(todayD.run){
    ctx+=`Dagens træning: ${todayD.run.type} – ${todayD.run.dur} @ ${todayD.run.pace}. ${todayD.run.tip}\n`;
  }else if(todayD.ex){
    const exs=dayEx(todayD);
    ctx+=`Dagens øvelser: ${exs.map(e=>e.n).join(', ')}\n`;
    // Vis hvad brugeren løftede sidste uge for at hjælpe coach foreslå vægte
    if(cw>=2&&cw<=TW()){
      const prevW=cw-1;
      const prevWeights=exs.filter(e=>!e.core).map(e=>{
        const v=gw(prevW,todayD.full,e.n);return v?`${e.n}: ${v} kg`:null;
      }).filter(Boolean);
      if(prevWeights.length)ctx+=`Sidste uge (uge ${prevW}) på denne dag: ${prevWeights.join(', ')}\n`;
    }
  }else{
    ctx+=`Dagens træning: Hvile (restitution).\n`;
  }
  if(PROG.startDate){
    ctx+=`Program startdato: ${fmtDate(PROG.startDate)}\n`;
    if(programDone){
      ctx+=`STATUS: Programmet er FÆRDIGT – brugeren har gennemført hele programmet! Foreslå hvad de skal nu (nyt forløb, nye mål, deload, etc).\n`;
    }else{
      ctx+=`Programuge: ${cw} af ${TW()} (${GP[gymPhase(cw)].name}-fase)\n`;
      if(isDeload(cw))ctx+=`VIGTIGT: Uge ${cw} er en planlagt DELOAD-uge (~40% færre sæt, kortere løb, 60-70% vægt). Det er meningen — pres ikke brugeren til mere volumen denne uge.\n`;
      ctx+=`5km mål: ${fmtSec(PROG.start5kSec||2100)} → under ${fmtSec(goal5kSec())} på ${TW()} uger\n`;
    }
  }else{
    ctx+=`Program ikke startet endnu (ingen startdato sat).\n`;
    ctx+=`Estimeret aktuel uge (fra data): ${cw}\n`;
  }

  // === PROGRAM ===
  ctx+=`\n=== TRÆNINGSPROGRAM ===\n`;
  ctx+=`${TW()}-ugers Recomp + 5km løb. Start: ${fmtSec(PROG.start5kSec||2100)}, mål: under ${fmtSec(goal5kSec())}.\n`;
  ctx+='Ugentligt skema:\n';
  D.forEach(d=>{
    const exs=dayEx(d);
    if(exs){
      ctx+=`  ${d.full} (${d.type}): ${exs.map(e=>e.n).join(', ')}\n`;
    }else if(d.run){
      ctx+=`  ${d.full} (${d.type}): ${d.run.dur} @ ${d.run.pace}\n`;
    }else{
      ctx+=`  ${d.full}: Hvile\n`;
    }
  });
  ctx+='\nFaser:\n';
  GP.forEach((p,i)=>{
    ctx+=`  ${phaseLabel(i)} – ${p.name}: compound ${p.c.s} sæt × ${p.c.r}, isolation ${p.i.s} sæt × ${p.i.r} (${p.tip})\n`;
  });
  PH.forEach((p,i)=>{
    ctx+=`  ${phaseLabel(i)} – Løb ${p.l}: Tir ${p.wd}, Fre ${p.sa}, Mål ${p.g}\n`;
  });

  ctx+='\n=== LOGGEDE DATA ===\n';
  let anyData=false;
  for(let w=1;w<=TW();w++){
    let weekData='';
    D.forEach(d=>{
      const exs=dayEx(d);
      if(exs){
        exs.filter(e=>!e.core).forEach(e=>{
          const v=gw(w,d.full,e.n);
          if(v){weekData+=`  ${d.full} ${e.n}: ${v} kg\n`;anyData=true}
          const hv=gw(w,d.full,'HOME__'+e.n);
          if(hv){weekData+=`  ${d.full} ${e.n} (HJEMME-version): ${hv} kg\n`;anyData=true}
        });
      }else if(d.run){
        const tid=gw(w,d.full,'tid'),pace=gw(w,d.full,'pace'),km=gw(w,d.full,'km'),note=gw(w,d.full,'note');
        if(tid||pace||km){
          weekData+=`  ${d.full} løb: tid=${tid||'-'}, pace=${pace||'-'}, km=${km||'-'}`;
          if(note)weekData+=`, noter: "${note}"`;
          weekData+='\n';
          anyData=true;
        }
      }
    });
    if(weekData)ctx+=`Uge ${w}:\n${weekData}`;
  }
  if(!anyData)ctx+='(Ingen data logget endnu)\n';

  // Custom exercises
  const allCust=Object.entries(CUSTOM).filter(([_,arr])=>arr&&arr.length);
  if(allCust.length){
    ctx+='\n=== TILFØJEDE ØVELSER ===\n';
    allCust.forEach(([day,arr])=>{
      ctx+=`${day}: ${arr.map(e=>e.n).join(', ')}\n`;
    });
  }

  // Mobility-sessioner
  if(typeof MOB!=='undefined'&&MOB.log&&MOB.log.length){
    ctx+=`\n=== MOBILITY ===\nGennemførte mobility-sessioner: ${MOB.log.length} (seneste: ${MOB.log.slice(-3).map(k=>k.replace('__',' – ')).join(', ')})\n`;
  }
  // Dagens kalorier/makroer
  if(typeof CAL!=='undefined'&&calToday().items.length){
    const t=calorieTargets(),tot=calTotals();
    ctx+=`\n=== KALORIER I DAG ===\n${tot.kcal}/${t.kcal} kcal · Protein ${Math.round(tot.p)}/${t.protein}g · Kulhydrat ${Math.round(tot.c)}/${t.carbs}g · Fedt ${Math.round(tot.f)}/${t.fat}g (${t.label})\n`;
  }

  // Kropsdata
  const bodyEntries=Object.entries(BODY).filter(([_,v])=>v.kg||v.fat).sort((a,b)=>a[0]-b[0]);
  if(bodyEntries.length){
    ctx+='\n=== KROPSDATA ===\n';
    bodyEntries.forEach(([w,v])=>{
      ctx+=`Uge ${w}: ${v.kg?v.kg+' kg':''}${v.kg&&v.fat?' · ':''}${v.fat?v.fat+'% fedt':''}${v.date?' ('+v.date+')':''}\n`;
    });
    // Beregn ændringer
    const first=bodyEntries[0][1],last=bodyEntries[bodyEntries.length-1][1];
    if(bodyEntries.length>=2){
      if(first.kg&&last.kg){const d=Math.round((last.kg-first.kg)*10)/10;ctx+=`Vægtændring: ${d>=0?'+':''}${d} kg\n`}
      if(first.fat&&last.fat){const d=Math.round((last.fat-first.fat)*10)/10;ctx+=`Fedtændring: ${d>=0?'+':''}${d}%\n`}
    }
  }

  // Øvelse-noter på tværs af de seneste 4 uger (vigtigt for kontinuerlig coaching)
  const cwForNotes=currentWeek();
  const noteEntries=[];
  for(let w=Math.max(1,cwForNotes-3);w<=Math.min(TW(),cwForNotes);w++){
    D.filter(d=>d.ex).forEach(d=>{
      dayEx(d).filter(e=>!e.core).forEach(e=>{
        const note=getExerciseNote(w,d.full,e.n);
        if(note&&note.trim()){
          noteEntries.push(`Uge ${w} · ${d.full} · ${e.n}: ${note.trim().substring(0,150)}`);
        }
      });
    });
  }
  if(noteEntries.length){
    ctx+='\n=== ØVELSE-NOTER (sidste 4 uger) ===\n';
    ctx+=noteEntries.join('\n')+'\n';
  }

  // PCOS-relevant data: profil, skridt og cyklus
  const tpl=TEMPLATES[PROG.template||'recomp'];
  if(tpl?.needsSteps){
    if(PCOS_PROFILE.completed&&!PCOS_PROFILE.skipped){
      ctx+='\n=== PCOS PROFIL ===\n';
      const bmi=pcosBMI();
      if(bmi)ctx+=`BMI: ${bmi}${bmi<25?' (lean PCOS)':bmi<30?' (let overvægt)':' (overvægt)'}\n`;
      if(PCOS_PROFILE.height)ctx+=`Højde: ${PCOS_PROFILE.height} cm\n`;
      if(PCOS_PROFILE.weight)ctx+=`Vægt: ${PCOS_PROFILE.weight} kg\n`;
      if(PCOS_PROFILE.goal)ctx+=`Mål: ${PCOS_PROFILE.goal}\n`;

    }
    const recentSteps=Object.entries(STEPS).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,7);
    if(recentSteps.length){
      ctx+='\n=== SKRIDT (sidste 7 dage) ===\n';
      const goal=tpl.dailyStepsGoal||8000;
      recentSteps.forEach(([d,s])=>{ctx+=`${d}: ${s.toLocaleString('da-DK')} skridt${s>=goal?' ✓':' ('+(goal-s)+' under mål)'}\n`});

        if(phase)ctx+=`${d}: ${phase.name}\n`;
      });
    }
  }

  return ctx;
}

async function callClaude(userMessage){
  if(!AI.apiKey)throw new Error('Indtast først din API-nøgle i indstillinger.');

  const ctx=buildTrainingContext();

  // Byg Gemini "contents"-format. Gemini bruger 'model' som rolle for assistant,
  // og 'parts:[{text}]' i stedet for content-strings.
  const contents=[];
  const recent=AI.messages.slice(-10);
  recent.forEach(m=>{
    contents.push({
      role:m.role==='assistant'?'model':'user',
      parts:[{text:m.content}]
    });
  });
  // Tilføj den nye besked med kontekst
  contents.push({
    role:'user',
    parts:[{text:`<træningsdata>\n${ctx}\n</træningsdata>\n\n${userMessage}`}]
  });

  const model=AI.model||'gemini-2.5-flash';
  // Fallback-kæde: nogle nøgler/konti mangler enkelte modeller (Google svarer 404).
  // Prøv automatisk ældre søster-modeller og husk den der virker.
  const candidates=geminiCandidates(AI.workingModel||model);
  let res=null,usedModel=model,lastErr='';
  const sysText=getSystemPrompt()+'\n\nSVAR ALTID PÅ DANSK — aldrig engelsk, heller ikke delvist. Hold svar under ~350 ord så de aldrig afkortes. Vis ALDRIG din tænkeproces, udkast, planlægning eller meta-noter (fx "Drafting the response") — lever KUN det færdige svar.';
  async function tryCoach(cand,withThinking){
    const is25=cand.startsWith('gemini-2.5')||cand.endsWith('-latest');
    const gen={maxOutputTokens:4096,temperature:1};
    if(is25&&withThinking)gen.thinkingConfig={thinkingBudget:0};
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cand)}:generateContent`;
    return fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':AI.apiKey},
      body:JSON.stringify({contents,systemInstruction:{parts:[{text:sysText}]},generationConfig:gen})
    });
  }
  for(const cand of candidates){
    res=await tryCoach(cand,true);
    usedModel=cand;
    if(res.ok)break;
    let em='';try{const ej=await res.clone().json();em=ej?.error?.message||''}catch(e){}
    const eml=em.toLowerCase();
    // "invalid argument"? Prøv samme model uden thinkingConfig før vi opgiver
    if(res.status===400&&eml.includes('invalid argument')){
      const r2=await tryCoach(cand,false);
      if(r2.ok){res=r2;break}
      let em2='';try{const ej2=await r2.clone().json();em2=ej2?.error?.message||''}catch(e){}
      lastErr=em2||em;res=r2;
    }else{lastErr=em}
    const l=lastErr.toLowerCase();
    if(res.status===404||l.includes('not found'))markBadModel(cand);
    const modelMissing=res.status===404||(res.status===400&&(l.includes('model')||l.includes('invalid')||l.includes('not found')));
    if(!modelMissing)break;
  }
  // Husk fungerende model så vi ikke prøver kæden hver gang
  if(res.ok&&usedModel!==AI.workingModel){AI.workingModel=usedModel;saveAI()}

  if(!res.ok){
    let errMsg=`API fejl ${res.status}`,errJson=null;
    try{errJson=await res.json();errMsg=errJson?.error?.message||lastErr||errMsg;}catch(e){if(lastErr)errMsg=lastErr}
    if(res.status===400&&errMsg.toLowerCase().includes('api key'))errMsg='Ugyldig API-nøgle. Tjek din nøgle i indstillinger.';
    else if(res.status===403)errMsg='Adgang nægtet ('+errMsg.slice(0,120)+'). Har nøglen en website-restriktion, skal den være: d5j9m87p5h-gif.github.io/* — eller sæt den til "None".';
    else if(res.status===429)errMsg=geminiRateMsg(errJson);
    else if(res.status===404||(res.status===400&&errMsg.toLowerCase().includes('model')))errMsg='Ingen af Gemini-modellerne er tilgængelige på din nøgle. Google siger: "'+(errMsg.slice(0,140))+'". Prøv at oprette en ny nøgle på aistudio.google.com.';
    else if(res.status===503)errMsg='Google har midlertidig overbelastning. Prøv igen om et øjeblik.';
    throw new Error(errMsg);
  }

  const data=await res.json();
  // Gemini-svar: data.candidates[0].content.parts[0].text
  const candidate=data?.candidates?.[0];
  if(!candidate)throw new Error('Tomt svar fra Gemini. Prøv igen.');
  if(candidate.finishReason==='SAFETY')throw new Error('Svaret blev blokeret af Geminis sikkerhedsfilter.');
  // Filtrér "thinking"-dele fra (2.5-modeller kan inkludere dem)
  let text=(candidate.content?.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('\n').trim();
  if(!text)throw new Error('Tomt tekstsvar — modellen returnerede intet.');
  // Blev svaret afkortet? Sig det ærligt i stedet for at stoppe midt i en sætning
  if(candidate.finishReason==='MAX_TOKENS'){
    text+='\n\n*…(svaret blev for langt og er afkortet — skriv **"fortsæt"** for resten)*';
  }
  return text;
}

async function sendAIMessage(custom){
  if(aiBusy)return;
  const inp=document.getElementById('aiInput');
  const userMsg=custom||inp.value.trim();
  if(!userMsg)return;
  if(!AI.apiKey){toast('Tilføj først API-nøgle');return}

  AI.messages.push({role:'user',content:userMsg});
  if(!custom)inp.value='';
  saveAI();
  aiBusy=true;
  renderChat();
  showTyping();

  try{
    const reply=await callClaude(userMsg);
    AI.messages.push({role:'assistant',content:reply});
    saveAI();
  }catch(e){
    showAIError(e.message||'Ukendt fejl');
    AI.messages.pop(); // remove user msg on error so they can try again
    saveAI();
  }finally{
    aiBusy=false;
    hideTyping();
    renderChat();
  }
}

function md2html(text){
  let s=escHtml(text);
  // Code
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // Bold + italic
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
  // Bullet lists
  s=s.replace(/^[ \t]*[-•*][ \t]+(.+)$/gm,'<li>$1</li>');
  // Numbered lists
  s=s.replace(/^[ \t]*\d+\.[ \t]+(.+)$/gm,'<li>$1</li>');
  // Wrap consecutive <li>s in <ul>
  s=s.replace(/(<li>[\s\S]*?<\/li>(?:\s*<li>[\s\S]*?<\/li>)*)/g,m=>'<ul>'+m+'</ul>');
  s=s.replace(/<\/ul>\s*<ul>/g,'');
  // Paragraphs from double newlines
  const blocks=s.split(/\n{2,}/);
  return blocks.map(b=>{
    b=b.trim();
    if(!b)return'';
    if(b.startsWith('<ul>')||b.startsWith('<li>'))return b;
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

        <a class="lc-btn video" href="${e.l}" target="_blank">▶ Video</a>
        <button class="lc-btn add" onclick="openAddModal(${idx})">+ Tilføj</button>
      </div>
    </div>`;
  });
  h+=`</div>`;

  // Show summary of custom exercises
  const allCust=Object.entries(CUSTOM).filter(([_,arr])=>arr&&arr.length);
  if(allCust.length){
    h+=`<div class="section-label" style="margin-top:24px">📌 Dine tilføjede øvelser</div>`;
    allCust.forEach(([day,arr])=>{

      arr.forEach(ex=>{

        </div>`;
      });

  return h;

// Swipe-down-to-dismiss på modaler
let modalSwipeStartY=null;
function modalSwipeStart(e){
  modalSwipeStartY=e.touches[0].clientY;
  const c=document.getElementById('profileModalContent');
  if(c)c.style.transition='none';
}
function modalSwipeMove(e){
  if(modalSwipeStartY===null)return;
  const dy=e.touches[0].clientY-modalSwipeStartY;
  if(dy<=0)return;
  const c=document.getElementById('profileModalContent');
  if(c)c.style.transform='translateY('+dy+'px)';
}
function modalSwipeEnd(e){
  if(modalSwipeStartY===null)return;
  const c=document.getElementById('profileModalContent');
  if(!c){modalSwipeStartY=null;return}
  const dy=(e.changedTouches?.[0]?.clientY||0)-modalSwipeStartY;
  c.style.transition='transform .25s cubic-bezier(.34,1.56,.64,1)';
  if(dy>100){
    c.style.transform='translateY(100vh)';
    setTimeout(()=>{closeModal();render()},250);
  }else{
    c.style.transform='translateY(0)';
  }
  modalSwipeStartY=null;
}

/* ═══════════════════════════════════════════════════════════ */
// Muskelgruppe-detection fra øvelsesnavn (simpel heuristik)
/* ── VARIATION: byt øvelser til ligeværdige alternativer ved nyt forløb ──
   Grupperet efter FUNKTION, ikke bare muskelgruppe. Squat → Front Squat
   (begge knæ-dominante), aldrig Squat → Leg Curl. Kun sidestillede varianter. */
const VARIATION_GROUPS=[
  // Knæ-dominant underkrop
  ['Squat','Front Squat','Hack Squat / Benpres','Hack Squat','Goblet Squat','Leg Press'],
  // Hofte-dominant underkrop

  // Unilateralt ben
  ['Walking Lunges','Bulgarian Split Squat','Reverse Lunges','Step-ups','Cossack Squat'],
  // Baglår-isolation
  ['Leg Curl','Leg Curl (liggende)','Seated Leg Curl','Nordic Ham Curl'],
  // Baller
  ['Hip Thrust','Glute Bridge'],
  // Forlår-isolation
  ['Leg Extension','Leg Extensions','Sissy Squat'],
  // Lægge
  ['Calf Raises','Calf Raises (stående)','Calf Raises (siddende)','Seated Calf Raise'],
  // Vandret pres
  ['Bænkpres (flad)','DB Bænkpres','Machine Chest Press','Push-ups','Close-Grip Bench'],
  // Skråt pres
  ['Incline Bænkpres','Incline DB Press','Landmine Press (bryst)','Decline Bænkpres'],
  // Bryst-isolation
  ['Cable Fly','Cable Flyes','Dumbbell Flyes','Pec Deck','Incline Cable Fly'],
  // Lodret træk
  ['Pullups / Lat Pulldown','Pullups','Lat Pulldown','Underhaands Pulldown','Chin-ups'],
  // Vandret træk
  ['Bent-over Rows','Pendlay Row','Seated Cable Row','Kabel Rows','T-Bar Row','Dumbbell Row','Chest-supported Row','Meadows Row'],
  // Lodret pres skulder
  ['Overhead Press','DB Shoulder Press','Arnold Press','Landmine Press (skulder)','Machine Shoulder Press'],
  // Sideskulder
  ['Lateral Raise','Cable Lateral Raise','Front Raise'],
  // Bagskulder
  ['Face Pull','Facepulls','Rear Delt Fly','Cable Rear Delt Fly','Face Pull (høj)'],
  // Biceps
  ['Biceps Curl (stang)','Biceps Curl (DB)','Biceps Curl (kabel)','Cable Curl','Hammer Curl','Incline DB Curl','Preacher Curl','EZ-bar Curl','Spider Curl','Concentration Curl'],
  // Triceps
  ['Triceps Pushdown','Rope Pushdown','Skull Crushers','Overhead Triceps Extension','Overhead Tri Extension','Diamond Push-ups'],
  // Core: anti-ekstension
  ['Planke','Plank','Ab Wheel Rollout','Hollow Hold','Weighted Plank','Dead Bug'],
  // Core: anti-rotation / sider
  ['Side Planke','Side Plank','Pallof Press','Russian Twist','Cable Woodchop','Copenhagen Plank'],
  // Core: fleksion
  ['Cable Crunch','Hanging Leg Raise','Toes-to-bar','Leg Raise']
];
// Findes øvelsen i biblioteket? (så vi ikke bytter til noget uden video/beskrivelse)
function exerciseExists(name){
  return !!libLookup(name);
}
// Find et alternativ til en øvelse — deterministisk ud fra seed, så samme
// forløb altid giver samme skema (ikke nyt hver gang man åbner appen)
function variantFor(name,seed){
  const grp=VARIATION_GROUPS.find(g=>g.indexOf(name)>=0);
  if(!grp)return null;
  // Kandidater: andre i gruppen som findes i biblioteket
  const cands=grp.filter(n=>n!==name&&exerciseExists(n));
  if(!cands.length)return null;
  // Deterministisk valg ud fra navn+seed
  let hash=seed*31;
  for(let i=0;i<name.length;i++)hash=(hash*31+name.charCodeAt(i))>>>0;
  return cands[hash%cands.length];
}
// Basisløft der IKKE byttes væk — de er programmets rygrad og bør bestå
// gennem alle forløb. Variation hører til på assistance-øvelserne.
const VARIATION_PROTECTED=['Squat','Deadlift','Bænkpres (flad)','Overhead Press'];
// Anvend variation på hele programmet: gemmes som almindelige SWAPS_EX
function applyVariation(seed){
  const s=seed||((PROG.variationSeed||0)+1);
  PROG.variationSeed=s;
  let count=0;
  const usedGlobal=new Set(); // undgå samme øvelse to gange i ugen
  // Registrér først alt der bliver stående
  D.filter(d=>d.ex).forEach(d=>d.ex.forEach(e=>{
    if(VARIATION_PROTECTED.indexOf(e.n)>=0)usedGlobal.add(e.n);
  }));
  D.filter(d=>d.ex).forEach(d=>{
    const usedToday=new Set();
    const usedGroups=new Set();
    // Registrér ALLE dagens originale navne først, så en bytning aldrig
    // lander på en øvelse der i forvejen står på dagen
    d.ex.forEach(e=>usedToday.add(e.n));
    d.ex.forEach(e=>{
      if(VARIATION_PROTECTED.indexOf(e.n)>=0){
        usedToday.add(e.n);
        const g0=VARIATION_GROUPS.findIndex(g=>g.indexOf(e.n)>=0);
        if(g0>=0)usedGroups.add(g0);
        return; // basisløft bevares
      }
      const gi=VARIATION_GROUPS.findIndex(g=>g.indexOf(e.n)>=0);
      if(gi<0){usedToday.add(e.n);return}
      // Er gruppen allerede brugt i dag? Så lad øvelsen stå (undgår dublet)
      if(usedGroups.has(gi)){usedToday.add(e.n);return}
      const grp=VARIATION_GROUPS[gi];
      const cands=grp.filter(n=>n!==e.n&&exerciseExists(n)&&!usedToday.has(n)&&!usedGlobal.has(n));
      if(!cands.length){usedToday.add(e.n);usedGroups.add(gi);return}
      let hash=s*31;
      for(let i=0;i<e.n.length;i++)hash=(hash*31+e.n.charCodeAt(i))>>>0;
      const alt=cands[hash%cands.length];
      const libEx=libLookup(alt);
      if(!SWAPS_EX[d.full])SWAPS_EX[d.full]={};
      SWAPS_EX[d.full][e.n]={n:alt,k:e.k,l:libEx?libEx.l:e.l,core:e.core};
      usedToday.add(alt);usedGlobal.add(alt);usedGroups.add(gi);
      count++;
    });
  });
  try{localStorage.setItem(SWK,JSON.stringify(SWAPS_EX))}catch(e){}
  saveProg();
  return count;
}

/* ── NAVNE-ALIAS: programmerne og biblioteket bruger nogle gange lidt
   forskellige navne for samme øvelse. Denne tabel binder dem sammen så
   video, muskel-vælger og bytte-forslag altid finder den rigtige øvelse. */
const EX_ALIAS={
  'Pullups / Lat Pulldown':'Lat Pulldown',
  'Facepulls':'Face Pull',
  'Leg Curl':'Leg Curl (liggende)',
  'Leg Curls':'Leg Curl (liggende)',
  'Leg Curl (siddende)':'Leg Curl (siddende)',
  'Calf Raises':'Calf Raises (stående)',
  'Læghæv':'Calf Raises (stående)',
  'Planke':'Plank',
  'Side Planke':'Side Plank',
  'Kabel Rows':'Seated Cable Row',
  'Rows (maskine/stang)':'Bent-over Rows',
  'Biceps Curl (kabel)':'Cable Curl',
  'Hack Squat / Benpres':'Hack Squat',
  'Leg Extensions':'Leg Extension',
  // Skade-varianter → nærmeste biblioteksøvelse (så video virker)
  'Landmine Press':'Landmine Press (skulder)',
  'Neutral-greb DB pres':'Incline DB Press',
  'Neutral-greb DB skråpres':'Incline DB Press',
  'HIIT-finisher':'Burpees',
  'DB Bænkpres':'Incline DB Press',
  'Cable Lateral Raise (lav vinkel)':'Cable Lateral Raise',
  'Lat Pulldown (neutralt greb)':'Lat Pulldown',
  'Triceps Pushdown (reb, let)':'Rope Pushdown',
  'DB Bænkpres (neutralt greb)':'Incline DB Press',
  'Leg Press (moderat dybde)':'Leg Press',
  'Leg Press (halv bevægelse)':'Leg Press',
  'Box Squat (til parallel)':'Squat',
  'Back Extension (kontrolleret)':'Hyperextension',
  'Glute Bridge (gulv)':'Glute Bridge',
  'Chest-supported Row':'Chest-supported Row'
};
// Slå en øvelse op i biblioteket — prøver alias hvis direkte match fejler
function libLookup(name){
  if(typeof LIB==='undefined'||!Array.isArray(LIB))return null;
  let hit=LIB.find(e=>e&&e.n===name);
  if(hit)return hit;
  const alias=EX_ALIAS[name];
  if(alias){hit=LIB.find(e=>e&&e.n===alias);if(hit)return hit}
  // Sidste forsøg: match uden parentes-tilføjelser og versaler
  const base=String(name).toLowerCase().replace(/\s*\([^)]*\)/g,'').trim();
  return LIB.find(e=>e&&e.n.toLowerCase().replace(/\s*\([^)]*\)/g,'').trim()===base)||null;
}

function guessExerciseMuscle(name){
  const n=name.toLowerCase();
  // VIGTIGT: rækkefølgen betyder alt. Mest specifikke mønstre først, ellers
  // fanger "press" alle skulderpres som bryst, og "curl" alle leg curls som arme.
  if(/(leg curl|ham curl|nordic|leg exten|sissy|adductor|tibialis)/.test(n))return 'legs';
  if(/(lateral raise|side raise|front raise|rear delt|reverse fly|overhead press|ohp|shoulder press|arnold|landmine press \(skulder\)|handstand|dislocate)/.test(n))return 'shoulders';
  if(/(face.?pull|facepull|shrug|upright row)/.test(n))return 'back';
  if(/(curl|biceps|triceps|skull|pushdown|kickback|overhead tri|close.?grip|diamond push|wrist|dips)/.test(n))return 'arms';
  if(/(crunch|plank|planke|core|ab |abs|ab wheel|leg raise|toes.?to|twist|rollout|dead bug|pallof|woodchop|hollow|bird dog|copenhagen|mountain climb)/.test(n))return 'core';
  if(/(squat|leg press|lunge|hip thrust|glute|calf|bulgarian|rdl|romanian|split squat|step.?up|cossack|sumo deadlift)/.test(n))return 'legs';
  if(/(row|pulldown|pull.?up|pullup|chin.?up|lat |deadlift|dødløft|rack pull|hyperexten|straight.?arm)/.test(n))return 'back';
  if(/(bænk|bench|chest|fly|flyes|push.?up|pec deck|incline|decline)/.test(n))return 'chest';
  if(/press/.test(n))return 'chest'; // resterende pres = bryst
  return null;
}

/* ── REST TIMER ────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
let restTimerInterval=null,restTimerEnd=0,restAutoHide=null;

function startRestTimer(exType){
  // exType: 'c'=compound (150s), 'i'=isolation (75s), 'x'=core (45s), 'ss'=superset transition (20s)
  const durations={c:150,i:75,x:45,ss:20};
  const labels={c:'Pause',i:'Pause',x:'Pause',ss:'Skift øvelse'};
  const secs=durations[exType]||90;
  restTimerEnd=Date.now()+secs*1000;
  const el=document.getElementById('restTimer');
  el.classList.remove('done');
  el.classList.add('show');
  el.querySelector('.rt-label').textContent=labels[exType]||'Pause';
  tickRestTimer();
  clearInterval(restTimerInterval);
  restTimerInterval=setInterval(tickRestTimer,250);
}
function tickRestTimer(){
  const el=document.getElementById('restTimer');
  if(!el)return;
  const left=Math.max(0,Math.ceil((restTimerEnd-Date.now())/1000));
  const m=Math.floor(left/60),s=left%60;
  const t=el.querySelector('.rt-time');
  if(left<=0){
    clearInterval(restTimerInterval);
    el.classList.add('done');
    t.textContent='GÅ!';
    try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    clearTimeout(restAutoHide);
    restAutoHide=setTimeout(()=>dismissTimer(),5000);
  }else{
    t.textContent=m+':'+String(s).padStart(2,'0');
  }
}
// Justér pausen mens den kører (+/− sekunder). Genoptager hvis den var talt ned.
function adjustRest(delta){
  const now=Date.now();
  let base=Math.max(now,restTimerEnd); // hvis timeren er udløbet, læg oveni nu
  let newEnd=base+delta*1000;
  if(newEnd-now<1000){ // ikke under 1 sek → luk hvis man trækker for langt ned
    if(delta<0){dismissTimer();return}
  }
  restTimerEnd=Math.max(now+1000,newEnd);
  const el=document.getElementById('restTimer');
  if(el){el.classList.remove('done');clearTimeout(restAutoHide)}
  clearInterval(restTimerInterval);
  tickRestTimer();
  restTimerInterval=setInterval(tickRestTimer,250);
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
}

function dismissTimer(){
  clearInterval(restTimerInterval);
  clearTimeout(restAutoHide);
  const el=document.getElementById('restTimer');
  el.classList.remove('show','done');
}

function getPR(day,exName){
  let best=0;
  for(let w=1;w<=TW();w++){
    const v=maxW(gw(w,day,exName));
    if(!isNaN(v)&&v>best)best=v;
  }
  return best||0;
}

const DAY_COMPLETED_KEY='tw4_day_completed_shown';
function getDayCompletedShown(){

}

// Tjek om alle øvelser/løb på en dag er logget for at trigge fejring
function isDayFullyLogged(week,day){
  const dayObj=D.find(o=>o.full===day);
  if(!dayObj)return false;
  // Løbedag: tid skal være logget
  if(dayObj.run){
    const tid=gw(week,day,'tid');
    return !!(tid&&tid.trim().length>0);
  }
  // Restitutionsdag: kan ikke "gennemføres" — skip
  if(!dayObj.ex&&!dayObj.run)return false;
  // Styrkedag: ALLE sæt skal være udfyldt på ALLE øvelser
  const exs=dayEx(dayObj);
  if(!exs||!exs.length)return false;
  const home=isHomeDay(week,day);
  for(const e of exs){
    const key=home?'HOME__'+e.n:e.n;
    const v=gw(week,day,key);
    if(!v)return false;
    const sr=exSR(e,week);
    const numSets=parseInt(sr.s)||3;
    if(e.core){
      // Core: ALLE sæt skal være afkrydset
      const done=countCompletedSets(v,numSets);
      if(done<numSets)return false;
    }else{
      // Vægt: ALLE sæt skal have en værdi (hjemme: 0 kg = kropsvægt er OK)
      const arr=parseW(v);
      if(arr.length<numSets)return false;
      for(let i=0;i<numSets;i++){
        if(arr[i]==null||isNaN(arr[i]))return false;
        if(!home&&arr[i]<=0)return false;
      }
    }
  }
  return true;
}

// Beregn dagens "highlight" statistik
function getDayStats(week,day){
  const dayObj=D.find(o=>o.full===day);
  if(!dayObj)return '';
  // Løbedag: vis tid
  if(dayObj.run){
    const tid=gw(week,day,'tid');
    const pace=gw(week,day,'pace');
    const km=gw(week,day,'km');
    let bits=[];
    if(tid)bits.push(`<div class="dcm-stat"><div class="dcm-stat-v">${tid}</div><div class="dcm-stat-l">Tid</div></div>`);
    if(pace)bits.push(`<div class="dcm-stat"><div class="dcm-stat-v">${pace}</div><div class="dcm-stat-l">Pace</div></div>`);
    if(km)bits.push(`<div class="dcm-stat"><div class="dcm-stat-v">${km}</div><div class="dcm-stat-l">Km</div></div>`);
    return bits.join('');
  }
  // Styrkedag: vis antal øvelser + total volumen
  const exs=dayEx(dayObj);
  if(!exs)return '';
  const home=isHomeDay(week,day);
  let totalVol=0,exCount=0,prCount=0;
  exs.forEach(e=>{
    if(e.core)return;
    const key=home?'HOME__'+e.n:e.n;
    const v=gw(week,day,key);
    const arr=parseW(v);
    const sr=exSR(e,week);
    const reps=parseInt(String(sr.r).split('-')[0])||8;
    arr.forEach(w=>{if(w>0)totalVol+=w*reps});
    if(arr.length&&(arr[0]>0||(home&&!isNaN(arr[0]))))exCount++;
    if(isPR(day,key,week))prCount++;
  });
  let bits=[];
  bits.push(`<div class="dcm-stat"><div class="dcm-stat-v">${exCount}</div><div class="dcm-stat-l">Øvelser</div></div>`);
  if(totalVol>0)bits.push(`<div class="dcm-stat"><div class="dcm-stat-v">${Math.round(totalVol).toLocaleString('da-DK')}</div><div class="dcm-stat-l">Volumen (kg)</div></div>`);
  if(home)bits.push(`<div class="dcm-stat"><div class="dcm-stat-v" style="color:var(--blue)">🏠</div><div class="dcm-stat-l">Hjemme</div></div>`);
  if(prCount>0)bits.push(`<div class="dcm-stat"><div class="dcm-stat-v" style="color:#ffd60a">🏆 ${prCount}</div><div class="dcm-stat-l">Nye PRs</div></div>`);
  return bits.join('');
}

function checkAndCelebratePR(day,exName,newVal){
  const newMax=maxW(newVal);
  if(isNaN(newMax)||newMax<=0)return;
  // Find tidligere bedste IKKE-inklusive denne uge (så vi sammenligner med faktisk historik)
  let prevBest=0;
  let prevWeeksLogged=0;
  for(let w=1;w<=TW();w++){
    if(w===week)continue; // skip nuværende uge
    const v=maxW(gw(w,day,exName));
    if(!isNaN(v)&&v>0){
      prevWeeksLogged++;
      if(v>prevBest)prevBest=v;
    }
  }
  // INGEN fejring hvis:
  // 1. Det er første gang øvelsen logges nogensinde (uge 1 normal logging)
  // 2. Den nye vægt ikke er HØJERE end tidligere bedste (samme vægt = ikke en PR)
  if(prevWeeksLogged===0)return;
  if(newMax<=prevBest)return;
  // Det er en REEL PR — vægten er højere end alle tidligere uger
  showPRCelebration();
}

function showPRCelebration(){
  const el=document.getElementById('prToast');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  fireConfetti();
  try{navigator.vibrate&&navigator.vibrate([100,50,100,50,200])}catch(e){}
  setTimeout(()=>el.classList.remove('show'),1200);
}

function isPR(day,exName,week){
  const thisMax=maxW(gw(week,day,exName));
  if(isNaN(thisMax)||thisMax<=0)return false;
  const pr=getPR(day,exName);
  return thisMax>=pr;
}
