<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRÆNING">
<meta name="theme-color" content="#07070f">
<title>TRÆNINGSPROGRAM</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23000'/%3E%3Ctext x='50%25' y='52%25' text-anchor='middle' dominant-baseline='middle' fill='%23ffd60a' font-family='-apple-system,sans-serif' font-size='90' font-weight='900'%3E💪%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💪%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Dyb athletic baggrund — varmere sort */
  --bg:#0a0a0b;--bg1:#121214;--bg2:#1a1a1d;--bg3:#242428;
  --bg-input:#1e1e22;
  --bdr:#2c2c2e;--bdr2:#38383a;
  --txt:#fafafa;--mut:#9a9aa0;--mut2:#5a5a60;
  --sep:rgba(255,255,255,.05);--sep2:rgba(255,255,255,.09);
  --acc:#ffd60a;--acc2:#f0c040;
  --acc-dim:rgba(255,214,10,.12);--acc-glow:rgba(255,214,10,.25);
  --blue:#0a84ff;--ora:#ff9f0a;--grn:#32d74b;--red:#ff453a;--pur:#bf5af2;
  --success:#32d74b;
  /* Day-type farver */
  --c-push:#ffd60a;--c-run:#32d74b;--c-legs:#ff9f0a;--c-pull:#0a84ff;--c-rest:#7d7d85;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --r:20px;--r2:16px;--r3:12px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --glass:rgba(18,18,20,.82);
  --shadow:0 2px 16px rgba(0,0,0,.35),0 0 1px rgba(255,255,255,.05);
  --shadow-up:0 -2px 20px rgba(0,0,0,.45);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* Premium SVG ikon-system (Lucide-baseret) */
.ic{width:24px;height:24px;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0;display:inline-block;vertical-align:middle}
.ic.sm{width:18px;height:18px;stroke-width:2}
.ic.lg{width:30px;height:30px;stroke-width:1.5}
.ic.fill{fill:currentColor;stroke:none}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;z-index:1}

/* ══ HEADER ══ */
#hdr{
  padding:calc(var(--st) + 16px) 20px 16px;flex-shrink:0;position:relative;z-index:10;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);
  transition:padding .3s var(--ease);
}
#hdr::before{content:'';position:absolute;top:-60px;right:-30px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,214,10,.08) 0%,transparent 65%);pointer-events:none}
.hdr-eyebrow{font-size:10px;letter-spacing:3px;color:var(--acc);font-family:'DM Mono',monospace;margin-bottom:4px;opacity:.7;text-transform:uppercase;transition:all .3s var(--ease);max-height:20px;overflow:hidden}
#hdr h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,9vw,54px);letter-spacing:1px;line-height:.92;background:linear-gradient(145deg,#ffffff 30%,var(--acc) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transition:font-size .3s var(--ease)}
.hdr-stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;transition:all .3s var(--ease);max-height:120px;overflow:hidden;opacity:1}

/* ══ PROGRESS HERO ══ */
.progress-hero{display:flex;align-items:center;gap:18px;width:100%;cursor:pointer}
.phero-ring{width:76px;height:76px;position:relative;flex-shrink:0}
.phero-ring svg{transform:rotate(-90deg)}
.phr-bg{stroke:var(--bg3);fill:none;stroke-width:6}
.phr-fill{stroke:var(--acc);fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--acc-glow));transition:stroke-dashoffset .8s var(--ease)}
.phr-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.phr-pct{font-family:'Bebas Neue',sans-serif;font-size:21px;line-height:1;letter-spacing:.3px}
.phr-sub{font-family:'DM Mono',monospace;font-size:8px;color:var(--mut);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.phero-stats{flex:1;display:flex;flex-direction:column;min-width:0}
.ph-stat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--sep)}
.ph-stat:last-child{border-bottom:none}
.ph-stat-l{font-size:12px;color:var(--mut);font-weight:500}
.ph-stat-v{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;letter-spacing:-.2px;white-space:nowrap}
.ph-stat-v.grn{color:var(--grn)}
.ph-stat-v.acc{color:var(--acc)}
.hdr-stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:6px 14px;display:flex;align-items:center;gap:7px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .15s var(--ease),background .15s}
.hdr-stat:active{transform:scale(.94);background:rgba(255,214,10,.12)}
.hdr-stat-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0}
.hdr-stat label{font-size:10px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;font-weight:500}
.hdr-stat b{font-size:12px;font-weight:600;color:var(--acc);font-family:'DM Mono',monospace}

/* Kompakt header ved scroll */
#hdr.compact{padding-top:calc(var(--st) + 10px);padding-bottom:10px}
#hdr.compact .hdr-eyebrow{max-height:0;margin-bottom:0;opacity:0}
#hdr.compact h1{font-size:24px;line-height:1}
#hdr.compact .hdr-stats{max-height:0;margin-top:0;opacity:0}

/* ══ TABS (iOS bottom bar) ══ */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;padding:6px 4px calc(var(--sb) + 4px);box-shadow:var(--shadow-up)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--mut);border:none;background:transparent;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;transition:color .25s var(--ease);position:relative;min-height:44px;justify-content:center}
.tab .tab-icon{display:flex;align-items:center;justify-content:center;line-height:1;transition:transform .25s var(--spring)}
.tab .tab-icon .ic{width:23px;height:23px}
.tab.on{color:var(--acc)}
.tab.on .tab-icon{transform:scale(1.1)}
.tab::after{display:none}

/* ══ SCROLL ══ */
#cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px calc(var(--sb) + 80px);scroll-behavior:smooth}

/* ══ DAY GRID ══ */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px}
.dc{border-radius:var(--r2);padding:12px 4px 10px;text-align:center;cursor:pointer;border:1.5px solid rgba(255,255,255,.06);background:var(--bg2);transition:all .25s var(--ease);position:relative;overflow:hidden;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--col);border-radius:var(--r2) var(--r2) 0 0;transform:scaleX(0);transition:transform .3s var(--spring)}
.dc:active{transform:scale(.93);transition-duration:.1s}
.dc.on{border-color:var(--col);background:linear-gradient(180deg,var(--col)18 0%,var(--col)08 100%);box-shadow:0 4px 20px var(--col)20,inset 0 1px 0 rgba(255,255,255,.06)}
.dc.on::before{transform:scaleX(1)}
.dc .di{font-size:18px;display:block;margin-bottom:4px}
.dc .da{font-size:10px;font-weight:700;letter-spacing:.5px;font-family:'DM Mono',monospace}
.dc .dl{font-size:7px;letter-spacing:.6px;margin-top:4px;color:var(--col);opacity:.7;text-transform:uppercase}
.dc.on .dl{opacity:1}

/* ══ DETAIL PANEL ══ */
.det{background:var(--bg1);border-radius:var(--r);padding:20px;border:1px solid var(--bdr);box-shadow:var(--shadow);animation:slideUp .35s var(--spring);position:relative;overflow:hidden}
.det::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.det-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.det-icon{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:var(--r2);flex-shrink:0}
.det-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.5px;line-height:.95}
.det-sub{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:3px}
.badge{margin-left:auto;padding:6px 14px;border-radius:100px;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;font-family:'DM Mono',monospace}

/* ══ PHASE BANNER ══ */
.phase-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r2);margin-bottom:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}

/* ══ HJEMME-TRÆNING ══ */
.home-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;margin-bottom:12px;background:var(--bg2);border:1.5px dashed var(--bdr2);border-radius:var(--r2);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;min-height:46px;transition:all .2s var(--ease)}
.home-toggle:active{transform:scale(.98)}
.home-toggle.on{background:color-mix(in srgb,var(--blue) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--blue) 40%,transparent);color:var(--blue)}
.home-toggle .ic{width:15px;height:15px}
.home-alt{margin:10px 0 4px;padding:10px 12px;background:color-mix(in srgb,var(--blue) 8%,var(--bg2));border-left:3px solid var(--blue);border-radius:var(--r3)}
.home-alt-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.home-alt-head .ic{width:14px;height:14px;color:var(--blue);flex-shrink:0}
.home-alt-head b{font-size:13px;font-weight:600;flex:1}
.home-alt-vid{font-family:'DM Mono',monospace;font-size:10px;color:var(--blue);text-decoration:none;letter-spacing:.5px;white-space:nowrap}
.home-alt-note{font-size:11px;color:var(--mut);line-height:1.5}
.home-equip{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;padding:0 4px}
.home-equip-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut2);letter-spacing:1px;text-transform:uppercase}
.he-chip{background:var(--bg2);border:1.5px solid var(--bdr);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.3px;padding:8px 14px;border-radius:100px;cursor:pointer;min-height:36px;transition:all .2s var(--ease)}
.he-chip:active{transform:scale(.95)}
.he-chip.on{background:color-mix(in srgb,var(--blue) 15%,transparent);border-color:var(--blue);color:var(--blue)}

/* ══ MOBILITY ══ */
.mob-card{width:100%;display:flex;align-items:center;gap:14px;padding:16px;margin-top:14px;background:color-mix(in srgb,var(--grn) 7%,var(--bg1));border:1px solid color-mix(in srgb,var(--grn) 25%,transparent);border-radius:var(--r2);cursor:pointer;text-align:left;font-family:inherit;color:var(--txt);transition:transform .15s var(--ease)}
.mob-card:active{transform:scale(.98)}
.mob-card-icon{font-size:28px}
.mob-card-text{flex:1}
.mob-card-text b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.mob-card-text small{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.3px}
.mob-card-arrow{font-size:22px;color:var(--mut2)}
.mob-modal{max-width:440px;max-height:85vh;overflow-y:auto;padding:22px 18px;position:relative}
.modal-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--bg3);border:none;color:var(--mut);font-size:14px;cursor:pointer;z-index:2}
.mob-head{margin-bottom:16px;padding-right:36px}
.mob-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;margin-bottom:4px}
.mob-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:.3px}
.mob-back{background:none;border:none;color:var(--acc);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;padding:0;margin-bottom:8px;letter-spacing:.5px}
.mob-routine{width:100%;display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:8px;background:var(--bg2);border:1px solid var(--sep);border-left:3px solid var(--mc);border-radius:var(--r3);cursor:pointer;text-align:left;font-family:inherit;color:var(--txt);transition:transform .15s var(--ease)}
.mob-routine:active{transform:scale(.98)}
.mob-r-icon{font-size:24px}
.mob-r-text{flex:1;min-width:0}
.mob-r-text b{display:block;font-size:15px;font-weight:600}
.mob-r-text small{font-family:'DM Mono',monospace;font-size:10px;color:var(--mc);letter-spacing:.3px;display:block;margin:2px 0}
.mob-r-text em{font-style:normal;font-size:11px;color:var(--mut);line-height:1.4;display:block}
.mob-r-arrow{font-size:20px;color:var(--mut2)}
.mob-ex{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--sep)}
.mob-ex.done{opacity:.55}
.mob-ex.done .mob-ex-n{text-decoration:line-through}
.mob-check{width:32px;height:32px;border-radius:50%;border:2px solid var(--mc);background:transparent;color:#000;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .15s var(--ease);display:flex;align-items:center;justify-content:center}
.mob-ex.done .mob-check{background:var(--mc)}
.mob-check:active{transform:scale(.88)}
.mob-ex-text{flex:1;min-width:0}
.mob-ex-n{font-size:14px;font-weight:600;margin-bottom:2px}
.mob-ex-r{font-family:'DM Mono',monospace;font-size:10px;color:var(--acc);letter-spacing:.3px;font-weight:500;margin-left:4px}
.mob-ex-no{font-size:12px;color:var(--mut);line-height:1.45}
.mob-ex-vid{font-size:12px;color:var(--blue);text-decoration:none;padding:6px 10px;background:var(--bg3);border-radius:100px;flex-shrink:0}
.mob-complete{text-align:center;padding:16px;margin-top:12px;background:color-mix(in srgb,var(--grn) 10%,transparent);border-radius:var(--r2);font-size:14px;font-weight:600;color:var(--grn)}

/* ══ LØBERUTE ══ */
.route-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;margin-top:12px;background:color-mix(in srgb,var(--grn) 8%,var(--bg1));border:1px solid color-mix(in srgb,var(--grn) 28%,transparent);border-radius:var(--r2);color:var(--grn);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.4px;cursor:pointer;min-height:48px;transition:transform .15s var(--ease)}
.route-btn:active{transform:scale(.98)}
.route-btn .ic{width:16px;height:16px}
.route-modal{max-width:440px;max-height:88vh;overflow-y:auto;padding:22px 18px;position:relative}
.route-status{font-family:'DM Mono',monospace;font-size:12px;color:var(--mut);margin:8px 0 12px;letter-spacing:.3px}
.route-map{width:100%;height:300px;border-radius:var(--r2);background:var(--bg2);overflow:hidden}
.route-stats{display:flex;gap:8px;margin:14px 0}
.route-stat{flex:1;background:var(--bg2);border-radius:var(--r3);padding:10px;text-align:center}
.route-stat b{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.4px;display:block;line-height:1;color:var(--acc)}
.route-stat small{font-family:'DM Mono',monospace;font-size:9px;color:var(--mut);letter-spacing:.6px;text-transform:uppercase;margin-top:4px;display:block}
.route-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.route-setup{font-size:13px;line-height:1.6;color:var(--mut)}
.route-setup p{margin-bottom:10px}
.route-setup b{color:var(--txt)}
.route-setup a{color:var(--blue)}
.route-setup ol{margin:0 0 14px 18px}
.route-setup li{margin-bottom:6px}
.route-setup input{width:100%;background:var(--bg2);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:13px;padding:12px 14px;border-radius:var(--r3);outline:none;margin-bottom:12px}
.route-setup input:focus{border-color:var(--acc)}

/* ══ GUIDET LØB ══ */
.guide-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;margin-top:8px;background:color-mix(in srgb,var(--blue) 9%,var(--bg1));border:1px solid color-mix(in srgb,var(--blue) 30%,transparent);border-radius:var(--r2);color:var(--blue);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.4px;cursor:pointer;min-height:48px;transition:transform .15s var(--ease)}
.guide-btn:active{transform:scale(.98)}
.rg-modal{max-width:400px;padding:28px 22px;text-align:center;background:#000}
.rg-status{font-family:'DM Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:.3px;margin-bottom:18px;line-height:1.5}
.rg-time{font-family:'Bebas Neue',sans-serif;font-size:76px;line-height:1;letter-spacing:1px;margin-bottom:16px;font-variant-numeric:tabular-nums}
.rg-row{display:flex;gap:10px;margin-bottom:22px}
.rg-stat{flex:1;background:var(--bg1);border-radius:var(--r2);padding:14px 8px}
.rg-stat b{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.5px;display:block;line-height:1;color:var(--acc)}
.rg-stat small{font-family:'DM Mono',monospace;font-size:9px;color:var(--mut);letter-spacing:.8px;text-transform:uppercase;margin-top:5px;display:block}
.rg-btns{display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.rg-start{background:linear-gradient(180deg,var(--grn),#28a745);color:#000;border:none;font-family:'DM Mono',monospace;font-size:13px;font-weight:700;letter-spacing:1.5px;padding:16px 40px;border-radius:100px;cursor:pointer;text-transform:uppercase;min-height:54px;box-shadow:0 6px 20px rgba(50,215,75,.3)}
.rg-start:active{transform:scale(.95)}
.rg-pause{background:var(--bg3);color:var(--txt);border:none;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1px;padding:14px 24px;border-radius:100px;cursor:pointer;min-height:50px}
.rg-stop{background:linear-gradient(180deg,var(--red),#d63030);color:#fff;border:none;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1px;padding:14px 24px;border-radius:100px;cursor:pointer;min-height:50px}
.rg-note{font-family:'DM Mono',monospace;font-size:9px;color:var(--mut2);letter-spacing:.3px;line-height:1.6}
.rg-nav{background:color-mix(in srgb,var(--blue) 12%,var(--bg1));border:1px solid color-mix(in srgb,var(--blue) 30%,transparent);border-radius:var(--r2);padding:14px 16px;margin-bottom:18px;font-size:15px;font-weight:600;color:var(--blue);line-height:1.4;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center}
.phase-banner::before{display:none}
.phase-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.phase-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px}
.phase-info{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace}

/* ══ EXERCISE TABLE ══ */
.ex-hd{display:none}
.exrow{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r2);padding:16px;margin-bottom:12px;position:relative;transition:all .15s;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.exrow:active{border-color:var(--bdr2)}
.exrow.has-sets{box-shadow:0 2px 8px rgba(0,0,0,.25)}
.exrow.core{border-left:3px solid var(--acc)}
.exrow.core::before{display:none}
.exrow.cust{border-left:3px solid var(--pur)}
.exrow.cust::before{display:none}
.exrow-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-width:0}
.exrow-top>div:first-child{flex:1;min-width:0}
.exrow-meta{display:flex;align-items:center;gap:14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:.5px}
.exrow-meta b{color:var(--txt);font-weight:600}
.exrow-meta .meta-max{margin-left:auto;color:var(--acc);font-weight:600}
.exn{font-size:14px;font-weight:600;line-height:1.3;color:var(--txt);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.exn .cust-tag{display:inline-block;background:rgba(191,90,242,.15);color:var(--pur);font-family:'DM Mono',monospace;font-size:8px;font-weight:600;letter-spacing:1px;padding:2px 6px;border-radius:4px;vertical-align:middle}
.exn .rmx{display:inline-flex;align-items:center;justify-content:center;color:var(--red);font-size:13px;cursor:pointer;opacity:.5;padding:0 4px;background:none;border:none;font-family:inherit;min-width:32px;min-height:32px}
.exn .rmx:hover{opacity:1}
.exno{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:4px;line-height:1.4}
.exs{display:none}
.exr{display:none}
.exkg{display:none}
.wi{background:var(--bg3);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:14px;font-weight:500;width:72px;padding:8px 4px;border-radius:100px;text-align:center;outline:none;-webkit-appearance:none;transition:all .2s var(--ease);min-height:36px}
.wi:focus{border-color:var(--acc);background:rgba(255,214,10,.06);box-shadow:0 0 0 3px rgba(255,214,10,.12)}
.wi::placeholder{color:var(--mut2);font-size:11px;font-weight:400}
.wi.fl{animation:wfl .6s var(--ease)}
@keyframes wfl{0%{border-color:var(--grn);box-shadow:0 0 0 4px rgba(48,209,88,.2)}100%{border-color:var(--bdr);box-shadow:none}}
.dup{font-size:10px;font-weight:600;font-family:'DM Mono',monospace;color:var(--grn)}
.ddn{font-size:10px;font-weight:600;font-family:'DM Mono',monospace;color:var(--red)}
.deq{font-size:10px;font-family:'DM Mono',monospace;color:var(--mut)}
.vl{display:inline-flex;align-items:center;justify-content:center;color:var(--acc);text-decoration:none;font-size:12px;font-family:'DM Mono',monospace;font-weight:500;padding:6px 10px;background:rgba(255,214,10,.08);border-radius:100px;white-space:nowrap;border:1px solid rgba(255,214,10,.15);transition:all .15s;min-width:36px;min-height:36px;flex-shrink:0}
.vl:hover{background:rgba(255,214,10,.16)}

/* ══ PER-SET INPUTS ══ */
.set-expand{padding:6px 0 0;animation:slideUp .25s var(--spring)}
.set-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.set-chip{display:flex;flex-direction:column;align-items:center;gap:0;flex:1;min-width:60px;max-width:90px;background:var(--bg-input);border:1.5px solid transparent;border-radius:14px;padding:8px 4px 6px;transition:all .2s var(--ease)}
.set-chip.filled{background:color-mix(in srgb,var(--grn) 8%,var(--bg-input))}
.set-chip:has(input:focus){background:var(--acc-dim);border-color:var(--acc)}
.set-chip label{font-family:'DM Mono',monospace;font-size:8px;color:var(--mut2);letter-spacing:1px}
.set-chip input{width:100%;padding:2px 2px 0;border-radius:0;text-align:center;background:transparent;border:none;color:var(--txt);font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;outline:none;-webkit-appearance:none;min-height:32px}
.set-chip input::placeholder{color:var(--mut2);opacity:.5}

/* ══ METRICS GRID (sæt/reps/max) ══ */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:var(--r2);overflow:hidden;margin:10px 0 4px}
.metric{padding:10px 6px;text-align:center;border-right:1px solid var(--sep)}
.metric:last-child{border-right:none}
.metric-num{font-family:'Bebas Neue',sans-serif;font-size:23px;line-height:1;letter-spacing:.4px}
.metric-num.muted{color:var(--mut2)}
.metric-num.grn{color:var(--grn)}
.metric-num small{font-family:'DM Mono',monospace;font-size:11px;color:var(--mut);font-weight:400;margin-left:2px}
.metric-cap{font-family:'DM Mono',monospace;font-size:8px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:4px}

/* ══ ØVELSE DONE-STATE ══ */
.exrow{position:relative}
.exrow.done{border-color:color-mix(in srgb,var(--grn) 28%,transparent)!important}
.exrow.done::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grn);border-radius:3px 0 0 3px}

/* ══ CORE INPUT (sek/antal) ══ */
.core-input-wrap{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1.5px solid var(--bdr);border-radius:100px;padding:4px 14px 4px 4px;width:fit-content}

/* ══ CORE CHECKMARK SETS (tid-baserede øvelser) ══ */
.core-check-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.core-check{flex:1;min-width:64px;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;background:var(--bg3);border:1.5px solid var(--bdr);border-radius:14px;cursor:pointer;font-family:'DM Mono',monospace;color:var(--mut);transition:all .15s var(--ease);min-height:56px;justify-content:center}
.core-check:active{transform:scale(.95)}
.core-check .cc-num{font-size:9px;letter-spacing:1px;font-weight:600;text-transform:uppercase}
.core-check .cc-mark{font-size:22px;line-height:1;color:var(--mut2);font-weight:600}
.core-check.done{background:rgba(48,209,88,.12);border-color:rgba(48,209,88,.4);color:var(--grn)}
.core-check.done .cc-mark{color:var(--grn);animation:checkPop .3s var(--spring)}
.core-check.done .cc-num{color:var(--grn)}
@keyframes checkPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.core-check-row.all-done .core-check{box-shadow:0 0 0 2px rgba(48,209,88,.2)}
.core-input-wrap .wi{border:none;background:transparent;width:80px;padding:8px 4px;min-height:36px}
.core-input-wrap .wi:focus{box-shadow:none;background:transparent}
.core-input-unit{font-family:'DM Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}

/* ══ HISTORY STRIP (sidste ugers data per øvelse) ══ */
.hist-strip{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(135deg,rgba(10,132,255,.08),rgba(48,209,88,.04));border:1px solid rgba(10,132,255,.2);border-radius:var(--r2);margin-top:2px;flex-wrap:wrap}
.hist-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--blue);font-weight:700;display:flex;align-items:center;gap:4px}
.hist-cells{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.hist-cell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 10px;background:var(--bg2);border-radius:8px;min-width:44px;border:1px solid var(--bdr)}
.hist-cell.latest{background:rgba(10,132,255,.15);border-color:rgba(10,132,255,.4)}
.hist-w{font-family:'DM Mono',monospace;font-size:8px;color:var(--mut2);letter-spacing:.5px;font-weight:600}
.hist-cell.latest .hist-w{color:var(--blue)}
.hist-v{font-family:'DM Mono',monospace;font-size:13px;color:var(--txt);font-weight:600}
.hist-cell.latest .hist-v{color:var(--blue)}
.hist-suggest{font-family:'DM Mono',monospace;font-size:11px;color:var(--grn);font-weight:700;letter-spacing:.3px;margin-left:auto;white-space:nowrap;background:rgba(48,209,88,.1);padding:4px 10px;border-radius:100px;border:1px solid rgba(48,209,88,.25)}
.hist-suggest-btn{cursor:pointer;transition:transform .12s,background .12s}
.hist-suggest-btn:active{transform:scale(.94);background:rgba(48,209,88,.22)}
.hist-suggest-btn::after{content:' ⤵';opacity:.7}

/* ══ SWAP EXERCISE ══ */
.swap-btn{background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.25);color:var(--blue);font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.3px;padding:4px 8px;border-radius:6px;cursor:pointer;margin-left:4px;min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
.swap-btn:active{transform:scale(.93)}
.swap-btn.on{background:rgba(255,159,10,.15);border-color:rgba(255,159,10,.4);color:#ff9f0a}
.swap-tag{display:inline-block;background:rgba(255,159,10,.15);color:#ff9f0a;font-family:'DM Mono',monospace;font-size:8px;font-weight:600;letter-spacing:1px;padding:2px 6px;border-radius:4px;vertical-align:middle}
.swap-alt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.swap-alt{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);cursor:pointer;transition:all .15s var(--ease)}
.swap-alt:active{transform:scale(.98);background:var(--bg3);border-color:var(--blue)}
.swap-alt-name{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.3px;line-height:1.1}
.swap-alt-desc{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:3px;line-height:1.3}
.swap-alt-arr{color:var(--mut2);font-size:18px;flex-shrink:0}
.set-toggle{
  background:var(--bg2);border:1.5px solid var(--bdr);color:var(--mut);font-size:14px;
  cursor:pointer;padding:0;border-radius:50%;
  font-family:'DM Mono',monospace;transition:all .15s var(--ease);
  width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;letter-spacing:1px;
}
.set-toggle:active{transform:scale(.88);background:var(--acc);color:#000;border-color:var(--acc)}
.set-toggle:hover{color:var(--acc);border-color:var(--acc);background:rgba(255,214,10,.08)}

/* ══ TIP ══ */
.tip{margin-top:16px;padding:12px 16px;background:var(--bg2);border-radius:var(--r2);font-size:12px;color:var(--mut);line-height:1.6;border-left:3px solid var(--bdr)}
.tip b{color:var(--txt)}
.tcore{margin-top:8px;padding:12px 16px;background:rgba(255,214,10,.04);border:1px solid rgba(255,214,10,.12);border-radius:var(--r2);font-size:12px;color:var(--acc);border-left:3px solid var(--acc)}

/* ══ WEEK PICKER ══ */
.wpick{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.wpick label{font-size:9px;color:var(--mut);letter-spacing:2px;font-family:'DM Mono',monospace;text-transform:uppercase}
.wb{padding:7px 12px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);font-family:'DM Mono',monospace;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s var(--ease);min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.wb-toggle{padding:8px 16px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--acc);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;min-height:38px;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s var(--ease)}
.wb-toggle:active{transform:scale(.95);background:rgba(255,214,10,.12);border-color:var(--acc)}
.wb-toggle:active{transform:scale(.95);color:var(--acc);border-color:var(--acc)}

/* Kg-summary (klikbar - kan folde sæt sammen) */
.kg-summary{font-family:'DM Mono',monospace;font-size:13px;color:var(--mut);text-align:center;padding:8px 4px;cursor:pointer;border:1px dashed transparent;border-radius:8px;transition:all .15s var(--ease)}
.kg-summary:active{background:var(--bg2);border-color:var(--bdr)}
.core-unit-label{font-size:9px;color:var(--mut2);font-family:'DM Mono',monospace;text-align:center;margin-top:2px;letter-spacing:.5px;text-transform:uppercase}
.exrow.has-sets .exkg{align-self:start}
.wb:active{transform:scale(.92)}
.wb.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}

/* ══ RUN CARDS ══ */
.rungrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}

/* ══ EVIDENSBASERET LØBE-UI ══ */
.run-phase-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,var(--pc)15,var(--pc)05);border:1px solid var(--pc)35;border-radius:var(--r2);margin-bottom:14px;border-left:4px solid var(--pc)}
.rpb-icon{font-size:26px;flex-shrink:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--pc)20;border-radius:50%}
.rpb-text{flex:1;min-width:0}
.rpb-eyebrow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--pc);margin-bottom:2px;font-weight:600}
.rpb-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.3px;line-height:1.1;margin-bottom:3px}
.rpb-sub{font-size:11px;color:var(--mut);line-height:1.4}

.run-prescription{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:16px;border-left:4px solid var(--rc)}
.rp-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--bdr)}
.rp-type-emoji{font-size:36px;flex-shrink:0;width:60px;height:60px;display:flex;align-items:center;justify-content:center;background:var(--rc)15;border-radius:50%;border:1px solid var(--rc)30}
.rp-type{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;line-height:1.1;color:var(--rc)}
.rp-type-cat{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--mut);margin-top:4px;text-transform:uppercase}

.rp-targets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.rp-target{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px 12px;text-align:center}
.rp-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;font-weight:600}
.rp-value{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.3px;color:var(--txt);line-height:1}
.rp-extra{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut2);margin-top:6px}
.rp-delta{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;margin-top:6px;display:inline-block;padding:2px 8px;border-radius:100px}
.rp-delta.down{color:var(--grn);background:rgba(48,209,88,.1)}
.rp-delta.up{color:#ff9f0a;background:rgba(255,159,10,.1)}

.rp-tip{padding:10px 14px;border-radius:var(--r2);font-size:12px;line-height:1.5}

/* ══ WARMUP/MAIN/COOLDOWN BLOCKS ══ */
.rp-blocks{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.rp-block{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--bg2);border-radius:var(--r2);border:1px solid var(--bdr);border-left:3px solid var(--bdr);position:relative}
.rp-block.warmup{border-left-color:#ff9f0a;background:rgba(255,159,10,.04)}
.rp-block.main{border-left-color:var(--rc);background:var(--rc)08}
.rp-block.cooldown{border-left-color:#30d158;background:rgba(48,209,88,.04)}
.rp-block-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:var(--mut)}
.rp-block.warmup .rp-block-num{background:rgba(255,159,10,.15);border-color:#ff9f0a;color:#ff9f0a}
.rp-block.main .rp-block-num{background:var(--rc)20;border-color:var(--rc);color:var(--rc)}
.rp-block.cooldown .rp-block-num{background:rgba(48,209,88,.15);border-color:#30d158;color:#30d158}
.rp-block-content{flex:1;min-width:0}
.rp-block-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--mut);font-weight:700;margin-bottom:4px;text-transform:uppercase}
.rp-block-detail{font-size:13px;line-height:1.4;color:var(--txt)}
.rp-block-detail b{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.3px;color:var(--txt)}
.rp-block-extra{font-size:10px;font-family:'DM Mono',monospace;color:var(--mut2);margin-top:4px;line-height:1.4}

/* ══ INTERVAL REST CARD (pause-info) ══ */
.interval-rest-card{margin-top:10px;background:rgba(10,132,255,.06);border:1px solid rgba(10,132,255,.2);border-radius:10px;padding:10px 12px}
.irc-row{display:flex;align-items:center;gap:10px}
.irc-icon{font-size:18px;flex-shrink:0}
.irc-text{flex:1;min-width:0}
.irc-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--blue);font-weight:700;margin-bottom:2px;text-transform:uppercase}
.irc-value{font-size:12px;color:var(--txt);line-height:1.4}
.irc-value b{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--blue);letter-spacing:.3px}

.rp-total{text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:1px;padding:10px;background:var(--bg2);border-radius:var(--r2);border:1px dashed var(--bdr);margin-bottom:14px}
.rp-total b{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--rc);letter-spacing:.5px}

/* ══ RUN INFO BUTTONS ══ */
.run-info-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--bdr);background:var(--bg3);color:var(--mut);font-family:Georgia,serif;font-style:italic;font-weight:600;font-size:11px;cursor:pointer;padding:0;margin-left:4px;vertical-align:middle;transition:all .15s var(--ease);line-height:1}
.run-info-btn:active{transform:scale(.88);color:var(--acc);border-color:var(--acc)}
.run-info-btn.small{width:16px;height:16px;font-size:10px}

.run-info-modal{max-width:480px;max-height:85vh;overflow-y:auto;padding:0}

/* ══ DAG-GENNEMFØRT FEJRING ══ */
.day-complete-modal{max-width:380px;text-align:center;padding:32px 24px 24px;background:linear-gradient(160deg,rgba(48,209,88,.08) 0%,var(--bg1) 50%,rgba(255,214,10,.04) 100%);border:1px solid rgba(48,209,88,.25);animation:dcmPop .5s var(--spring)}
@keyframes dcmPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.dcm-confetti{font-size:64px;line-height:1;margin-bottom:12px;animation:dcmBounce 1s var(--spring)}
@keyframes dcmBounce{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-8deg)}75%{transform:translateY(-6px) rotate(8deg)}}
.dcm-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.5px;line-height:1;margin-bottom:6px;background:linear-gradient(135deg,#30d158,var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dcm-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:18px}
.dcm-body{font-size:14px;line-height:1.6;color:var(--txt);margin-bottom:24px;padding:0 8px}
.dcm-stats{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.dcm-stat{background:var(--bg2);border:1px solid var(--bdr);border-radius:14px;padding:10px 14px;min-width:74px;flex:0 1 auto}
.dcm-stat-v{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.3px;line-height:1;color:var(--acc)}
.dcm-stat-l{font-family:'DM Mono',monospace;font-size:9px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.dcm-close{background:linear-gradient(180deg,#30d158 0%,#28a745 100%);color:#000;border:none;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1.5px;padding:14px 32px;border-radius:100px;cursor:pointer;text-transform:uppercase;box-shadow:0 4px 16px rgba(48,209,88,.3),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s var(--spring);min-height:48px}
.dcm-close:active{transform:scale(.95)}
.run-info-body{padding:18px 22px 28px;font-size:13px;line-height:1.6;color:var(--txt)}
.run-info-body p{margin:0 0 12px}
.run-info-body p:last-child{margin-bottom:0}
.run-info-body b{color:var(--acc);font-weight:600}
.rcard{background:var(--bg2);border-radius:var(--r2);padding:16px;border:1px solid var(--bdr);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.rcard label{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:6px}
.rcard .rval{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px}
.rtip{grid-column:1/-1;border-radius:var(--r2);padding:14px 16px;font-size:13px;line-height:1.5}
.runlog{margin-top:4px;background:var(--bg2);border-radius:var(--r2);overflow:hidden;border:1px solid var(--bdr)}
.runlog-head{padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr)}
.runlog-head span{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px}
.runlog-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}
.runlog-label{font-size:13px;font-weight:500}
.runlog-prev{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.runlog-note{padding:12px 16px}
.runlog-note label{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:6px}
textarea{background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);border-radius:var(--r2);padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:13px;resize:none;outline:none;width:100%;transition:border-color .2s,box-shadow .2s;line-height:1.5}
textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,214,10,.1)}

/* ══ REST ══ */
.rest{text-align:center;padding:48px 0}
.rest-icon{font-size:56px;display:block;margin-bottom:16px}
.rest-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--mut);letter-spacing:1px}
.rest-sub{font-size:13px;color:var(--mut2);margin-top:6px;font-family:'DM Mono',monospace}

/* ══ WEIGHT LOG ══ */
.wld{background:var(--bg1);border-radius:var(--r);overflow:hidden;margin-bottom:16px;border:1px solid var(--bdr);box-shadow:var(--shadow)}
.wlh{padding:14px 16px;display:flex;align-items:center;gap:10px;position:relative}
.wlh-icon{display:flex;align-items:center}
.wlh-icon .ic{width:18px;height:18px}
.wlh-text{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.5px}
.wlh-phase{margin-left:auto;font-size:9px;font-family:'DM Mono',monospace;font-weight:500;padding:4px 10px;border-radius:100px;opacity:.9}
.wlc{display:grid;grid-template-columns:1fr 80px 80px 72px;gap:4px 8px;padding:8px 16px 6px;border-bottom:1px solid var(--bdr);background:var(--bg2)}
.wlc span{font-size:9px;color:var(--mut2);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace}
.wlr{display:grid;grid-template-columns:1fr 80px 80px 72px;gap:4px 8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}
.wln{font-size:13px;font-weight:500}
.wls{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.wlp{font-size:13px;font-weight:500;color:var(--mut);font-family:'DM Mono',monospace}

/* ══ PHASES ══ */
.phcard{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.phcard::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--pc)}
.ph-num-wrap{text-align:center}
.ph-num{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;color:var(--pc)}
.ph-weeks{font-size:9px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.ph-label{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.5px;margin-bottom:6px}
.ph-row{font-size:12px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:3px;line-height:1.5}
.ph-goal{text-align:center;background:var(--bg2);border-radius:var(--r2);padding:12px 14px;border:1px solid var(--bdr);min-width:72px}
.ph-goal label{font-size:8px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:4px}
.ph-goal span{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;color:var(--acc)}
.section-label{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:12px;margin-top:8px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* ══ RULES ══ */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:var(--bg1);border-radius:var(--r2);padding:16px;border:1px solid var(--bdr);position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.rc:active{transform:scale(.98)}
.rc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--rc)}
.rc-icon{font-size:24px;margin-bottom:10px;display:block}
.rc-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px;margin-bottom:6px;color:var(--rc)}
.rc-body{font-size:12px;color:var(--mut);line-height:1.6}

/* ══ GRAPH ══ */
.graph-wrap{background:var(--bg1);border-radius:var(--r);padding:20px;border:1px solid var(--bdr);margin-bottom:16px;box-shadow:var(--shadow)}
.graph-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;margin-bottom:4px}
.graph-gain{font-size:12px;font-family:'DM Mono',monospace;font-weight:500;margin-bottom:14px}
.ex-picker{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.ex-picker::-webkit-scrollbar{display:none}
.expill{flex-shrink:0;padding:8px 14px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s var(--ease);min-height:36px}
.expill:active{transform:scale(.95)}
.expill.on{color:#000;font-weight:700}

/* ══ HINT ══ */
.hint{text-align:center;padding:40px 0;color:var(--mut2);font-family:'DM Mono',monospace;font-size:13px;line-height:2}
.hint-icon{font-size:40px;display:block;margin-bottom:10px}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:calc(var(--sb)+100px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--grn);color:#000;font-family:'DM Mono',monospace;font-size:13px;font-weight:600;padding:10px 24px;border-radius:100px;opacity:0;transition:all .35s var(--spring);pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 8px 32px rgba(48,209,88,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══ DIVIDERS ══ */
.page-title{margin-bottom:24px}
.page-eyebrow{font-family:'DM Mono',monospace;font-size:10px;color:var(--acc);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;opacity:.8}
.page-h1{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:.5px;line-height:.95}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ══ TODAY BANNER ══ */
.today-banner{background:linear-gradient(135deg,var(--tc)14 0%,var(--tc)06 100%);border:1px solid var(--tc)30;border-radius:var(--r);padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s var(--ease);box-shadow:0 4px 24px var(--tc)10}
.today-banner::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--tc)}
.today-banner:active{transform:scale(.98)}
.tb-icon{font-size:32px;flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--tc)18;border-radius:var(--r2);border:1px solid var(--tc)25}
.tb-text{flex:1;min-width:0}
.tb-eyebrow{font-size:9px;letter-spacing:3px;color:var(--tc);font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tb-eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:var(--tc);animation:pls 2s infinite ease-in-out}
@keyframes pls{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.tb-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;line-height:1;color:var(--txt)}
.tb-sub{font-size:12px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:4px;line-height:1.4}
.tb-arrow{font-size:20px;color:var(--tc);flex-shrink:0;opacity:.4}

/* ══ FLEX-MODE BANNER ══ */
.flex-banner{background:linear-gradient(135deg,var(--tc)14 0%,var(--tc)06 100%);border:1px solid var(--tc)30;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s var(--ease);box-shadow:0 4px 24px var(--tc)10}
.flex-banner::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--tc)}
.flex-banner:active{transform:scale(.98)}
.flex-banner.complete{--tc:#30d158;background:linear-gradient(135deg,rgba(48,209,88,.12),rgba(48,209,88,.04));border-color:rgba(48,209,88,.3);cursor:default}
.flex-banner.complete:active{transform:none}
.flex-banner.done{--tc:#ffd60a;background:linear-gradient(135deg,rgba(255,214,10,.15),rgba(255,214,10,.05));border-color:rgba(255,214,10,.35);cursor:default}
.flex-banner.done:active{transform:none}
.flex-banner-icon{font-size:32px;flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--tc)18;border-radius:var(--r2);border:1px solid var(--tc)25}
.flex-banner-text{flex:1;min-width:0}
.fb-eyebrow{font-size:9px;letter-spacing:3px;color:var(--tc);font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.fb-eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:var(--tc);animation:pls 2s infinite ease-in-out}
.fb-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;line-height:1;color:var(--txt)}
.fb-sub{font-size:12px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:4px;line-height:1.4}

/* ══ FLEX QUEUE ══ */
.flex-queue{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px 14px;margin-bottom:16px}
.flex-queue-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--mut);margin-bottom:8px;font-weight:600}
.flex-queue-list{display:flex;flex-direction:column;gap:6px}
.flex-queue-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;cursor:pointer;transition:all .15s var(--ease)}
.flex-queue-item:active{transform:scale(.98);background:var(--bg3)}

/* ══ FLEX-MODE TOGGLE (i settings) ══ */
.flex-mode-info{display:flex;flex-direction:column;gap:8px}
.fm-option{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg2);border:1.5px solid var(--bdr);border-radius:var(--r2);cursor:pointer;transition:all .15s var(--ease)}
.fm-option:active{transform:scale(.98)}
.fm-option.on{border-color:var(--acc);background:rgba(255,214,10,.05)}
.fm-emo{font-size:22px;flex-shrink:0}
.fm-content{flex:1;min-width:0}
.fm-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.3px;line-height:1.2;margin-bottom:3px}
.fm-desc{font-size:11px;color:var(--mut);line-height:1.4}
.fm-check{font-size:18px;color:var(--acc);font-weight:600;flex-shrink:0}

/* ══ PROGRAM SETUP/DONE ══ */
.prog-setup{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:24px 20px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.prog-setup::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.prog-setup-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;margin-bottom:8px}
.prog-setup-sub{font-size:12px;color:var(--mut);line-height:1.7;margin-bottom:16px}
.prog-setup .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.prog-btn{background:linear-gradient(180deg,var(--acc) 0%,var(--acc2) 100%);color:#000;border:none;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:14px 20px;border-radius:100px;cursor:pointer;text-transform:uppercase;transition:transform .15s var(--spring),box-shadow .15s;min-height:48px;box-shadow:0 4px 16px rgba(255,214,10,.25),inset 0 1px 0 rgba(255,255,255,.3)}
.prog-btn:active{transform:scale(.95);box-shadow:0 2px 8px rgba(255,214,10,.2)}
.prog-btn.ghost{background:var(--bg2);color:var(--txt);border:1.5px solid var(--bdr);box-shadow:none}
.prog-btn.ghost:active{background:var(--bg3);border-color:var(--mut)}
.prog-btn.ghost:hover{color:var(--txt);border-color:var(--mut)}

/* Fyld-alle-sæt knap (sparer klik) */
.fill-all-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:11px;background:rgba(48,209,88,.1);border:1.5px dashed rgba(48,209,88,.4);border-radius:var(--r2);color:var(--grn);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .15s var(--ease);min-height:44px}
.fill-all-btn:active{transform:scale(.97);background:rgba(48,209,88,.18)}

/* ══ EXERCISE ACTION BAR (tydeligere knapper) ══ */
.ex-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)}
.ex-act{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;background:var(--bg2);border:1px solid var(--bdr);border-radius:100px;color:var(--mut);font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.3px;cursor:pointer;transition:all .15s var(--ease);min-height:36px}
.ex-act:active{transform:scale(.94)}
.ex-act.on{background:rgba(255,214,10,.12);border-color:rgba(255,214,10,.4);color:var(--acc)}
.ex-act.danger{color:var(--red);border-color:rgba(255,69,58,.25)}
.ex-act.danger:active{background:rgba(255,69,58,.12)}
.prog-date-input{background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:14px;padding:10px 14px;border-radius:var(--r2);outline:none;text-align:center;margin:10px 0}
.prog-date-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,214,10,.1)}
.prog-done{background:linear-gradient(150deg,rgba(255,69,58,.06) 0%,rgba(255,214,10,.08) 50%,rgba(48,209,88,.06) 100%);border:1px solid rgba(255,214,10,.2);border-radius:var(--r);padding:24px 20px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.prog-done .pd-emoji{font-size:56px;display:block;margin-bottom:12px}
.prog-done .pd-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;background:linear-gradient(135deg,#fff 0%,var(--acc) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.prog-done .pd-sub{font-size:13px;color:var(--mut);line-height:1.7;margin-bottom:16px;font-family:'DM Mono',monospace}
.prog-done .pd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.prog-done .pd-stat{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:10px 8px}
.prog-done .pd-stat label{font-size:8px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:4px}
.prog-done .pd-stat span{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;color:var(--acc)}

/* ══ AI COACH ══ */
.ai-settings{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.ai-settings-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;min-height:44px}
.ai-settings-head .arrow{transition:transform .25s var(--spring);font-size:11px;color:var(--acc)}
.ai-settings.open .ai-settings-head .arrow{transform:rotate(90deg)}
.ai-settings-body{display:none;margin-top:14px}
.ai-settings.open .ai-settings-body{display:block}
.ai-settings-status{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;padding:4px 10px;border-radius:100px}
.ai-settings-status.ok{background:rgba(48,209,88,.12);color:var(--grn);border:1px solid rgba(48,209,88,.25)}
.ai-settings-status.miss{background:rgba(255,69,58,.12);color:var(--red);border:1px solid rgba(255,69,58,.25)}
.ai-field{margin-bottom:14px}
.ai-field label{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
.ai-field input,.ai-field select{width:100%;background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);border-radius:var(--r2);padding:10px 12px;font-family:'DM Mono',monospace;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.ai-field input:focus,.ai-field select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,214,10,.1)}
.ai-field .hint-line{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6}
.ai-field .hint-line a{color:var(--acc);text-decoration:none}
.ai-btn{background:var(--acc);color:#000;border:none;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:10px 18px;border-radius:100px;cursor:pointer;text-transform:uppercase;transition:transform .15s var(--spring);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ai-btn .ic{width:15px;height:15px}
.ai-btn:active{transform:scale(.95)}
.ai-btn:disabled{opacity:.3;cursor:not-allowed}
.ai-btn.ghost{background:transparent;color:var(--mut);border:1.5px solid var(--bdr)}
.ai-btn.ghost:hover{color:var(--txt);border-color:var(--mut)}
.ai-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ai-quick-btn{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--txt);transition:all .2s var(--ease);display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;min-height:64px;box-shadow:var(--shadow)}
.ai-quick-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--qc)}
.ai-quick-btn:active{transform:scale(.97)}
.ai-quick-btn:hover{border-color:var(--qc)}
.ai-quick-btn .qi{font-size:22px;flex-shrink:0}
.ai-quick-btn .qt{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px;line-height:1.1;color:var(--qc)}
.ai-quick-btn .qd{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.3}
.ai-chat{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.ai-chat-head{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;background:var(--bg2)}

.ai-chat-head .ai-clear{margin-left:auto;background:none;border:none;color:var(--mut);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;padding:6px 10px;border-radius:8px;min-height:36px}

.ai-msgs{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto}

.ai-bub{max-width:85%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.6}
.ai-msg.user .ai-bub{background:var(--acc);color:#000;border-bottom-right-radius:6px;font-weight:500}
.ai-msg.bot .ai-bub{background:var(--bg2);color:var(--txt);border:1px solid var(--bdr);border-bottom-left-radius:6px}

.ai-bub ul,.ai-bub ol{margin:8px 0 8px 20px}.ai-bub li{margin:4px 0}
.ai-bub code{background:var(--bg);padding:2px 6px;border-radius:5px;font-family:'DM Mono',monospace;font-size:12px;color:var(--acc)}

.ai-typing{display:flex;align-items:center;gap:5px;padding:16px}

.ai-typing span:nth-child(2){animation-delay:.2s}

@keyframes tdot{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.ai-error{background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.25);color:var(--red);padding:12px 16px;border-radius:var(--r2);font-size:13px;line-height:1.5;margin:8px 16px 16px}
.ai-input-row{border-top:1px solid var(--bdr);padding:12px 14px;display:flex;gap:10px;align-items:flex-end;background:var(--bg)}
.ai-input{flex:1;background:var(--bg2);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;border-radius:22px;outline:none;resize:none;min-height:44px;max-height:120px;line-height:1.4;transition:border-color .2s}
.ai-input:focus{border-color:var(--acc)}
.ai-send{background:var(--acc);color:#000;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;flex-shrink:0;transition:transform .15s var(--spring);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,214,10,.2)}

.ai-empty{text-align:center;padding:36px 24px;color:var(--mut)}
.ai-empty .ae-icon{font-size:42px;display:block;margin-bottom:12px;opacity:.5}
.ai-empty .ae-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--txt);letter-spacing:.5px;margin-bottom:8px}
.ai-empty .ae-sub{font-size:12px;font-family:'DM Mono',monospace;line-height:1.8}
.ai-cost-note{font-size:11px;color:var(--mut2);text-align:center;font-family:'DM Mono',monospace;padding:8px 16px;line-height:1.5}

/* ══ LIBRARY ══ */
.lib-search{display:flex;gap:8px;margin-bottom:14px;position:relative;align-items:center}
.lib-search-icon{position:absolute;left:16px;color:var(--mut2);pointer-events:none;display:flex;z-index:1}
.lib-actions{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.lib-action-btn{background:var(--bg2);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.5px;padding:14px 18px;border-radius:var(--r2);cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s var(--ease)}

.lib-action-btn.primary{background:rgba(255,214,10,.08);border-color:rgba(255,214,10,.3);color:var(--acc)}
.lib-action-btn.primary:active{background:rgba(255,214,10,.15)}
.lib-action-btn.ai{background:linear-gradient(135deg,rgba(10,132,255,.1),rgba(191,90,242,.1));border-color:rgba(191,90,242,.3);color:#a070ff}
.lib-action-btn.ai:active{background:linear-gradient(135deg,rgba(10,132,255,.18),rgba(191,90,242,.18))}
.lib-search input{flex:1;background:var(--bg2);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;padding:12px 16px 12px 42px;border-radius:100px;outline:none;transition:border-color .2s,box-shadow .2s}
