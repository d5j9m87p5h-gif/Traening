function readSetupTime(){
  const minInp=document.getElementById('progStartMin');
  const secInp=document.getElementById('progStartSec');
  if(!minInp&&!secInp)return null;
  const m=parseInt(minInp?.value);
  const s=parseInt(secInp?.value)||0;
  if(isNaN(m)||m<=0)return null;
  return m*60+Math.min(s,59);
}

function updateProgPreview(){
  const sec=readSetupTime();
  const weeksSelect=document.getElementById('progWeeks');
  if(sec&&sec>0)PROG.start5kSec=sec;
  if(weeksSelect){const w=parseInt(weeksSelect.value);if(w&&w>=4)PROG.totalWeeks=w}
  saveProg(); // gem live så headeren også opdateres
  updateHeaderWeek();
  const goalSec=Math.round((PROG.start5kSec||2100)*(1-Math.min(0.30,0.02*PROG.totalWeeks)));

      <div style="font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:4px">${fmtSec(PROG.start5kSec||2100)} → ${fmtSec(goalSec)} på ${PROG.totalWeeks} uger</div>`;

}

/* ── GRAPH ── */
function rGraph(){
  const gymExs=[];
  D.filter(d=>d.ex).forEach(d=>{
    dayEx(d).filter(e=>!e.core).forEach(e=>{
      if(!gymExs.find(x=>x.n===e.n))gymExs.push({n:e.n,day:d.full,color:d.color});
    });
  });
  if(selGraph>=gymExs.length)selGraph=0;
  const selEx=gymExs[selGraph]||gymExs[0];
  if(!selEx)return '<div class="hint"><span class="hint-icon">📊</span>Ingen øvelser endnu</div>';
  const pts=[];
  for(let w=1;w<=TW();w++){const v=maxW(gw(w,selEx.day,selEx.n));pts.push(isNaN(v)?null:v)}
  const filled=pts.filter(v=>v!==null);
  const hasData=filled.length>=2;
  const maxV=hasData?Math.max(...filled):100,minV=hasData?Math.min(...filled):0;
  const range=Math.max(maxV-minV,10),padV=range*.2;
  const W2=340,H2=170,pl=42,pr=14,pt2=18,pb=28,iw=W2-pl-pr,ih=H2-pt2-pb;
  function px(w){return pl+((w-1)/7)*iw}
  function py(v){return pt2+ih-(((v-(minV-padV))/(range+2*padV))*ih)}
  const phC=['#4f8ef722','#f0704022','#e0406022'],phR=[[1,3],[4,6],[7,8]];
  let svg=`<svg viewBox="0 0 ${W2} ${H2}" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:10px">`;
  svg+=`<rect width="${W2}" height="${H2}" fill="#0e0e1a" rx="10"/>`;
  phR.forEach(([s,e],i)=>{
    const x1=px(s)-iw/14,x2=px(e)+iw/14;
    svg+=`<rect x="${x1}" y="${pt2}" width="${x2-x1}" height="${ih}" fill="${phC[i]}" rx="4"/>`;
  });
  for(let i=0;i<=4;i++){const y=pt2+(ih/4)*i;svg+=`<line x1="${pl}" y1="${y}" x2="${W2-pr}" y2="${y}" stroke="#ffffff06" stroke-width="1"/>`;}
  if(hasData){
    for(let i=0;i<=2;i++){
      const v=minV-padV+(range+2*padV)*(1-i/2);
      svg+=`<text x="${pl-4}" y="${pt2+(ih/2)*i+4}" text-anchor="end" font-size="8" fill="#3a3a5a" font-family="DM Mono,monospace">${Math.round(v)}</text>`;
    }
  }
  for(let w=1;w<=TW();w++)svg+=`<text x="${px(w)}" y="${H2-6}" text-anchor="middle" font-size="9" fill="#3a3a5a" font-family="DM Mono,monospace">${w}</text>`;
  if(hasData){
    let pathD='',dotPts=[];
    let prev=null;
    for(let w=1;w<=TW();w++){
      const v=pts[w-1];
      if(v!==null){const x=px(w),y=py(v);if(prev===null)pathD+=`M${x},${y}`;else pathD+=` L${x},${y}`;dotPts.push({x,y,v,w});prev={x,y};}
    }
    const fd=dotPts[0],ld=dotPts[dotPts.length-1];
    svg+=`<path d="${pathD} L${ld.x},${pt2+ih} L${fd.x},${pt2+ih} Z" fill="url(#grad)"/>`;
    svg+=`<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${selEx.color}" stop-opacity=".3"/><stop offset="100%" stop-color="${selEx.color}" stop-opacity="0"/></linearGradient></defs>`;
    svg+=`<path d="${pathD}" fill="none" stroke="${selEx.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    dotPts.forEach(({x,y,v})=>{
      svg+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${selEx.color}" stroke="#0e0e1a" stroke-width="2"/>`;
      svg+=`<text x="${x}" y="${y-9}" text-anchor="middle" font-size="9" fill="${selEx.color}" font-family="DM Mono,monospace" font-weight="500">${v}</text>`;
    });
  }else{
    svg+=`<text x="${W2/2}" y="${H2/2}" text-anchor="middle" font-size="11" fill="#3a3a5a" font-family="DM Sans,sans-serif">Ingen data endnu</text>`;
  }
  svg+=`<text x="${W2/2}" y="${H2-1}" text-anchor="middle" font-size="7" fill="#2a2a3a" font-family="DM Mono,monospace">UGE</text>`;
  svg+='</svg>';

  const firstVal=filled[0],lastVal=filled[filled.length-1];
  const totalGain=filled.length>=2?Math.round((lastVal-firstVal)*10)/10:null;

  let h=`<div class="page-title"><div class="page-eyebrow">// Statistik</div><div class="page-h1">Fremgang</div></div>`;
  h+=`<div class="ex-picker">`;
  gymExs.forEach((e,i)=>{
    const on=i===selGraph;
    h+=`<button class="expill${on?' on':''}" style="${on?`background:${e.color}22;border-color:${e.color};color:${e.color}`:''}" onclick="selGraph=${i};render()">${e.n}</button>`;
  });
  h+=`</div>`;
  h+=`<div class="graph-wrap">
    <div class="graph-title" style="color:${selEx.color}">${selEx.n}</div>
    ${totalGain!==null?`<div class="graph-gain" style="color:${totalGain>=0?'#30c080':'#e04060'}">${totalGain>=0?'▲ +':'▼ '}${totalGain} kg totalt over ${filled.length} uger</div>`:'<div class="graph-gain" style="color:var(--mut)">Tilføj mindst 2 ugers data for at se trend</div>'}
    ${svg}
    <div style="display:flex;justify-content:center;gap:14px;margin-top:12px">
      ${['Hypertrofi','Styrke','Peak'].map((l,i)=>`<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:3px;background:${'#4f8ef7 #f07040 #e04060'.split(' ')[i]}33;border:1px solid ${'#4f8ef7 #f07040 #e04060'.split(' ')[i]}55"></div><span style="font-size:9px;color:var(--mut);font-family:'DM Mono',monospace">${l}</span></div>`).join('')}
    </div>
  </div>`;

  h+=`<div class="section-label">🏃 Løbefremgang</div>`;
  D.filter(d=>d.run).forEach(rd=>{
    const paces=[];
    for(let w=1;w<=TW();w++){const v=gw(w,rd.full,'pace');if(v)paces.push({w,v});}
    h+=`<div class="wld" style="margin-bottom:12px;border:1px solid ${rd.color}22">
      <div class="wlh" style="background:${rd.color}12;border-bottom:1px solid ${rd.color}20">
        <span class="wlh-icon">${rd.icon}</span>
        <span class="wlh-text" style="color:${rd.color}">${rd.full} – ${rd.type}</span>
      </div>
      <div style="padding:12px 16px">`;
    if(paces.length===0){
      h+=`<div style="font-size:12px;color:var(--mut2);font-family:'DM Mono',monospace">Ingen løbsdata endnu</div>`;
    }else{
      h+=`<div style="display:flex;gap:8px;flex-wrap:wrap">`;
      paces.forEach(p=>{
        h+=`<div style="background:${rd.color}15;border:1px solid ${rd.color}25;border-radius:10px;padding:8px 12px;text-align:center">
          <div style="font-size:8px;color:var(--mut);font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:3px">UGE ${p.w}</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:${rd.color}">${p.v}</div>
        </div>`;
      });
      h+=`</div>`;
    }
    h+=`</div></div>`;
  });

  // Volumen og streak nederst
  h+=rVolume();
  h+=rStreak();

  return h;
}

      </div>`:''}
    </div>
    <div class="body-field">
      <label>📐 Fedtprocent</label>
      <input type="number" inputmode="decimal" step="0.1" placeholder="—" value="${bd.fat||''}"
        onchange="bodySetField(${bw},'fat',this.value)" onfocus="this.select()">
      <div class="bf-unit">%</div>
      ${fatDiff!==null?`<div class="bf-diff" style="color:${fatDiff<=0?'var(--grn)':'var(--red)'}">

        </div>

          <label class="bp-btn${bd.photoScale?'':' primary'}" for="bpScale${bw}">📱 ${bd.photoScale?'Skift':'Upload'}</label>

}

function bodyNav(dir){bodyWeek=Math.max(1,Math.min(TW(),bodyWeek+dir));render()}

function bodySetField(w,field,val){
  if(!BODY[w])BODY[w]={};
  const num=parseFloat(val);
  if(isNaN(num)||val.trim()===''){delete BODY[w][field]}
  else{BODY[w][field]=num}
  if(!BODY[w].date)BODY[w].date=todayISO();
  saveBody();toast();
  render();
}

function bodyUploadPhoto(w,field,input){
  const file=input.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    // Compress image to max 600px width to keep localStorage manageable
    const img=new Image();
    img.onload=function(){
      const maxW=600,maxH=800;
      let cw=img.width,ch=img.height;
      if(cw>maxW){ch=Math.round(ch*(maxW/cw));cw=maxW}
      if(ch>maxH){cw=Math.round(cw*(maxH/ch));ch=maxH}
      const canvas=document.createElement('canvas');
      canvas.width=cw;canvas.height=ch;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,cw,ch);
      const compressed=canvas.toDataURL('image/jpeg',0.7);
      if(!BODY[w])BODY[w]={};
      BODY[w][field]=compressed;
      if(!BODY[w].date)BODY[w].date=todayISO();
      saveBody();
      toast('✓ Billede gemt');
      render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function bodyRemovePhoto(w,field){
  if(!confirm('Fjern billedet?'))return;
  if(BODY[w])delete BODY[w][field];
  saveBody();toast('✓ Fjernet');render();
}

/* ── STEPS WIDGET (PCOS template) ──────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function rStepsWidget(){
  const today=todayISO();
  const tpl=TEMPLATES[PROG.template||'recomp'];
  const goal=tpl?.dailyStepsGoal||8000;
  const today_steps=STEPS[today]||0;
  const pct=Math.min(100,Math.round(today_steps/goal*100));
  let status='',statusColor='var(--mut)';
  if(today_steps===0){status='Indtast dagens skridt fra din telefon/ur';}
  else if(pct>=100){status=`✓ Mål nået! +${today_steps-goal} over`;statusColor='var(--grn)'}
  else if(pct>=75){status=`Næsten der · mangler ${(goal-today_steps).toLocaleString('da-DK')}`;statusColor='var(--acc)'}
  else if(pct>=50){status=`Godt på vej · mangler ${(goal-today_steps).toLocaleString('da-DK')}`;statusColor='#0a84ff'}
  else{status=`Mangler ${(goal-today_steps).toLocaleString('da-DK')} skridt`;statusColor='var(--mut)'}

  return `<div class="steps-widget">
    <div class="steps-widget-row">
      <div class="steps-icon">🚶‍♀️</div>
      <div class="steps-content">
        <div class="steps-label">Skridt i dag · ${todayISO()}</div>
        <div class="steps-value">

const CYCLE_PHASES=[

  {id:'luteal',emo:'🌙',name:'Luteal',tip:'Nedadgående energi — fokus på vedligeholdelse'},

function rCycleTracker(){
  const today=todayISO();
  const cur=CYCLE[today]?.phase||null;

  let h=`<div class="cycle-section">
    <div class="cycle-title">🌸 Cyklus i dag</div>

    <div class="cycle-phases">`;
  CYCLE_PHASES.forEach(p=>{
    h+=`<button class="cycle-phase${cur===p.id?' on':''}" onclick="setCyclePhase('${today}','${p.id}')">
      <div class="cp-emo">${p.emo}</div>
      <div class="cp-name">${p.name}</div>

function setCyclePhase(date,phase){

  if(CYCLE[date].phase===phase){delete CYCLE[date].phase}
  else{CYCLE[date].phase=phase}
  saveCycle();
  render();
}

function rBodyGraph(){
  const pts=[],fatPts=[];
  for(let w=1;w<=TW();w++){
    const b=BODY[w]||{};
    pts.push(b.kg?b.kg:null);
    fatPts.push(b.fat?b.fat:null);
  }
  const kgFilled=pts.filter(v=>v!==null);
  const fatFilled=fatPts.filter(v=>v!==null);
  const hasKg=kgFilled.length>=2,hasFat=fatFilled.length>=2;
  if(!hasKg&&!hasFat)return'<div class="body-graph"><div class="body-graph-title">Vægt & Fedt Trend</div><div class="body-graph-sub" style="color:var(--mut2)">Tilføj mindst 2 ugers data for at se trend</div></div>';

  const W2=340,H2=180,pl=46,pr=14,pt2=20,pb=30;
  const iw=W2-pl-pr,ih=H2-pt2-pb;
  function px(w){return pl+((w-1)/7)*iw}

  let svg=`<svg viewBox="0 0 ${W2} ${H2}" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:10px">`;
  svg+=`<rect width="${W2}" height="${H2}" fill="#0c0c0e" rx="10"/>`;

  // Grid
  for(let i=0;i<=4;i++){const y=pt2+(ih/4)*i;svg+=`<line x1="${pl}" y1="${y}" x2="${W2-pr}" y2="${y}" stroke="#ffffff06" stroke-width="1"/>`;}
  for(let w=1;w<=TW();w++)svg+=`<text x="${px(w)}" y="${H2-8}" text-anchor="middle" font-size="9" fill="#48484a" font-family="DM Mono,monospace">${w}</text>`;
  svg+=`<text x="${W2/2}" y="${H2-1}" text-anchor="middle" font-size="7" fill="#38383a" font-family="DM Mono,monospace">UGE</text>`;

  // Draw kg line (blue)
  if(hasKg){
    const maxV=Math.max(...kgFilled),minV=Math.min(...kgFilled);
    const range=Math.max(maxV-minV,2),padV=range*.25;
    function pyKg(v){return pt2+ih-(((v-(minV-padV))/(range+2*padV))*ih)}
    let pathD='',dots=[];
    for(let w=1;w<=TW();w++){if(pts[w-1]!==null){const x=px(w),y=pyKg(pts[w-1]);pathD+=(dots.length===0?'M':'L')+x+','+y;dots.push({x,y,v:pts[w-1]})}}
    svg+=`<path d="${pathD}" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    dots.forEach(d=>{
      svg+=`<circle cx="${d.x}" cy="${d.y}" r="4" fill="#0a84ff" stroke="#0c0c0e" stroke-width="2"/>`;
      svg+=`<text x="${d.x}" y="${d.y-9}" text-anchor="middle" font-size="8" fill="#0a84ff" font-family="DM Mono,monospace" font-weight="500">${d.v}</text>`;
    });
  }

  // Draw fat% line (purple)
  if(hasFat){
    const maxF=Math.max(...fatFilled),minF=Math.min(...fatFilled);
    const rangeF=Math.max(maxF-minF,2),padF=rangeF*.25;
    function pyFat(v){return pt2+ih-(((v-(minF-padF))/(rangeF+2*padF))*ih)}
    let pathF='',dotsF=[];
    for(let w=1;w<=TW();w++){if(fatPts[w-1]!==null){const x=px(w),y=pyFat(fatPts[w-1]);pathF+=(dotsF.length===0?'M':'L')+x+','+y;dotsF.push({x,y,v:fatPts[w-1]})}}
    svg+=`<path d="${pathF}" fill="none" stroke="#bf5af2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 3"/>`;
    dotsF.forEach(d=>{
      svg+=`<circle cx="${d.x}" cy="${d.y}" r="3.5" fill="#bf5af2" stroke="#0c0c0e" stroke-width="2"/>`;
      svg+=`<text x="${d.x}" y="${d.y+14}" text-anchor="middle" font-size="8" fill="#bf5af2" font-family="DM Mono,monospace">${d.v}%</text>`;
    });
  }
  svg+='</svg>';

  // Summary stats
  const kgChange=hasKg?Math.round((kgFilled[kgFilled.length-1]-kgFilled[0])*10)/10:null;
  const fatChange=hasFat?Math.round((fatFilled[fatFilled.length-1]-fatFilled[0])*10)/10:null;

  let h=`<div class="body-graph">
    <div class="body-graph-title">Vægt & Fedt Trend</div>
    <div class="body-graph-sub">
      ${hasKg?`<span style="color:#0a84ff">● Vægt${kgChange!==null?' ('+(kgChange>=0?'+':'')+kgChange+' kg)':''}</span> `:''}
      ${hasFat?`<span style="color:#bf5af2">● Fedt%${fatChange!==null?' ('+(fatChange>=0?'+':'')+fatChange+'%)':''}</span>`:''}
    </div>
    ${svg}
  </div>`;
  return h;
}

// Build context summary of all training data
function buildTrainingContext(){
  // === DATO & DAGENS TRÆNING ===
  const now=new Date();
  const todayStr=now.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const todayIdx=todayDayIdx();
  const todayD=D[todayIdx];
  const cw=currentWeek();
  const programDone=isProgramDone();

  let ctx='';

  // === PERSONLIG PROFIL (vises altid hvis udfyldt) ===
  if(PROFILE.completed&&!PROFILE.skipped){
    ctx+='=== PERSONLIG PROFIL ===\n';
    if(PROFILE.gender&&PROFILE.gender!=='private'){ctx+=`Køn: ${PROFILE.gender==='male'?'Mand':'Kvinde'}\n`}
    if(PROFILE.age)ctx+=`Alder: ${PROFILE.age} år\n`;
    if(PROFILE.height)ctx+=`Højde: ${PROFILE.height} cm\n`;
    if(PROFILE.weight)ctx+=`Vægt: ${PROFILE.weight} kg\n`;
    const bmi=pcosBMI();
    if(bmi)ctx+=`BMI: ${bmi}\n`;
    if(PROFILE.goalWeight)ctx+=`Mål-vægt: ${PROFILE.goalWeight} kg\n`;
    if(PROFILE.experience){
      const exMap={beginner:'Begynder (<1 år)',some:'Mellem (1-3 år)',experienced:'Erfaren (3+ år)'};
      ctx+=`Erfaring: ${exMap[PROFILE.experience]||PROFILE.experience}\n`;
    }
    if(PROFILE.injuries)ctx+=`Skader/begrænsninger: ${PROFILE.injuries}\n`;
    const tdee=calcTDEE(),target=calcCalorieTarget(),protein=calcProteinTarget();
    if(tdee)ctx+=`TDEE: ${tdee} kcal\n`;
    if(target)ctx+=`Anbefalede daglige kalorier: ${target} kcal\n`;
    if(protein)ctx+=`Anbefalet protein: ${protein} g/dag\n`;
    ctx+='\n';
  }

  ctx+='=== I DAG ===\n';
  ctx+=`Dato: ${todayStr}\n`;
  ctx+=`Dagens dag: ${todayD.full} – ${todayD.type} (${todayD.label})\n`;
  if(todayD.run){
    ctx+=`Dagens træning: ${todayD.run.type} – ${todayD.run.dur} @ ${todayD.run.pace}. ${todayD.run.tip}\n`;
  }else if(todayD.ex){
    const exs=dayEx(todayD);
    ctx+=`Dagens øvelser: ${exs.map(e=>e.n).join(', ')}\n`;
    // Vis hvad brugeren løftede sidste uge for at hjælpe coach foreslå vægte
    if(cw>=2&&cw<=TW()){
      const prevW=cw-1;
      const prevWeights=exs.filter(e=>!e.core).map(e=>{
        const v=gw(prevW,todayD.full,e.n);return v?`${e.n}: ${v} kg`:null;
      }).filter(Boolean);
      if(prevWeights.length)ctx+=`Sidste uge (uge ${prevW}) på denne dag: ${prevWeights.join(', ')}\n`;
    }
  }else{
    ctx+=`Dagens træning: Hvile (restitution).\n`;
  }
  if(PROG.startDate){
    ctx+=`Program startdato: ${fmtDate(PROG.startDate)}\n`;
    if(programDone){
      ctx+=`STATUS: Programmet er FÆRDIGT – brugeren har gennemført hele programmet! Foreslå hvad de skal nu (nyt forløb, nye mål, deload, etc).\n`;
    }else{
      ctx+=`Programuge: ${cw} af ${TW()} (${GP[gymPhase(cw)].name}-fase)\n`;
      ctx+=`5km mål: ${fmtSec(PROG.start5kSec||2100)} → under ${fmtSec(goal5kSec())} på ${TW()} uger\n`;
    }
  }else{
    ctx+=`Program ikke startet endnu (ingen startdato sat).\n`;
    ctx+=`Estimeret aktuel uge (fra data): ${cw}\n`;
  }

  // === PROGRAM ===
  ctx+=`\n=== TRÆNINGSPROGRAM ===\n`;
  ctx+=`${TW()}-ugers Recomp + 5km løb. Start: ${fmtSec(PROG.start5kSec||2100)}, mål: under ${fmtSec(goal5kSec())}.\n`;
  ctx+='Ugentligt skema:\n';
  D.forEach(d=>{
    const exs=dayEx(d);
    if(exs){
      ctx+=`  ${d.full} (${d.type}): ${exs.map(e=>e.n).join(', ')}\n`;
    }else if(d.run){
      ctx+=`  ${d.full} (${d.type}): ${d.run.dur} @ ${d.run.pace}\n`;
    }else{
      ctx+=`  ${d.full}: Hvile\n`;
    }
  });
  ctx+='\nFaser:\n';
  GP.forEach((p,i)=>{
    ctx+=`  Uge ${['1-3','4-6','7-8'][i]} – ${p.name}: compound ${p.c.s} sæt × ${p.c.r}, isolation ${p.i.s} sæt × ${p.i.r} (${p.tip})\n`;
  });
  PH.forEach(p=>{
    ctx+=`  ${p.w} – Løb ${p.l}: Tir ${p.wd}, Fre ${p.sa}, Mål ${p.g}\n`;
  });

  ctx+='\n=== LOGGEDE DATA ===\n';
  let anyData=false;
  for(let w=1;w<=TW();w++){
    let weekData='';
    D.forEach(d=>{
      const exs=dayEx(d);
      if(exs){
        exs.filter(e=>!e.core).forEach(e=>{
          const v=gw(w,d.full,e.n);
          if(v){weekData+=`  ${d.full} ${e.n}: ${v} kg\n`;anyData=true}
        });
      }else if(d.run){
        const tid=gw(w,d.full,'tid'),pace=gw(w,d.full,'pace'),km=gw(w,d.full,'km'),note=gw(w,d.full,'note');
        if(tid||pace||km){
          weekData+=`  ${d.full} løb: tid=${tid||'-'}, pace=${pace||'-'}, km=${km||'-'}`;
          if(note)weekData+=`, noter: "${note}"`;
          weekData+='\n';
          anyData=true;
        }
      }
    });
    if(weekData)ctx+=`Uge ${w}:\n${weekData}`;
  }
  if(!anyData)ctx+='(Ingen data logget endnu)\n';

  // Custom exercises
  const allCust=Object.entries(CUSTOM).filter(([_,arr])=>arr&&arr.length);
  if(allCust.length){
    ctx+='\n=== TILFØJEDE ØVELSER ===\n';
    allCust.forEach(([day,arr])=>{
      ctx+=`${day}: ${arr.map(e=>e.n).join(', ')}\n`;
    });
  }

  // Kropsdata
  const bodyEntries=Object.entries(BODY).filter(([_,v])=>v.kg||v.fat).sort((a,b)=>a[0]-b[0]);
  if(bodyEntries.length){
    ctx+='\n=== KROPSDATA ===\n';
    bodyEntries.forEach(([w,v])=>{
      ctx+=`Uge ${w}: ${v.kg?v.kg+' kg':''}${v.kg&&v.fat?' · ':''}${v.fat?v.fat+'% fedt':''}${v.date?' ('+v.date+')':''}\n`;
    });
    // Beregn ændringer
    const first=bodyEntries[0][1],last=bodyEntries[bodyEntries.length-1][1];
    if(bodyEntries.length>=2){
      if(first.kg&&last.kg){const d=Math.round((last.kg-first.kg)*10)/10;ctx+=`Vægtændring: ${d>=0?'+':''}${d} kg\n`}
      if(first.fat&&last.fat){const d=Math.round((last.fat-first.fat)*10)/10;ctx+=`Fedtændring: ${d>=0?'+':''}${d}%\n`}
    }
  }

  // PCOS-relevant data: profil, skridt og cyklus
  const tpl=TEMPLATES[PROG.template||'recomp'];
  if(tpl?.needsSteps){
    if(PCOS_PROFILE.completed&&!PCOS_PROFILE.skipped){
      ctx+='\n=== PCOS PROFIL ===\n';
      const bmi=pcosBMI();
      if(bmi)ctx+=`BMI: ${bmi}${bmi<25?' (lean PCOS)':bmi<30?' (let overvægt)':' (overvægt)'}\n`;
      if(PCOS_PROFILE.height)ctx+=`Højde: ${PCOS_PROFILE.height} cm\n`;
      if(PCOS_PROFILE.weight)ctx+=`Vægt: ${PCOS_PROFILE.weight} kg\n`;
      if(PCOS_PROFILE.goal)ctx+=`Mål: ${PCOS_PROFILE.goal}\n`;
      if(PCOS_PROFILE.cycleStatus)ctx+=`Cyklus-status: ${PCOS_PROFILE.cycleStatus}\n`;
      if(PCOS_PROFILE.experience)ctx+=`Erfaring: ${PCOS_PROFILE.experience}\n`;
      if(PCOS_PROFILE.onMedication&&PCOS_PROFILE.onMedication!=='private')ctx+=`Medicin: ${PCOS_PROFILE.onMedication==='yes'?'Ja':'Nej'}\n`;
    }
    const recentSteps=Object.entries(STEPS).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,7);
    if(recentSteps.length){
      ctx+='\n=== SKRIDT (sidste 7 dage) ===\n';
      const goal=tpl.dailyStepsGoal||8000;
      recentSteps.forEach(([d,s])=>{ctx+=`${d}: ${s.toLocaleString('da-DK')} skridt${s>=goal?' ✓':' ('+(goal-s)+' under mål)'}\n`});
      const avg=Math.round(recentSteps.reduce((a,[,s])=>a+s,0)/recentSteps.length);
      ctx+=`Gennemsnit: ${avg.toLocaleString('da-DK')} (mål ${goal.toLocaleString('da-DK')})\n`;
    }
    const recentCycle=Object.entries(CYCLE).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,14);
    if(recentCycle.length){
      ctx+='\n=== CYKLUS (sidste indgange) ===\n';
      recentCycle.forEach(([d,c])=>{
        const phase=CYCLE_PHASES.find(p=>p.id===c.phase);
        if(phase)ctx+=`${d}: ${phase.name}\n`;
      });
    }
  }

  return ctx;
}

async function callClaude(userMessage){
  if(!AI.apiKey)throw new Error('Indtast først din API-nøgle i indstillinger.');

  const ctx=buildTrainingContext();

  // Byg Gemini "contents"-format. Gemini bruger 'model' som rolle for assistant,
  // og 'parts:[{text}]' i stedet for content-strings.
  const contents=[];
  const recent=AI.messages.slice(-10);
  recent.forEach(m=>{
    contents.push({
      role:m.role==='assistant'?'model':'user',
      parts:[{text:m.content}]
    });
  });
  // Tilføj den nye besked med kontekst
  contents.push({
    role:'user',
    parts:[{text:`<træningsdata>\n${ctx}\n</træningsdata>\n\n${userMessage}`}]
  });

  const model=AI.model||'gemini-2.5-flash';
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;

  const res=await fetch(url,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-goog-api-key':AI.apiKey
    },
    body:JSON.stringify({
      contents,
      systemInstruction:{parts:[{text:getSystemPrompt()}]},
      generationConfig:{
        maxOutputTokens:1500,
        temperature:1
      }
    })
  });

  if(!res.ok){
    let errMsg=`API fejl ${res.status}`;
    try{const err=await res.json();errMsg=err?.error?.message||errMsg;}catch(e){}
    if(res.status===400&&errMsg.toLowerCase().includes('api key'))errMsg='Ugyldig API-nøgle. Tjek din nøgle i indstillinger.';
    else if(res.status===403)errMsg='Adgang nægtet. Tjek at API-nøglen er aktiv på aistudio.google.com.';
    else if(res.status===429)errMsg='Daglig grænse nået (1500 forespørgsler/dag på Flash). Vent til i morgen, eller skift model.';
    else if(res.status===404||(res.status===400&&errMsg.toLowerCase().includes('model')))errMsg=`Modellen "${model}" blev ikke fundet. Skift til Gemini 2.5 Flash i indstillinger.`;
    else if(res.status===503)errMsg='Google har midlertidig overbelastning. Prøv igen om et øjeblik.';
    throw new Error(errMsg);
  }

  const data=await res.json();
  // Gemini-svar: data.candidates[0].content.parts[0].text
  const candidate=data?.candidates?.[0];
  if(!candidate)throw new Error('Tomt svar fra Gemini. Prøv igen.');
  if(candidate.finishReason==='SAFETY')throw new Error('Svaret blev blokeret af Geminis sikkerhedsfilter.');
  const text=(candidate.content?.parts||[]).filter(p=>p.text).map(p=>p.text).join('\n').trim();
  if(!text)throw new Error('Tomt tekstsvar — modellen returnerede intet.');
  return text;
}

let aiBusy=false;

async function sendAIMessage(custom){
  if(aiBusy)return;
  const inp=document.getElementById('aiInput');
  const userMsg=custom||inp.value.trim();
  if(!userMsg)return;
  if(!AI.apiKey){toast('Tilføj først API-nøgle');return}

  AI.messages.push({role:'user',content:userMsg});
  if(!custom)inp.value='';
  saveAI();
  aiBusy=true;
  renderChat();
  showTyping();

  try{
    const reply=await callClaude(userMsg);
    AI.messages.push({role:'assistant',content:reply});
    saveAI();
  }catch(e){
    showAIError(e.message||'Ukendt fejl');
    AI.messages.pop(); // remove user msg on error so they can try again
    saveAI();
  }finally{
    aiBusy=false;
    hideTyping();
    renderChat();
  }
}

  }else if(kind==='next'){

      else{

        prompt=`Foreslå konkrete vægte til alle øvelser i Uge ${next}. Brug min sidste loggede uge som basis. ${phaseChange} Vær specifik: "Øvelse: X kg".`;
      }

function md2html(text){
  let s=escHtml(text);
  // Code
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // Bold + italic
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
  // Bullet lists
  s=s.replace(/^[ \t]*[-•*][ \t]+(.+)$/gm,'<li>$1</li>');
  // Numbered lists
  s=s.replace(/^[ \t]*\d+\.[ \t]+(.+)$/gm,'<li>$1</li>');
  // Wrap consecutive <li>s in <ul>
  s=s.replace(/(<li>[\s\S]*?<\/li>(?:\s*<li>[\s\S]*?<\/li>)*)/g,m=>'<ul>'+m+'</ul>');
  s=s.replace(/<\/ul>\s*<ul>/g,'');
  // Paragraphs from double newlines
  const blocks=s.split(/\n{2,}/);
  return blocks.map(b=>{
    b=b.trim();
    if(!b)return'';
    if(b.startsWith('<ul>')||b.startsWith('<li>'))return b;
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

let restTimerInterval=null,restTimerEnd=0;

function startRestTimer(exType){
  // exType: 'c'=compound (150s), 'i'=isolation (75s), 'x'=core (45s), 'ss'=superset transition (20s)
  const durations={c:150,i:75,x:45,ss:20};
  const labels={c:'Pause',i:'Pause',x:'Pause',ss:'Skift øvelse'};
  const secs=durations[exType]||90;
  const label=labels[exType]||'Pause';
  restTimerEnd=Date.now()+secs*1000;
  const el=document.getElementById('restTimer');
  el.classList.remove('done');
  el.classList.add('show');
  el.querySelector('.rt-label').textContent=label;
  clearInterval(restTimerInterval);
  restTimerInterval=setInterval(()=>{
    const left=Math.max(0,Math.ceil((restTimerEnd-Date.now())/1000));
    const m=Math.floor(left/60),s=left%60;
    el.querySelector('.rt-time').textContent=m+':'+String(s).padStart(2,'0');
    if(left<=0){
      clearInterval(restTimerInterval);
      el.classList.add('done');
      el.querySelector('.rt-time').textContent='GÅ!';
      try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
      setTimeout(()=>dismissTimer(),4000);
    }
  },250);
}

function dismissTimer(){
  clearInterval(restTimerInterval);
  const el=document.getElementById('restTimer');
  el.classList.remove('show','done');
}

/* ── PR TRACKING ───────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function getPR(day,exName){
  let best=0;
  for(let w=1;w<=TW();w++){
    const v=maxW(gw(w,day,exName));
    if(!isNaN(v)&&v>best)best=v;
  }
  return best||0;
}

function checkAndCelebratePR(day,exName,newVal){
  const newMax=maxW(newVal);
  if(isNaN(newMax)||newMax<=0)return;
  // Check all OTHER weeks for previous best
  let prevBest=0;
  for(let w=1;w<=TW();w++){
    const v=maxW(gw(w,day,exName));
    if(!isNaN(v)&&v>prevBest)prevBest=v;
  }
  // If newMax equals prevBest, it might BE this entry. Compare against truly previous
  // The new value is already stored at this point, so prevBest includes it
  // We need to check: is this the ONLY time this max appears?
  if(newMax>=prevBest&&newMax>0){
    // Count how many weeks have this max
    let maxCount=0;
    for(let w=1;w<=TW();w++){
      const v=maxW(gw(w,day,exName));
      if(v===newMax)maxCount++;
    }
    if(maxCount===1){showPRCelebration()} // first time hitting this weight
  }
}

function showPRCelebration(){
  const el=document.getElementById('prToast');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  fireConfetti();
  try{navigator.vibrate&&navigator.vibrate([100,50,100,50,200])}catch(e){}
  setTimeout(()=>el.classList.remove('show'),1200);
}

function isPR(day,exName,week){
  const thisMax=maxW(gw(week,day,exName));
  if(isNaN(thisMax)||thisMax<=0)return false;
  const pr=getPR(day,exName);
  return thisMax>=pr;
}

/* ── SUPERSET GROUPING ─────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
const SSK='tw4_ss';
let SUPERSETS={};// { "Mandag": [[0,1],[3,4]], ... } pairs of exercise indices
try{SUPERSETS=JSON.parse(localStorage.getItem(SSK)||'{}')}catch(e){}

// Default superset-forslag baseret på øvelsesnavne (push/pull, antagonister, arme)
const DEFAULT_SS_PAIRS={
  "Mandag":[["Bænkpres (flad)","Bent-over Rows"]],
  "Onsdag":[["Leg Curl","Calf Raises"]],
  "Torsdag":[["Biceps Curl (kabel)","Triceps Pushdown"]],
  "Lørdag":[["Leg Curl (liggende)","Tibialis Raises"]]
};

// Konvertér default-par til indices baseret på dagens øvelser. Kører kun første gang.
function applyDefaultSupersets(){
  if(localStorage.getItem('tw4_ss_init'))return;
  Object.entries(DEFAULT_SS_PAIRS).forEach(([dayFull,pairs])=>{
    const dayObj=D.find(o=>o.full===dayFull);
    if(!dayObj||!dayObj.ex)return;
    const exNames=dayObj.ex.map(e=>e.n);
    if(!SUPERSETS[dayFull])SUPERSETS[dayFull]=[];
    pairs.forEach(([a,b])=>{
      const ai=exNames.indexOf(a),bi=exNames.indexOf(b);
      if(ai>=0&&bi>=0&&!SUPERSETS[dayFull].some(p=>p[0]===ai||p[1]===ai||p[0]===bi||p[1]===bi)){
        SUPERSETS[dayFull].push([ai,bi]);
      }
    });
  });
  saveSS();
  try{localStorage.setItem('tw4_ss_init','1')}catch(e){}
}
applyDefaultSupersets();

function saveSS(){try{localStorage.setItem(SSK,JSON.stringify(SUPERSETS))}catch(e){}}

function toggleSuperset(dayFull,idx){
  if(!SUPERSETS[dayFull])SUPERSETS[dayFull]=[];
  const pairs=SUPERSETS[dayFull];
  const existing=pairs.findIndex(p=>p[0]===idx||p[1]===idx);
  if(existing>=0){
    pairs.splice(existing,1);
    toast('Superset fjernet');
  }else{
    // Pair with next exercise that isn't already in a superset
    const dayObj=D.find(o=>o.full===dayFull);
    const exs=dayObj?dayEx(dayObj):null;
    if(!exs)return;
    let partner=-1;
    for(let i=idx+1;i<exs.length;i++){
      if(!exs[i].core&&!pairs.some(p=>p[0]===i||p[1]===i)){partner=i;break}
    }
    if(partner<0){toast('Ingen tilgængelig partner');return}
    pairs.push([idx,partner]);
    toast('✓ Superset markeret');
  }
  saveSS();render();
}

function isInSuperset(dayFull,idx){
  const pairs=SUPERSETS[dayFull]||[];
  return pairs.some(p=>p[0]===idx||p[1]===idx);
}

function isSupersetPartner(dayFull,idx){
  const pairs=SUPERSETS[dayFull]||[];
  const pair=pairs.find(p=>p[0]===idx||p[1]===idx);
  if(!pair)return null;
  return pair[0]===idx?pair[1]:pair[0];
}

function getRestTypeForSuperset(dayFull,exIdx,exType){
  // Superset: kort 20-sek "skift øvelse"-pause for første i par, normal pause efter andet
  const pairs=SUPERSETS[dayFull]||[];
  const pair=pairs.find(p=>p[0]===exIdx||p[1]===exIdx);
  if(!pair)return exType; // ikke i superset → normal pause
  if(pair[1]===exIdx)return exType; // andet i par → normal pause
  return 'ss'; // første i par → kort overgangs-pause
}

function readMinSec(minId,secId){
  const m=parseInt(document.getElementById(minId)?.value);
  const s=parseInt(document.getElementById(secId)?.value)||0;
  if(isNaN(m)||m<0)return null;
  return m*60+Math.min(Math.max(s,0),59);
}
function setMinSec(minId,secId,totalSec){
  const m=Math.floor(totalSec/60),s=Math.round(totalSec%60);
  const minEl=document.getElementById(minId),secEl=document.getElementById(secId);
  if(minEl&&document.activeElement!==minEl)minEl.value=m;
  if(secEl&&document.activeElement!==secEl)secEl.value=String(s).padStart(2,'0');
}

function calcPace(){
  const result=document.getElementById('pcResult');
  if(!result)return;
  const dist=parseFloat(document.getElementById('pcDist')?.value);
  const totalSec=readMinSec('pcTimeMin','pcTimeSec');
  if(!dist||dist<=0){result.textContent='Indtast en gyldig distance';return}
  if(!totalSec||totalSec<=0){result.textContent='Indtast tid (min + sek)';return}
  const paceSec=Math.round(totalSec/dist);
  setMinSec('pcPaceMin','pcPaceSec',paceSec);
  const kmh=Math.round(dist/(totalSec/3600)*10)/10;
  result.textContent=`${fmtSec(paceSec)} /km · ${kmh} km/t · ${fmtSec(totalSec)} total`;
}

function calcPaceReverse(){
  const result=document.getElementById('pcResult');
  if(!result)return;
  const dist=parseFloat(document.getElementById('pcDist')?.value);
  const paceSec=readMinSec('pcPaceMin','pcPaceSec');
  if(!dist||dist<=0){result.textContent='Indtast en gyldig distance';return}
  if(!paceSec||paceSec<=0){result.textContent='Indtast pace (min + sek)';return}
  const totalSec=Math.round(paceSec*dist);
  setMinSec('pcTimeMin','pcTimeSec',totalSec);
  const kmh=Math.round(3600/paceSec*10)/10;
  result.textContent=`${fmtSec(totalSec)} total · ${kmh} km/t · ${fmtSec(paceSec)} /km`;
}

  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.tw4&&!data._version){throw new Error('Ugyldigt format')}
      if(!confirm('Importér backup?\n\nDette overskriver alle nuværende data. Kan ikke fortrydes.'))return;
      if(data.tw4){W=data.tw4;save()}
      if(data.tw4_custom){CUSTOM=data.tw4_custom;saveCustom()}
      if(data.tw4_ai){AI={...AI,...data.tw4_ai};saveAI()}
      if(data.tw4_prog){PROG={...PROG,...data.tw4_prog};saveProg()}
      if(data.tw4_body){BODY=data.tw4_body;saveBody()}
      if(data.tw4_ss){SUPERSETS=data.tw4_ss;saveSS()}
      if(data.tw4_steps){STEPS=data.tw4_steps;saveSteps()}

      if(data.tw4_pcos_profile){PCOS_PROFILE=data.tw4_pcos_profile;savePcosProfile()}
      if(data.tw4_profile){PROFILE=data.tw4_profile;saveProfile()}
      toast('✓ Data importeret');
      render();
    }catch(err){
      toast('Fejl: '+err.message);
    }
  };
  reader.readAsText(file);
}

/* ── ESTIMATED 1RM (Epley formula) ─────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function estimate1RM(weight,reps){
  if(!weight||!reps||weight<=0||reps<=0)return 0;
  return Math.round(weight*(1+reps/30));
}
function estimateExercise1RM(week,day,name,e){
  const w=maxW(gw(week,day,name));
  if(isNaN(w)||w<=0)return null;
  // Use upper rep bound from current phase
  const sr=exSR(e,week);
  const repStr=String(sr.r);
  const upperRep=parseInt(repStr.split('–').pop())||parseInt(repStr)||10;
  return estimate1RM(w,upperRep);
}

  const cont=document.getElementById('confetti');
  if(!cont)return;
  cont.classList.add('show');
  cont.innerHTML='';
  const colors=['#ffd60a','#0a84ff','#30d158','#ff453a','#bf5af2','#ff6f40'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div');
    el.className='cf';
    el.style.left=Math.random()*100+'%';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay=(Math.random()*.3)+'s';
    el.style.animationDuration=(1.2+Math.random()*1)+'s';
    cont.appendChild(el);
  }
  setTimeout(()=>{cont.classList.remove('show');cont.innerHTML=''},2400);
}

/* ═══════════════════════════════════════════════════════════ */
/* ── VOLUME TRACKING ───────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
// Map exercise names to muscle groups
const MUSCLE_MAP={
  // Bryst
  "Bænkpres (flad)":"chest","Incline Bænkpres":"chest","Decline Bænkpres":"chest","Dumbbell Press":"chest","Incline DB Press":"chest","Dumbbell Flyes":"chest","Cable Flyes":"chest","Push-ups":"chest","Dips (bryst)":"chest","Pec Deck":"chest","Close-Grip Bench":"chest",
  // Ryg
  "Bent-over Rows":"back","Pullups":"back","Pullups / Lat Pulldown":"back","Lat Pulldown":"back","Pendlay Row":"back","Seated Cable Row":"back","Kabel Rows":"back","T-Bar Row":"back","Dumbbell Row":"back","Deadlift":"back","Rack Pull":"back","Inverted Row":"back","Face Pull":"back","Facepulls":"back","Shrugs":"back","Underhaands Pulldown":"back",
  // Skuldre
  "Overhead Press":"shoulders","DB Shoulder Press":"shoulders","Arnold Press":"shoulders","Lateral Raise":"shoulders","Front Raise":"shoulders","Reverse Flyes":"shoulders","Cable Lateral Raise":"shoulders","Upright Row":"shoulders",
  // Ben
  "Squat":"legs","Front Squat":"legs","Hack Squat":"legs","Hack Squat / Benpres":"legs","Leg Press":"legs","Romanian Deadlift":"legs","Sumo Deadlift":"legs","Walking Lunges":"legs","Bulgarian Split Squat":"legs","Goblet Squat":"legs","Leg Curl":"legs","Leg Curl (siddende)":"legs","Leg Curl (liggende)":"legs","Leg Extension":"legs","Hip Thrust":"legs","Glute Bridge":"legs","Calf Raises":"legs","Calf Raises (stående)":"legs","Calf Raises (siddende)":"legs","Tibialis Raises":"legs",
  // Arme
  "Biceps Curl (stang)":"arms","Biceps Curl (DB)":"arms","Biceps Curl (kabel)":"arms","Hammer Curl":"arms","Cable Curl":"arms","Preacher Curl":"arms","Concentration Curl":"arms","Triceps Pushdown":"arms","Overhead Tri Extension":"arms","Skull Crushers":"arms","Dips (triceps)":"arms"
};
const MUSCLE_INFO={
  chest:{n:"Bryst",c:"#0a84ff",emo:"💪"},
  back:{n:"Ryg",c:"#bf5af2",emo:"🔙"},
  legs:{n:"Ben",c:"#ff6f40",emo:"🦵"},
  shoulders:{n:"Skuldre",c:"#30d158",emo:"🏔️"},
  arms:{n:"Arme",c:"#ff453a",emo:"💥"}
};

function calcWeeklyVolume(w){
  // returns {muscle: totalVolume}
  const vol={chest:0,back:0,legs:0,shoulders:0,arms:0};
  D.filter(d=>d.ex).forEach(d=>{
    dayEx(d).filter(e=>!e.core).forEach(e=>{
      const muscle=MUSCLE_MAP[e.n];
      if(!muscle)return;
      const arr=parseW(gw(w,d.full,e.n));
      if(!arr.length)return;
      const sr=exSR(e,w);
      const repStr=String(sr.r);
      // Use middle of rep range as estimate
      const reps=repStr.includes('–')?
        Math.round((parseInt(repStr.split('–')[0])+parseInt(repStr.split('–')[1]))/2):
        parseInt(repStr)||8;
      arr.forEach(weight=>{vol[muscle]+=weight*reps});
    });
  });
  return vol;
}

function rVolume(){
  const cw=Math.min(currentWeek(),TW());
  const vol=calcWeeklyVolume(cw);
  const total=Object.values(vol).reduce((a,b)=>a+b,0);
  if(total===0)return '';
  const max=Math.max(...Object.values(vol));
  let h=`<div class="vol-section">
    <div class="vol-title">📊 Volumen denne uge</div>
    <div class="vol-sub">Estimeret tonnage (sæt × reps × kg) per muskelgruppe</div>
    <div class="vol-bars">`;
  Object.entries(vol).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
    const info=MUSCLE_INFO[k];
    const pct=Math.round(v/max*100);
    h+=`<div class="vol-bar-row">
      <div class="vol-bar-label">${info.emo} ${info.n}</div>
      <div class="vol-bar-track">
        <div class="vol-bar-fill" style="width:${pct}%;background:${info.c}"></div>
      </div>
      <div class="vol-bar-val">${Math.round(v).toLocaleString('da-DK')} kg</div>
    </div>`;
  });
  h+=`</div></div>`;
  return h;
}

/* ═══════════════════════════════════════════════════════════ */
/* ── STREAK HEATMAP ────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function rStreak(){
  if(!PROG.startDate)return '';
  const start=new Date(PROG.startDate+'T00:00:00');
  const today=new Date();today.setHours(0,0,0,0);start.setHours(0,0,0,0);
  const totalDays=TW()*7;
  const todayIdx=Math.floor((today-start)/(86400000));

  // Per uge: tæl hvor mange dage med data
  const dayMap={};// dayIdx → entries count
  for(let w=1;w<=TW();w++){
    D.forEach((d,di)=>{
      const exs=dayEx(d);
      let hasData=false;
      if(exs){hasData=exs.some(e=>gw(w,d.full,e.n))}
      else if(d.run){hasData=['tid','pace','km'].some(k=>gw(w,d.full,k))}
      if(hasData){
        const dayIdx=(w-1)*7+di;
        dayMap[dayIdx]=(dayMap[dayIdx]||0)+1;
      }
    });
  }

  // Beregn streak (lange og nuværende)
  let curStreak=0,bestStreak=0,running=0;
  const trainingDays=[0,2,4,5]; // mandag, onsdag, torsdag(?), lørdag — alle ikke-løb dage med ex
  // Faktisk lad os tælle om man har trænet på dage hvor man skulle
  for(let i=0;i<=Math.min(todayIdx,totalDays-1);i++){
    if(dayMap[i]){running++;bestStreak=Math.max(bestStreak,running)}
    else{running=0}
  }
  curStreak=running;

  let h=`<div class="streak-section">
    <div class="streak-title">🔥 Konsistens</div>
    <div class="streak-sub">
      <div>Nuværende streak: <span class="streak-stat">${curStreak} ${curStreak===1?'dag':'dage'}</span></div>
      <div>Bedste: <span class="streak-stat">${bestStreak} ${bestStreak===1?'dag':'dage'}</span></div>
    </div>
    <div class="streak-grid">
      <div class="streak-day-label"></div>
      <div class="streak-day-label">M</div>
      <div class="streak-day-label">T</div>
      <div class="streak-day-label">O</div>
      <div class="streak-day-label">T</div>
      <div class="streak-day-label">F</div>
      <div class="streak-day-label">L</div>
      <div class="streak-day-label">S</div>`;
  for(let w=0;w<TW();w++){
    h+=`<div class="streak-day-label">U${w+1}</div>`;
    for(let di=0;di<7;di++){
      const idx=w*7+di;
      const cnt=dayMap[idx]||0;
      const isFuture=idx>todayIdx;
      const isToday=idx===todayIdx;
      let cls='streak-cell';
      if(isFuture)cls+=' future';
      else if(cnt>=3)cls+=' l4';
      else if(cnt===2)cls+=' l3';
      else if(cnt===1)cls+=' l1';
      if(isToday)cls+=' today';
      h+=`<div class="${cls}" title="${D[di].full} uge ${w+1}${cnt?' · '+cnt+' øvelser':''}"></div>`;
    }
  }
  h+=`</div>
    <div class="streak-legend">
      <span>Mindre</span>
      <div class="streak-legend-cells">
        <div style="background:var(--bg3)"></div>
        <div style="background:rgba(255,214,10,.18)"></div>
        <div style="background:rgba(255,214,10,.4)"></div>
        <div style="background:rgba(255,214,10,.7)"></div>
        <div style="background:var(--acc)"></div>
      </div>
      <span>Mere</span>
    </div>
  </div>`;
  return h;
}

/* ═══════════════════════════════════════════════════════════ */
/* ── PHOTO GALLERY ─────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
let galleryOpen=false;
function toggleGallery(){galleryOpen=!galleryOpen;render();}

function rPhotoGallery(){
  const weeks=[];
  for(let w=1;w<=TW();w++){if(BODY[w]?.photoBody||BODY[w]?.photoScale)weeks.push(w)}
  if(weeks.length===0)return '';
  let h=`<div class="gallery-toggle">
    <button class="prog-btn ghost" onclick="toggleGallery()">${galleryOpen?'▴ Skjul':'🖼️ Se alle billeder ('+weeks.length+')'}</button>
  </div>`;
  if(galleryOpen){
    h+=`<div class="gallery-grid">`;
    weeks.forEach(w=>{
      const b=BODY[w];
      const photo=b.photoBody||b.photoScale;
      const stats=[b.kg?b.kg+'kg':'',b.fat?b.fat+'%':''].filter(Boolean).join(' · ');
      h+=`<div class="gallery-item" onclick="bodyWeek=${w};galleryOpen=false;render()">
        <img src="${photo}" alt="Uge ${w}">
        <div class="gal-week">UGE ${w}</div>
        ${stats?`<div class="gal-stats">${stats}</div>`:''}
      </div>`;
    });
    h+=`</div>`;
  }
  return h;
}

/* ═══════════════════════════════════════════════════════════ */
/* ── WORKOUT TIMER ─────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
let workoutStart=null,workoutTimerInterval=null,workoutLastActivity=0;

function startWorkoutTimer(){
  if(workoutStart)return;
  workoutStart=Date.now();
  workoutLastActivity=Date.now();
  workoutTimerInterval=setInterval(updateWorkoutTimerDisplay,1000);
  updateWorkoutTimerDisplay();
}
function bumpWorkoutActivity(){
  workoutLastActivity=Date.now();
  if(!workoutStart)startWorkoutTimer();
}
function updateWorkoutTimerDisplay(){
  const el=document.getElementById('workoutTimer');
  if(!el||!workoutStart)return;
  const sec=Math.floor((Date.now()-workoutStart)/1000);
  const m=Math.floor(sec/60),s=sec%60;
  el.querySelector('.wt-time').textContent=m+':'+String(s).padStart(2,'0');
  // Auto-stop hvis ingen aktivitet i 30 min
  if(Date.now()-workoutLastActivity>30*60*1000){
    stopWorkoutTimer();
  }
}
function stopWorkoutTimer(){
  clearInterval(workoutTimerInterval);
  workoutStart=null;
  const el=document.getElementById('workoutTimer');
  if(el)el.style.display='none';
}

/* ═══════════════════════════════════════════════════════════ */
/* ── CSV EXPORT ────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function exportCSV(){
  const rows=[['Uge','Dag','Øvelse','Vægt(max kg)','Sæt-for-sæt','Type','Note']];
  for(let w=1;w<=TW();w++){
    D.filter(d=>d.ex).forEach(d=>{
      dayEx(d).forEach(e=>{
        const v=gw(w,d.full,e.n);
        if(!v)return;
        const note=getExerciseNote(w,d.full,e.n);
        rows.push([w,d.full,e.n,maxW(v)||'',v,e.k||'c',note.replace(/[\r\n]/g,' ')]);
      });
    });
    D.filter(d=>d.run).forEach(d=>{
      const tid=gw(w,d.full,'tid'),pace=gw(w,d.full,'pace'),km=gw(w,d.full,'km'),note=gw(w,d.full,'note');
      if(tid||pace||km){
        rows.push([w,d.full,'Løb',tid||'',pace+' /km'+(km?' · '+km+'km':''),'run',(note||'').replace(/[\r\n]/g,' ')]);
      }
    });
  }
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='traening-'+todayISO()+'.csv';
  a.click();URL.revokeObjectURL(url);
  toast('✓ CSV downloadet');
}

/* ═══════════════════════════════════════════════════════════ */
/* ── PWA / OFFLINE SUPPORT ─────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
// Inline service worker via Blob URL — caches the app shell after first load
if('serviceWorker' in navigator){
  const swCode=`
    const CACHE='traening-v1';
    self.addEventListener('install',e=>{self.skipWaiting()});
    self.addEventListener('activate',e=>{e.waitUntil(clients.claim())});
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET')return;
      e.respondWith(
        caches.open(CACHE).then(cache=>
          cache.match(e.request).then(cached=>{
            const fetchPromise=fetch(e.request).then(resp=>{
              if(resp&&resp.status===200&&resp.type==='basic'){
                cache.put(e.request,resp.clone());
              }
              return resp;
            }).catch(()=>cached);
            return cached||fetchPromise;
          })
        )
      );
    });
  `;
  try{
    const blob=new Blob([swCode],{type:'application/javascript'});
    const swUrl=URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }catch(e){}
}
