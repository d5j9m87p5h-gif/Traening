<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRÆNING">
<meta name="theme-color" content="#07070f">
<title>TRÆNINGSPROGRAM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;--bg1:#0c0c0e;--bg2:#161618;--bg3:#1c1c1e;
  --bdr:#2c2c2e;--bdr2:#38383a;
  --txt:#f5f5f7;--mut:#86868b;--mut2:#48484a;
  --acc:#ffd60a;--acc2:#f0c040;
  --blue:#0a84ff;--ora:#ff6f40;--grn:#30d158;--red:#ff453a;--pur:#bf5af2;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --r:16px;--r2:12px;--r3:8px;
  --glass:rgba(28,28,30,.72);
  --shadow:0 2px 16px rgba(0,0,0,.35),0 0 1px rgba(255,255,255,.05);
  --shadow-up:0 -2px 20px rgba(0,0,0,.45);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;z-index:1}

/* ══ HEADER ══ */
#hdr{
  padding:calc(var(--st) + 16px) 20px 16px;flex-shrink:0;position:relative;z-index:10;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
#hdr::before{content:'';position:absolute;top:-60px;right:-30px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,214,10,.08) 0%,transparent 65%);pointer-events:none}
.hdr-eyebrow{font-size:10px;letter-spacing:3px;color:var(--acc);font-family:'DM Mono',monospace;margin-bottom:4px;opacity:.7;text-transform:uppercase}
#hdr h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,9vw,54px);letter-spacing:1px;line-height:.92;background:linear-gradient(145deg,#ffffff 30%,var(--acc) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hdr-stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:6px 14px;display:flex;align-items:center;gap:7px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hdr-stat-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0}
.hdr-stat label{font-size:10px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;font-weight:500}
.hdr-stat b{font-size:12px;font-weight:600;color:var(--acc);font-family:'DM Mono',monospace}

/* ══ TABS (iOS bottom bar) ══ */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;padding:6px 4px calc(var(--sb) + 4px);box-shadow:var(--shadow-up)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;font-size:10px;font-weight:500;letter-spacing:.3px;color:var(--mut);border:none;background:transparent;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;transition:color .25s var(--ease);position:relative;min-height:44px;justify-content:center}
.tab .tab-icon{font-size:20px;display:block;line-height:1;transition:transform .25s var(--spring)}
.tab.on{color:var(--acc)}
.tab.on .tab-icon{transform:scale(1.1)}
.tab::after{display:none}

/* ══ SCROLL ══ */
#cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px calc(var(--sb) + 80px);scroll-behavior:smooth}

/* ══ DAY GRID ══ */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px}
.dc{border-radius:var(--r2);padding:12px 4px 10px;text-align:center;cursor:pointer;border:1.5px solid rgba(255,255,255,.06);background:var(--bg2);transition:all .25s var(--ease);position:relative;overflow:hidden;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--col);border-radius:var(--r2) var(--r2) 0 0;transform:scaleX(0);transition:transform .3s var(--spring)}
.dc:active{transform:scale(.93);transition-duration:.1s}
.dc.on{border-color:var(--col);background:linear-gradient(180deg,var(--col)18 0%,var(--col)08 100%);box-shadow:0 4px 20px var(--col)20,inset 0 1px 0 rgba(255,255,255,.06)}
.dc.on::before{transform:scaleX(1)}
.dc .di{font-size:18px;display:block;margin-bottom:4px}
.dc .da{font-size:10px;font-weight:700;letter-spacing:.5px;font-family:'DM Mono',monospace}
.dc .dl{font-size:7px;letter-spacing:.6px;margin-top:4px;color:var(--col);opacity:.7;text-transform:uppercase}
.dc.on .dl{opacity:1}

/* ══ DETAIL PANEL ══ */
.det{background:var(--bg1);border-radius:var(--r);padding:20px;border:1px solid var(--bdr);box-shadow:var(--shadow);animation:slideUp .35s var(--spring);position:relative;overflow:hidden}
.det::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.det-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.det-icon{font-size:28px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:var(--r2);border:1px solid var(--bdr);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.det-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;line-height:1}
.det-sub{font-size:10px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:2px}
.badge{margin-left:auto;padding:6px 14px;border-radius:100px;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;font-family:'DM Mono',monospace}

/* ══ PHASE BANNER ══ */
.phase-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r2);margin-bottom:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.phase-banner::before{display:none}
.phase-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.phase-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px}
.phase-info{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace}

/* ══ EXERCISE TABLE ══ */
.ex-hd{display:grid;grid-template-columns:1fr 38px 52px 76px 40px;gap:4px 8px;padding:10px 0 6px;border-bottom:1px solid var(--bdr);margin-bottom:4px}
.ex-hd span{font-size:9px;color:var(--mut2);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace}
.exrow{display:grid;grid-template-columns:1fr 38px 52px 76px 40px;gap:4px 8px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center;border-radius:var(--r3);position:relative;transition:background .15s}
.exrow.core{padding-left:12px;margin-bottom:2px}
.exrow.core::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--acc);border-radius:3px}
.exrow.cust{padding-left:12px}
.exrow.cust::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--pur);border-radius:3px}
.exn{font-size:13px;font-weight:500;line-height:1.3;color:var(--txt)}
.exn .cust-tag{display:inline-block;background:rgba(191,90,242,.15);color:var(--pur);font-family:'DM Mono',monospace;font-size:8px;font-weight:600;letter-spacing:1px;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.exn .rmx{display:inline-flex;align-items:center;justify-content:center;color:var(--red);font-size:13px;margin-left:4px;cursor:pointer;opacity:.5;padding:0 4px;background:none;border:none;font-family:inherit;min-width:44px;min-height:44px}
.exn .rmx:hover{opacity:1}
.exno{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.exs{font-family:'Bebas Neue',sans-serif;font-size:22px;text-align:center;line-height:1}
.exr{font-size:10px;font-weight:500;text-align:center;font-family:'DM Mono',monospace;line-height:1.3;color:var(--txt)}
.exkg{display:flex;flex-direction:column;align-items:center;gap:4px}
.wi{background:var(--bg3);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:14px;font-weight:500;width:72px;padding:8px 4px;border-radius:100px;text-align:center;outline:none;-webkit-appearance:none;transition:all .2s var(--ease);min-height:36px}
.wi:focus{border-color:var(--acc);background:rgba(255,214,10,.06);box-shadow:0 0 0 3px rgba(255,214,10,.12)}
.wi::placeholder{color:var(--mut2);font-size:11px;font-weight:400}
.wi.fl{animation:wfl .6s var(--ease)}
@keyframes wfl{0%{border-color:var(--grn);box-shadow:0 0 0 4px rgba(48,209,88,.2)}100%{border-color:var(--bdr);box-shadow:none}}
.dup{font-size:10px;font-weight:600;font-family:'DM Mono',monospace;color:var(--grn)}
.ddn{font-size:10px;font-weight:600;font-family:'DM Mono',monospace;color:var(--red)}
.deq{font-size:10px;font-family:'DM Mono',monospace;color:var(--mut)}
.vl{display:inline-flex;align-items:center;justify-content:center;color:var(--acc);text-decoration:none;font-size:10px;font-family:'DM Mono',monospace;font-weight:500;padding:6px 8px;background:rgba(255,214,10,.08);border-radius:var(--r3);white-space:nowrap;border:1px solid rgba(255,214,10,.15);transition:all .15s;min-width:36px;min-height:36px}
.vl:hover{background:rgba(255,214,10,.16)}

/* ══ TIP ══ */
.tip{margin-top:16px;padding:12px 16px;background:var(--bg2);border-radius:var(--r2);font-size:12px;color:var(--mut);line-height:1.6;border-left:3px solid var(--bdr)}
.tip b{color:var(--txt)}
.tcore{margin-top:8px;padding:12px 16px;background:rgba(255,214,10,.04);border:1px solid rgba(255,214,10,.12);border-radius:var(--r2);font-size:12px;color:var(--acc);border-left:3px solid var(--acc)}

/* ══ WEEK PICKER ══ */
.wpick{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.wpick label{font-size:9px;color:var(--mut);letter-spacing:2px;font-family:'DM Mono',monospace;text-transform:uppercase}
.wb{padding:7px 12px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);font-family:'DM Mono',monospace;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s var(--ease);min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.wb:active{transform:scale(.92)}
.wb.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}

/* ══ RUN CARDS ══ */
.rungrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.rcard{background:var(--bg2);border-radius:var(--r2);padding:16px;border:1px solid var(--bdr);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.rcard label{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:6px}
.rcard .rval{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px}
.rtip{grid-column:1/-1;border-radius:var(--r2);padding:14px 16px;font-size:13px;line-height:1.5}
.runlog{margin-top:4px;background:var(--bg2);border-radius:var(--r2);overflow:hidden;border:1px solid var(--bdr)}
.runlog-head{padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr)}
.runlog-head span{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px}
.runlog-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}
.runlog-label{font-size:13px;font-weight:500}
.runlog-prev{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.runlog-note{padding:12px 16px}
.runlog-note label{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:6px}
textarea{background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);border-radius:var(--r2);padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:13px;resize:none;outline:none;width:100%;transition:border-color .2s,box-shadow .2s;line-height:1.5}
textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,214,10,.1)}

/* ══ REST ══ */
.rest{text-align:center;padding:48px 0}
.rest-icon{font-size:56px;display:block;margin-bottom:16px}
.rest-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--mut);letter-spacing:1px}
.rest-sub{font-size:13px;color:var(--mut2);margin-top:6px;font-family:'DM Mono',monospace}

/* ══ WEIGHT LOG ══ */
.wld{background:var(--bg1);border-radius:var(--r);overflow:hidden;margin-bottom:16px;border:1px solid var(--bdr);box-shadow:var(--shadow)}
.wlh{padding:14px 16px;display:flex;align-items:center;gap:10px;position:relative}
.wlh-icon{font-size:18px}
.wlh-text{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.5px}
.wlh-phase{margin-left:auto;font-size:9px;font-family:'DM Mono',monospace;font-weight:500;padding:4px 10px;border-radius:100px;opacity:.9}
.wlc{display:grid;grid-template-columns:1fr 80px 80px 72px;gap:4px 8px;padding:8px 16px 6px;border-bottom:1px solid var(--bdr);background:var(--bg2)}
.wlc span{font-size:9px;color:var(--mut2);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace}
.wlr{display:grid;grid-template-columns:1fr 80px 80px 72px;gap:4px 8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}
.wln{font-size:13px;font-weight:500}
.wls{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.wlp{font-size:13px;font-weight:500;color:var(--mut);font-family:'DM Mono',monospace}

/* ══ PHASES ══ */
.phcard{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.phcard::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--pc)}
.ph-num-wrap{text-align:center}
.ph-num{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;color:var(--pc)}
.ph-weeks{font-size:9px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.ph-label{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.5px;margin-bottom:6px}
.ph-row{font-size:12px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:3px;line-height:1.5}
.ph-goal{text-align:center;background:var(--bg2);border-radius:var(--r2);padding:12px 14px;border:1px solid var(--bdr);min-width:72px}
.ph-goal label{font-size:8px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;font-family:'DM Mono',monospace;display:block;margin-bottom:4px}
.ph-goal span{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;color:var(--acc)}
.section-label{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:12px;margin-top:8px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* ══ RULES ══ */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:var(--bg1);border-radius:var(--r2);padding:16px;border:1px solid var(--bdr);position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.rc:active{transform:scale(.98)}
.rc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--rc)}
.rc-icon{font-size:24px;margin-bottom:10px;display:block}
.rc-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px;margin-bottom:6px;color:var(--rc)}
.rc-body{font-size:12px;color:var(--mut);line-height:1.6}

/* ══ GRAPH ══ */
.graph-wrap{background:var(--bg1);border-radius:var(--r);padding:20px;border:1px solid var(--bdr);margin-bottom:16px;box-shadow:var(--shadow)}
.graph-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;margin-bottom:4px}
.graph-gain{font-size:12px;font-family:'DM Mono',monospace;font-weight:500;margin-bottom:14px}
.ex-picker{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.ex-picker::-webkit-scrollbar{display:none}
.expill{flex-shrink:0;padding:8px 14px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s var(--ease);min-height:36px}
.expill:active{transform:scale(.95)}
.expill.on{color:#000;font-weight:700}

/* ══ HINT ══ */
.hint{text-align:center;padding:40px 0;color:var(--mut2);font-family:'DM Mono',monospace;font-size:13px;line-height:2}
.hint-icon{font-size:40px;display:block;margin-bottom:10px}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:calc(var(--sb)+100px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--grn);color:#000;font-family:'DM Mono',monospace;font-size:13px;font-weight:600;padding:10px 24px;border-radius:100px;opacity:0;transition:all .35s var(--spring);pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 8px 32px rgba(48,209,88,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══ DIVIDERS ══ */
.page-title{margin-bottom:20px}
.page-eyebrow{font-size:9px;color:var(--acc);letter-spacing:3px;font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:4px;opacity:.6}
.page-h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.5px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ══ TODAY BANNER ══ */
.today-banner{background:linear-gradient(135deg,var(--tc)14 0%,var(--tc)06 100%);border:1px solid var(--tc)30;border-radius:var(--r);padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s var(--ease);box-shadow:0 4px 24px var(--tc)10}
.today-banner::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--tc)}
.today-banner:active{transform:scale(.98)}
.tb-icon{font-size:32px;flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--tc)18;border-radius:var(--r2);border:1px solid var(--tc)25}
.tb-text{flex:1;min-width:0}
.tb-eyebrow{font-size:9px;letter-spacing:3px;color:var(--tc);font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tb-eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:var(--tc);animation:pls 2s infinite ease-in-out}
@keyframes pls{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

const DAY_NAMES=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayDayIdx(){return (new Date().getDay()+6)%7} // 0=Mandag, 6=Søndag
function thisMondayISO(){
  const d=new Date();
  const idx=(d.getDay()+6)%7;
  d.setDate(d.getDate()-idx);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function weekFromStart(){
  if(!PROG.startDate)return 0;
  const start=new Date(PROG.startDate+'T00:00:00');
  const today=new Date();
  today.setHours(0,0,0,0);start.setHours(0,0,0,0);
  const diffDays=Math.floor((today-start)/(24*60*60*1000));
  return Math.floor(diffDays/7)+1; // uge 1 = dag 0..6
}
function fmtDate(iso){
  if(!iso)return'';
  try{return new Date(iso+'T00:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'long',year:'numeric'})}catch(e){return iso}
}

function ek(w,d,n){return'w'+w+'__'+(d+'__'+n).replace(/[^\w]/g,'_')}
function gw(w,d,n){return W[ek(w,d,n)]||''}
function sw(w,d,n,v){W[ek(w,d,n)]=v;save();toast()}
function df(w,d,n){if(w<2)return null;const c=parseFloat(gw(w,d,n)),p=parseFloat(gw(w-1,d,n));if(isNaN(c)||isNaN(p))return null;return Math.round((c-p)*10)/10}

// merge default + custom exercises for a day
function dayEx(d){if(!d.ex)return null;return [...d.ex,...(CUSTOM[d.full]||[])]}

// Programmets nuværende uge — først via startdato, ellers fra seneste data
function currentWeek(){
  if(PROG.startDate){
    const w=weekFromStart();
    if(w>=1&&w<=8)return w;
    if(w>8)return 9; // færdigt
    return 1; // før startdato
  }
  // Fallback: seneste uge med data
  for(let w=8;w>=1;w--){
    const has=D.some(d=>{
      if(d.ex){return dayEx(d).some(e=>gw(w,d.full,e.n))}
      if(d.run){return['tid','pace','km'].some(k=>gw(w,d.full,k))}
      return false;
    });
    if(has)return w;
  }
  return 1;
}
function isProgramDone(){return PROG.startDate&&weekFromStart()>8}

let tt;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg||'✓ Gemt';
  t.classList.add('show');
  clearTimeout(tt);
  tt=setTimeout(()=>t.classList.remove('show'),1400);
}

const TABS=['weekly','weights','graph','coach','library','phases','rules'];
function go(t){
  tab=t;
  // Når Skema åbnes: spring til dagens dag og dagens uge
  if(t==='weekly'){
    sel=todayDayIdx();
    const cw=currentWeek();
    if(cw>=1&&cw<=8)week=cw;
  }else{
    sel=null;
  }
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('on',TABS[i]===t));
  render();
  document.getElementById('cnt').scrollTop=0;
}
function sd(i){sel=sel===i?null:i;render();if(sel!==null)setTimeout(()=>document.querySelector('.det')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function sw2(w){week=w;render()}
function wch(el){const w=+el.dataset.w,d=el.dataset.d,n=el.dataset.n;sw(w,d,n,el.value);el.classList.remove('fl');void el.offsetWidth;el.classList.add('fl');setTimeout(()=>el.classList.remove('fl'),550)}
function diffH(d){if(d===null)return'';const cl=d>0?'dup':d<0?'ddn':'deq',s=d>0?`▲+${d}`:d<0?`▼${d}`:'=0';return`<div class="${cl}">${s}</div>`}

function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ═══════════════════════════════════════════════════════════ */
/* ── MAIN RENDER ───────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function render(){
  updateHeaderWeek();
  const c=document.getElementById('cnt');
  if(tab==='weekly')c.innerHTML=rWeekly();
  else if(tab==='weights')c.innerHTML=rLog();
  else if(tab==='graph')c.innerHTML=rGraph();
  else if(tab==='coach')c.innerHTML=rCoach();
  else if(tab==='library')c.innerHTML=rLibrary();
  else if(tab==='phases')c.innerHTML=rPhases();
  else c.innerHTML=rRules();
}

function updateHeaderWeek(){
  const el=document.getElementById('hdrWeek');
  if(!el)return;
  const cw=currentWeek();
  if(isProgramDone()){
    el.innerHTML=`<div class="hdr-stat-dot" style="background:#30c080"></div><label>Status</label><b style="color:#30c080">FÆRDIG</b>`;
  }else if(PROG.startDate){
    el.innerHTML=`<div class="hdr-stat-dot"></div><label>Uge</label><b>${cw} / 8</b>`;
  }else{
    el.innerHTML=`<div class="hdr-stat-dot"></div><label>Plan</label><b>8 UGE</b>`;
  }
}

function wpickH(){
  let h='<div class="wpick"><label>Uge</label>';
  for(let w=1;w<=8;w++)h+=`<button class="wb${week===w?' on':''}" onclick="sw2(${w})">${w}</button>`;
  return h+'</div>';
}

/* ── WEEKLY ── */
function rWeekly(){
  let h='';

  // Program færdigt? Vis fejring + start-forfra
  if(isProgramDone()){
    h+=rProgDone();
  }
  // Ingen startdato sat? Vis setup-banner
  else if(!PROG.startDate){
    h+=rProgSetup();
  }
  // I gang: vis dagens træning som banner
  else{
    h+=rTodayBanner();
  }

  // Day grid
  const todayIdx=todayDayIdx();
  h+='<div class="dgrid">';
  D.forEach((d,i)=>{
    const isToday=i===todayIdx&&PROG.startDate&&!isProgramDone();
    h+=`<div class="dc${sel===i?' on':''}" style="--col:${d.color}" onclick="sd(${i})">
      <span class="di">${d.icon}</span>
      <div class="da">${d.day}${isToday?' <span style="color:'+d.color+';font-size:10px">●</span>':''}</div>
      <div class="dl">${d.label}</div>
    </div>`;
  });
  h+='</div>';
  if(sel!==null){
    const d=D[sel];
    h+=`<div class="det">
      <div class="det-head">
        <div class="det-icon">${d.icon}</div>
        <div>
          <div class="det-sub">${d.full}</div>
          <div class="det-title">${d.type}</div>
        </div>
        <div class="badge" style="background:${d.color}22;color:${d.color};border:1px solid ${d.color}44">${d.label}</div>
      </div>`;

    const exs=dayEx(d);
    if(exs){
      const gp=GP[gymPhase(week)];
      h+=wpickH();
      h+=`<div class="phase-banner" style="background:${gp.color}10;border:1px solid ${gp.color}30">
        <div class="phase-dot" style="background:${gp.color}"></div>
        <div class="phase-name" style="color:${gp.color}">${gp.name.toUpperCase()}</div>
        <div class="phase-info">${gp.weeks} &nbsp;·&nbsp; ${gp.tip}</div>
      </div>`;
      h+=`<div class="ex-hd"><span>Øvelse</span><span>Sæt</span><span>Reps</span><span>Kg – uge ${week}</span><span>Se</span></div>`;
      exs.forEach((e,exIdx)=>{
        const sr=exSR(e,week),v=gw(week,d.full,e.n),dv=df(week,d.full,e.n);
        const isCust=e.custom;
        const cls=isCust?'cust':(e.core?'core':'');
        const rmBtn=isCust?`<button class="rmx" onclick="removeCustomEx('${escAttr(d.full)}','${escAttr(e.n)}')" title="Fjern">×</button>`:'';
        const custTag=isCust?'<span class="cust-tag">EGEN</span>':'';
        h+=`<div class="exrow${cls?' '+cls:''}">
          <div><div class="exn">${e.n}${custTag}${rmBtn}</div>${e.no?`<div class="exno">${e.no}</div>`:''}</div>
          <div class="exs" style="color:${d.color}">${sr.s}</div>
          <div class="exr">${sr.r}</div>
          <div class="exkg">
            <input class="wi" type="number" inputmode="decimal" placeholder="kg" min="0" step="0.5"
              value="${v}" data-w="${week}" data-d="${d.full}" data-n="${escAttr(e.n)}"
              onchange="wch(this)" onfocus="this.select()">
            ${diffH(dv)}
          </div>
          <a class="vl" href="${e.l}" target="_blank">▶</a>
        </div>`;
      });
      h+=`<div class="tip">💡 <b>Pause:</b> 2–3 min styrke &nbsp;·&nbsp; 60–90 sek isolation &nbsp;·&nbsp; 1–2 reps fra failure</div>`;
      if(exs.some(e=>e.core))h+=`<div class="tcore">🔶 <b>Core-blok</b> – ca. 10 min til sidst &nbsp;·&nbsp; 45–60 sek pause</div>`;
      h+=`<div style="margin-top:12px;text-align:center"><button class="ai-btn ghost" onclick="go('library')">+ Tilføj øvelse fra bibliotek</button></div>`;

    }else if(d.run){
      h+=wpickH();
      h+=`<div class="rungrid">
        <div class="rcard"><label>Type</label><div class="rval" style="color:${d.color}">${d.run.type}</div></div>
        <div class="rcard"><label>Mål pace</label><div class="rval" style="color:${d.color}">${d.run.pace}</div></div>
        <div class="rcard"><label>Varighed</label><div class="rval" style="color:${d.color}">${d.run.dur}</div></div>
        <div class="rtip" style="background:${d.color}10;border:1px solid ${d.color}25;color:${d.color}cc">💡 ${d.run.tip}</div>
      </div>`;
      const rf=[{k:'tid',label:'Tid (min:sek)',ph:'28:30'},{k:'pace',label:'Faktisk pace (min/km)',ph:'5:42'},{k:'km',label:'Distance (km)',ph:'5.2'}];
      h+=`<div class="runlog">
        <div class="runlog-head" style="background:${d.color}15;border-bottom:1px solid ${d.color}25">
          <span style="color:${d.color}">📝</span>
          <span style="color:${d.color}">LOG – UGE ${week}</span>
        </div>`;
      rf.forEach(f=>{
        const cv=gw(week,d.full,f.k),pv=week>1?gw(week-1,d.full,f.k):'';
        h+=`<div class="runlog-row">
          <div>
            <div class="runlog-label">${f.label}</div>
            ${pv?`<div class="runlog-prev">▸ Forrige: ${pv}</div>`:''}
          </div>
          <input class="wi" type="text" inputmode="decimal" placeholder="${f.ph}" style="width:80px"
            value="${cv}" data-w="${week}" data-d="${d.full}" data-n="${f.k}"
            onchange="wch(this)" onfocus="this.select()">
        </div>`;
      });
      const note=gw(week,d.full,'note');
      h+=`<div class="runlog-note">
        <label>📓 Noter</label>
        <textarea rows="2" placeholder="Hvordan gik det? Følte du dig stærk?"
          data-w="${week}" data-d="${d.full}" data-n="note"
          onchange="wch(this)">${escHtml(note)}</textarea>
      </div></div>`;

    }else{
      h+=`<div class="rest">
        <span class="rest-icon">😴</span>
        <div class="rest-title">Restitutionsdag</div>
        <div class="rest-sub">Søvn 7–9 timer &nbsp;·&nbsp; Let gåtur er fint</div>
      </div>`;
    }
    h+='</div>';
  }else{
    h+=`<div class="hint"><span class="hint-icon">👆</span>Tryk på en dag<br>for øvelser og videolinks</div>`;
  }
  return h;
}

/* ── TODAY BANNER ── */
function rTodayBanner(){
  const idx=todayDayIdx();
  const d=D[idx];
  const cw=currentWeek();
  const today=new Date().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'});
  const exs=dayEx(d);
  let summary='';
  if(d.run){
    summary=`${d.run.dur} @ ${d.run.pace} · ${d.run.type}`;
  }else if(exs){
    const compounds=exs.filter(e=>!e.core).slice(0,3).map(e=>e.n).join(', ');
    summary=`${exs.filter(e=>!e.core).length} øvelser · ${compounds}${exs.filter(e=>!e.core).length>3?'…':''}`;
  }else{
    summary='Hvile · Søvn 7-9 timer · Let gåtur er fint';
  }
  return `<div class="today-banner" style="--tc:${d.color}" onclick="sel=${idx};render();setTimeout(()=>document.querySelector('.det')?.scrollIntoView({behavior:'smooth',block:'start'}),50)">
    <div class="tb-icon">${d.icon}</div>
    <div class="tb-text">
      <div class="tb-eyebrow"><span class="pulse"></span>I dag · ${today} · Uge ${cw}</div>
      <div class="tb-title">${d.type}</div>
      <div class="tb-sub">${summary}</div>
    </div>
    <div class="tb-arrow">›</div>
  </div>`;
}

/* ── PROGRAM SETUP (vælg startdato) ── */
function rProgSetup(){
  const tm=thisMondayISO();
  return `<div class="prog-setup">
    <div class="prog-setup-title">📅 Sæt startdato</div>
    <div class="prog-setup-sub">Vælg den mandag du starter (eller startede) programmet.<br>Så ved appen hvilken uge du er i — og din coach ved hvad dagens træning er.</div>
    <input type="date" class="prog-date-input" id="progDateInput" value="${tm}">
    <div class="btn-row">
      <button class="prog-btn" onclick="setProgStart()">✓ Start programmet</button>
      <button class="prog-btn ghost" onclick="setProgStartToday()">Start i denne uge</button>
    </div>
  </div>`;
}

/* ── PROGRAM DONE ── */
function rProgDone(){
  // Saml stats
  const startDate=fmtDate(PROG.startDate);
  let totalLogged=0,totalKg=0;
  D.filter(d=>d.ex).forEach(d=>{
    dayEx(d).filter(e=>!e.core).forEach(e=>{
      for(let w=1;w<=8;w++){const v=parseFloat(gw(w,d.full,e.n));if(!isNaN(v)){totalLogged++;totalKg+=v}}
    });
  });
  // Find bedste 5km tid
  let bestPace='–';
  D.filter(d=>d.run).forEach(d=>{
    for(let w=1;w<=8;w++){const v=gw(w,d.full,'tid');if(v&&(bestPace==='–'||v<bestPace))bestPace=v}
  });
  return `<div class="prog-done">
    <span class="pd-emoji">🏆</span>
    <div class="pd-title">8 UGER FÆRDIG!</div>
    <div class="pd-sub">Startet ${startDate}<br>Du har gennemført hele Recomp + 5km programmet</div>
    <div class="pd-stats">
      <div class="pd-stat"><label>Sæt loggede</label><span>${totalLogged}</span></div>
      <div class="pd-stat"><label>Bedste tid</label><span>${bestPace}</span></div>
      <div class="pd-stat"><label>Uger</label><span>8/8</span></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="prog-btn" onclick="restartProgram()">↻ Start nyt 8-ugers forløb</button>
      <button class="prog-btn ghost" onclick="go('coach')">🤖 Få debrief fra coach</button>
    </div>
    <div style="font-size:10px;color:var(--mut2);margin-top:14px;font-family:'DM Mono',monospace;line-height:1.6">Dine data fra denne periode bevares — du kan altid se dem i Vægtlog og Fremgang.</div>
  </div>`;
}

function setProgStart(){
  const inp=document.getElementById('progDateInput');
  if(!inp||!inp.value){toast('Vælg en dato');return}
  PROG.startDate=inp.value;saveProg();
  const cw=currentWeek();if(cw>=1&&cw<=8)week=cw;
  toast('✓ Programmet startet');
  render();
}
function setProgStartToday(){
  PROG.startDate=thisMondayISO();saveProg();
  toast('✓ Programmet startet');
  render();
}
function restartProgram(){
  if(!confirm('Start et nyt 8-ugers forløb?\n\nDine eksisterende data bevares – men programmet starter forfra fra denne mandag.'))return;
  PROG.startDate=thisMondayISO();saveProg();
  week=1;
  toast('✓ Nyt forløb startet');
  render();
}
function rLog(){
  let h='<div class="page-title"><div class="page-eyebrow">// Data</div><div class="page-h1">Vægtlog</div></div>';
  h+=wpickH();
  D.filter(d=>d.ex).forEach(d=>{
    const gp=GP[gymPhase(week)];
    const exs=dayEx(d);
    h+=`<div class="wld">
      <div class="wlh" style="background:${d.color}15;border-bottom:1px solid ${d.color}25">
        <span class="wlh-icon">${d.icon}</span>
        <span class="wlh-text" style="color:${d.color}">${d.full} – ${d.type}</span>
        <span class="wlh-phase" style="background:${gp.color}20;color:${gp.color};border:1px solid ${gp.color}30">${gp.name}</span>
      </div>
      <div class="wlc"><span>Øvelse</span><span>Uge ${week}</span><span>${week>1?'Uge '+(week-1):'Forrige'}</span><span>Ændring</span></div>`;
    exs.filter(e=>!e.core).forEach(e=>{
      const sr=exSR(e,week),cv=gw(week,d.full,e.n),pv=week>1?gw(week-1,d.full,e.n):'',dv=df(week,d.full,e.n);
      let dfh='<span style="color:var(--mut2)">–</span>';
      if(dv!==null){const cl=dv>0?'dup':dv<0?'ddn':'deq',s=dv>0?`▲+${dv}`:dv<0?`▼${dv}`:'=0';dfh=`<span class="${cl}">${s}</span>`;}
      const custTag=e.custom?' <span style="background:#9060f022;color:#9060f0;font-family:DM Mono,monospace;font-size:7px;font-weight:600;letter-spacing:1px;padding:1px 5px;border-radius:4px">EGEN</span>':'';
      h+=`<div class="wlr">
        <div><div class="wln">${e.n}${custTag}</div><div class="wls">${sr.s} sæt · ${sr.r}</div></div>
        <input class="wi" type="number" inputmode="decimal" placeholder="kg" min="0" step="0.5"
          style="width:72px" value="${cv}" data-w="${week}" data-d="${d.full}" data-n="${escAttr(e.n)}"
          onchange="wch(this)" onfocus="this.select()">
        <div class="wlp">${pv?pv+' kg':'–'}</div>
        <div>${dfh}</div>
      </div>`;
    });
    h+='</div>';
  });
  D.filter(d=>d.run).forEach(d=>{
    const rf=[{k:'tid',label:'Tid'},{k:'pace',label:'Pace /km'},{k:'km',label:'Distance'}];
    h+=`<div class="wld">
      <div class="wlh" style="background:${d.color}15;border-bottom:1px solid ${d.color}25">
        <span class="wlh-icon">${d.icon}</span>
        <span class="wlh-text" style="color:${d.color}">${d.full} – ${d.type}</span>
      </div>`;
    rf.forEach(f=>{
      const cv=gw(week,d.full,f.k),pv=week>1?gw(week-1,d.full,f.k):'';
      h+=`<div class="wlr" style="grid-template-columns:1fr auto">
        <div><div class="wln">${f.label}</div>${pv?`<div class="wls">▸ Forrige: ${pv}</div>`:''}</div>
        <input class="wi" type="text" inputmode="decimal" placeholder="–" style="width:80px"
          value="${cv}" data-w="${week}" data-d="${d.full}" data-n="${f.k}"
          onchange="wch(this)" onfocus="this.select()">
      </div>`;
    });
    const note=gw(week,d.full,'note');
    h+=`<div class="runlog-note">
      <label>📓 Noter</label>
      <textarea rows="2" placeholder="Hvordan gik det?"
        data-w="${week}" data-d="${d.full}" data-n="note"
        onchange="wch(this)">${escHtml(note)}</textarea>
    </div></div>`;
  });
  h+=`<div class="tip">💡 Rammer du øverste rep-tal → <b>+2,5–5 kg næste uge</b>. Grøn = du er på rette spor! 🎯<br>Data gemmes permanent på din iPhone.</div>`;
  return h;
}

/* ── GRAPH ── */
function rGraph(){
  const gymExs=[];
  D.filter(d=>d.ex).forEach(d=>{
    dayEx(d).filter(e=>!e.core).forEach(e=>{
      if(!gymExs.find(x=>x.n===e.n))gymExs.push({n:e.n,day:d.full,color:d.color});
    });
  });
  if(selGraph>=gymExs.length)selGraph=0;
  const selEx=gymExs[selGraph]||gymExs[0];
  if(!selEx)return '<div class="hint"><span class="hint-icon">📊</span>Ingen øvelser endnu</div>';
  const pts=[];
  for(let w=1;w<=8;w++){const v=parseFloat(gw(w,selEx.day,selEx.n));pts.push(isNaN(v)?null:v)}
  const filled=pts.filter(v=>v!==null);
  const hasData=filled.length>=2;
  const maxV=hasData?Math.max(...filled):100,minV=hasData?Math.min(...filled):0;
  const range=Math.max(maxV-minV,10),padV=range*.2;
  const W2=340,H2=170,pl=42,pr=14,pt2=18,pb=28,iw=W2-pl-pr,ih=H2-pt2-pb;
  function px(w){return pl+((w-1)/7)*iw}
  function py(v){return pt2+ih-(((v-(minV-padV))/(range+2*padV))*ih)}
  const phC=['#4f8ef722','#f0704022','#e0406022'],phR=[[1,3],[4,6],[7,8]];
  let svg=`<svg viewBox="0 0 ${W2} ${H2}" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:10px">`;
  svg+=`<rect width="${W2}" height="${H2}" fill="#0e0e1a" rx="10"/>`;
  phR.forEach(([s,e],i)=>{
    const x1=px(s)-iw/14,x2=px(e)+iw/14;
    svg+=`<rect x="${x1}" y="${pt2}" width="${x2-x1}" height="${ih}" fill="${phC[i]}" rx="4"/>`;
  });
  for(let i=0;i<=4;i++){const y=pt2+(ih/4)*i;svg+=`<line x1="${pl}" y1="${y}" x2="${W2-pr}" y2="${y}" stroke="#ffffff06" stroke-width="1"/>`;}
  if(hasData){
    for(let i=0;i<=2;i++){
      const v=minV-padV+(range+2*padV)*(1-i/2);
      svg+=`<text x="${pl-4}" y="${pt2+(ih/2)*i+4}" text-anchor="end" font-size="8" fill="#3a3a5a" font-family="DM Mono,monospace">${Math.round(v)}</text>`;
    }
  }
  for(let w=1;w<=8;w++)svg+=`<text x="${px(w)}" y="${H2-6}" text-anchor="middle" font-size="9" fill="#3a3a5a" font-family="DM Mono,monospace">${w}</text>`;
  if(hasData){
    let pathD='',dotPts=[];
    let prev=null;
    for(let w=1;w<=8;w++){
      const v=pts[w-1];
      if(v!==null){const x=px(w),y=py(v);if(prev===null)pathD+=`M${x},${y}`;else pathD+=` L${x},${y}`;dotPts.push({x,y,v,w});prev={x,y};}
    }
    const fd=dotPts[0],ld=dotPts[dotPts.length-1];
    svg+=`<path d="${pathD} L${ld.x},${pt2+ih} L${fd.x},${pt2+ih} Z" fill="url(#grad)"/>`;
    svg+=`<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${selEx.color}" stop-opacity=".3"/><stop offset="100%" stop-color="${selEx.color}" stop-opacity="0"/></linearGradient></defs>`;
    svg+=`<path d="${pathD}" fill="none" stroke="${selEx.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    dotPts.forEach(({x,y,v})=>{
      svg+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${selEx.color}" stroke="#0e0e1a" stroke-width="2"/>`;

  const firstVal=filled[0],lastVal=filled[filled.length-1];

  });
  h+=`</div>`;
  h+=`<div class="graph-wrap">
    <div class="graph-title" style="color:${selEx.color}">${selEx.n}</div>
    ${totalGain!==null?`<div class="graph-gain" style="color:${totalGain>=0?'#30c080':'#e04060'}">${totalGain>=0?'▲ +':'▼ '}${totalGain} kg totalt over ${filled.length} uger</div>`:'<div class="graph-gain" style="color:var(--mut)">Tilføj mindst 2 ugers data for at se trend</div>'}
    ${svg}
    <div style="display:flex;justify-content:center;gap:14px;margin-top:12px">
      ${['Hypertrofi','Styrke','Peak'].map((l,i)=>`<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:3px;background:${'#4f8ef7 #f07040 #e04060'.split(' ')[i]}33;border:1px solid ${'#4f8ef7 #f07040 #e04060'.split(' ')[i]}55"></div><span style="font-size:9px;color:var(--mut);font-family:'DM Mono',monospace">${l}</span></div>`).join('')}
    </div>
  </div>`;

  h+=`<div class="section-label">🏃 Løbefremgang</div>`;
  D.filter(d=>d.run).forEach(rd=>{
    const paces=[];
    for(let w=1;w<=8;w++){const v=gw(w,rd.full,'pace');if(v)paces.push({w,v});}
    h+=`<div class="wld" style="margin-bottom:12px;border:1px solid ${rd.color}22">
      <div class="wlh" style="background:${rd.color}12;border-bottom:1px solid ${rd.color}20">

        <span class="wlh-text" style="color:${rd.color}">${rd.full} – ${rd.type}</span>
      </div>
      <div style="padding:12px 16px">`;
    if(paces.length===0){
      h+=`<div style="font-size:12px;color:var(--mut2);font-family:'DM Mono',monospace">Ingen løbsdata endnu</div>`;
    }else{
      h+=`<div style="display:flex;gap:8px;flex-wrap:wrap">`;
      paces.forEach(p=>{
        h+=`<div style="background:${rd.color}15;border:1px solid ${rd.color}25;border-radius:10px;padding:8px 12px;text-align:center">
          <div style="font-size:8px;color:var(--mut);font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:3px">UGE ${p.w}</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:${rd.color}">${p.v}</div>
        </div>`;
      });
      h+=`</div>`;
    }
    h+=`</div></div>`;
  });
  return h;
}

// Build context summary of all training data
function buildTrainingContext(){
  // === DATO & DAGENS TRÆNING ===
  const now=new Date();
  const todayStr=now.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const todayIdx=todayDayIdx();
  const todayD=D[todayIdx];
  const cw=currentWeek();
  const programDone=isProgramDone();

  let ctx='=== I DAG ===\n';
  ctx+=`Dato: ${todayStr}\n`;
  ctx+=`Dagens dag: ${todayD.full} – ${todayD.type} (${todayD.label})\n`;
  if(todayD.run){
    ctx+=`Dagens træning: ${todayD.run.type} – ${todayD.run.dur} @ ${todayD.run.pace}. ${todayD.run.tip}\n`;
  }else if(todayD.ex){
    const exs=dayEx(todayD);
    ctx+=`Dagens øvelser: ${exs.map(e=>e.n).join(', ')}\n`;
    // Vis hvad brugeren løftede sidste uge for at hjælpe coach foreslå vægte
    if(cw>=2&&cw<=8){
      const prevW=cw-1;
      const prevWeights=exs.filter(e=>!e.core).map(e=>{
        const v=gw(prevW,todayD.full,e.n);return v?`${e.n}: ${v} kg`:null;
      }).filter(Boolean);
      if(prevWeights.length)ctx+=`Sidste uge (uge ${prevW}) på denne dag: ${prevWeights.join(', ')}\n`;
    }
  }else{
    ctx+=`Dagens træning: Hvile (restitution).\n`;
  }
  if(PROG.startDate){
    ctx+=`Program startdato: ${fmtDate(PROG.startDate)}\n`;
    if(programDone){
      ctx+=`STATUS: Programmet er FÆRDIGT – brugeren har gennemført alle 8 uger! Foreslå hvad de skal nu (nyt forløb, nye mål, deload, etc).\n`;
    }else{
      ctx+=`Programuge: ${cw} af 8 (${GP[gymPhase(cw)].name}-fase)\n`;
    }
  }else{
    ctx+=`Program ikke startet endnu (ingen startdato sat).\n`;
    ctx+=`Estimeret aktuel uge (fra data): ${cw}\n`;
  }

  // === PROGRAM ===
  ctx+='\n=== TRÆNINGSPROGRAM ===\n';
  ctx+='8-ugers Recomp + 5km løb. Mål: muskelvækst + fedttab + 5km tid fra 35 min til <30 min.\n';
  ctx+='Ugentligt skema:\n';
  D.forEach(d=>{
    const exs=dayEx(d);
    if(exs){
      ctx+=`  ${d.full} (${d.type}): ${exs.map(e=>e.n).join(', ')}\n`;
    }else if(d.run){
      ctx+=`  ${d.full} (${d.type}): ${d.run.dur} @ ${d.run.pace}\n`;
    }else{
      ctx+=`  ${d.full}: Hvile\n`;
    }
  });
  ctx+='\nFaser:\n';
  GP.forEach((p,i)=>{
    ctx+=`  Uge ${['1-3','4-6','7-8'][i]} – ${p.name}: compound ${p.c.s} sæt × ${p.c.r}, isolation ${p.i.s} sæt × ${p.i.r} (${p.tip})\n`;
  });
  PH.forEach(p=>{
    ctx+=`  ${p.w} – Løb ${p.l}: Tir ${p.wd}, Fre ${p.sa}, Mål ${p.g}\n`;
  });

  ctx+='\n=== LOGGEDE DATA ===\n';
  let anyData=false;
  for(let w=1;w<=8;w++){
    let weekData='';
    D.forEach(d=>{
      const exs=dayEx(d);
      if(exs){
        exs.filter(e=>!e.core).forEach(e=>{
          const v=gw(w,d.full,e.n);
          if(v){weekData+=`  ${d.full} ${e.n}: ${v} kg\n`;anyData=true}
        });
      }else if(d.run){
        const tid=gw(w,d.full,'tid'),pace=gw(w,d.full,'pace'),km=gw(w,d.full,'km'),note=gw(w,d.full,'note');
        if(tid||pace||km){
          weekData+=`  ${d.full} løb: tid=${tid||'-'}, pace=${pace||'-'}, km=${km||'-'}`;
          if(note)weekData+=`, noter: "${note}"`;
          weekData+='\n';
          anyData=true;
        }
      }
    });
    if(weekData)ctx+=`Uge ${w}:\n${weekData}`;
  }
  if(!anyData)ctx+='(Ingen data logget endnu)\n';

  // Custom exercises
  const allCust=Object.entries(CUSTOM).filter(([_,arr])=>arr&&arr.length);
  if(allCust.length){
    ctx+='\n=== TILFØJEDE ØVELSER ===\n';
    allCust.forEach(([day,arr])=>{
      ctx+=`${day}: ${arr.map(e=>e.n).join(', ')}\n`;
    });
  }

  return ctx;
}

const SYSTEM_PROMPT=`Du er en personlig dansk styrketræner og løbecoach for en bruger der følger et 8-ugers Recomp + 5km program.

Brugerens mål:
1. Recomposition: muskelvækst + fedttab på samme tid (vedligeholdelseskalorier ±100, 2,2g protein/kg)
2. 5km løb: forbedre fra 35 min til under 30 min på 8 uger

Programstruktur (uge 1-3 hypertrofi, 4-6 styrke, 7-8 peak):
- Mandag: Upper A (styrke)
- Tirsdag: Restitutionsløb (let)
- Onsdag: Lower A (styrke + core-blok)
- Torsdag: Upper B (hypertrofi)
- Fredag: Intervalløb (hård)
- Lørdag: Lower B (hypertrofi + core-blok)
- Søndag: Hvile

Princip for progression: Når brugeren rammer øverste rep-tal i en sæt-rækkefølge → +2,5–5 kg næste uge.

VIGTIGT: Du modtager ALTID følgende kontekst i hver besked:
- Dagens dato og hvilken dag det er
- Dagens specifikke træning (øvelser eller løbetype)
- Brugerens nuværende programuge
- Sidste uges vægte for dagens øvelser (hvis relevant)
- Alle loggede data fra programmet

Brug ALTID denne kontekst aktivt. Sig "I dag har du Upper A" hvis det er mandag, ikke "din næste træning kan være...". Vær specifik om dato og uge.

Når programmet er FÆRDIGT (uge 8 forbi):
- Anerkend resultatet og foreslå konkrete næste skridt
- Mulige veje: nyt 8-ugers forløb (med højere mål), deload-uge før genstart, peak-test af 5km løb, eller skift til vedligeholdelse
- Brug brugerens faktiske data til at vurdere hvad der giver mening

Stil og format:
- Svar på dansk
- Vær konkret og handlingsorienteret. Ingen vatpinde-svar.
- Når du foreslår vægte, vær specifik: "Bænkpres: prøv 67,5 kg næste uge (+2,5 kg fra sidst)"
- Maks 4-6 punkter per svar — kort og brugbart
- Brug **bold** til vigtige tal og navne
- Hvis data mangler, sig det direkte og foreslå hvad brugeren skal logge
- Aldrig generiske fitness-floskler — brug brugerens reelle data`;

async function callClaude(userMessage){
  if(!AI.apiKey)throw new Error('Indtast først din API-nøgle i indstillinger.');

  const ctx=buildTrainingContext();

  // Byg Gemini "contents"-format. Gemini bruger 'model' som rolle for assistant,
  // og 'parts:[{text}]' i stedet for content-strings.
  const contents=[];
  const recent=AI.messages.slice(-10);
  recent.forEach(m=>{
    contents.push({
      role:m.role==='assistant'?'model':'user',
      parts:[{text:m.content}]
    });
  });
  // Tilføj den nye besked med kontekst
  contents.push({
    role:'user',
    parts:[{text:`<træningsdata>\n${ctx}\n</træningsdata>\n\n${userMessage}`}]
  });

  const model=AI.model||'gemini-2.5-flash';
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;

  const res=await fetch(url,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-goog-api-key':AI.apiKey
    },
    body:JSON.stringify({
      contents,
      systemInstruction:{parts:[{text:SYSTEM_PROMPT}]},
      generationConfig:{
        maxOutputTokens:1500,
        temperature:1
      }
    })
  });

  if(!res.ok){
    let errMsg=`API fejl ${res.status}`;
    try{const err=await res.json();errMsg=err?.error?.message||errMsg;}catch(e){}
    if(res.status===400&&errMsg.toLowerCase().includes('api key'))errMsg='Ugyldig API-nøgle. Tjek din nøgle i indstillinger.';
    else if(res.status===403)errMsg='Adgang nægtet. Tjek at API-nøglen er aktiv på aistudio.google.com.';
    else if(res.status===429)errMsg='Daglig grænse nået (1500 forespørgsler/dag på Flash). Vent til i morgen, eller skift model.';
    else if(res.status===404||(res.status===400&&errMsg.toLowerCase().includes('model')))errMsg=`Modellen "${model}" blev ikke fundet. Skift til Gemini 2.5 Flash i indstillinger.`;
    else if(res.status===503)errMsg='Google har midlertidig overbelastning. Prøv igen om et øjeblik.';
    throw new Error(errMsg);
  }

  const data=await res.json();
  // Gemini-svar: data.candidates[0].content.parts[0].text
  const candidate=data?.candidates?.[0];
  if(!candidate)throw new Error('Tomt svar fra Gemini. Prøv igen.');
  if(candidate.finishReason==='SAFETY')throw new Error('Svaret blev blokeret af Geminis sikkerhedsfilter.');
  const text=(candidate.content?.parts||[]).filter(p=>p.text).map(p=>p.text).join('\n').trim();
  if(!text)throw new Error('Tomt tekstsvar — modellen returnerede intet.');
  return text;
}

let aiBusy=false;

async function sendAIMessage(custom){
  if(aiBusy)return;
  const inp=document.getElementById('aiInput');
  const userMsg=custom||inp.value.trim();
  if(!userMsg)return;
  if(!AI.apiKey){toast('Tilføj først API-nøgle');return}

  AI.messages.push({role:'user',content:userMsg});
  if(!custom)inp.value='';
  saveAI();
  aiBusy=true;
  renderChat();
  showTyping();

  try{
    const reply=await callClaude(userMsg);
    AI.messages.push({role:'assistant',content:reply});
    saveAI();
  }catch(e){
    showAIError(e.message||'Ukendt fejl');
    AI.messages.pop(); // remove user msg on error so they can try again
    saveAI();
  }finally{
    aiBusy=false;
    hideTyping();
    renderChat();
  }
}

function aiQuick(kind){
  const cw=currentWeek();
  const phase=GP[gymPhase(Math.min(cw,8))].name;
  const programDone=isProgramDone();
  let prompt;
  if(kind==='today'){
    if(programDone){
      prompt=`Programmet er færdigt — jeg har gennemført alle 8 uger. Giv mig en grundig debrief: Hvor stor fremgang har jeg lavet (vægte og 5km tid)? Hvad var stærkest? Hvad kan forbedres? Og giv mig 3 konkrete valgmuligheder for hvad jeg gør nu (fx nyt forløb med højere mål, deload-uge, peak-test af 5km, eller skift til vedligeholdelse).`;
    }else{
      const todayD=D[todayDayIdx()];
      if(todayD.run){
        prompt=`I dag er det ${todayD.full} – ${todayD.type}. Giv mig konkret pace-strategi for dagens løb baseret på mine sidste løbedata. Hvad skal jeg sigte efter, og hvor hårdt skal jeg køre?`;
      }else if(todayD.ex){
        prompt=`I dag er det ${todayD.full} – ${todayD.type}. Foreslå konkrete vægte til hver øvelse i dag baseret på det jeg løftede sidste uge. Vær specifik: "Øvelse: X kg" — og fortæl hvilke der skal øges og hvilke der skal holdes.`;
      }else{
        prompt=`I dag er det ${todayD.full} – hviledag. Giv mig konkret råd til hvad jeg bør fokusere på i dag for optimal restitution (søvn, protein, evt. let aktivitet) — uden generiske floskler.`;
      }
    }
  }else if(kind==='analyze'){
    prompt=`Analysér min fremgang grundigt. Hvor er jeg stærk? Hvor halter jeg? Er jeg på vej mod mit mål om både muskelvækst og 5km under 30 min? Vær konkret med tal.`;
  }else if(kind==='next'){
    if(programDone){
      prompt=`Programmet er færdigt. Foreslå konkret hvad næste 8-ugers forløb skal se ud — baseret på mine resultater. Skal noget ændres i programstrukturen, vægte eller løbemål?`;
    }else{
      const next=cw+1;
      if(next>8)prompt=`Det er sidste uge af programmet. Giv mig en debrief på hele 8-ugers forløbet og foreslå hvad jeg skal gøre når jeg er færdig.`;
      else{
        const nextPhase=GP[gymPhase(next)].name;
        const phaseChange=phase!==nextPhase?`Bemærk: jeg skifter fra ${phase} til ${nextPhase}-fase næste uge.`:'';
        prompt=`Foreslå konkrete vægte til alle øvelser i Uge ${next}. Brug min sidste loggede uge som basis. ${phaseChange} Vær specifik: "Øvelse: X kg".`;
      }
    }
  }else if(kind==='adjust'){
    prompt=`Skal noget i mit program justeres? Kig på data: er der øvelser hvor jeg ikke gør fremskridt? Skal volumen, hyppighed eller restitution ændres? Foreslå konkrete ændringer hvis nødvendigt.`;
  }else if(kind==='run'){
    prompt=`Hvordan går det med min 5km tid? Er jeg på vej mod under 30 min? Foreslå pace til næste tirsdag (let) og næste fredag (intervaller). Skal noget ændres ved løbene?`;
  }
  sendAIMessage(prompt);
}

function md2html(text){
  let s=escHtml(text);
  // Code
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // Bold + italic
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
  // Bullet lists
  s=s.replace(/^[ \t]*[-•*][ \t]+(.+)$/gm,'<li>$1</li>');
  // Numbered lists
  s=s.replace(/^[ \t]*\d+\.[ \t]+(.+)$/gm,'<li>$1</li>');
  // Wrap consecutive <li>s in <ul>
  s=s.replace(/(<li>[\s\S]*?<\/li>(?:\s*<li>[\s\S]*?<\/li>)*)/g,m=>'<ul>'+m+'</ul>');
  s=s.replace(/<\/ul>\s*<ul>/g,'');
  // Paragraphs from double newlines
  const blocks=s.split(/\n{2,}/);
  return blocks.map(b=>{
    b=b.trim();
    if(!b)return'';
    if(b.startsWith('<ul>')||b.startsWith('<li>'))return b;
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

function renderChat(){
  if(tab!=='coach')return;
  const c=document.getElementById('aiMsgs');
  if(!c)return;
  if(AI.messages.length===0){
    const hasKey=AI.apiKey&&AI.apiKey.trim().length>10;
    c.innerHTML=`<div class="ai-empty">
      <span class="ae-icon">🤖</span>
      <div class="ae-title">Klar til at coache dig</div>
      <div class="ae-sub">${hasKey?'Tryk på en hurtig handling ovenfor<br>eller skriv et spørgsmål nedenfor':'Tilføj din API-nøgle ovenfor for at komme i gang'}</div>
    </div>`;
  }else{
    c.innerHTML=AI.messages.map(m=>`<div class="ai-msg ${m.role==='user'?'user':'bot'}">
      <div class="ai-bub">${m.role==='user'?escHtml(m.content):md2html(m.content)}</div>
    </div>`).join('');
  }
  if(aiBusy)showTyping();
  c.scrollTop=c.scrollHeight;
}

function showTyping(){
  const c=document.getElementById('aiMsgs');
  if(!c||document.getElementById('aiTyping'))return;
  const t=document.createElement('div');
  t.id='aiTyping';
  t.className='ai-msg bot';
  t.innerHTML=`<div class="ai-bub" style="padding:8px 13px"><div class="ai-typing"><span></span><span></span><span></span></div></div>`;
  c.appendChild(t);
  c.scrollTop=c.scrollHeight;
}
function hideTyping(){document.getElementById('aiTyping')?.remove()}

function showAIError(msg){
  const e=document.getElementById('aiError');
  if(e){e.innerHTML=`<div class="ai-error">⚠️ ${escHtml(msg)}</div>`;setTimeout(()=>{e.innerHTML=''},6000);}
}

/* ── EXERCISE LIBRARY ──────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
let libQuery='', libFilter='all';

function rLibrary(){
  let h=`<div class="page-title"><div class="page-eyebrow">// Søg, find, tilføj</div><div class="page-h1">Bibliotek</div></div>`;

  h+=`<div class="lib-search">
    <input type="text" id="libQ" value="${escAttr(libQuery)}" placeholder="🔍 Søg øvelse…" oninput="libSearch(this.value)">
  </div>`;

  // Filters
  h+=`<div class="lib-filters">
    <button class="lib-pill${libFilter==='all'?' on':''}" style="${libFilter==='all'?'background:var(--acc);border-color:var(--acc)':''}" onclick="libSetFilter('all')">Alle (${LIB.length})</button>`;
  MG.forEach(g=>{
    const count=LIB.filter(e=>e.m===g.k).length;
    const on=libFilter===g.k;
    h+=`<button class="lib-pill${on?' on':''}" style="${on?`background:${g.c};border-color:${g.c}`:''}" onclick="libSetFilter('${g.k}')">
      <span class="lp-emo">${g.emo}</span>${g.n} (${count})
    </button>`;
  });
  h+=`</div>`;

  // Filter exercises
  let list=LIB.slice();
  if(libFilter!=='all')list=list.filter(e=>e.m===libFilter);
  if(libQuery){
    const q=libQuery.toLowerCase();
    list=list.filter(e=>e.n.toLowerCase().includes(q)||e.desc.toLowerCase().includes(q)||e.e.toLowerCase().includes(q));
  }

  if(list.length===0){
    h+=`<div class="lib-empty">Ingen øvelser fundet for "${escHtml(libQuery)}"</div>`;
    return h;
  }

  h+=`<div class="lib-grid">`;
  list.forEach((e,i)=>{
    const g=MG.find(x=>x.k===e.m);
    const stars='★'.repeat(e.d)+'☆'.repeat(3-e.d);
    const idx=LIB.indexOf(e);
    h+=`<div class="lib-card" style="--lc:${g.c}">
      <div class="lc-row1">
        <div class="lc-emo">${g.emo}</div>
        <div class="lc-titles">
          <div class="lc-name">${e.n}</div>
          <div class="lc-meta">
            <span class="lc-tag muscle">${g.n}</span>
            <span class="lc-tag">${e.e}</span>
            <span class="lc-diff">${stars}</span>
          </div>
        </div>
      </div>
      <div class="lc-desc">${e.desc}</div>
      <div class="lc-actions">
        <a class="lc-btn video" href="${e.l}" target="_blank">▶ Video</a>
        <button class="lc-btn add" onclick="openAddModal(${idx})">+ Tilføj</button>
      </div>
    </div>`;
  });
  h+=`</div>`;

  // Show summary of custom exercises
  const allCust=Object.entries(CUSTOM).filter(([_,arr])=>arr&&arr.length);
  if(allCust.length){
    h+=`<div class="section-label" style="margin-top:24px">📌 Dine tilføjede øvelser</div>`;
    allCust.forEach(([day,arr])=>{
      const dayObj=D.find(d=>d.full===day);
      const col=dayObj?.color||'#9060f0';
      arr.forEach(ex=>{
        h+=`<div style="background:var(--bg1);border:1px solid var(--bdr);border-left:3px solid ${col};border-radius:var(--r2);padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px">
          <div style="font-family:'DM Mono',monospace;font-size:9px;color:${col};letter-spacing:1px;text-transform:uppercase;min-width:60px">${day}</div>
          <div style="flex:1;font-size:13px">${ex.n}</div>
          <button onclick="removeCustomEx('${escAttr(day)}','${escAttr(ex.n)}')" style="background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 8px">×</button>
        </div>`;
      });
    });
  }

  return h;
}

function libSearch(v){
  libQuery=v;
  // Re-render only the grid section to keep input focus
  const inp=document.getElementById('libQ');
  const focus=document.activeElement===inp;
  const caret=inp?inp.selectionStart:0;
  render();
  if(focus){
    const newInp=document.getElementById('libQ');
    if(newInp){newInp.focus();newInp.setSelectionRange(caret,caret)}
  }
}

function libSetFilter(f){libFilter=f;render()}

function openAddModal(libIdx){
  const ex=LIB[libIdx];
  if(!ex)return;
  const m=document.getElementById('modal');
  let h=`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Tilføj "${ex.n}"</div>
    <div class="modal-sub">Vælg hvilken styrkedag øvelsen skal tilføjes til</div>
    <div class="modal-list">`;
  D.filter(d=>d.ex).forEach(d=>{
    h+=`<div class="modal-row" onclick="addCustomEx(${libIdx},'${escAttr(d.full)}')">
      <span class="mi">${d.icon}</span>
      <div>
        <div class="mt">${d.full}</div>
        <div class="ms">${d.type}</div>
      </div>
      <span class="mr">+ TILFØJ</span>
    </div>`;
  });
  h+=`</div>
    <button class="modal-close" onclick="closeModal()">Annuller</button>
  </div>`;
  m.innerHTML=h;
  m.classList.add('show');
}

function closeModal(){
  const m=document.getElementById('modal');
  m.classList.remove('show');
  m.innerHTML='';
}

function addCustomEx(libIdx,dayFull){
  const ex=LIB[libIdx];
  if(!ex)return;
  if(!CUSTOM[dayFull])CUSTOM[dayFull]=[];
  // Avoid duplicates
  if(CUSTOM[dayFull].some(e=>e.n===ex.n)){
    toast('Allerede tilføjet');
    closeModal();
    return;
  }
  CUSTOM[dayFull].push({
    n:ex.n,
    k:ex.k,
    no:ex.e,
    l:ex.l,
    custom:true,
    core:ex.k==='x'?1:undefined
  });
  saveCustom();
  closeModal();
  toast('✓ Tilføjet til '+dayFull);
  render();
}

function removeCustomEx(dayFull,exName){
  if(!confirm(`Fjern "${exName}" fra ${dayFull}?`))return;
  if(!CUSTOM[dayFull])return;
  CUSTOM[dayFull]=CUSTOM[dayFull].filter(e=>e.n!==exName);
  if(CUSTOM[dayFull].length===0)delete CUSTOM[dayFull];
  saveCustom();
  toast('✓ Fjernet');
  render();
}

/* ═══════════════════════════════════════════════════════════ */
/* ── INIT ──────────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
render();
</script>
