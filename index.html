.lib-pill{flex-shrink:0;padding:8px 14px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s var(--ease);display:flex;align-items:center;gap:6px;min-height:36px}
.lib-pill .lp-emo{display:flex;align-items:center}
.lib-pill .lp-emo .ic{width:14px;height:14px}
.lib-pill:active{transform:scale(.95)}
.lib-pill.on{font-weight:700;color:#000}
.lib-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:520px){.lib-grid{grid-template-columns:1fr 1fr}}
.lib-card{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.lib-card:active{transform:scale(.99)}
.lib-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--lc)}
.lc-row1{display:flex;align-items:flex-start;gap:12px}
.lc-emo{flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--lc) 12%,transparent);border-radius:var(--r2);border:1px solid color-mix(in srgb,var(--lc) 20%,transparent)}
.lc-emo .ic{width:24px;height:24px}
.lc-titles{flex:1;min-width:0}
.lc-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;line-height:1.1}
.lc-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.lc-tag{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--bg2);color:var(--mut);border:1px solid var(--bdr)}
.lc-tag.muscle{background:var(--lc)12;color:var(--lc);border-color:var(--lc)20}
.lc-diff{font-family:'DM Mono',monospace;font-size:10px;color:var(--acc);letter-spacing:1px}
.lc-desc{font-size:12px;color:var(--mut);line-height:1.6}
.lc-actions{display:flex;gap:8px;margin-top:4px}
.lc-btn{flex:1;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);transition:all .15s;min-height:44px}
.lc-btn:active{transform:scale(.97)}
.lc-btn:hover{color:var(--txt);border-color:var(--mut)}
.lc-btn.video{border-color:rgba(255,214,10,.2);color:var(--acc);background:rgba(255,214,10,.06)}
.lc-btn.video:hover{background:rgba(255,214,10,.12)}
.lc-btn.add{border-color:rgba(191,90,242,.2);color:var(--pur);background:rgba(191,90,242,.06)}
.lc-btn.add:hover{background:rgba(191,90,242,.14)}
.lib-difffilter{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.lib-diffpill{background:var(--bg1);border:1px solid var(--bdr);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;padding:7px 12px;border-radius:100px;cursor:pointer;transition:all .15s}
.lib-diffpill.on{background:color-mix(in srgb,var(--acc) 15%,transparent);border-color:var(--acc);color:var(--acc);font-weight:600}
.lib-empty{text-align:center;padding:48px 24px;color:var(--mut);font-family:'DM Mono',monospace;font-size:13px}

/* ══ MODAL ══ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:998;display:none;align-items:flex-end;justify-content:center;padding:0 14px calc(var(--sb) + 14px)}
.modal-bg.show{display:flex}
.modal{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:480px;padding:24px 20px calc(var(--sb) + 24px);animation:slup .35s var(--spring);box-shadow:0 -8px 40px rgba(0,0,0,.5)}
@media (min-width:520px){.modal-bg{align-items:center;padding:16px}.modal{border-radius:var(--r);max-width:420px}}
@keyframes slup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:18px}
.modal-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.modal-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);cursor:pointer;transition:all .15s;min-height:56px}
.modal-row:active{transform:scale(.98)}
.modal-row:hover{border-color:var(--pur)}
.modal-row .mi{font-size:20px}.modal-row .mt{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px}
.modal-row .ms{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace}
.modal-row .mr{margin-left:auto;color:var(--pur);font-family:'DM Mono',monospace;font-size:12px}
.modal-close{width:100%;padding:12px;background:transparent;border:1.5px solid var(--bdr);color:var(--mut);border-radius:var(--r2);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;min-height:44px;transition:all .15s}
.modal-close:active{transform:scale(.98)}

/* ══ BODY TRACKER ══ */
.body-week-nav{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.body-week-nav .bw-arr{width:44px;height:44px;border-radius:50%;background:var(--bg2);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--mut);transition:all .15s var(--ease)}
.body-week-nav .bw-arr:active{transform:scale(.9);background:var(--bg3)}
.body-week-nav .bw-arr.dis{opacity:.25;pointer-events:none}
.body-week-nav .bw-label{flex:1;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px}
.body-week-nav .bw-phase{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;text-align:center;display:block;margin-top:2px}

.body-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.body-field{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.body-field label{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
.body-field input{width:100%;background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:18px;font-weight:500;padding:10px 12px;border-radius:var(--r2);outline:none;text-align:center;transition:border-color .2s,box-shadow .2s}
.body-field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,214,10,.12)}
.body-field .bf-unit{font-size:11px;color:var(--mut);text-align:center;margin-top:6px;font-family:'DM Mono',monospace}
.body-field .bf-diff{font-size:11px;font-family:'DM Mono',monospace;text-align:center;margin-top:4px;font-weight:600}

.body-photo{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.body-photo>label{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:14px;text-align:center}
.body-photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.body-photo-slot{text-align:center}
.body-photo-slot .bps-label{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:4px}
.body-photo-preview{width:100%;border-radius:var(--r2);overflow:hidden;aspect-ratio:3/4;background:var(--bg2);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;position:relative}
.body-photo-preview img{width:100%;height:100%;object-fit:cover}
.body-photo-preview .bpp-empty{text-align:center;padding:20px;color:var(--mut2);display:flex;flex-direction:column;align-items:center;gap:6px}
.body-photo-preview .bpp-empty .ic{width:28px;height:28px}
.body-photo-slot .bps-label .ic,.bp-btn .ic{width:14px;height:14px}
.body-photo-preview .bpp-empty span{font-size:40px;display:block;margin-bottom:8px;opacity:.4}
.body-photo-preview .bpp-empty div{font-size:11px;font-family:'DM Mono',monospace}
.body-photo-btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
.bp-btn{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:10px 16px;border-radius:100px;cursor:pointer;border:1.5px solid var(--bdr);background:var(--bg2);color:var(--mut);transition:all .15s;min-height:44px;display:flex;align-items:center;gap:6px}
.bp-btn:active{transform:scale(.95)}
.bp-btn.primary{background:var(--acc);color:#000;border-color:var(--acc)}
.bp-btn.danger{color:var(--red);border-color:rgba(255,69,58,.3)}
input[type=file]{display:none}

.body-graph{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.body-graph-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:4px}
.body-graph-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:14px}

.body-compare{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.body-compare-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:14px}
.body-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.body-compare-card{text-align:center}
.body-compare-card .bcc-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
.body-compare-card .bcc-img{width:100%;aspect-ratio:3/4;border-radius:var(--r2);overflow:hidden;background:var(--bg2);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center}
.body-compare-card .bcc-img img{width:100%;height:100%;object-fit:cover}
.body-compare-card .bcc-stats{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:6px;line-height:1.6}
.body-compare-card .bcc-empty{color:var(--mut2);font-size:24px;opacity:.3}

/* ══ REST TIMER ══ */
#restTimer{position:fixed;bottom:calc(var(--sb) + 72px);right:16px;left:16px;z-index:99;margin:0 auto;max-width:340px;border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:2px solid var(--acc);box-shadow:0 4px 24px rgba(255,214,10,.2);display:none;align-items:center;gap:12px;padding:12px 14px;font-family:'DM Mono',monospace}
#restTimer.show{display:flex;animation:slideUp .3s var(--spring)}
#restTimer .rt-main{display:flex;flex-direction:column;align-items:center;min-width:56px}
#restTimer .rt-time{font-size:24px;font-weight:700;color:var(--acc);line-height:1}
#restTimer .rt-label{font-size:7px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:3px}
#restTimer .rt-controls{display:flex;gap:6px;flex:1}
#restTimer .rt-btn{flex:1;background:var(--bg2);border:1px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:11px 6px;border-radius:10px;cursor:pointer;transition:transform .12s,background .12s;min-height:42px}
#restTimer .rt-btn:active{transform:scale(.94);background:var(--bg3)}
#restTimer .rt-btn.rt-skip{font-size:10px;color:var(--mut);letter-spacing:.3px}
#restTimer.done{border-color:var(--grn)}
#restTimer.done .rt-time{color:var(--grn)}
#restTimer.done{animation:timerPulse .6s ease 3}
#restTimer.done .rt-time{color:var(--grn)}
@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ══ PR BADGE ══ */
.pr-badge{display:inline-flex;align-items:center;gap:2px;background:rgba(255,214,10,.15);color:var(--acc);font-family:'DM Mono',monospace;font-size:7px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.pr-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:1000;font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--acc);text-shadow:0 0 40px rgba(255,214,10,.5);pointer-events:none;opacity:0}
.pr-toast.show{animation:prCelebrate .8s var(--spring) forwards}
@keyframes prCelebrate{0%{opacity:1;transform:translate(-50%,-50%) scale(0)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) translateY(-30px)}}

/* ══ SUPERSET ══ */
.ss-tag{display:inline-block;background:rgba(255,111,64,.12);color:var(--ora);font-family:'DM Mono',monospace;font-size:7px;font-weight:600;letter-spacing:1px;padding:2px 5px;border-radius:4px;margin-left:4px;vertical-align:middle}
.ss-bracket{position:absolute;right:-4px;top:-2px;bottom:-2px;width:3px;background:var(--ora);border-radius:3px;opacity:.6}

/* ══ PACE CALCULATOR ══ */
.pace-calc{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-top:16px;box-shadow:var(--shadow)}
.pace-calc-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pace-calc-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.pace-calc-field{text-align:center}
.pace-calc-field label{display:block;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.pace-calc-field input{width:100%;background:var(--bg);border:1.5px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:15px;padding:8px;border-radius:var(--r2);outline:none;text-align:center;min-height:40px}
.pace-calc-field input:focus{border-color:var(--acc)}
.pace-calc-result{text-align:center;padding:10px;background:var(--bg2);border-radius:var(--r2);border:1px solid var(--bdr);font-family:'DM Mono',monospace;font-size:13px;color:var(--grn)}

/* ══ EXPORT/IMPORT ══ */
.backup-section{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-top:20px;box-shadow:var(--shadow)}

/* ══ BACKUP REMINDER MODAL ══ */
.backup-reminder-modal{max-width:360px;text-align:center;padding:28px 24px 22px}
.brm-icon{font-size:44px;margin-bottom:12px}
.brm-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;margin-bottom:10px}
.brm-body{font-size:13px;line-height:1.6;color:var(--mut);margin-bottom:20px}
.brm-btns{display:flex;flex-direction:column;gap:8px}
.backup-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;margin-bottom:8px}
.backup-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:14px;line-height:1.6}
.backup-btns{display:flex;gap:8px;flex-wrap:wrap}

/* ══ COG BUTTON ══ */
#hdrCog{position:absolute;top:calc(var(--st) + 14px);right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--mut);font-size:18px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:all .2s var(--ease);display:flex;align-items:center;justify-content:center}
#hdrCog:active{transform:scale(.9) rotate(45deg)}
#hdrCog:hover{color:var(--acc);border-color:var(--acc)}
#hdrInfo{position:absolute;top:calc(var(--st) + 14px);right:62px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--mut);font-size:16px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:all .2s var(--ease);display:flex;align-items:center;justify-content:center}
#hdrInfo:active{transform:scale(.9)}
#hdrInfo:hover{color:var(--blue);border-color:var(--blue)}

/* ══ NOTES POPUP ══ */
.note-btn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:14px;padding:4px;opacity:.5;transition:opacity .15s;min-width:28px;min-height:28px}
.note-btn:hover,.note-btn.has{opacity:1;color:var(--acc)}
.note-popup{margin-top:8px;padding:10px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);grid-column:1/-1;animation:slideUp .2s var(--spring)}
.note-popup textarea{width:100%;min-height:50px;font-size:12px}

/* ══ ESTIMATED 1RM ══ */
.est-1rm{font-size:9px;color:var(--mut2);font-family:'DM Mono',monospace;margin-top:2px;letter-spacing:.5px}
.est-1rm b{color:var(--blue);font-weight:600}

/* ══ CONFETTI ══ */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:1001;overflow:hidden;display:none}
#confetti.show{display:block}
.cf{position:absolute;top:-20px;width:8px;height:14px;animation:cfFall 1.6s ease-in forwards}
@keyframes cfFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(120vh) rotate(720deg);opacity:.5}}

/* ══ VOLUME CHART ══ */
.vol-section{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.vol-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:4px}
/* dashboard-overblik */
.sw-row{align-items:flex-start!important;padding:14px!important}
.sw-row .ms{white-space:normal!important;line-height:1.5;margin-top:3px}
.dash{margin-bottom:20px}
.dash-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--bg1)),var(--bg1));border:1.5px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:var(--r);padding:15px}
.dh-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dh-wk{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;letter-spacing:.5px}
.dh-wk span{font-size:15px;color:var(--mut)}
.dh-phase{font-family:'DM Mono',monospace;font-size:9.5px;padding:4px 9px;border-radius:100px;white-space:nowrap;letter-spacing:.3px}
.dh-prog{height:7px;background:var(--bg3);border-radius:4px;margin:11px 0 6px;overflow:hidden}
.dh-fill{height:100%;background:linear-gradient(90deg,var(--acc),#ffb800);border-radius:4px;transition:width .4s}
.dh-sub{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--mut);line-height:1.5}
.dash-sec{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:20px 0 9px}
.dash-days{display:flex;gap:4px}
.dash-day{flex:1;aspect-ratio:1;border-radius:9px;background:var(--bg2);border:1px solid var(--sep);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Mono',monospace;min-width:0}
.dash-day.done{background:color-mix(in srgb,var(--grn) 16%,transparent);border-color:color-mix(in srgb,var(--grn) 50%,transparent)}
.dash-day.rest{opacity:.4}
.dash-day.today{border-color:var(--acc);border-width:2px}
.dd-d{font-size:7.5px;color:var(--mut);letter-spacing:.2px}
.dash-day.done .dd-d{color:var(--grn)}
.dd-i{font-size:12px;margin-top:1px}
.dash-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dash-kpi{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px}
.dk-l{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px}
.dk-v{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1.1;margin-top:3px;letter-spacing:.5px}
.dk-v span{font-size:14px;color:var(--mut)}
.dk-s{font-family:'DM Mono',monospace;font-size:9px;color:var(--mut);margin-top:2px;line-height:1.4}
.dk-s.up{color:var(--grn)}
.dk-s.down{color:#ff9f0a}
.dash-chart{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r2);padding:13px}
.dc-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.dc-t{font-size:12.5px;font-weight:600}
.dc-d{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--mut)}
.dash-pr{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg1);border:1px solid var(--sep);border-radius:var(--r3);padding:11px 13px;margin-bottom:6px}
.dp-n{font-size:13px;font-weight:500}
.dp-d{font-family:'DM Mono',monospace;font-size:9px;color:var(--mut2);margin-top:2px}
.dp-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.dp-w{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--acc);letter-spacing:.5px}
.dp-badge{font-family:'DM Mono',monospace;font-size:8.5px;background:color-mix(in srgb,var(--grn) 18%,transparent);color:var(--grn);padding:3px 7px;border-radius:100px}
.vol-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:12px}
.vol-bars{display:flex;flex-direction:column;gap:8px}
.vol-bar-row{display:grid;grid-template-columns:80px 1fr 60px;gap:10px;align-items:center}
.vol-bar-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.vol-bar-track{height:12px;background:var(--bg2);border-radius:6px;position:relative;overflow:hidden}
.vol-bar-fill{height:100%;border-radius:6px;transition:width .8s var(--ease)}
.vol-bar-val{font-size:11px;font-family:'DM Mono',monospace;color:var(--txt);text-align:right;font-weight:500}

/* ══ STREAK HEATMAP ══ */
.streak-section{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.streak-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:4px}
.streak-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.streak-stat{color:var(--acc);font-weight:600}
.streak-grid{display:grid;grid-template-columns:32px repeat(7,1fr);gap:4px}
.streak-day-label{font-size:8px;color:var(--mut2);font-family:'DM Mono',monospace;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.5px}
.streak-cell{aspect-ratio:1;border-radius:4px;background:var(--bg3);position:relative;transition:transform .15s var(--ease)}
.streak-cell:hover{transform:scale(1.15)}
.streak-cell.l1{background:rgba(255,214,10,.18)}
.streak-cell.l2{background:rgba(255,214,10,.4)}
.streak-cell.l3{background:rgba(255,214,10,.7)}
.streak-cell.l4{background:var(--acc)}
.streak-cell.future{background:var(--bg2);opacity:.5}
.streak-cell.today{box-shadow:0 0 0 2px var(--acc)}
.streak-week-label{font-size:7px;color:var(--mut2);font-family:'DM Mono',monospace;text-align:center;margin-top:2px}
.streak-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:9px;color:var(--mut2);font-family:'DM Mono',monospace}
.streak-legend-cells{display:flex;gap:3px}
.streak-legend-cells div{width:10px;height:10px;border-radius:2px}

/* ══ PHOTO GALLERY ══ */
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media (min-width:520px){.gallery-grid{grid-template-columns:repeat(3,1fr)}}
.gallery-item{position:relative;aspect-ratio:3/4;border-radius:var(--r2);overflow:hidden;background:var(--bg2);border:1px solid var(--bdr);cursor:pointer;transition:transform .2s var(--ease)}
.gallery-item:active{transform:scale(.96)}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-item .gal-week{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;padding:3px 8px;border-radius:6px;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.5px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.gallery-item .gal-stats{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-family:'DM Mono',monospace;font-size:9px;color:#fff;text-align:center}
.gallery-toggle{margin-top:12px;text-align:center}

/* ══ WORKOUT TIMER ══ */
.workout-timer{display:inline-flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:var(--blue);padding:5px 10px;background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.25);border-radius:100px;letter-spacing:.5px}
.workout-timer .wt-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pls 1.5s infinite}

/* ══ TOOLTIP ══ */
#chartTooltip{position:fixed;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--bdr);color:var(--txt);font-family:'DM Mono',monospace;font-size:11px;padding:6px 10px;border-radius:8px;pointer-events:none;z-index:1000;display:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#chartTooltip.show{display:block;animation:fi .15s ease}

/* ══ TEMPLATE CHOOSER ══ */
.tpl-chooser{padding:24px 16px;animation:fi .3s ease}
.tpl-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--acc);text-transform:uppercase;text-align:center;margin-bottom:6px}
.tpl-h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;text-align:center;margin-bottom:8px;line-height:1}
.tpl-sub{font-size:13px;color:var(--mut);font-family:'DM Mono',monospace;text-align:center;margin-bottom:32px;line-height:1.5}
.tpl-card{background:var(--bg1);border:2px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:12px;cursor:pointer;transition:all .2s var(--ease);display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center}
.tpl-card:active{transform:scale(.98)}
.tpl-card:hover{border-color:var(--tc);background:var(--bg2)}
.tpl-card.cur{border-color:var(--tc);background:var(--bg2);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 20%,transparent)}
.tpl-emo{width:54px;height:54px;border-radius:50%;background:color-mix(in srgb,var(--tc) 15%,transparent);display:flex;align-items:center;justify-content:center;font-size:28px}
.tpl-info .tpl-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;line-height:1.1;margin-bottom:2px}
.tpl-info .tpl-meta{font-size:11px;font-family:'DM Mono',monospace;color:var(--mut2);margin-bottom:6px;letter-spacing:.5px}
.tpl-info .tpl-desc{font-size:12px;color:var(--mut);line-height:1.5}
.tpl-arr{color:var(--tc);font-size:20px;opacity:.6}
.tpl-card.cur .tpl-arr{opacity:1}
.tpl-current-tag{font-family:'DM Mono',monospace;font-size:8px;font-weight:700;letter-spacing:1.5px;background:var(--acc);color:#000;padding:3px 8px;border-radius:100px;display:inline-block;margin-left:8px;vertical-align:middle}

/* ══ STEPS WIDGET (PCOS) ══ */
.steps-widget{background:linear-gradient(135deg,rgba(255,111,168,.12),rgba(10,132,255,.08));border:1.5px solid rgba(255,111,168,.3);border-radius:var(--r);padding:18px;margin-bottom:16px}
.steps-widget-row{display:flex;align-items:center;gap:14px}
.steps-icon{width:54px;height:54px;border-radius:50%;background:rgba(255,111,168,.18);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.steps-content{flex:1}
.steps-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.steps-value{display:flex;align-items:baseline;gap:6px}
.steps-value input{width:90px;background:transparent;border:none;color:var(--txt);font-family:'Bebas Neue',sans-serif;font-size:32px;font-weight:600;outline:none;padding:0;letter-spacing:.5px}
.steps-value input:focus{color:#ff6fa8}
.steps-goal{font-size:13px;color:var(--mut);font-family:'DM Mono',monospace}
.steps-bar{height:6px;background:var(--bg3);border-radius:6px;margin-top:10px;overflow:hidden}
.steps-bar-fill{height:100%;background:linear-gradient(90deg,#ff6fa8,#0a84ff);border-radius:6px;transition:width .6s var(--ease)}
.steps-status{font-size:10px;font-family:'DM Mono',monospace;margin-top:6px;letter-spacing:.5px}

/* ══ CYCLE TRACKER ══ */
.cycle-section{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:16px}

/* Cyklus-pille (kompakt visning øverst i dagens detalje) */
.cycle-pill{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,rgba(255,105,180,.08),rgba(191,90,242,.08));border:1px solid rgba(255,105,180,.2);border-radius:100px;margin-bottom:14px;cursor:pointer;flex-wrap:wrap;transition:all .15s var(--ease)}
.cycle-pill:active{transform:scale(.98)}
.cycle-pill-emo{font-size:18px}
.cycle-pill-text{font-family:'DM Mono',monospace;font-size:11px;color:#ff69b4;letter-spacing:.3px}
.cycle-pill-text b{color:var(--txt);font-weight:600}
.cycle-pill-tip{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;flex:1;min-width:0;line-height:1.4;margin-left:auto;opacity:.85}
@media(max-width:380px){.cycle-pill-tip{display:none}}
.cycle-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;margin-bottom:4px}
.cycle-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:14px}
.cycle-phases{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:480px){.cycle-phases{grid-template-columns:repeat(4,1fr)}}
.cycle-phase{padding:12px 8px;border:1.5px solid var(--bdr);border-radius:var(--r2);background:var(--bg2);text-align:center;cursor:pointer;transition:all .2s var(--ease);min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cycle-phase:active{transform:scale(.95)}
.cycle-phase.on{background:rgba(255,111,168,.15);border-color:#ff6fa8;color:#ff6fa8}
.cycle-phase .cp-emo{font-size:18px}
.cycle-phase .cp-name{font-family:'DM Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}

/* ══ MEDICAL DISCLAIMER ══ */
.med-disclaimer{background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.25);border-radius:var(--r2);padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.med-disclaimer-icon{font-size:18px;line-height:1.3;flex-shrink:0}
.med-disclaimer-text{font-size:11px;color:var(--mut);line-height:1.5}
.med-disclaimer-text b{color:#ff453a;font-weight:600}

/* ══ QUICK COACH BUTTON ══ */
.ai-btn.quick-coach{background:linear-gradient(135deg,#0a84ff,#bf5af2);color:#fff;border:none;font-weight:600;letter-spacing:.5px;box-shadow:0 4px 16px rgba(10,132,255,.25)}
.ai-btn.quick-coach:active{transform:scale(.96);box-shadow:0 2px 8px rgba(10,132,255,.2)}

/* ══ WELLNESS WIDGET ══ */
.wellness-widget{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.wellness-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;margin-bottom:4px}
.wellness-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-bottom:14px;line-height:1.5}
.wellness-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:520px){.wellness-grid{grid-template-columns:1fr 1fr;gap:12px}}
.wellness-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px 12px;text-align:center;min-width:0}
.wellness-card label{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
.wellness-card .wval{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;margin-bottom:6px}
.wellness-card .wval-sub{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:4px;font-weight:600}
.wellness-slider-row{display:flex;align-items:center;gap:6px;margin-top:6px;width:100%}
.wellness-slider{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;background:var(--bg3);border-radius:4px;outline:none;cursor:pointer}
.wellness-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--acc);border-radius:50%;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.wellness-slider::-moz-range-thumb{width:20px;height:20px;background:var(--acc);border-radius:50%;cursor:pointer;border:none}
.wellness-stress .wellness-slider::-webkit-slider-thumb{background:#ff453a}
.wellness-stress .wellness-slider::-moz-range-thumb{background:#ff453a}
.wellness-emoji{font-size:16px;width:22px;text-align:center;flex-shrink:0}

/* ══ AI ONBOARDING ══ */
.ai-onboarding{padding:24px 18px;text-align:center;animation:fi .3s ease}
.aob-icon{font-size:54px;display:block;margin-bottom:12px;animation:bounce 1.5s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.aob-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;margin-bottom:8px}
.aob-sub{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:24px;max-width:380px;margin-left:auto;margin-right:auto}
.aob-steps{text-align:left;max-width:420px;margin:0 auto 20px;display:flex;flex-direction:column;gap:14px}
.aob-step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:flex-start;padding:14px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2)}
.aob-num{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#000;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;font-weight:600;flex-shrink:0}
.aob-txt b{display:block;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px;color:var(--txt);margin-bottom:3px}
.aob-txt div{font-size:12px;color:var(--mut);line-height:1.5}
.aob-txt code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:11px;color:var(--blue);font-family:'DM Mono',monospace}
.aob-cta{background:linear-gradient(135deg,var(--acc),#ff9f0a);color:#000;border:none;padding:14px 28px;border-radius:100px;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 20px rgba(255,214,10,.3);min-height:48px}
.aob-cta:active{transform:scale(.97)}
.aob-quota{margin-top:16px;font-size:10px;color:var(--mut2);font-family:'DM Mono',monospace}

/* ══ INTRO / WELCOME FLOW ══ */
.intro-wrap{position:fixed;inset:0;background:#000;z-index:1500;display:flex;flex-direction:column;animation:fi .4s ease;padding:env(safe-area-inset-top,16px) 0 env(safe-area-inset-bottom,20px)}
.intro-skip{position:absolute;top:calc(env(safe-area-inset-top,16px) + 12px);right:16px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);color:var(--mut);font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1.5px;padding:8px 14px;border-radius:100px;cursor:pointer;text-transform:uppercase;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5}
.intro-skip:active{transform:scale(.95);color:var(--txt)}
.intro-slides{flex:1;overflow:hidden;position:relative;touch-action:pan-y}
.intro-track{display:flex;height:100%;transition:transform .35s cubic-bezier(.34,1.56,.64,1);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.intro-slide{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;will-change:transform;-webkit-transform:translateZ(0);transform:translateZ(0)}
.intro-emoji{font-size:88px;margin-bottom:24px;animation:introFloat 2.4s ease-in-out infinite;line-height:1}
@keyframes introFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.intro-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--acc);text-transform:uppercase;margin-bottom:10px}
.intro-h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.5px;line-height:1.05;margin-bottom:14px;max-width:340px}
.intro-text{font-size:14px;color:var(--mut);line-height:1.6;max-width:340px;margin-bottom:8px}
.intro-text b{color:var(--txt);font-weight:600}
.intro-features{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;max-width:380px}
.intro-feature{background:var(--bg2);border:1px solid var(--bdr);padding:8px 14px;border-radius:100px;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1px;color:var(--mut)}
.intro-feature .if-emo{margin-right:4px;font-size:13px}
.intro-templates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;max-width:340px}

/* ══ INTRO TRAINING STYLES ══ */
.intro-styles{display:flex;flex-direction:column;gap:10px;margin-top:16px;max-width:360px;width:100%}
.intro-style-card{background:var(--bg2);border:1.5px solid var(--bdr);border-radius:var(--r2);padding:14px;text-align:left}
.intro-style-card.flex{border-color:rgba(255,214,10,.25);background:linear-gradient(135deg,rgba(255,214,10,.05),rgba(255,255,255,.02))}
.is-icon{font-size:22px;margin-bottom:6px}
.is-name{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--acc);font-weight:700;margin-bottom:6px}
.is-desc{font-size:12px;color:var(--txt);line-height:1.45;margin-bottom:8px}
.is-best{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;line-height:1.4}

/* ══ TRAINING STYLE PICKER MODAL ══ */
.tsp-option{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg2);border:1.5px solid var(--bdr);border-radius:var(--r2);cursor:pointer;transition:all .15s var(--ease);margin-bottom:10px;text-align:left}
.tsp-option:active{transform:scale(.97);background:var(--bg3);border-color:var(--acc)}
.tsp-option.flex{border-color:rgba(255,214,10,.3);background:linear-gradient(135deg,rgba(255,214,10,.04),rgba(255,255,255,.02))}
.tsp-option.flex:active{background:rgba(255,214,10,.1)}
.tsp-icon{font-size:24px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:50%}
.tsp-content{flex:1;min-width:0;text-align:left}
.tsp-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.3px;line-height:1.1;margin-bottom:4px}
.tsp-desc{font-size:11px;color:var(--mut);line-height:1.4;margin-bottom:4px}
.tsp-best{font-size:10px;color:var(--mut2);font-family:'DM Mono',monospace}
.tsp-arr{font-size:18px;color:var(--mut2);flex-shrink:0}
.intro-tpl{background:var(--bg2);border:1.5px solid var(--bdr);border-radius:var(--r2);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.intro-tpl-emo{font-size:24px}
.intro-tpl-name{font-family:'DM Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);text-align:center;line-height:1.3}
.intro-footer{padding:16px 24px 0;display:flex;flex-direction:column;align-items:center;gap:14px}
.intro-dots{display:flex;gap:8px}
.intro-dot{width:8px;height:8px;border-radius:50%;background:var(--bg3);transition:all .25s var(--ease)}
.intro-dot.on{background:var(--acc);transform:scale(1.3)}
.intro-cta{background:var(--acc);color:#000;border:none;padding:16px 28px;border-radius:100px;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;min-width:200px;min-height:52px;box-shadow:0 6px 20px rgba(255,214,10,.3)}
.intro-cta:active{transform:scale(.97)}
.intro-cta.final{background:linear-gradient(135deg,var(--acc),#ff9f0a)}

/* ══ BODY LOG REMINDER ══ */
.blr-modal{max-width:380px;text-align:center;padding:28px 24px 20px;animation:fi .3s ease}
.blr-emoji{font-size:54px;margin-bottom:14px;animation:introFloat 2.4s ease-in-out infinite;display:inline-block}
.blr-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;margin-bottom:10px}
.blr-sub{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:22px}
.blr-actions{display:flex;flex-direction:column;gap:8px}
.blr-skip{margin-top:14px;font-family:'DM Mono',monospace;font-size:10px;color:var(--mut2);letter-spacing:.5px;cursor:pointer;padding:8px;text-decoration:underline;text-underline-offset:3px}
.blr-skip:active{color:var(--mut)}

/* ══ VIEW MODE TOGGLE (Hele ugen vs Kun i dag) ══ */
.view-toggle{display:flex;gap:0;background:var(--bg2);border:1px solid var(--bdr);border-radius:100px;padding:3px;margin-bottom:18px;width:fit-content;margin-left:auto;margin-right:auto}

/* Hop til i dag-knap (når man ser anden dag) */
.today-jump-wrap{display:flex;justify-content:center;margin-bottom:14px}
.today-jump{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:var(--bg2);border:1.5px solid var(--bdr);border-radius:100px;color:var(--acc);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:all .15s var(--ease);min-height:38px}
.today-jump:active{transform:scale(.95);background:rgba(255,214,10,.12);border-color:var(--acc)}
.vt-opt{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;background:transparent;border:none;color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.5px;padding:8px 16px;border-radius:100px;cursor:pointer;min-height:36px;transition:all .2s var(--ease);white-space:nowrap}
.vt-opt .ic{width:15px;height:15px}
.vt-opt:active{transform:scale(.96)}
.vt-opt.on{background:var(--acc);color:#000}

/* ══ DAY SWIPE HINT (Kun i dag mode) ══ */
.day-swipe-hint{text-align:center;font-family:'DM Mono',monospace;font-size:9px;color:var(--mut2);letter-spacing:1.5px;margin-bottom:8px;opacity:.6;text-transform:uppercase}

/* Kompakt dag-stribe i "Kun i dag" mode — gør alle dage direkte tappable */
.day-rail{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1);padding:var(--s1);margin-bottom:var(--s4);background:var(--bg1);border-radius:var(--r2);border:1px solid var(--sep)}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:var(--s3) 0 var(--s2);background:transparent;border:none;border-radius:var(--r3);color:var(--mut2);cursor:pointer;font-family:inherit;transition:all .25s var(--ease);min-height:58px;overflow:hidden}
.day::before{content:'';position:absolute;inset:0;background:var(--dc,var(--acc));opacity:0;transition:opacity .25s var(--ease)}
.day>*{position:relative;z-index:1}
.day:active{transform:scale(.93)}
.day.on{color:#000}
.day.on::before{opacity:1}
.day.today:not(.on){color:var(--dc,var(--acc))}
.day .ic{width:19px;height:19px;stroke-width:2}
.day-label{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.day .live-dot{position:absolute;top:6px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--dc,var(--acc));z-index:2;box-shadow:0 0 6px var(--dc,var(--acc))}
.day.on .live-dot{background:#000;box-shadow:none}
.day .done-dot{position:absolute;bottom:3px;right:5px;width:13px;height:13px;border-radius:50%;background:var(--grn);color:#000;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.day.on .done-dot{background:#000;color:var(--grn)}
.day-swipe-wrap{touch-action:pan-y;animation:dayFi .25s ease}
@keyframes dayFi{from{opacity:0;transform:translateX(0)}to{opacity:1;transform:translateX(0)}}

/* ══ WEIGHT TAB SWIPE (Log vs Graf) ══ */
.weight-swipe-hint{text-align:center;font-family:'DM Mono',monospace;font-size:9px;color:var(--mut2);letter-spacing:1.5px;margin-bottom:12px;opacity:.5;text-transform:uppercase}
.weight-swipe-wrap{touch-action:pan-y;animation:dayFi .25s ease}
/* ══ KALORIETÆLLER ══ */
.cal-wrap{animation:dayFi .25s ease}
.cal-hero{display:flex;gap:18px;align-items:center;background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:12px}
.cal-ring{position:relative;flex-shrink:0;width:130px;height:130px}
.cal-ring svg{transform:rotate(-90deg)}
.cal-ring-bg{fill:none;stroke:var(--bg3);stroke-width:9}
.cal-ring-fill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease),stroke .3s}
.cal-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal-ring-num{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1}
.cal-ring-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut)}
.cal-hero-side{flex:1;min-width:0}
.cal-remain{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--grn);line-height:1}
.cal-remain.over{color:var(--red)}
.cal-target-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.3px;margin:2px 0 12px}
.cal-macros{display:flex;flex-direction:column;gap:8px}
.cal-macro{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center}
.cal-macro .cm-lbl{font-size:11px;font-weight:600}
.cal-macro b{font-family:'DM Mono',monospace;font-size:11px;text-align:right}
.cal-macro .cm-bar{grid-column:1/3;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.cal-macro .cm-bar div{height:100%;border-radius:2px;transition:width .5s var(--ease)}
.cal-note-prot{background:color-mix(in srgb,var(--red) 8%,var(--bg1));border-left:3px solid var(--red);border-radius:var(--r3);padding:10px 12px;font-size:12px;color:var(--mut);line-height:1.5;margin-bottom:12px}
.cal-photo-box{margin-bottom:12px}
.cal-mealplan{margin-bottom:14px;background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r2);overflow:hidden}
/* deload + skader + opvarmning */
.deload-banner{background:linear-gradient(135deg,color-mix(in srgb,#bf5af2 16%,var(--bg1)),var(--bg1));border:1.5px solid color-mix(in srgb,#bf5af2 45%,transparent);border-radius:var(--r2);padding:14px 16px;margin-bottom:14px}
.dl-head{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#bf5af2;letter-spacing:.5px}
.dl-body{font-size:12.5px;color:var(--txt);line-height:1.6;margin-top:5px}
.dl-body b{color:#bf5af2}
.dl-why{font-size:11px;color:var(--mut);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid var(--sep)}
.swap-tag.inj{background:color-mix(in srgb,#ff9f0a 20%,transparent);color:#ff9f0a}
.inj-why{font-size:10.5px;color:#ff9f0a;line-height:1.5;margin-top:3px}
.inj-picker{margin-top:12px}
.inj-picker-lbl{font-size:11px;color:var(--mut);line-height:1.5;margin-bottom:8px}
.inj-chips{display:flex;flex-wrap:wrap;gap:6px}
.inj-chip{background:var(--bg2);border:1px solid var(--bdr);color:var(--mut);font-size:11.5px;padding:8px 12px;border-radius:100px;cursor:pointer}
.inj-chip.on{background:color-mix(in srgb,#ff9f0a 18%,transparent);border-color:#ff9f0a;color:#ff9f0a;font-weight:600}
.inj-disclaimer{font-size:10px;color:var(--mut2);line-height:1.6;margin-top:10px;padding:8px 10px;background:var(--bg2);border-radius:var(--r3)}
/* program-bygger */
.bld-sec{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--acc);margin:22px 0 10px}
.bld-opt{color:var(--mut2);text-transform:none;letter-spacing:0}
.bld-splits{display:flex;flex-direction:column;gap:8px}
.bld-split{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--bg1);border:1.5px solid var(--bdr);border-radius:var(--r2);padding:13px 15px;cursor:pointer;text-align:left;width:100%}
.bld-split.on{border-color:#64d2ff;background:color-mix(in srgb,#64d2ff 10%,var(--bg1))}
.bld-split b{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--txt);letter-spacing:.5px}
.bld-split.on b{color:#64d2ff}
.bld-split span{font-size:12px;color:var(--mut)}
.bld-weeks{display:flex;gap:8px}
.bld-wk{flex:1;background:var(--bg1);border:1.5px solid var(--bdr);color:var(--mut);font-family:'DM Mono',monospace;font-size:13px;padding:12px;border-radius:var(--r3);cursor:pointer}
.bld-wk.on{border-color:#64d2ff;color:#64d2ff;background:color-mix(in srgb,#64d2ff 10%,transparent);font-weight:700}
.bld-hint{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.5}
.bld-day{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--r2);margin-bottom:7px;overflow:hidden}
.bld-day.open{border-color:#64d2ff}
.bld-day.rest{opacity:.75}
.bld-day-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.bld-day-head b{font-size:14px}
.bld-day-type{font-size:11px;color:var(--mut);margin-left:8px}
.bld-day-n{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut)}
.bld-run{background:var(--bg3);border:1px solid var(--bdr);color:var(--mut);font-family:'DM Mono',monospace;font-size:10px;padding:6px 11px;border-radius:100px;cursor:pointer}
.bld-run.on{background:color-mix(in srgb,#30d158 18%,transparent);border-color:#30d158;color:#30d158}
.bld-exlist{padding:0 14px 8px}
.bld-ex{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--sep);font-size:13px}
.bld-ex button{background:none;border:none;color:var(--mut2);font-size:13px;cursor:pointer;padding:0 4px}
/* muskel-vælger */
.mm-wrap{background:radial-gradient(ellipse at 50% 26%,#1a1a24,var(--bg1));border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;margin:8px 0 12px}
.mm-toggle{display:flex;gap:6px;margin-bottom:8px}
.mm-toggle button{flex:1;background:var(--bg2);border:1px solid var(--bdr);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;padding:8px;border-radius:var(--r3);cursor:pointer}
.mm-toggle button.on{background:color-mix(in srgb,var(--acc) 15%,transparent);border-color:var(--acc);color:var(--acc)}
.mm-svg{display:flex;justify-content:center;padding:4px 0}
.mm-svg svg{width:auto;height:200px;max-width:100%}
.mm-svg .mm-passive{fill:#191922;stroke:#24242e;stroke-width:.3}
.mm-svg .mm-mg{fill:#3a3a47;stroke:#12121a;stroke-width:.25;cursor:pointer;transition:fill .16s}
.mm-svg .mm-mg:hover{fill:#54546a}
.mm-svg .mm-mg.sel{fill:#ff453a}
.mm-hint{text-align:center;font-family:'DM Mono',monospace;font-size:13px;color:var(--txt);margin-top:4px;min-height:18px}
.mm-hint.empty{color:var(--mut2);font-size:11px}
.mm-exlist{margin-bottom:8px}
.mm-exhead{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.4px;color:var(--acc);text-transform:uppercase;margin:6px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.mm-exhead span{color:var(--mut);font-size:10px}
.mm-excard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg1);border:1px solid var(--sep);border-radius:var(--r3);padding:11px 13px;margin-bottom:6px}
.mm-exn{font-size:13px;font-weight:500}
.mm-add{background:color-mix(in srgb,var(--grn) 15%,transparent);color:var(--grn);border:1px solid color-mix(in srgb,var(--grn) 35%,transparent);font-family:'DM Mono',monospace;font-size:11px;font-weight:600;padding:7px 12px;border-radius:100px;cursor:pointer;flex-shrink:0}
.mm-added{font-family:'DM Mono',monospace;font-size:11px;color:var(--grn);flex-shrink:0}
.mm-vid{color:var(--acc);font-size:11px;font-family:'DM Mono',monospace;text-decoration:none;flex-shrink:0}
.mm-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mm-empty{text-align:center;color:var(--mut2);font-size:12px;padding:20px;background:var(--bg1);border-radius:var(--r3)}
.bld-addmode,.lib-viewmode{display:flex;gap:6px;margin:4px 0 10px}
.lib-viewmode{margin:0 0 14px}
.bld-addmode button,.lib-viewmode button{flex:1;background:var(--bg2);border:1px solid var(--bdr);color:var(--mut);font-family:'DM Mono',monospace;font-size:11px;padding:9px;border-radius:var(--r3);cursor:pointer}
.bld-addmode button.on,.lib-viewmode button.on{background:color-mix(in srgb,var(--acc) 15%,transparent);border-color:var(--acc);color:var(--acc)}
.lib-body-intro{font-size:12px;color:var(--mut);line-height:1.5;margin-bottom:10px}
.bld-add-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut);padding:8px 14px 4px;letter-spacing:.3px}
.bld-cat{font-size:10px;color:var(--mut2);padding:6px 14px 3px;font-weight:600}
.bld-chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 6px}
.bld-chip{background:var(--bg2);border:1px solid var(--bdr);color:var(--mut);font-size:11px;padding:6px 10px;border-radius:100px;cursor:pointer}
.bld-chip:active{background:color-mix(in srgb,#64d2ff 20%,transparent);color:#64d2ff}
.bld-go{width:100%;background:#64d2ff;color:#000;border:none;font-family:'DM Mono',monospace;font-weight:700;font-size:14px;padding:16px;border-radius:var(--r2);cursor:pointer;margin-top:22px}
.bld-back{width:100%;background:none;border:none;color:var(--mut);font-size:12px;padding:14px;cursor:pointer;margin-top:6px}
.bld-card{border-style:dashed}
.sugg{display:flex;align-items:baseline;flex-wrap:wrap;gap:7px;background:color-mix(in srgb,var(--acc) 8%,var(--bg2));border-left:3px solid var(--acc);border-radius:var(--r3);padding:9px 11px;margin-top:8px}
.sugg.deload{background:color-mix(in srgb,#bf5af2 10%,var(--bg2));border-left-color:#bf5af2}
.sugg.phase{background:color-mix(in srgb,#0a84ff 10%,var(--bg2));border-left-color:#0a84ff}
.sugg.first{background:var(--bg2);border-left-color:var(--mut2)}
.sugg-lbl{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);flex-shrink:0}
.sugg-w{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:var(--acc)}
.sugg.deload .sugg-w{color:#bf5af2}
.sugg.phase .sugg-w{color:#0a84ff}
.sugg-reps{font-family:'DM Mono',monospace;font-size:12px;color:var(--txt)}
.sugg-why{font-size:10px;color:var(--mut);width:100%;line-height:1.4}
.sugg-txt{font-size:11px;color:var(--mut);line-height:1.5;flex:1;min-width:0}
.wu{margin-top:8px}
.wu summary{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--mut);cursor:pointer;padding:5px 0;list-style:none}
.wu summary::-webkit-details-marker{display:none}
.wu-rows{background:var(--bg2);border-radius:var(--r3);padding:9px 11px;margin-top:4px}
.wu-row{display:flex;align-items:baseline;gap:9px;padding:4px 0;font-family:'DM Mono',monospace;font-size:12px}

function suggestWeight(wk,dayFull,logName,e,dayObj){
  if(!e||e.core)return null;                     // core er tid/reps, ikke vægt
  const thisIsDeload=isDeload(wk);
  // Seneste uge med logget ARBEJDSVÆGT (kig op til 8 uger tilbage).
  // Deload-uger springes over — ellers ville en let deload-vægt trække næste
  // uges forslag ned. Er vi selv i en deload, må vi gerne bruge en deload-uge.
  let lastW=NaN,lastWk=null;
  for(let w=wk-1;w>=Math.max(1,wk-8);w--){
    if(isDeload(w)&&!thisIsDeload)continue; // ignorér deload-uger for normale forslag
    const v=maxW(gw(w,dayFull,logName));
    if(!isNaN(v)&&v>0){lastW=v;lastWk=w;break}
  }
  // Faldback: fandt vi kun deload-data (fx allerførste uger var deload), tag alligevel seneste
  if(isNaN(lastW)){
    for(let w=wk-1;w>=Math.max(1,wk-8);w--){
      const v=maxW(gw(w,dayFull,logName));
      if(!isNaN(v)&&v>0){lastW=v;lastWk=w;break}
    }
  }
  const sr=exSR(e,wk);
  if(isNaN(lastW)){
    return{kind:'first',reps:sr.r,
      text:'Første gang: find en vægt hvor sidste rep er hård, men teknisk ren. Log den — så regner appen resten ud fremover.'};
  }
  const samePhase=gymPhase(lastWk)===gymPhase(wk);
  let target,why;
  if(samePhase){
    target=lastW+progressionStep(e,dayObj);
    why='progression fra '+lastW+' kg i uge '+lastWk;
  }else{
    // Ny fase med nyt rep-interval → omregn via estimeret 1RM
    const oneRM=estimate1RM(lastW,repTopOf(exSR(e,lastWk)));
    target=oneRM/(1+repTopOf(sr)/30);
    why='omregnet til ny fase (est. 1RM '+oneRM+' kg)';
  }
  const deload=isDeload(wk);
  if(deload){target*=0.65;why='deload — ca. 65% af normal arbejdsvægt'}
  const rounded=Math.max(2.5,Math.round(target/2.5)*2.5);
  return{kind:deload?'deload':samePhase?'progress':'phase',w:rounded,from:lastW,fromWk:lastWk,reps:sr.r,why};
}

function exSR(e,w){
  const base=e.core?GP[gymPhase(w)].x:(GP[gymPhase(w)][e.k]||GP[gymPhase(w)].c);
  if(!isDeload(w))return base;
  // Deload: ~40% færre sæt, samme reps-interval, let vægt (se banner)
  const n=parseInt(base.s);
  if(!n)return base;
  return{s:String(Math.max(2,Math.round(n*0.6))),r:base.r};
}

// Skalerer et forløb efter brugerens træningserfaring (kun forløb med expScale:true).
// Erfarne løftere har brug for mere volumen + hårdere teknikker for at bevare muskel i underskud.
function applyExperienceScaling(tplId){
  const exp=PROFILE.experience||'some';
  if(exp==='some')return; // GP i templaten er kalibreret til mellem-niveau = baseline
  if(tplId==='shred'){
    if(exp==='experienced'){
      // Erfaren: +1 sæt på compound & isolation, tilføj intensitetsteknik per fase
      const tech=['Sidste sæt: 1-2 rest-pause reps','Sidste sæt til teknisk failure (RIR 0)','Drop-set på sidste isolation-øvelse'];
      GP.forEach((p,i)=>{
        p.c={s:String(parseInt(p.c.s)+1),r:p.c.r};
        p.i={s:String(parseInt(p.i.s)+1),r:p.i.r};
        p.tip=p.tip+' · '+tech[i];
      });
      // Ekstra princip om avanceret autoregulering
      RL.push({i:'🎯',t:'Autoregulér (erfaren)',b:'Du kender din krop: styr efter RIR, ikke faste tal. Ryger et løft 2+ reps ned to gange i træk, er det tid til en diet-pause.',c:'#ff375f'});
    }else if(exp==='beginner'){
      // Nybegynder: −1 sæt på compound, blødere finish-fase, form-fokus
      GP.forEach((p,i)=>{
        p.c={s:String(Math.max(3,parseInt(p.c.s)-1)),r:p.c.r};
        if(i===2)p.tip='Hold formen skarp — pres ikke for hårdt sidste fase';
      });
      RL.push({i:'🧑‍🏫',t:'Form før vægt (ny)',b:'Som ny løfter: prioritér teknik over vægt. Muskel bevares fint på moderat belastning når du er ny, og skadesrisiko er større i underskud.',c:'#30d158'});
    }
  }
}

let mmSide='front', mmSel=null, mmContext='builder', mmDay=null;
function renderMuscleMap(ctx){
  // ctx: 'builder' (vælg → tilføj til mmDay) eller 'library' (vælg → filtrér)
  const isF=mmSide==='front';
  const vb=isF?'0 0 35 93':'37 0 35 93';
  const passive=isF?MMAP_PF:MMAP_PB, pdata=isF?MMAP_F:MMAP_B;
  let paths='';
  passive.forEach(function(id){if(pdata[id])paths+='<path class="mm-passive" d="'+pdata[id]+'"/>'});
  Object.keys(MMAP_G).forEach(function(gid){
    const parts=MMAP_G[gid][isF?'front':'back']||[];
    parts.forEach(function(pid){
      const dd=pdata[pid];if(!dd)return;
      paths+='<path class="mm-mg'+(mmSel===gid?' sel':'')+'" data-mg="'+gid+'" d="'+dd+'" onclick="mmPick(\''+gid+'\')"><title>'+MMAP_G[gid].label+'</title></path>';
    });
  });
  let h='<div class="mm-wrap">';
  h+='<div class="mm-toggle"><button class="'+(isF?'on':'')+'" onclick="mmSetSide(\'front\')">Forfra</button><button class="'+(!isF?'on':'')+'" onclick="mmSetSide(\'back\')">Bagfra</button></div>';
  h+='<div class="mm-svg"><svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet">'+paths+'</svg></div>';
  h+='<div class="mm-hint'+(mmSel?'':' empty')+'">'+(mmSel?MMAP_G[mmSel].label:'Tryk på en muskel')+'</div>';
  h+='</div>';
  // Øvelsesliste for valgt muskel
  h+='<div class="mm-exlist" id="mmExList">'+renderMuscleExercises(ctx)+'</div>';
  return h;
}
function renderMuscleExercises(ctx){
  if(!mmSel)return '<div class="mm-empty">Vælg en muskel ovenfor for at se øvelser</div>';
  const g=MMAP_G[mmSel];
  if(ctx==='builder'){
    const names=MMAP_POOL[mmSel]||[];
    if(!names.length)return '<div class="mm-empty">Ingen øvelser til '+g.label+'</div>';
    const current=(mmDay&&CUSTOMPROG)?builderDayExercises(mmDay):[];
    let h='<div class="mm-exhead">'+g.label+' <span>'+names.length+' øvelser</span></div>';
    names.forEach(function(n){
      const added=current.indexOf(n)>=0;
      h+='<div class="mm-excard"><span class="mm-exn">'+escHtml(n)+'</span>'+
        (added?'<span class="mm-added">✓ Tilføjet</span>':'<button class="mm-add" onclick="mmAddToDay(\''+escAttr(n)+'\')">+ Tilføj</button>')+'</div>';
    });
    return h;
  }else{
    // Library: vis matchende LIB-øvelser med video + tilføj-til-program
    // Brug præcis navne-mapping hvor den findes, ellers hele muskelgruppen
    const precise=MMAP_LIBEX[mmSel];
    const libEx=(precise&&precise.length)
      ? LIB.filter(function(e){return precise.indexOf(e.n)>=0})
      : LIB.filter(function(e){return e.m===g.lib});
    let h='<div class="mm-exhead">'+g.label+' <span>'+libEx.length+' øvelser</span></div>';
    if(!libEx.length)return h+'<div class="mm-empty">Ingen øvelser her endnu</div>';
    libEx.forEach(function(e){
      const idx=LIB.indexOf(e);
      h+='<div class="mm-excard"><span class="mm-exn">'+escHtml(e.n)+'</span>'+
        '<span class="mm-actions">'+
        '<a class="mm-vid" href="https://www.youtube.com/results?search_query='+encodeURIComponent(e.n+' tutorial')+'" target="_blank" rel="noopener">▶ Video</a>'+
        '<button class="mm-add" onclick="openAddModal('+idx+')">+ Tilføj</button>'+
        '</span></div>';
    });
    return h;
  }
}
function mmSetSide(s){mmSide=s;mmSel=null;render()}
function mmPick(g){mmSel=g;render()}
function mmAddToDay(name){
  if(!mmDay)return;
  builderAddEx(mmDay,name); // gemmer + re-renderer
}

function poolFind(name){
  for(const cat of Object.keys(EX_POOL)){
    const f=EX_POOL[cat].find(e=>e.n===name);
    if(f)return{...f,l:YTQ+encodeURIComponent(f.n+' tutorial')};
  }
  return{n:name,k:'i',l:YTQ+encodeURIComponent(name+' tutorial')};
}

];
// Byg et fuldt template-objekt ud fra brugerens opsætning
function buildCustomTemplate(){
  if(!CUSTOMPROG)return null;
  const split=SPLITS[CUSTOMPROG.split]||SPLITS.ul4;
  const runDays=CUSTOMPROG.runDays||[];
  const D=ALL_DAYS.map(d=>{
    const planDay=split.plan.find(p=>p.full===d.full);
    const names=(CUSTOMPROG.dayEx&&CUSTOMPROG.dayEx[d.full])||(planDay?planDay.ex:null);
    if(names&&names.length){
      const col=planDay&&planDay.tag==='lower'?'#ff9f0a':'#0a84ff';
      return{day:d.day,full:d.full,type:planDay?planDay.type:'Træning',
        label:(planDay?planDay.type:'TRÆNING').toUpperCase(),color:col,
        icon:planDay&&planDay.tag==='lower'?'🦵':'💪',tag:planDay?planDay.tag:'upper',
        ex:names.map(poolFind)};
    }
    if(runDays.indexOf(d.full)>=0){
      return{day:d.day,full:d.full,type:'Løb',label:'LØB',color:'#30d158',icon:'🏃',tag:'run',
        run:{pace:'6:30 /km',dur:'30 min',type:'Easy run',tip:'Roligt tempo — du skal kunne tale undervejs.'}};
    }
    return{day:d.day,full:d.full,type:'Hvile',label:'RESTITUTION',color:'#5a5a7a',icon:'😴',tag:'rest'};
  });
  const w=CUSTOMPROG.weeks||8;
  return{
    id:'custom',name:'Mit eget program',emo:'🛠️',color:'#64d2ff',
    desc:`Din egen uge: ${split.label}${runDays.length?' + '+runDays.length+' løbedag'+(runDays.length>1?'e':''):''}. Appen styrer sæt, reps, progression og deloads automatisk.`,
    weeks:w,needsRunTime:runDays.length>0,defaultRunSec:1800,
    headerTitle:'MIT EGET<br>PROGRAM',
    D,
    GP:[
      {name:'Hypertrofi',weeks:phaseLabelFor(w,0),color:'#0a84ff',tip:'Byg muskelmasse · RIR 2-3',c:{s:'4',r:'8–12'},i:{s:'3',r:'12–15'},x:{s:'3',r:'30–45s'}},
      {name:'Styrke',weeks:phaseLabelFor(w,1),color:'#ff9f0a',tip:'Tungere vægt, færre reps · RIR 1-2',c:{s:'5',r:'4–6'},i:{s:'3',r:'8–12'},x:{s:'3',r:'30–45s'}},
      {name:'Peak',weeks:phaseLabelFor(w,2),color:'#bf5af2',tip:'Maks styrke · RIR 1',c:{s:'5',r:'3–5'},i:{s:'3',r:'8–10'},x:{s:'3',r:'30–45s'}}
    ],
    PH:runDays.length?[
      {n:1,l:'Base',w:phaseLabelFor(w,0),wd:'30 min @ 6:30/km',sa:'—',g:'Byg grundform',c:'#30d158'},
      {n:2,l:'Fart',w:phaseLabelFor(w,1),wd:'35 min @ 6:15/km',sa:'—',g:'Øget tempo',c:'#ff9f0a'},
      {n:3,l:'Peak',w:phaseLabelFor(w,2),wd:'40 min @ 6:00/km',sa:'—',g:'Bedste form',c:'#ff375f'}
    ]:[],
    RL:[
      {i:'🥩',t:'Protein',b:'1,6-2,2 g per kg kropsvægt dagligt — grundlaget for muskelopbygning.',c:'#ff375f'},
      {i:'📈',t:'Progressiv overbelastning',b:'Tilføj lidt vægt eller en rep hver uge. Appen foreslår automatisk næste vægt.',c:'#0a84ff'},
      {i:'😴',t:'Søvn',b:'7-9 timer. Musklen bygges når du sover, ikke i centeret.',c:'#bf5af2'},
      {i:'🌙',t:'Tag dine deloads',b:'Aflastningsugerne er planlagt med vilje — de er grunden til at du kan blive ved med at gå frem.',c:'#30d158'}
    ]
  };
}
// Fase-ugelabels for en given programlængde
function phaseLabelFor(tw,i){
  const p1=Math.ceil(tw*0.375),p2=p1+Math.ceil(tw*0.375);
  const r=[{s:1,e:p1},{s:p1+1,e:p2},{s:p2+1,e:tw}][i];
  return`Uge ${r.s}–${r.e}`;
}
// Registrér/genopfrisk eget program i TEMPLATES
function refreshCustomTemplate(){
  const t=buildCustomTemplate();
  if(t)TEMPLATES.custom=t; else delete TEMPLATES.custom;
  return t;
}

function loadProgram(){
  refreshCustomTemplate();
  const tplId=PROG.template||'recomp';
  const tpl=TEMPLATES[tplId]||TEMPLATES.recomp;
  // Deep clone så ændringer ikke ødelægger templates
  D=JSON.parse(JSON.stringify(tpl.D));
  GP=JSON.parse(JSON.stringify(tpl.GP));
  PH=JSON.parse(JSON.stringify(tpl.PH));
  RL=JSON.parse(JSON.stringify(tpl.RL));
  // Erfarings-tilpasning: skalér volumen/intensitet for forløb der understøtter det
  if(tpl.expScale)applyExperienceScaling(tplId);
  if(tplId==='custom'&&CUSTOMPROG&&CUSTOMPROG.weeks)PROG.totalWeeks=CUSTOMPROG.weeks;
  // Opdater header-titel — vis neutral titel hvis bruger ej har valgt program endnu
  const h1=document.querySelector('#hdr h1');
  if(h1){
    if(!PROG.templateChosen){
      h1.innerHTML='TRÆNINGS<br>PROGRAM';
    }else{
      let title=tpl.headerTitle||'TRÆNINGSPROGRAM';
      if(tpl.needsRunTime&&PROG.runDistance){
        title=title.replace(/\d+KM/i,PROG.runDistance+'KM');
      }
      h1.innerHTML=title;
    }
  }
  // Skjul header-stats og cog hvis program ej valgt
  const stats=document.getElementById('hdrStats');
  if(stats)stats.style.display=PROG.templateChosen?'':'none';
  const cog=document.getElementById('hdrCog');
  if(cog)cog.style.display=PROG.templateChosen?'':'none';
}

  CUSTOMPROG.runDays=[];

}
function builderSetWeeks(w){CUSTOMPROG.weeks=w;saveCustomProg();refreshCustomTemplate();render()}
function builderToggleRun(dayFull){
  const r=CUSTOMPROG.runDays||[];

  if(i>=0)r.splice(i,1);else r.push(dayFull);
  CUSTOMPROG.runDays=r;saveCustomProg();refreshCustomTemplate();render();
}
function builderEditDay(dayFull){builderDay=builderDay===dayFull?null:dayFull;mmSel=null;render()}
let builderAddMode='cat';
function setBuilderAddMode(m,dayFull){builderAddMode=m;if(m==='body'){mmDay=dayFull;mmSel=null}render()}
function builderDayExercises(dayFull){
  if(CUSTOMPROG.dayEx&&CUSTOMPROG.dayEx[dayFull])return CUSTOMPROG.dayEx[dayFull];
  const split=SPLITS[CUSTOMPROG.split]||SPLITS.ul4;
  const p=split.plan.find(x=>x.full===dayFull);
  return p?p.ex.slice():[];
}
function builderSetDayEx(dayFull,list){
  if(!CUSTOMPROG.dayEx){
    // Materialisér alle dage første gang så standarderne bevares
    CUSTOMPROG.dayEx={};
    (SPLITS[CUSTOMPROG.split]||SPLITS.ul4).plan.forEach(p=>{CUSTOMPROG.dayEx[p.full]=p.ex.slice()});
  }
  CUSTOMPROG.dayEx[dayFull]=list;
  saveCustomProg();refreshCustomTemplate();render();
}
function builderAddEx(dayFull,name){
  const l=builderDayExercises(dayFull).slice();
  if(l.indexOf(name)<0)l.push(name);
  builderSetDayEx(dayFull,l);
}
function builderRemoveEx(dayFull,name){
  const l=builderDayExercises(dayFull).filter(x=>x!==name);
  if(!l.length)return; // mindst én øvelse
  builderSetDayEx(dayFull,l);
}
function builderActivate(){
  refreshCustomTemplate();

function chooseTemplate(tplId){
  const tpl=TEMPLATES[tplId];
  if(!tpl)return;
  const wasCurrentDefault=PROG.template===tplId&&PROG.templateChosen;
  if(wasCurrentDefault){
    // Samme program valgt igen: har man data, så tilbyd genstart (evt. med nye øvelser)
    if(Object.keys(W).length){
      openSwitchModal(tplId,true);
      return;
    }
    PROG.templateChosen=true;saveProg();
    if(modalOpenForTemplate){closeModal();modalOpenForTemplate=false}
    render();return;
  }
  const hasData=Object.keys(W).length>0;
  const isFirstTimeChoice=!PROG.templateChosen;
  // Skifter man program MED eksisterende data → lad brugeren vælge hvordan
  if(hasData&&PROG.template!==tplId){
    openSwitchModal(tplId);
    return;
  }
  applyTemplateSwitch(tplId,!hasData);
  if(isFirstTimeChoice){
    setTimeout(()=>openTrainingStylePicker(),400);
  }else{
    render();
  }
}

function applyTemplateSwitch(tplId,freshStart,withVariation){
  const tpl=TEMPLATES[tplId];
  if(!tpl)return;
  if(freshStart){
    // Arkivér den gamle log så intet går tabt, og start med blankt skema
    try{
      const arch=JSON.parse(localStorage.getItem('tw4_archive')||'[]');
      if(Object.keys(W).length){
        arch.push({template:PROG.template,startDate:PROG.startDate,ended:todayISO(),data:W});
        localStorage.setItem('tw4_archive',JSON.stringify(arch.slice(-5)));
      }
    }catch(e){}
    W={};save();
    PROG.startDate=todayISO();
    // Nulstil forløbs-specifikke tilstande
    HOME_DAYS={};try{localStorage.setItem(HOME_KEY,JSON.stringify(HOME_DAYS))}catch(e){}
    CUSTOM={};try{localStorage.setItem(CK,JSON.stringify(CUSTOM))}catch(e){}
    SWAPS_EX={};try{localStorage.setItem(SWK,JSON.stringify(SWAPS_EX))}catch(e){}
  }
  PROG.template=tplId;
  PROG.templateChosen=true;
  PROG.totalWeeks=tpl.weeks||8;
  if(tpl.needsRunTime&&tpl.defaultRunSec)PROG.start5kSec=tpl.defaultRunSec;
  saveProg();
  loadProgram();
  SUPERSETS={};saveSS();
  try{localStorage.removeItem('tw4_ss_init')}catch(e){}
  applyDefaultSupersets();
  let varCount=0;
  if(withVariation)varCount=applyVariation();
  week=Math.min(currentWeek(),TW());sel=0;
  if(modalOpenForTemplate){modalOpenForTemplate=false}
  closeModal();
  toast(withVariation?('✓ '+tpl.name+' med '+varCount+' nye øvelser'):freshStart?('✓ '+tpl.name+' startet fra uge 1'):('✓ Skiftet til '+tpl.name));
  render();
}

      <button class="prog-btn ghost" style="width:100%;margin-top:14px" onclick="confirmTrainingStyle(false)">Spring over (bruger Kalender)</button>
    </div>
  </div>`;
  m.classList.add('show');
}

function confirmTrainingStyle(flexEnabled){
  PROG.flexMode=flexEnabled;
  saveProg();
  closeModal();
  toast(flexEnabled?'✓ Flex-mode aktiveret':'✓ Kalender-mode aktiveret');
  render();
}

let modalOpenForTemplate=false;
function openTemplateChooserModal(){
  modalOpenForTemplate=true;
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal" onclick="event.stopPropagation()" style="max-width:480px;max-height:85vh;overflow-y:auto">

    <div style="text-align:center;margin-top:8px">
      <button class="prog-btn ghost" onclick="closeModal();modalOpenForTemplate=false">Annullér</button>
    </div>
  </div>`;
  m.classList.add('show');
}
