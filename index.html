const SSK='tw4_ss';
let SUPERSETS={};// { "Mandag": [[0,1],[3,4]], ... } pairs of exercise indices
try{SUPERSETS=JSON.parse(localStorage.getItem(SSK)||'{}')}catch(e){}

// Default superset-forslag baseret på øvelsesnavne (push/pull, antagonister, arme)
const DEFAULT_SS_PAIRS={
  "Mandag":[["Bænkpres (flad)","Bent-over Rows"]],
  "Onsdag":[["Leg Curl","Calf Raises"]],
  "Torsdag":[["Biceps Curl (kabel)","Triceps Pushdown"]],
  "Lørdag":[["Leg Curl (liggende)","Tibialis Raises"]]
};

// Konvertér default-par til indices baseret på dagens øvelser. Kører kun første gang.
function applyDefaultSupersets(){
  if(localStorage.getItem('tw4_ss_init'))return;
  Object.entries(DEFAULT_SS_PAIRS).forEach(([dayFull,pairs])=>{
    const dayObj=D.find(o=>o.full===dayFull);
    if(!dayObj||!dayObj.ex)return;
    const exNames=dayObj.ex.map(e=>e.n);
    if(!SUPERSETS[dayFull])SUPERSETS[dayFull]=[];
    pairs.forEach(([a,b])=>{
      const ai=exNames.indexOf(a),bi=exNames.indexOf(b);
      if(ai>=0&&bi>=0&&!SUPERSETS[dayFull].some(p=>p[0]===ai||p[1]===ai||p[0]===bi||p[1]===bi)){
        SUPERSETS[dayFull].push([ai,bi]);
      }
    });
  });
  saveSS();
  try{localStorage.setItem('tw4_ss_init','1')}catch(e){}
}
applyDefaultSupersets();

function saveSS(){try{localStorage.setItem(SSK,JSON.stringify(SUPERSETS))}catch(e){}}

function toggleSuperset(dayFull,idx){
  if(!SUPERSETS[dayFull])SUPERSETS[dayFull]=[];
  const pairs=SUPERSETS[dayFull];
  const existing=pairs.findIndex(p=>p[0]===idx||p[1]===idx);
  if(existing>=0){
    pairs.splice(existing,1);
    toast('Superset fjernet');
  }else{
    // Pair with next exercise that isn't already in a superset
    const dayObj=D.find(o=>o.full===dayFull);
    const exs=dayObj?dayEx(dayObj):null;
    if(!exs)return;
    let partner=-1;
    for(let i=idx+1;i<exs.length;i++){
      if(!exs[i].core&&!pairs.some(p=>p[0]===i||p[1]===i)){partner=i;break}
    }
    if(partner<0){toast('Ingen tilgængelig partner');return}
    pairs.push([idx,partner]);
    toast('✓ Superset markeret');
  }
  saveSS();render();
}

function isInSuperset(dayFull,idx){
  const pairs=SUPERSETS[dayFull]||[];
  return pairs.some(p=>p[0]===idx||p[1]===idx);
}

function isSupersetPartner(dayFull,idx){
  const pairs=SUPERSETS[dayFull]||[];
  const pair=pairs.find(p=>p[0]===idx||p[1]===idx);
  if(!pair)return null;
  return pair[0]===idx?pair[1]:pair[0];
}

function getRestTypeForSuperset(dayFull,exIdx,exType){
  // Superset: kort 20-sek "skift øvelse"-pause for første i par, normal pause efter andet
  const pairs=SUPERSETS[dayFull]||[];
  const pair=pairs.find(p=>p[0]===exIdx||p[1]===exIdx);
  if(!pair)return exType; // ikke i superset → normal pause
  if(pair[1]===exIdx)return exType; // andet i par → normal pause
  return 'ss'; // første i par → kort overgangs-pause
}

function renderPaceCalc(){
  return `<div class="pace-calc">
    <div class="pace-calc-title">🧮 Pace-kalkulator</div>
    <div class="pace-calc-row" style="grid-template-columns:1fr 1.4fr">
      <div class="pace-calc-field">
        <label>Distance</label>
        <input type="number" inputmode="decimal" step="0.1" placeholder="Distance" id="pcDist" oninput="calcPace()" onfocus="this.select()">
        <div style="font-size:8px;color:var(--mut2);font-family:'DM Mono',monospace;margin-top:4px">km</div>
      </div>
      <div class="pace-calc-field">
        <label>Tid</label>
        <div style="display:flex;align-items:center;gap:4px;justify-content:center">
          <input type="number" inputmode="numeric" min="0" max="999" placeholder="min" id="pcTimeMin" oninput="calcPace()" style="width:60px" onfocus="this.select()">
          <span style="color:var(--mut);font-weight:600">:</span>
          <input type="number" inputmode="numeric" min="0" max="59" placeholder="sek" id="pcTimeSec" oninput="calcPace()" style="width:60px" onfocus="this.select()">
        </div>
        <div style="font-size:8px;color:var(--mut2);font-family:'DM Mono',monospace;margin-top:4px">min : sek</div>
      </div>
    </div>
    <div class="pace-calc-result" id="pcResult">Indtast distance + tid → vi beregner pace</div>
  </div>`;
}

function calcPace(){
  const result=document.getElementById('pcResult');
  if(!result)return;
  const dist=parseFloat(document.getElementById('pcDist')?.value);
  const totalSec=readMinSec('pcTimeMin','pcTimeSec');
  if(!dist||dist<=0){result.textContent='Indtast distance';return}
  if(!totalSec||totalSec<=0){result.textContent='Indtast tid (min + sek)';return}
  const paceSec=Math.round(totalSec/dist);
  const kmh=Math.round(dist/(totalSec/3600)*10)/10;
  result.innerHTML=`<span style="color:var(--grn);font-size:14px;font-weight:600">${fmtSec(paceSec)} /km</span> &nbsp;·&nbsp; ${kmh} km/t`;
}

function readMinSec(minId,secId){
  const m=parseInt(document.getElementById(minId)?.value);
  const s=parseInt(document.getElementById(secId)?.value)||0;
  if(isNaN(m)||m<0)return null;
  return m*60+Math.min(Math.max(s,0),59);
}

function exportData(){
  const data={
    tw4:W, tw4_custom:CUSTOM, tw4_ai:{apiKey:'',model:AI.model,settingsOpen:AI.settingsOpen}, /* nøgle medtages BEVIDST ikke i backup */
    tw4_swaps:SWAPS_EX,

    tw4_home_days:HOME_DAYS, tw4_home_equip:HOME_EQUIP, tw4_mobility:MOB, tw4_calories:CAL, tw4_mealplan:MEALPLAN, tw4_weekplan:WEEKPLAN, tw4_customprog:CUSTOMPROG,
    _exported:new Date().toISOString(), _version:3
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='traening-backup-'+todayISO()+'.json';
  a.click();URL.revokeObjectURL(url);
  toast('✓ Backup downloadet');
}

function importData(input){
  const file=input.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.tw4&&!data._version){throw new Error('Ugyldigt format')}
      if(!confirm('Importér backup?\n\nDette overskriver alle nuværende data. Kan ikke fortrydes.'))return;
      if(data.tw4){W=data.tw4;save()}
      if(data.tw4_custom){CUSTOM=data.tw4_custom;saveCustom()}
      if(data.tw4_ai){
        const keepKey=AI.apiKey; // ny backup har tom nøgle — bevar den eksisterende
        AI={...AI,...data.tw4_ai};
        if(!AI.apiKey)AI.apiKey=keepKey;
        saveAI();
      }
      if(data.tw4_prog){PROG={...PROG,...data.tw4_prog};saveProg()}
      if(data.tw4_body){BODY=data.tw4_body;saveBody()}
      if(data.tw4_ss){SUPERSETS=data.tw4_ss;saveSS()}
      if(data.tw4_steps){STEPS=data.tw4_steps;saveSteps()}
      if(data.tw4_cycle){CYCLE=data.tw4_cycle;saveCycle()}
      if(data.tw4_swaps){SWAPS_EX=data.tw4_swaps;saveSwaps()}
      if(data.tw4_pcos_profile){PCOS_PROFILE=data.tw4_pcos_profile;savePcosProfile()}
      if(data.tw4_profile){PROFILE=data.tw4_profile;saveProfile()}
      if(data.tw4_wellness){WELLNESS=data.tw4_wellness;saveWellness()}
      if(data.tw4_home_days){HOME_DAYS=data.tw4_home_days;saveHomeDays()}
      if(data.tw4_home_equip){HOME_EQUIP=data.tw4_home_equip;try{localStorage.setItem(HOME_EQUIP_KEY,HOME_EQUIP)}catch(e){}}
      if(data.tw4_mobility){MOB=data.tw4_mobility;saveMob()}
      if(data.tw4_calories){CAL=data.tw4_calories;saveCal()}
      if(data.tw4_mealplan){MEALPLAN=data.tw4_mealplan;saveMealplan()}
      if(data.tw4_weekplan){WEEKPLAN=data.tw4_weekplan;saveWeekplan()}
      if(data.tw4_customprog){CUSTOMPROG=data.tw4_customprog;saveCustomProg();refreshCustomTemplate()}
      toast('✓ Data importeret');
      render();
    }catch(err){
      toast('Fejl: '+err.message);
    }
  };
  reader.readAsText(file);
}

/* ── ESTIMATED 1RM (Epley formula) ─────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function estimate1RM(weight,reps){
  if(!weight||!reps||weight<=0||reps<=0)return 0;
  return Math.round(weight*(1+reps/30));
}
function estimateExercise1RM(week,day,name,e){
  const w=maxW(gw(week,day,name));
  if(isNaN(w)||w<=0)return null;
  // Use upper rep bound from current phase
  const sr=exSR(e,week);
  const repStr=String(sr.r);
  const upperRep=parseInt(repStr.split('–').pop())||parseInt(repStr)||10;
  return estimate1RM(w,upperRep);
}

const MUSCLE_MAP={
  // Bryst
  "Bænkpres (flad)":"chest","Incline Bænkpres":"chest","Decline Bænkpres":"chest","Dumbbell Press":"chest","Incline DB Press":"chest","Dumbbell Flyes":"chest","Cable Flyes":"chest","Push-ups":"chest","Dips (bryst)":"chest","Pec Deck":"chest","Close-Grip Bench":"chest",
  // Ryg
  "Bent-over Rows":"back","Pullups":"back","Pullups / Lat Pulldown":"back","Lat Pulldown":"back","Pendlay Row":"back","Seated Cable Row":"back","Kabel Rows":"back","T-Bar Row":"back","Dumbbell Row":"back","Deadlift":"back","Rack Pull":"back","Inverted Row":"back","Face Pull":"back","Facepulls":"back","Shrugs":"back","Underhaands Pulldown":"back",
  // Skuldre
  "Overhead Press":"shoulders","DB Shoulder Press":"shoulders","Arnold Press":"shoulders","Lateral Raise":"shoulders","Front Raise":"shoulders","Reverse Flyes":"shoulders","Cable Lateral Raise":"shoulders","Upright Row":"shoulders",
  // Ben
  "Squat":"legs","Front Squat":"legs","Hack Squat":"legs","Hack Squat / Benpres":"legs","Leg Press":"legs","Romanian Deadlift":"legs","Sumo Deadlift":"legs","Walking Lunges":"legs","Bulgarian Split Squat":"legs","Goblet Squat":"legs","Leg Curl":"legs","Leg Curl (siddende)":"legs","Leg Curl (liggende)":"legs","Leg Extension":"legs","Hip Thrust":"legs","Glute Bridge":"legs","Calf Raises":"legs","Calf Raises (stående)":"legs","Calf Raises (siddende)":"legs","Tibialis Raises":"legs",
  // Arme
  "Biceps Curl (stang)":"arms","Biceps Curl (DB)":"arms","Biceps Curl (kabel)":"arms","Hammer Curl":"arms","Cable Curl":"arms","Preacher Curl":"arms","Concentration Curl":"arms","Triceps Pushdown":"arms","Overhead Tri Extension":"arms","Skull Crushers":"arms","Dips (triceps)":"arms"
};
const MUSCLE_INFO={
  chest:{n:"Bryst",c:"#0a84ff",emo:"💪"},
  back:{n:"Ryg",c:"#bf5af2",emo:"🔙"},
  legs:{n:"Ben",c:"#ff6f40",emo:"🦵"},
  shoulders:{n:"Skuldre",c:"#30d158",emo:"🏔️"},
  arms:{n:"Arme",c:"#ff453a",emo:"💥"}
};

function calcWeeklyVolume(w){
  // returns {muscle: totalVolume}
  const vol={chest:0,back:0,legs:0,shoulders:0,arms:0};
  D.filter(d=>d.ex).forEach(d=>{
    dayEx(d).filter(e=>!e.core).forEach(e=>{
      const muscle=MUSCLE_MAP[e.n];
      if(!muscle)return;
      const arr=parseW(gw(w,d.full,e.n));
      if(!arr.length)return;
      const sr=exSR(e,w);
      const repStr=String(sr.r);
      // Use middle of rep range as estimate
      const reps=repStr.includes('–')?
        Math.round((parseInt(repStr.split('–')[0])+parseInt(repStr.split('–')[1]))/2):
        parseInt(repStr)||8;
      arr.forEach(weight=>{vol[muscle]+=weight*reps});
    });
  });
  return vol;
}

function rVolume(){
  const cw=Math.min(currentWeek(),TW());
  const vol=calcWeeklyVolume(cw);
  const total=Object.values(vol).reduce((a,b)=>a+b,0);
  if(total===0)return '';
  const max=Math.max(...Object.values(vol));
  let h=`<div class="vol-section">
    <div class="vol-title">📊 Volumen denne uge</div>
    <div class="vol-sub">Estimeret tonnage (sæt × reps × kg) per muskelgruppe</div>
    <div class="vol-bars">`;
  Object.entries(vol).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
    const info=MUSCLE_INFO[k];
    const pct=Math.round(v/max*100);
    h+=`<div class="vol-bar-row">
      <div class="vol-bar-label">${info.emo} ${info.n}</div>
      <div class="vol-bar-track">
        <div class="vol-bar-fill" style="width:${pct}%;background:${info.c}"></div>
      </div>
      <div class="vol-bar-val">${Math.round(v).toLocaleString('da-DK')} kg</div>
    </div>`;
  });
  h+=`</div></div>`;
  return h;
}

/* ── STREAK HEATMAP ────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function rStreak(){
  if(!PROG.startDate)return '';
  const start=new Date(PROG.startDate+'T00:00:00');
  const today=new Date();today.setHours(0,0,0,0);start.setHours(0,0,0,0);
  const totalDays=TW()*7;
  const todayIdx=Math.floor((today-start)/(86400000));

  // Per uge: tæl hvor mange dage med data
  const dayMap={};// dayIdx → entries count
  for(let w=1;w<=TW();w++){
    D.forEach((d,di)=>{
      const exs=dayEx(d);
      let hasData=false;
      if(exs){hasData=exs.some(e=>gw(w,d.full,e.n)||gw(w,d.full,'HOME__'+e.n))}
      else if(d.run){hasData=['tid','pace','km'].some(k=>gw(w,d.full,k))}
      if(hasData){
        const dayIdx=(w-1)*7+di;
        dayMap[dayIdx]=(dayMap[dayIdx]||0)+1;
      }
    });
  }

  // Beregn streak (lange og nuværende)
  let curStreak=0,bestStreak=0,running=0;
  const trainingDays=[0,2,4,5]; // mandag, onsdag, torsdag(?), lørdag — alle ikke-løb dage med ex
  // Faktisk lad os tælle om man har trænet på dage hvor man skulle
  for(let i=0;i<=Math.min(todayIdx,totalDays-1);i++){
    if(dayMap[i]){running++;bestStreak=Math.max(bestStreak,running)}
    else{running=0}
  }
  curStreak=running;

  // Milepæle baseret på BEDSTE streak
  const milestones=[
    {d:7,emo:'🥉',name:'1 uge',color:'#cd7f32'},
    {d:14,emo:'🥈',name:'2 uger',color:'#c0c0c0'},
    {d:30,emo:'🥇',name:'1 måned',color:'#ffd60a'},
    {d:60,emo:'🏆',name:'2 måneder',color:'#0a84ff'},
    {d:100,emo:'💎',name:'100 dage',color:'#bf5af2'}
  ];
  const earned=milestones.filter(m=>bestStreak>=m.d);
  const next=milestones.find(m=>bestStreak<m.d);
  let milestonesHtml='';
  if(earned.length||next){
    milestonesHtml=`<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;padding:10px;background:var(--bg2);border-radius:var(--r2);border:1px solid var(--bdr)">`;
    earned.forEach(m=>{
      milestonesHtml+=`<div title="${m.name} streak" style="display:flex;align-items:center;gap:4px;padding:4px 10px;background:${m.color}20;border:1px solid ${m.color}50;border-radius:100px;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;color:${m.color}"><span style="font-size:14px">${m.emo}</span>${m.name}</div>`;
    });
    if(next){
      const remaining=next.d-bestStreak;
      milestonesHtml+=`<div style="display:flex;align-items:center;gap:4px;padding:4px 10px;background:var(--bg3);border:1px dashed var(--bdr);border-radius:100px;font-family:'DM Mono',monospace;font-size:10px;color:var(--mut2);opacity:.7"><span style="font-size:14px;opacity:.5">${next.emo}</span>${remaining} dag${remaining===1?'':'e'} til</div>`;
    }
    milestonesHtml+=`</div>`;
  }

  let h=`<div class="streak-section">
    <div class="streak-title">🔥 Konsistens</div>
    <div class="streak-sub">
      <div>Nuværende streak: <span class="streak-stat">${curStreak} ${curStreak===1?'dag':'dage'}</span></div>
      <div>Bedste: <span class="streak-stat">${bestStreak} ${bestStreak===1?'dag':'dage'}</span></div>
    </div>
    ${milestonesHtml}
    <div class="streak-grid">
      <div class="streak-day-label"></div>
      <div class="streak-day-label">M</div>
      <div class="streak-day-label">T</div>
      <div class="streak-day-label">O</div>
      <div class="streak-day-label">T</div>
      <div class="streak-day-label">F</div>
      <div class="streak-day-label">L</div>
      <div class="streak-day-label">S</div>`;
  for(let w=0;w<TW();w++){
    h+=`<div class="streak-day-label">U${w+1}</div>`;
    for(let di=0;di<7;di++){
      const idx=w*7+di;
      const cnt=dayMap[idx]||0;
      const isFuture=idx>todayIdx;
      const isToday=idx===todayIdx;
      let cls='streak-cell';
      if(isFuture)cls+=' future';
      else if(cnt>=3)cls+=' l4';
      else if(cnt===2)cls+=' l3';
      else if(cnt===1)cls+=' l1';
      if(isToday)cls+=' today';
      h+=`<div class="${cls}" title="${D[di].full} uge ${w+1}${cnt?' · '+cnt+' øvelser':''}"></div>`;
    }
  }
  h+=`</div>
    <div class="streak-legend">
      <span>Mindre</span>
      <div class="streak-legend-cells">
        <div style="background:var(--bg3)"></div>
        <div style="background:rgba(255,214,10,.18)"></div>
        <div style="background:rgba(255,214,10,.4)"></div>
        <div style="background:rgba(255,214,10,.7)"></div>
        <div style="background:var(--acc)"></div>
      </div>
      <span>Mere</span>
    </div>
  </div>`;
  return h;
}

let workoutStart=null,workoutTimerInterval=null,workoutLastActivity=0;

function startWorkoutTimer(){
  if(workoutStart)return;
  workoutStart=Date.now();
  workoutLastActivity=Date.now();
  workoutTimerInterval=setInterval(updateWorkoutTimerDisplay,1000);
  updateWorkoutTimerDisplay();
}
function bumpWorkoutActivity(){
  workoutLastActivity=Date.now();
  if(!workoutStart)startWorkoutTimer();
}
function updateWorkoutTimerDisplay(){
  const el=document.getElementById('workoutTimer');
  if(!el||!workoutStart)return;
  const sec=Math.floor((Date.now()-workoutStart)/1000);
  const m=Math.floor(sec/60),s=sec%60;
  el.querySelector('.wt-time').textContent=m+':'+String(s).padStart(2,'0');
  // Auto-stop hvis ingen aktivitet i 30 min
  if(Date.now()-workoutLastActivity>30*60*1000){
    stopWorkoutTimer();
  }
}
function stopWorkoutTimer(){
  clearInterval(workoutTimerInterval);
  workoutStart=null;
  const el=document.getElementById('workoutTimer');
  if(el)el.style.display='none';
}

/* ── CSV EXPORT ────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
function exportCSV(){
  const rows=[['Uge','Dag','Øvelse','Vægt(max kg)','Sæt-for-sæt','Type','Note']];
  for(let w=1;w<=TW();w++){
    D.filter(d=>d.ex).forEach(d=>{
      dayEx(d).forEach(e=>{
        const v=gw(w,d.full,e.n);
        if(!v)return;
        const note=getExerciseNote(w,d.full,e.n);
        rows.push([w,d.full,e.n,maxW(v)||'',v,e.k||'c',note.replace(/[\r\n]/g,' ')]);
      });
    });
    D.filter(d=>d.run).forEach(d=>{
      const tid=gw(w,d.full,'tid'),pace=gw(w,d.full,'pace'),km=gw(w,d.full,'km'),note=gw(w,d.full,'note');
      if(tid||pace||km){
        rows.push([w,d.full,'Løb',tid||'',pace+' /km'+(km?' · '+km+'km':''),'run',(note||'').replace(/[\r\n]/g,' ')]);
      }
    });
  }
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='traening-'+todayISO()+'.csv';
  a.click();URL.revokeObjectURL(url);
  toast('✓ CSV downloadet');
}

      {emo:'🔗',n:'Supersets'},
      {emo:'📷',n:'Progressbilleder'},
      {emo:'🌙',n:'Søvn & stress'},
      {emo:'🔥',n:'Streaks'},
      {emo:'📈',n:'Volumen-graf'},
      {emo:'🧮',n:'Pace-kalk'}
    ],
    cta:'Næste'
  },
  {
    eyebrow:'Privacy-first',
    emoji:'🔒',
    h1:'DINE DATA FORBLIVER DINE',
    text:'Alt gemmes <b>lokalt på din telefon</b>. Ingen konto, ingen tracking, ingen reklamer.',
    text2:'Du kan downloade en backup når som helst og dele appen med venner uden at de får adgang til dine data.',
    cta:'Kom i gang →',
    final:true
  }
];

function showIntro(){
  introIdx=0;
  renderIntro();
}

function renderIntro(){
  const overlay=document.getElementById('introOverlay');
  if(!overlay)return;
  introIdx=0;
  let h=`<div class="intro-wrap">
    <button class="intro-skip" onclick="finishIntro()">Spring over</button>
    <div class="intro-slides" id="introSlides"
      ontouchstart="introTouchStart(event)" ontouchmove="introTouchMove(event)" ontouchend="introTouchEnd(event)">
      <div class="intro-track" id="introTrack" style="transform:translateX(0)">`;
  INTRO_SLIDES.forEach((s,i)=>{
    h+=`<div class="intro-slide">
      <div class="intro-emoji">${s.emoji}</div>
      <div class="intro-eyebrow">// ${s.eyebrow}</div>
      <h1 class="intro-h1">${s.h1}</h1>
      <p class="intro-text">${s.text}</p>`;
    if(s.text2)h+=`<p class="intro-text" style="font-size:12px;color:var(--mut2);margin-top:6px">${s.text2}</p>`;
    if(s.showTemplates){
      h+=`<div class="intro-templates">`;
      Object.values(TEMPLATES).forEach(t=>{
        h+=`<div class="intro-tpl" style="border-color:${t.color}40">
          <div class="intro-tpl-emo">${t.emo}</div>
          <div class="intro-tpl-name" style="color:${t.color}">${t.name}</div>
        </div>`;
      });
      h+=`</div>`;
    }
    if(s.showTrainingStyles){
      h+=`<div class="intro-styles">
        <div class="intro-style-card">
          <div class="is-icon">📅</div>
          <div class="is-name">KALENDER-MODE</div>
          <div class="is-desc">Faste ugedage — Mandag = Upper A, Onsdag = Lower A. Følg en struktureret plan.</div>
          <div class="is-best">💡 Bedst for: Fast tidsplan, rutine-mennesker</div>
        </div>
        <div class="intro-style-card flex">
          <div class="is-icon">🔄</div>
          <div class="is-name">FLEX-MODE</div>
          <div class="is-desc">Træn når du har tid. Programmet er en kø — næste session venter til du logger den.</div>
          <div class="is-best">💡 Bedst for: Travle uger, uregelmæssig hverdag</div>
        </div>
      </div>`;
    }
    if(s.features){
      h+=`<div class="intro-features">`;
      s.features.forEach(f=>{
        h+=`<div class="intro-feature"><span class="if-emo">${f.emo}</span>${f.n}</div>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>
    </div>
    <div class="intro-footer">
      <div class="intro-dots">
        ${INTRO_SLIDES.map((_,i)=>`<div class="intro-dot${i===0?' on':''}"></div>`).join('')}
      </div>
      <button class="intro-cta${INTRO_SLIDES[0].final?' final':''}" onclick="${INTRO_SLIDES[0].final?'finishIntro()':'introNext()'}">${INTRO_SLIDES[0].cta}</button>
    </div>
  </div>`;
  overlay.innerHTML=h;
  overlay.style.display='block';
}

function introNext(){
  if(introIdx<INTRO_SLIDES.length-1){
    introIdx++;
    updateIntroPosition();
  }else{
    finishIntro();
  }
}

function introPrev(){
  if(introIdx>0){
    introIdx--;
    updateIntroPosition();
  }
}

// Opdater kun track-position, dots og CTA — uden full re-render
function updateIntroPosition(){
  const track=document.getElementById('introTrack');
  if(track){
    track.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)';
    track.style.transform=`translateX(-${introIdx*100}%)`;
  }
  // Opdater dots
  document.querySelectorAll('.intro-dot').forEach((dot,i)=>{
    dot.classList.toggle('on',i===introIdx);
  });
  // Opdater CTA-knap
  const cta=document.querySelector('.intro-cta');
  if(cta){
    const slide=INTRO_SLIDES[introIdx];
    cta.textContent=slide.cta;
    cta.classList.toggle('final',!!slide.final);
    cta.onclick=slide.final?finishIntro:introNext;
  }
}

function finishIntro(){
  PROG.introSeen=true;
  saveProg();
  const overlay=document.getElementById('introOverlay');
  if(overlay){
    overlay.style.opacity='0';
    overlay.style.transition='opacity .3s ease';
    setTimeout(()=>{
      overlay.style.display='none';
      overlay.style.opacity='1';
      overlay.innerHTML='';
    },300);
  }
  render();
}

// Swipe-handling for intro
let introTouchX=null,introTouchY=null,introTouchTime=0;
function introTouchStart(e){
  introTouchX=e.touches[0].clientX;
  introTouchY=e.touches[0].clientY;
  introTouchTime=Date.now();
  // Disable transition under drag for smooth følge-bevægelse
  const track=document.getElementById('introTrack');
  if(track)track.style.transition='none';
}
function introTouchMove(e){
  if(introTouchX===null)return;
  const dx=e.touches[0].clientX-introTouchX;
  const dy=e.touches[0].clientY-introTouchY;
  // Hvis primært vertikal scroll, ignorer
  if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>10)return;
  if(Math.abs(dx)>10)e.preventDefault();
  const track=document.getElementById('introTrack');
  if(!track)return;
  // Begræns drag ved ender
  let dragDx=dx;
  if(introIdx===0&&dx>0)dragDx=dx*0.3;
  if(introIdx===INTRO_SLIDES.length-1&&dx<0)dragDx=dx*0.3;
  track.style.transform=`translateX(calc(-${introIdx*100}% + ${dragDx}px))`;
}
function introTouchEnd(e){
  if(introTouchX===null)return;
  const dx=(e.changedTouches?.[0]?.clientX||0)-introTouchX;
  const elapsed=Date.now()-introTouchTime;
  const isSwipe=Math.abs(dx)>50||(Math.abs(dx)>20&&elapsed<200);
  const track=document.getElementById('introTrack');
  if(!track){introTouchX=null;return}
  if(isSwipe&&dx<0&&introIdx<INTRO_SLIDES.length-1){
    introIdx++;
  }else if(isSwipe&&dx>0&&introIdx>0){
    introIdx--;
  }
  updateIntroPosition();
  introTouchX=null;introTouchY=null;
}

/* ── PWA / OFFLINE SUPPORT ─────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
// Inline service worker via Blob URL — caches the app shell after first load
if('serviceWorker' in navigator){
  // Registrér sw.js (skal ligge ved siden af index.html på serveren)
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{
      // sw.js mangler på serveren — appen virker stadig, bare uden offline-support
    });
  });
}

/* ═══════════════════════════════════════════════════════════ */
/* ── INIT ──────────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════ */
loadProgram();
// Auto-set til den aktuelle uge baseret på startdato
if(PROG.startDate){
  const cw=currentWeek();
  if(cw>=1&&cw<=TW())week=cw;
}
// Default: åbn altid på dagens dag når program er i gang
if(PROG.startDate&&!isProgramDone()&&!PROG.flexMode){
  sel=todayDayIdx();
}
render();
// Vis intro for nye brugere (efter render så app er klar i baggrunden)
if(!PROG.introSeen){
  setTimeout(showIntro,100);
}else{
  // Backup-reminder hver 28. dag (kun for etablerede brugere)
  maybeShowBackupReminder();
}

// Kompakt header når man scroller i indhold
(function(){
  const cnt=document.getElementById('cnt');
  const hdr=document.getElementById('hdr');
  if(cnt&&hdr){
    let ticking=false;
    cnt.addEventListener('scroll',()=>{
      if(!ticking){
        requestAnimationFrame(()=>{
          if(cnt.scrollTop>40)hdr.classList.add('compact');
          else hdr.classList.remove('compact');
          ticking=false;
        });
        ticking=true;
      }
    },{passive:true});
  }
})();

// Auto-opdater til ny uge når app kommer i forgrunden (efter pause)
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&PROG.startDate){
    const cw=currentWeek();
    if(cw>=1&&cw<=TW()&&cw!==week){
      week=cw;
      if(!isProgramDone()&&!PROG.flexMode)sel=todayDayIdx();
      render();
    }
  }
});
</script>
